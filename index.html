<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astragali · Nox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500;600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#050B16;
  --bg1:#0B1626;
  --mist:#DFF3EE;
  --mist-2:#9DBDB8;
  --mist-3:#5E7F80;
  --gold:#D9BE8B;
  --gold-d:#9A7F52;
  --t1:#7FFFD4;
  --t1g:rgba(127,255,212,.55);
  --t2:#40E0D0;
  --t2g:rgba(64,224,208,.55);
  --t3:#B08CFF;
  --t3g:rgba(176,140,255,.55);
  --t4:#FF4D6D;
  --t4g:rgba(255,77,109,.55);
  --serif:"Cormorant Garamond",Georgia,serif;
  --han:"Noto Serif SC",serif;
  --caps:"Cinzel",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg0)}
body{
  background:
    radial-gradient(ellipse 130% 55% at 50% -8%,rgba(64,224,208,.10),transparent 55%),
    radial-gradient(ellipse 90% 60% at 85% 100%,rgba(176,140,255,.06),transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 70%);
  color:var(--mist);
  font-family:var(--han);font-weight:400;
  min-height:100vh;
  padding:42px 20px 90px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}

.masthead{text-align:center;margin-bottom:6px}
.masthead h1{
  font-family:var(--serif);font-weight:500;font-style:italic;
  font-size:clamp(36px,8vw,46px);
  letter-spacing:.01em;line-height:1.05;
  color:var(--gold);
  text-shadow:0 0 26px rgba(217,190,139,.35);
}
.masthead .latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:14px;color:var(--mist-2);margin-top:8px;letter-spacing:.05em;
}
.orn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:18px 0 30px;color:var(--gold-d);
}
.orn::before,.orn::after{
  content:"";height:1px;flex:1;max-width:150px;
  background:linear-gradient(90deg,transparent,var(--gold-d));
}
.orn::after{background:linear-gradient(90deg,var(--gold-d),transparent)}
.orn svg{width:15px;height:15px;flex:none;filter:drop-shadow(0 0 6px rgba(217,190,139,.6))}

.tiers{display:flex;justify-content:center;gap:12px;margin-bottom:40px;flex-wrap:wrap}
.tier{
  background:rgba(255,255,255,.02);
  border:1px solid rgba(157,189,184,.22);
  border-radius:12px;
  cursor:pointer;padding:12px 0 10px;
  width:calc(25% - 9px);min-width:78px;
  text-align:center;font-family:var(--han);color:var(--mist-3);
  transition:all .3s;position:relative;overflow:hidden;
}
.tier .gem{
  width:16px;height:16px;margin:0 auto 8px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,var(--tc),transparent 130%);
  border:1px solid var(--tc);
  opacity:.4;transition:all .3s;
}
.tier .rn{font-family:var(--caps);font-size:13px;letter-spacing:.12em;display:block}
.tier .nm{font-size:11px;letter-spacing:.3em;display:block;margin-top:4px;padding-left:.3em}
.tier[data-on="1"]{
  color:var(--mist);
  border-color:var(--tc);
  box-shadow:0 0 22px -6px var(--tg),inset 0 0 18px -10px var(--tg);
}
.tier[data-on="1"] .gem{
  opacity:1;
  box-shadow:0 0 12px var(--tg);
  animation:gemPulse 2.6s ease-in-out infinite;
}
@keyframes gemPulse{
  0%,100%{box-shadow:0 0 8px var(--tg)}
  50%{box-shadow:0 0 18px var(--tg),0 0 30px var(--tg)}
}

/* ---------- dice arena ---------- */
.arena{
  display:flex;justify-content:center;align-items:flex-end;gap:56px;
  padding:34px 0 10px;min-height:250px;
  perspective:1100px;position:relative;
}
.diecol{display:flex;flex-direction:column;align-items:center}
.dielabel{
  text-align:center;font-family:var(--serif);font-style:italic;
  font-size:12.5px;color:var(--mist-2);margin-top:26px;letter-spacing:.06em;
}
.podium{
  width:110px;height:10px;border-radius:50%;
  background:radial-gradient(ellipse at center,var(--pg) 0%,transparent 70%);
  margin-top:-2px;filter:blur(4px);
  transition:background .5s;
}

/* --- pyramid d4 --- */
.pyr-stage{width:150px;height:170px;display:flex;align-items:flex-end;justify-content:center}
.pyr{
  width:130px;height:150px;position:relative;
  transform-style:preserve-3d;
  transition:transform 2s cubic-bezier(.16,.7,.22,1);
  animation:hoverY 4.5s ease-in-out infinite;
}
@keyframes hoverY{0%,100%{margin-bottom:0}50%{margin-bottom:12px}}
.pface{
  position:absolute;left:50%;bottom:6px;
  width:116px;height:138px;margin-left:-58px;
  transform-origin:50% 100%;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:
    linear-gradient(160deg,rgba(255,255,255,.28) 0%,transparent 34%),
    linear-gradient(200deg,var(--fc2) 0%,var(--fc1) 60%,var(--fc0) 100%);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:20px;
  backface-visibility:hidden;
}
.pface .rn{
  font-family:var(--caps);font-size:26px;letter-spacing:.04em;
  color:rgba(6,14,20,.82);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.pface::after{
  content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 60%);
  opacity:0;transition:opacity .4s;
}
.pyr.lit .pface::after{opacity:.5;animation:sheen 2.4s linear infinite}
@keyframes sheen{
  0%{transform:translateX(-60%)}
  100%{transform:translateX(60%)}
}
.pf1{transform:rotateY(0deg)   translateZ(33px) rotateX(24deg)}
.pf2{transform:rotateY(90deg)  translateZ(33px) rotateX(24deg)}
.pf3{transform:rotateY(180deg) translateZ(33px) rotateX(24deg)}
.pf4{transform:rotateY(270deg) translateZ(33px) rotateX(24deg)}
.pbase{
  position:absolute;left:50%;bottom:6px;
  width:96px;height:96px;margin-left:-48px;
  transform-origin:50% 100%;
  transform:rotateX(-90deg) translateZ(-6px) translateY(48px);
  background:rgba(5,10,18,.9);
  border:1px solid rgba(255,255,255,.08);
}

/* --- cube d6 --- */
.die{
  width:100px;height:100px;
  transform-style:preserve-3d;
  transition:transform 2s cubic-bezier(.16,.7,.22,1);
  position:relative;
  animation:hoverY2 4.5s ease-in-out infinite;
}
@keyframes hoverY2{0%,100%{margin-bottom:6px}50%{margin-bottom:18px}}
.cface{
  position:absolute;inset:0;border-radius:12px;
  background:
    linear-gradient(150deg,rgba(255,255,255,.20) 0%,transparent 40%),
    linear-gradient(180deg,#12273C 0%,#0A1626 100%);
  border:1px solid rgba(127,255,212,.35);
  box-shadow:
    inset 0 0 24px -8px rgba(64,224,208,.35),
    inset 0 0 0 1px rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
}
.cface svg{width:64%;height:64%;color:var(--t2);filter:drop-shadow(0 0 5px var(--t2g))}
.cf1{transform:rotateY(0deg) translateZ(50px)}
.cf2{transform:rotateY(90deg) translateZ(50px)}
.cf3{transform:rotateY(180deg) translateZ(50px)}
.cf4{transform:rotateY(-90deg) translateZ(50px)}
.cf5{transform:rotateX(90deg) translateZ(50px)}
.cf6{transform:rotateX(-90deg) translateZ(50px)}

.actions{margin-top:26px;display:flex;justify-content:center}
.abtn{
  position:relative;cursor:pointer;
  background:linear-gradient(160deg,rgba(64,224,208,.16),rgba(64,224,208,.05));
  border:1px solid rgba(64,224,208,.55);
  border-radius:999px;
  font-family:var(--han);font-size:14.5px;letter-spacing:.4em;
  color:var(--t1);padding:15px 44px 15px calc(44px + .4em);
  transition:all .3s;overflow:hidden;
  text-shadow:0 0 12px var(--t1g);
  box-shadow:0 0 30px -10px var(--t2g),inset 0 0 22px -12px var(--t2g);
}
.abtn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
  transform:translateX(-110%);
}
.abtn:hover::before{transform:translateX(110%);transition:transform .8s}
.abtn:hover{box-shadow:0 0 44px -8px var(--t2g),inset 0 0 26px -10px var(--t2g)}
.abtn:active{transform:scale(.97)}
.abtn:disabled{opacity:.4;cursor:wait}

.hint{
  margin-top:16px;text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:13.5px;color:var(--mist-2);letter-spacing:.03em;
  min-height:22px;transition:color .4s;
}

.mute{
  position:fixed;top:16px;right:16px;z-index:5;
  background:rgba(255,255,255,.04);border:1px solid rgba(157,189,184,.25);
  border-radius:50%;width:38px;height:38px;cursor:pointer;
  color:var(--mist-2);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
.mute:hover{color:var(--t1);border-color:var(--t1)}

/* ---------- result ---------- */
.card{
  margin-top:34px;position:relative;
  background:linear-gradient(170deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--ac);
  border-radius:16px;
  padding:30px 26px 22px;
  box-shadow:0 0 46px -12px var(--ag),inset 0 0 34px -20px var(--ag);
  animation:rise .6s cubic-bezier(.2,.75,.3,1);
}
@keyframes rise{
  from{opacity:0;transform:translateY(22px) scale(.97)}
  to{opacity:1;transform:none}
}
.card.hell{animation:rise .6s cubic-bezier(.2,.75,.3,1),hellPulse 3s ease-in-out infinite .6s}
@keyframes hellPulse{
  0%,100%{box-shadow:0 0 46px -12px var(--ag),inset 0 0 34px -20px var(--ag)}
  50%{box-shadow:0 0 70px -8px var(--ag),inset 0 0 44px -16px var(--ag)}
}
.c-corner{position:absolute;width:22px;height:22px;border:1px solid var(--ac);opacity:.8}
.c-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:16px 0 0 0}
.c-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 16px 0 0}
.c-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 16px}
.c-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 16px 0}

.c-top{text-align:center;margin-bottom:14px}
.c-num{
  font-family:var(--caps);font-size:12px;letter-spacing:.34em;
  color:var(--ac);padding-left:.34em;
  text-shadow:0 0 14px var(--ag);
}
.c-tier{
  display:inline-block;margin-top:10px;
  font-family:var(--han);font-size:10.5px;letter-spacing:.4em;
  color:var(--ac);padding:4px 14px 3px calc(14px + .4em);
  border:1px solid var(--ac);border-radius:999px;
  box-shadow:0 0 14px -4px var(--ag);
}
.c-name{
  font-family:var(--han);font-weight:600;
  font-size:clamp(23px,6vw,28px);letter-spacing:.12em;
  color:var(--mist);margin-top:14px;padding-left:.12em;
  text-shadow:0 0 24px var(--ag);
}
.c-latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:15px;color:var(--mist-2);margin-top:4px;
}
.c-div{
  display:flex;align-items:center;gap:10px;margin:16px 0 18px;
}
.c-div::before,.c-div::after{
  content:"";height:1px;flex:1;
  background:linear-gradient(90deg,transparent,var(--ac));opacity:.5;
}
.c-div::after{background:linear-gradient(90deg,var(--ac),transparent)}
.c-div span{
  width:6px;height:6px;transform:rotate(45deg);
  background:var(--ac);flex:none;
  box-shadow:0 0 10px var(--ag);
}
.sec{margin-bottom:15px}
.sec dt{
  font-family:var(--caps);font-size:9.5px;letter-spacing:.28em;
  color:var(--ac);margin-bottom:7px;
}
.sec dd{
  font-size:13.5px;line-height:2;color:#C6D9D5;
  text-align:justify;
}
.warnbox{
  margin-bottom:15px;padding:13px 15px;border-radius:10px;
  border:1px solid rgba(255,77,109,.4);
  background:rgba(255,77,109,.07);
}
.warnbox dt{
  font-family:var(--caps);font-size:9.5px;letter-spacing:.28em;
  color:var(--t4);margin-bottom:7px;
}
.warnbox dd{font-size:12.5px;line-height:1.9;color:#F2B9C4;text-align:justify}
.c-foot{
  margin-top:8px;padding-top:14px;
  border-top:1px solid rgba(157,189,184,.18);
  display:flex;align-items:baseline;gap:14px;
  font-size:12px;color:var(--mist-2);
}
.c-foot .dur i{font-style:normal;letter-spacing:.06em}
.c-foot .tm{
  font-family:var(--caps);font-size:17px;letter-spacing:.08em;color:var(--ac);
  text-shadow:0 0 12px var(--ag);
}
.c-foot .tbtn{
  margin-left:auto;background:none;border:none;cursor:pointer;
  font-family:var(--han);font-size:12px;color:var(--mist-2);
  letter-spacing:.1em;padding:2px 0;
  border-bottom:1px solid var(--mist-3);transition:.2s;
}
.c-foot .tbtn:hover{color:var(--ac);border-color:var(--ac)}

.log{margin-top:52px}
.log h3{
  font-family:var(--caps);font-weight:400;font-size:10px;
  letter-spacing:.38em;color:var(--mist-3);
  text-align:center;margin-bottom:16px;padding-left:.38em;
}
.log ol{list-style:none}
.log li{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;font-size:13px;color:#B9CFCB;
  border:1px solid rgba(157,189,184,.14);
  border-radius:10px;margin-bottom:7px;
  background:rgba(255,255,255,.02);
}
.log li .dot{
  width:8px;height:8px;transform:rotate(45deg);flex:none;
  background:var(--lc);box-shadow:0 0 10px var(--lg);
}
.log li .lt{margin-left:auto;font-size:11px;letter-spacing:.22em;color:var(--lc)}

.safe{
  margin-top:56px;text-align:center;
  font-size:12.5px;line-height:2.1;color:var(--mist-2);
}
.safe .sw{
  font-family:var(--han);font-weight:500;color:var(--t1);
  letter-spacing:.16em;padding:0 2px 1px;
  border-bottom:1px solid var(--t1);
  text-shadow:0 0 14px var(--t1g);
}
.safe .lt{
  display:block;font-family:var(--serif);font-style:italic;
  font-size:12px;margin-top:6px;color:var(--mist-3);
}

.star-p{
  position:fixed;z-index:9;pointer-events:none;
  font-size:13px;line-height:1;
  animation:fly .9s cubic-bezier(.15,.6,.4,1) forwards;
}
@keyframes fly{
  from{opacity:1;transform:translate(0,0) scale(1)}
  to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(160deg)}
}
@media(max-width:430px){
  .arena{gap:30px}
  .pyr-stage{width:126px;height:150px}
  .pyr{width:110px;height:132px}
  .pface{width:100px;height:120px;margin-left:-50px;transform-origin:50% 100%}
  .pf1{transform:rotateY(0deg) translateZ(28px) rotateX(24deg)}
  .pf2{transform:rotateY(90deg) translateZ(28px) rotateX(24deg)}
  .pf3{transform:rotateY(180deg) translateZ(28px) rotateX(24deg)}
  .pf4{transform:rotateY(270deg) translateZ(28px) rotateX(24deg)}
  .die{width:86px;height:86px}
  .cf1{transform:rotateY(0deg) translateZ(43px)}
  .cf2{transform:rotateY(90deg) translateZ(43px)}
  .cf3{transform:rotateY(180deg) translateZ(43px)}
  .cf4{transform:rotateY(-90deg) translateZ(43px)}
  .cf5{transform:rotateX(90deg) translateZ(43px)}
  .cf6{transform:rotateX(-90deg) translateZ(43px)}
}
</style>

<canvas id="sky"></canvas>
<button class="mute" id="mute" title="音效">♪</button>

<div class="wrap">
  <div class="masthead">
    <h1>Astragali</h1>
    <div class="latin">nox &middot; sortem iacta &middot; 掷出今夜的签</div>
  </div>
  <div class="orn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"/>
    </svg>
  </div>

  <div class="tiers" id="tiers"></div>

  <div class="arena">
    <div class="diecol">
      <div class="pyr-stage">
        <div class="pyr" id="pyr">
          <div class="pface pf1" data-f="1"><span class="rn">I</span></div>
          <div class="pface pf2" data-f="2"><span class="rn">II</span></div>
          <div class="pface pf3" data-f="3"><span class="rn">III</span></div>
          <div class="pface pf4" data-f="4"><span class="rn">IV</span></div>
          <div class="pbase"></div>
        </div>
      </div>
      <div class="podium" id="pod1" style="--pg:rgba(127,255,212,.35)"></div>
      <div class="dielabel">Fatum &middot; 等级</div>
    </div>
    <div class="diecol">
      <div class="die" id="d2"></div>
      <div class="podium" style="--pg:rgba(64,224,208,.3)"></div>
      <div class="dielabel">Numerus &middot; 编号</div>
    </div>
  </div>

  <div class="actions"><button class="abtn" id="draw">掷出骰子</button></div>
  <div class="hint" id="hint">tolle et lege &mdash; 掷出，然后照做</div>

  <div id="slot"></div>

  <div class="log" id="log" hidden>
    <h3>Acta Noctis &middot; 今夜战绩</h3>
    <ol id="loglist"></ol>
  </div>

  <div class="safe">
    安全词 <span class="sw">菠萝披萨</span> 永远有效——任何一方说出，一切立刻停下。
    <span class="lt">semper valet, sine quaestione</span>
  </div>
</div>

<script>
const D=[
{t:1,n:"蒙眼辨物",l:"Quid est hoc",p:"服从方跪坐床沿，一条深色绸带蒙住双眼系至后脑——视觉被剥夺的一瞬，皮肤开始替眼睛工作，每一寸毛孔都竖起等待。支配方任选五种物件：一枚含在口中先加温至体温的冰块、一根羽毛的尾端、一条对折的皮带、指腹沾着的润滑液、以及唇齿本身——依次触上锁骨凹陷、乳晕外围、腰窝、大腿内侧最薄的那片皮肤。每处仅停三秒。冰块化到一半自锁骨滑落至胸前，那道水痕会一直凉到解答之后；皮带的钝重坠感与羽毛的轻痒之间隔着整整一个宇宙；而当唇齿贴上时，服从方甚至分不清那究竟是舌头还是别的什么。视觉退场后，辨识度被放大到令人措手不及。",r:"每次触碰仅三秒；服从方须于触感消退前说出物件名称。",b:"答对一样，支配方以唇亲吻该处并停留三秒；答错一样，臀部对称处受掌击一记。",m:"15 分钟"},
{t:1,n:"领带缚腕",l:"Vinculum",p:"支配方缓缓解下领带——那种带着体温的柔滑丝质自颈间抽出的窸窣声本身即是前奏——将服从方双腕交叠举至头顶，缠绕三圈，打一个一挣即开的活结。此后支配方在其锁骨间描一道湿吻、指尖沿肋骨往下点数、口含乳尖轻轻厮磨、或将手探入两腿之间——每一个瞬间，服从方本能想去推拒、去抓握、去遮掩，都必须以意志将双手钉回原位。绸带柔软而无杀伤力，真正的束缚是自愿。前臂的肌肉会因长时间举高而慢慢发酸，那种细密的酸胀与全身其他部位涌起的燥热搅在一起，令人愈发无处可逃——直至那份酸涨也开始成为某种奇异的快感来源。",r:"双手须全程保持于头顶原位；滑落一次即重新捆缚，前戏时长顺延。",b:"坚持至终局者，此后进入之姿势由服从方指定；累计挣脱三次者，当夜释放取消。",m:"20 分钟"},
{t:1,n:"低温滴蜡",l:"Cera",p:"熄灯，独留烛火。支配方持一支专用低温蜡烛悬于服从方肌肤上方约三十厘米——高度决定烫意的浓度，此距离恰好落在温热与灼烧之间那道甜蜜的界线上。烛芯上积满一颗晶莹的蜡珠，坠落——落于锁骨凹陷的瞬间先炸开一记短促的刺，随即化为一小片浓郁的暖，在心跳中凝固成一枚封印。随后沿身体中线次第落下：乳晕外围绕一圈，两颗乳尖恰好被这圈热度圈在中央；小腹排一列，每落一颗肌肉便本能地一收；髋骨两侧各一道，然后是大腿内侧最白的那一段，那里的皮肤最薄，蜡尚未凝已经化开成暖流缓缓下淌，痒得受蜡者不自觉地夹紧双腿。烛火跳动，室内漆黑，只有那一列一列缓缓凝固的红梅，在暗中标记这具身体的每一处坐标。",r:"服从方不得躲避；躲避一次，滴落高度下调五厘米。",b:"全程未动者，蜡片剥离后由施蜡者以舌尖将每一处红痕重新舔过一遍，直至印痕再次泛红。",m:"20 分钟"},
{t:1,n:"报数十下",l:"Decem",p:"服从方俯卧于支配方腿上，裙摆或下装褪至膝弯，两瓣软肉完全暴露于掌心之下。第一记不立即落——支配方先以掌心贴着臀肉缓慢揉压，画圈，捏住一小块然后松开，令肌肤先记住手的形状与温度，也令等待本身成为一种刑罚。就在服从方以为将落未落之际，一记清脆的掌击忽然降临，热度自击点向四周辐射，红印随即浮起。服从方须清晰报数：一。并附一句敬语。此后九下，节奏由施掌者掌控——可连击三下不容喘息，可悬停十数秒令臀肉在等待中先自战栗，可轻可重可正击可斜切。每一记落下之前的悬空，都比落下本身更折磨。第十下落定后，两瓣软肉滚烫得能焐手，皮肤下细小的血管都涨得清晰可见——此时任何抚摸都会带来放大数倍的酥麻。",r:"每记落下后须报数并致谢，二者缺一即视为漏记；报数含糊或迟疑亦然。",b:"漏记者自一重新计数；累计三次自一重计，则第十一下起改用皮拍。",m:"10 分钟"},
{t:1,n:"寸止三次",l:"Ad limen",p:"支配方以手指或器具将服从方一路引向顶点——起初缓慢，指腹沿会阴描着弧线打圈，探入寻找那个熟悉的凹陷；节奏逐渐加密，服从方的呼吸开始变浅、变急、变碎；腰肢不自觉地拱起，双腿在床单上蹬蹭寻找支点，喉间的呻吟越来越无法压制，穴道深处那种熟悉的即将决堤的感觉一路自尾椎蹿至头顶。就在临界线的最后一步——支配方的手骤然抽走，退开身，坐至床沿旁观。服从方悬在半空，穴口一张一合地咬着空气，眼泪汪汪地翻身要求继续，得到的只是一句：等它退下去。等电流自尾椎缓缓褪回原位，等呼吸重新平稳——支配方再度上前，从头开始爬这座山。三次。第三次抵达门槛之前的每一秒，服从方将同时怨恨与渴望那双手。",r:"临界须由服从方举手示意；夹腿、蹭床单、私下磨蹭皆判违规。",b:"忍至终局者，准予一次彻底而漫长的释放；中途违规者，违规几次禁令即顺延几日。",m:"30 分钟"},
{t:1,n:"隔布把玩",l:"Per pannum",p:"内裤是本局唯一的规则，也是唯一的战场。支配方以指腹隔着薄薄的棉布按压——先沿会阴按下去一路碾至耻骨，再沿中线上下反复地磨。布料初时是干爽的，指尖能清楚感到底下软肉起伏的形状；片刻后，中央位置洇出一枚小小的深色斑点；再片刻，那一点晕开成一整片，湿润的黏腻感开始透过布料反上指腹；至半局，整块布已湿到透明，紧贴在肉上，连底下充血肿起的两片外唇、以及那颗从遮蔽中探出头的、颤颤的珠子的轮廓，都在灯下清晰可辨。服从方会本能地扭动腰肢寻求更深的按压，会讨价还价地恳求脱掉那一层布——不许。今夜的终点是让身体隔着一层棉布，把自己浇透。指尖会数次故意错开阴蒂那一点，只在旁边打转，直到听见喉间那声破碎的哀求。",r:"未获准许，服从方双手不得触碰自身任何部位。",b:"湿至能拧出水时，施术者以齿咬住布料边缘将其缓缓褪下，褪至膝弯为止。",m:"20 分钟"},
{t:1,n:"丝袜足戏",l:"Pedes",p:"双方隔开一段距离对坐——距离即是本局的道具。服从方仅以两条穿着丝袜的腿伸至对方腿间，一切动作只以双足完成。脚背绷起的弧度绘出一道优雅的曲线，尼龙在灯下透出微微的哑光，脚趾隔着一层薄薄的透明料勾缠住对方——自根部一路缓缓向上磨，脚心以温柔的力道包住顶端，脚趾在冠状沟处收放。被伺候的一方只许坐直，双手可扶椅侧但不得触碰施足者，只能眼睁睁看着自己被一双脚随心所欲地拿捏。丝袜的滑与体温的热两重叠加，脚趾偶尔无意间捏紧一下的力道恰好卡在临界；而施足者从头至尾神色淡然，仿佛只是在做一件不那么重要的琐事，甚至可以一边施足一边翻手中的书。这种被漫不经心地伺候的羞耻感，即是本局的主菜。",r:"施足方不得使用双手与口，全程仅以双足完成；被伺候方不得触碰施足方。",b:"若成功令对方释放，溅落之物由施足方以脚趾抹开涂布于对方腹肌，展示片刻方可拭去。",m:"25 分钟"},
{t:1,n:"问诊",l:"Medicus",p:"诊室灯亮，一片冷白。医者着白衣，翻阅纸质病历，头也不抬地示意：更衣，躺于检查床上。病人依令褪去外衣，只余薄薄的一层布料。检查自最正经处始——听心音，压腹诊——医者的听诊器冰凉，贴上皮肤时一惊；手掌隔着薄衫按压小腹，力度专业而不带感情。而后问题开始漂移：此处可有压痛？此处呢？这里为何略有湿意？请解开一颗纽扣，方便触诊。医者的手指戴着薄薄一层医用手套，微凉，指腹沾了少许透明的检查用润滑液，探入时只说一句：请放松，配合检查。病人须对每一问如实作答——包括平日的自渎频率，包括高潮时脑中所想的画面，包括此刻是否已经因为这场检查而濡湿。医者的语气始终平静而专业，那份“公事公办”的冷淡与探入之处的实际内容形成的反差，是本局最烫的所在。谎言一旦被戳穿，检查项目立即追加。",r:"病人须对医者所有提问如实回答，不得隐瞒或含糊。",b:"每被戳穿一次谎言，检查项目追加一项，无上限。",m:"30 分钟"},
{t:1,n:"负重巡游",l:"Ambulatio",p:"跳蛋预先塞入穴中，遥控交予支配方。服从方须在居所内走完一整圈：客厅、厨房、阳台，再回到起点。开局时档位为零，服从方几乎能忘记体内那颗异物的存在——但支配方专挑最刁钻的时机推档。伸手取高处杯子的一瞬，震动骤然拔至中档，一股酥麻自会阴一路窜至头顶，扶着橱柜的手指骤然收紧；跨过门槛的抬腿一刹，档位再上一级，双腿之间那颗小东西撞在最敏感的凹陷上，膝盖一软险些跪下；以为已经安全站在阳台上凭栏望远时，档位骤然拔至最高，全身猛地绷成一根弦，指节掐入栏杆才没让呻吟出口。而穴道深处那颗跳蛋每一次震动都令内壁充血，走完半圈时大腿内侧已开始有黏湿的感觉——那是身体不受控地作出的诚实反应。规则是：不许停步，不许扶物借力，不许并腿求缓。",r:"全程不得停步、不得扶物、不得并腿；任何降档请求不予受理。",b:"中途跪倒于何处，即于何处继续玩至释放；成功走完一圈者，可指定接下来的体位。",m:"15 分钟"},
{t:1,n:"镜前直视",l:"Speculum",p:"支配方自身后环抱服从方，下颌搁于其肩，二人共同面向一面立镜。左手覆上其颈侧，右手自腰际缓缓下滑——服从方将同时以两种方式经历这一切：皮肤上的真实触感，与镜中那具正在被拆解的身体。指尖沿锁骨下行至乳尖，镜中的乳尖立即挺立起一小颗坚硬的红；手掌整个覆上小腹，镜中的小腹随着呼吸急促地起伏；两根手指探入腿间，镜中的双腿本能地想要合拢又被膝盖顶开，穴口那一小片湿意在灯下亮亮地反光。整个过程中，服从方须睁眼直视镜中的自己：看被触碰的位置，看面颊如何一点一点被红晕爬满，看唇齿如何一寸一寸地张开，看眼神如何自最初的清明转向迷离再转向哀求。想要闭眼时，耳边只有一句话：睁开，看着她。看她被玩弄到何种地步。看她其实很享受。镜中人即是自己，无可辩驳。",r:"服从方须全程睁眼直视镜中自身面容；闭眼一次，所有动作暂停十秒。",b:"服从方须以最直白的语言描述镜中所见——身体的每一处反应，须说出口。",m:"20 分钟"},
{t:1,n:"承露十步",l:"Decem passus",p:"释放之后不许立即清理。支配方按住服从方的腰不许其起身，令温热于体内最深处沉降片刻——那种滚烫的浓稠在穴道深处缓缓蔓延、被穴肉一层一层温柔地含裹住，是许多人一生中最舒适的几分钟之一。片刻后，允许起身。而后是考验：夹紧，站立，自床沿走至门边，共十步。每一步都能感到体内之物在缓缓晃动、被地心引力向下拽、试图自穴口挤出——必须以下腹的力气咬住，令穴口那圈软肉紧紧闭合。至第五步，一小滴温热的液体已经悄悄溢至穴口边缘；至第七步，大腿内侧开始微微战栗；至第九步，那一小股液体终于顺着大腿内侧缓缓滑下，画出一道亮亮的水痕，慢慢延伸至膝弯。支配方就在身后，数着剩余的步数，也数着大腿上那道水痕蜿蜒到哪一节。",r:"夹紧行走完十步，途中一滴不得外漏。",b:"漏出者，跪地以舌将地面上以及自身腿上的痕迹尽数舔净。",m:"5 分钟"},
{t:1,n:"言语课业",l:"Verba",p:"支配方埋于服从方体内至最深处，动作忽然放至最缓——那种缓不是抽出，而是将顶端在穴道最深的凹陷处以极慢的力度一点一点研磨。而后开始上课：此刻是什么感觉？说出来。舒服不合格，好棒不合格，再来更不合格。须说清是何处、被何物顶到、以何种角度研磨、深浅几何、快慢如何。服从方要一面承受身下缓慢而深入的碾压——那种缓慢比激烈还难熬，因为每一寸感官都被无限拉长——一面在被顶得语音破碎的间隙组织出完整而下流的句子。说得含糊，动作立即静止；静止会一直持续到答案清晰为止。而穴道深处那份被撑得满满的、痒到发疯的空虚会在静止中愈发难耐，逼着说话者不得不吐出更下流、更细节的形容——甚至开始主动扭腰迎合，只为求得动作的继续。这是快感的课堂，也是语言的课堂。",r:"每次作答须为完整一句，须具体到部位、动作、深度、感受，缺一即为不合格。",b:"作答不合格时动作静止，直至说出合格答案方续；三次不合格，改为无声抽插三十下不得回应。",m:"全程"},
{t:1,n:"唯口可用",l:"Ore tantum",p:"服从方双手缚于身后——常用的姿势是手腕交叠、以柔软的布带扎成一朵结。此后整段前戏之中，能动用的身体部位仅剩一张嘴。想触碰对方的胸膛，只能凑上前以唇瓣贴合；想爱抚对方的颈侧，只能以舌尖描摹脉搏跳动之处；想撩拨对方的锁骨凹陷，只能以脸颊侧面反复厮磨；想到达对方腿间，只能俯下身以鼻尖轻顶那处已经硬起的形状。失去双手的辅助，每一个动作都变得笨拙、专注、甚至孤注一掷——歪着头调整角度以便舌尖能舔到那个位置，够不到时鼻息里发出小小的不满的哼声，为了平衡而重心前倾时颈项拉出一条脆弱的曲线。而下颌的每一次开合、舌尖的每一次探入、唇瓣的每一次吮吸，都因为无法用手辅助而变得更为专注。所有关于想要的信息，都被迫全部压缩进唇舌那一小片皮肤上。",r:"服从方双手若挣脱一次，前戏时长翻倍；两次者，双手改缚于背后并加短绳。",b:"表现合格者，此后进入之体位、深度、节奏均由服从方指定。",m:"25 分钟"},
{t:1,n:"十枚印记",l:"Signa",p:"支配方将于服从方身上盖下十枚印记。自颈侧起——唇瓣贴上颈侧那一小块温热的皮肤，先以舌尖沾湿，再以齿列极轻地圈住，然后吮吸——力道逐渐加深，血色从皮下缓缓浮起，凝成一枚深红色的花瓣。锁骨凹陷处一枚，触及骨骼时受印者会本能地一颤，喉间泄出一声低低的呻吟；胸口正中一枚，落在两颗乳尖连线的中央，那里的皮肤最薄最敏感；腰侧一枚，那里的皮肤最痒，吮吸时受印者会不自觉地扭腰躲避又被按住；腹股沟一枚，与两腿之间的湿热只隔咫尺，齿列的震动会一路传导至穴道深处；大腿内侧最白的地方一枚；乃至更私密的、平日只有情人可见之处。其中至少三枚须落在明日穿衣仍可露出的位置——如颈侧、锁骨、或腕内。此后一周，低头即见：有主之身。",r:"每留一枚须清晰报数并说明所在位置；漏报或误报皆重来。",b:"报错者全程重来一遍——但已留下的印记不予消除，最终身上或有超过十枚。",m:"20 分钟"},
{t:1,n:"双点集中",l:"Papillae",p:"本局全身地图上只有两个坐标——左右各一颗小小的乳尖。指腹先隔着薄薄的一层衣料寻到它们，画圈、轻刮、按压——布料的摩擦与温热的手指的按压交替作用，两颗乳尖会在衣料底下慢慢地、执拗地挺立起来，硬到隔着布都能看见形状。而后是直接的施为：撩起衣料，让它们完全暴露于灯光下。拇指与食指捏住一颗缓缓碾磨，令那点粉嫩缓慢地变深、变红、变肿；舌尖包裹着另一颗打转，唾液的湿润与嘴唇的温度交替折磨；牙齿极轻地叩，一记细微的锐痛立即化作两腿之间的一阵电流；冰块贴上令乳尖骤然收缩成一颗坚硬的小豆，紧接着以温热的口再度含化。下腹会越来越空、腿间会越来越湿，双腿本能地想要并拢磨蹭以求缓解——不许。让所有电流只从这两个高地出发，看它们能否独力送人抵达终点。届时那两颗乳尖会红肿至平日的两倍大小，一碰即颤。",r:"服从方双手不得触碰下身；双腿不得并拢；蹭动床单亦判违规。",b:"仅凭双点抵达顶点者，事后一个要求无条件应允——除去打破安全底线之事。",m:"40 分钟"},
{t:1,n:"含冰侍奉",l:"Glacies",p:"侍奉者先含入一整块冰——冰凉在口腔内迅速蔓延，舌面、上颚、齿列全部降至骨感的低温。而后张口将对方纳入——滚烫撞入冰窖的一瞬，被含者会不自觉地倒吸一口气，柱身骤然一跳。冰块在口腔中并不静止：它贴着柱身缓缓滚动，一路自根部滑至顶端，凉意与舌面的余温交替碾过每一寸皮肤；冰在含侍的过程中缓慢融化，冰水自嘴角淌落，滴至被含者的小腹、大腿根部，那种从滚烫到冰凉的落差在皮肤上被放大成一阵战栗，令小腹肌肉不受控地一阵抽搐。片刻后，口腔自冰凉回暖至温热，被含者刚要习惯这份新的温度——侍奉者吐出，换下一块冰，含回。共三块。换冰时不许将对方吐出：新的冰块须直接在口中与对方共处，那种滚烫与冰凉在极小空间内共存的瞬间，最是要命。",r:"换冰时口不得离开被含者；冰须于口中完成交替。",b:"三块用尽仍未令对方缴械，第四块塞入侍奉者的另一处穴口继续。",m:"20 分钟"},
{t:1,n:"晨间唤醒",l:"Aurora",p:"晨光自窗帘缝隙漏入，一方尚在沉睡，呼吸绵长而深稳。另一方悄悄掀开被角自足端潜入，在温热而昏暗的被窝里摸索到晨起的形状——那是清晨特有的、并非源于欲望而源于生理的一段温热，硬度介于半苏与全醒之间。以唇轻触，仅仅是触碰；而后以舌尖沿冠状沟绕一周，动作要极轻、极慢；最后将顶端含入口中，含着不动，只让温热的口腔温度包裹住它。须缓——过急会令沉睡者过快苏醒，反而错过此局的真意。目标是让人在梦与醒的交界漂浮片刻：梦里先有了湿热缠绵的触感，意识一点点自深处上浮，梦与现实的界限模糊，肉体先于神志醒来。而后是那一刻——沉睡者睁眼，掀开被角，看见含着自己抬起眼睛的那双眼睛。此刻通常已经硬到近乎作痛，而含侍者的口中亦已被自己的津液与对方的前列腺液浸润。",r:"全程不得使用双手，不得出声，不得于对方完全清醒前停止。",b:"若对方醒来第一句为笑骂或抗议，本日主导权归唤醒者。",m:"随机"},
{t:1,n:"禁声五分",l:"Silentium",p:"规则宣布之后，房间会安静得可怕——因为接下来五分钟，无论对方做什么，服从方不得发出任何声音。而支配方深知每一处令人无法压制之处，会专挑那些地方下手。手指绕着乳尖打圈，服从方咬住嘴唇，鼻息骤然变粗；唇舌探至耳后那一小块隐秘的皮肤，服从方喉间那声呻吟顶至齿关又被硬生生咽回；两根手指同时探入穴中弯起，找到那个凹陷用力按压，服从方全身猛地一颤，喉咙里泄出一小半个音节又被立即收住。整个房间只剩水声、床单摩擦声、以及那濒临破功的鼻息。被压回喉咙里的声音不会消失——它们会转化为别的东西，积在身体的深处，令穴道的痉挛、皮肤的战栗、腰肢的扭动都倍加激烈。憋住的呻吟是最好的春药——服从方会发现自己愈是压抑声音，身体就愈是不受控地对每一次触碰做出更剧烈的反应。",r:"喘息允许，呻吟违规，单音节亦算；哭泣抽气亦不得成声。",b:"出声一次，本局时长加一分钟；累计超过十分钟者，当夜释放取消。",m:"5 分钟起"},
{t:1,n:"独角剧场",l:"Spectaculum",p:"支配方于一米之外落座，翘腿旁观。全程不得触碰服从方，服从方亦不得触碰对方。服从方面向观者躺定，双腿分开至膝盖几乎贴床——以自己最熟稔的方式开始：手指如何游走，往何处按压，何种节奏。一米的距离，比贴身更为赤裸：因为每一个动作都是演给唯一一位观众的独角戏，无处遮掩，无处狡辩。一根手指沿会阴描一道弧线，观者能清楚看见指腹如何压过每一寸皱褶；两根手指探入穴中，观者能清楚看见指节没入的深度、拉出时穴口如何被牵拽变形、指缝间如何拉出一根根晶亮的银丝；拇指同时按上那颗充血的珠子打圈，观者能清楚看见服从方腰肢如何在自己的手底下不受控地拱起、双腿如何本能地绷紧、脚趾如何蜷缩。观者始终不动，只是看着，眼神在服从方的手指与面部之间来回，令自我表演变得更难以承受。这种被凝视的独慰，与独自的自慰是完全不同的事——每一个动作都带着表演的自觉，也就带着更深的耻辱与更烈的兴奋。",r:"服从方须面向观者，双腿分开，动作须全程清晰可见。",b:"先开口恳求观者入场者为败方，败方于当夜之后续场合中居下位。",m:"20 分钟"},
{t:1,n:"项圈之日",l:"Collare",p:"清晨醒来，服从方亲手为自己扣上项圈——那圈皮革贴住颈项的一瞬，一整日的身份定调即已完成。低头饮水时，皮革轻压喉结的位置；侧身转头时，皮革蹭过颈侧的皮肤；伸手够高处物件时，皮革随颈项肌肉的绷紧而收紧一分。这一整日，做家务、阅读、伏案工作、与他人交谈——一切如常，唯独颈间那一圈始终存在，像一只温柔的手虚虚地环着。每一次它蹭过皮肤，都会想起它的含义：今日是戴着标记生活的一日。而项圈的存在会将服从方的意识状态整日维持在一种低烈度的性期待之中——每一次不经意的触碰、每一次镜中一瞥自己戴着项圈的样子、每一次外出时穿高领遮掩它的努力，都在积累欲望。想要摘下——沐浴时、外出前、访客来时——须先向支配方申请。申请时的措辞、语气、姿势，皆为评估的一部分。",r:"摘取（沐浴、外出、访客等）须提前申请，获准方可暂摘，事毕须立即戴回。",b:"擅自摘取一次，夜间掌击加二十下；累计三次，改为二十四小时不得摘除。",m:"一整天"},
{t:1,n:"舌尖清扫",l:"Lingua purgat",p:"事毕，任何人不得取用纸巾。支配方倚靠床头，只说一字：来。服从方跪行至身前，须以舌处理一切痕迹——对方身上的，自小腹一路舔至根部，将混合的白浊与自身的花蜜以舌面一点点收入口中；对方大腿内侧的，那里往往有一道自根部溢至股间的水痕，须循着痕迹的方向逐寸清扫；自己身上的，俯身够到大腿内侧那几道半干的湿痕，鼻尖能闻到属于自己的、混合了汗与情欲的独特气味；床单上的，如有溅出者，亦须以舌拭净。支配方指定何处即何处，不许发问，不许皱眉。这是一场仪式：将本局的一切证据，以最虔诚的方式收进体内。舔的动作要慢，要认真，要显得心悦诚服——甚至可能被要求在清扫过程中报告口中的味道、说出对方液体的口感、以及自身液体与对方液体混合后的差别。",r:"清扫顺序由支配方指定，不得询问理由，不得表现出嫌恶。",b:"遗漏一处，须自头再清扫一遍全身与床铺。",m:"15 分钟"},
{t:1,n:"整点奏报",l:"Nuntius",p:"服从方外出——上课、逛街、会友——一切社交如常。唯独每至整点，须寻一处无人角落，向支配方奏报下身状态。报告须具体：此刻濡湿至何等程度（可用几成或隔着内裤是否已经沁出作答），内裤贴合的触感（是紧贴、微微下坠、还是几乎能感到布料被吸附住），方才走神的那三十秒里脑中所想的画面（可具体到姿势、位置、对象）。文字须完整成句，可配图——譬如于洗手间内快速掀开裙摆自拍一张，让支配方看清此刻的实况。于是一整日，无论身在何处、正做何等正经事——课堂上、会议中、与家人共进午餐——每小时都有那一分钟，意识会被强行拽回两腿之间，被拽回那个远端接收报告的人身边。这份被无形之线牵系的感觉，比任何看得见的束缚都更持久。而每一次奏报时的躲藏、每一次掀起裙摆自拍时的紧张、每一次遣词造句的挣扎，本身即是一场微型的秘密仪式。",r:"奏报须包含湿度、触感、所想三项，缺一即不合格；不合格者当场重报。",b:"漏报一次，归家后跪姿补足一小时，补报期间不得动身。",m:"一整天"},
{t:1,n:"着装指定",l:"Vestis",p:"开局之前，由支配方自衣柜挑选服从方今夜的着装。可能是那条黑色吊带真丝睡裙——细肩带滑落至臂弯的姿势，胸口的蕾丝勾出乳沟的深度；可能是丝袜配一件白色衬衫，下摆刚好遮至腿根，一屈身便若隐若现；可能是一件宽大的男士衬衫，除此之外身无一物；亦可能只是一条内裤，其余全部不许。服从方着装完毕，须上前于支配方跟前转身一周展示，规则随即生效：全程不脱。裙摆会被推至腰际，肩带会被扯落至臂弯咬在齿间，衬衫扣子会被从上至下崩开数枚，丝袜会被撕开一个恰好露出穴口的洞——但衣物须一直留在身上，被揉皱、被浸湿、被弄得不成样子，甚至沾染上暧昧的痕迹，直至局终方可褪下。而着装本身的选择即是一份宣言——是被欣赏的对象，是被玩弄的容器，是被展示的作品。",r:"全程不得完全脱除；须着装完成整局，即便姿势变换亦然。",b:"衣物被弄污者，归着装者自行清洗；被弄破者，由指定者赔付新的。",m:"全程"},
{t:1,n:"按颈伏低",l:"Manus in cervice",p:"后入之位。服从方俯卧于床，双膝跪起，胸口贴住床单，臀部高高抬起——那种主动献上的姿势本身即是一份宣言。支配方一手掐住腰际，指腹按入腰窝那两处凹陷；另一只手整个覆上后颈，五指微微收拢，向下按——面颊贴上床单，一侧脸颊被压出一道浅浅的红印，视野里只剩床单的皱褶与放大的织物纹理。腰被迫塌成最深的弧度，臀部完全交付。此姿势之中，服从方无法看见身后，无法转身，无法撑起身体，无法调整任何角度——所能做的唯有承受身后传来的每一记撞击，以及感受后颈那只手的分量。那只手不重，但它始终在。它在说：别动。你是我的。而每一次撞击的深度都能穿透至平日难以触及的凹陷，令服从方在被按住的姿势中感受到一种奇异的、被彻底占有的安全感。",r:"服从方双手不得撑起身体；腰须始终塌陷保持深弧；撑起一次即受责。",b:"撑起一次，双手改缚于背后并加短绳；累计三次，改为面朝下双手完全束缚续玩。",m:"20 分钟"},
{t:1,n:"点名之吻",l:"Osculum",p:"支配方端坐不动，只出声。锁骨。——服从方须立即凑上前吻在其锁骨凹陷处。腕内。喉结。左胯凸起处。腰窝。膝内。共十处，由易至难：起初的位置伸手可及，后半段的位置需要跪下、俯身、甚至仰头才够得到。每一吻的速度、准头与虔诚程度都在支配方的评分之中。凑近的动作要迅速但不慌乱，唇触位置要精准，唇齿贴合的时间要恰到好处——过短显得敷衍，过长显得贪恋。这是一张以唇绘制的地图，绘制完毕之后，被吻者的身体上会留下一条完整的、被走过的路线——那些位置或许无痕，但会残留唇的温度与湿意，久久不散。而随着位置越来越私密——腹股沟、大腿内侧、乃至更深处——每一次凑近前的犹豫、每一次唇触时的战栗、每一次退开时的红脸，都成为本局最动人的细节。",r:"共十处；吻错位置、方向偏离、迟疑超过两秒者，皆判违规。",b:"每违规一次，掌击一记；累计三次，本局作废，另择时另计。",m:"15 分钟"},
{t:2,n:"龟甲缚",l:"Kikkou",p:"绳自后颈垂落，绕过肩头，于胸上一道、胸下一道，中央结出一串工整的菱形，令乳房被绳架自四面框住而不覆盖——那种被绳勒住却仍暴露的形态是龟甲缚的精髓所在。而后双臂自身后被一圈圈固定，前臂交叠于后腰，手腕以绳缠住。麻绳勒入皮肤的力道是均匀的、包裹性的——并非捆缚，更像一副生长于身上的甲胄。每一个绳结压着一个穴位，呼吸时整副绳架跟着起伏，胸口的绳被撑紧一分，勒痕慢慢在皮肤上洇出粉色的菱形花纹；乳房因两道绳的挤压而略微凸起，乳尖在绳与绳之间的空隙中挺立得格外分明，几乎是主动献上的姿态。绑毕不急于施为：先令被缚者在绳中静待五分钟，令其独自感受绳的重量、绳的温度、以及那份既被固定又被展示的双重感觉。心跳会撞在绳结上，一声一声，格外清晰——而穴道深处的湿意会随着每一次呼吸的起伏而缓缓渗出，无处可去，只能顺着大腿内侧慢慢下淌。",r:"绑缚前须检查指尖温度与麻木感；此后每十分钟须复查一次血运。",b:"绑毕先静置五分钟不作任何触碰，令被缚者独自感受；此后所有姿势自被缚者最敏感处开始。",m:"60 分钟"},
{t:2,n:"周身蜡刑",l:"Cera tota",p:"本局是一幅画的工程。受蜡者平躺于铺好防水布的床上，全身除隐私处外皆暴露于烛光下。施蜡者自锁骨落第一滴——烫意先在小小的范围内炸开，随即被身体的温度化开成一片暖印。而后沿身体版图逐次铺展：胸口对称两撇如书法起笔；肋骨起伏之处排一串圆点，每落一颗肌肉便本能地一收；小腹铺一小片，蜡在小腹的曲线上略微流淌片刻方凝；髋骨两侧各一道，那里骨骼突出，蜡凝得格外快；大腿内侧最白最薄的皮肤上，一路书写至膝弯——那里蜡尚未凝就已经化开成暖流缓缓下淌，痒得受蜡者不自觉地蹭动。烛与烛之间的间隙用来饮水、擦汗、检视皮肤，以及在等待中令下一滴的期待本身成为一种刑罚。四十五分钟后，受蜡者将成为一件覆满蜡封的完整作品——再被施蜡者一片一片剥开，剥落的蜡片如秋叶，露出蜡壳之下的粉色印痕，一处一处地重新暴露于灯光下，比原本更为敏感。此时任何抚摸都会带来放大数倍的战栗。",r:"每落一处，受蜡者须报出感受是烫是痒；每十分钟须补水一次；发现异常灼痛立即终止。",b:"全部剥离之后，印痕最深的一处由施蜡者以齿咬上，含定三十秒方松开。",m:"45 分钟"},
{t:2,n:"冰火淬炼",l:"Ignis et glacies",p:"案前置两盏：一盏盛冰块，一盏盛温水（约五十度，接近人体极限的耐受温度）。侍奉者先含一口温水，令口腔温热至几近发烫——舌面、上颚、齿列都被水温浸透。而后张口将对方纳入——热上加热，柱身如坠温泉，龟头周围被四十几度的口腔紧紧包裹住，被含者会立即倒吸一口气，柱身骤然一跳。侍奉者不急，含着不动，任由温热蔓延；片刻后，退出，含入一块冰。冰在口中迅速降温，舌面自炽热跌至冰点，再度将对方纳入——冰窖般的凉意瞬间咬住每一根神经，柱身在冰凉的口腔中反射性地想要退缩却被牢牢含住，甚至能感到柱身表面因温度骤降而微微颤抖。热、冷、热、冷，一张嘴即是一台温度的刑具。换温时不许将对方吐出：新的冰块或水须直接在口中与对方共处，那种极端温差在极小空间内碰撞的一瞬间，最能令人失守。到局末，被含者会连“到底是冷还是热”都难以分辨。",r:"换温不得中断含侍；冰块须直接在口中完成温度切换；水温不得超过五十度。",b:"若令对方失控，释放于何处由侍奉者指定——面部、口中、胸前皆可。",m:"25 分钟"},
{t:2,n:"整夜禁果",l:"Denegatio",p:"本局规则唯一：不许抵达。而支配方将以一整晚的时间违背这条规则的字面含义——手指、唇舌、玩具、体位轮番上阵，每一次都将服从方推至门槛边缘，看其腰肢拱起、足趾蜷缩、呼吸破碎、指节掐入床单，然后在最后一秒撤走一切刺激。服从方须自行举手叫停，亲手掐断自己的顶点——这份自我否决的痛楚往往比外部剥夺更难忍受。一次，两次，三次。至第五次左右，服从方开始耍赖：偷偷夹紧双腿相互磨蹭，暗暗蹭动床单以求缓解，甚至以哭腔讨价还价——这些皆无效。规则不可违背。而每一次被剥夺，都会令下一次的门槛来得更快、更猛烈——这是恶性循环，也是本局的乐趣所在。至局末，服从方已经处于近乎歇斯底里的欲望状态，穴道深处不受控地一阵阵痉挛，只要一根手指探入就能立即引爆——但不许。这份漫长的克制会在解禁那一刻化为一场山崩。",r:"临界须由服从方举手示意；夹腿、蹭动、私下磨蹭皆判违规；哭腔讨饶不予受理。",b:"忍至终局者，准予一次彻底而漫长的释放，直至耗尽；违规几次，禁令即顺延几日。",m:"90 分钟"},
{t:2,n:"强制连击",l:"Coactio",p:"高频震动器对准阴蒂，以医用胶带十字固定——它逃不掉，人也逃不掉。开至中档，支配方退至床边旁观。第一次顶点如约而至：呼吸紊乱、腰肢猛地弹起、穴道深处开始规律地痉挛——释放。但震动不停。刚刚经历过一次完整释放的、敏感至极的那一点被继续碾磨，快感开始由甜蜜转为过载：伸手试图去抓那颗跳蛋，被按住；本能地想要并腿夹住以缓解，膝盖被强行分开；哭喊着说不行了太多了求你停下，得到的回答只有一句——再来一次。第二次释放伴随着尖叫；第三次伴随着眼泪；第四次开始，身体进入一种既崩溃又空茫的失控状态，穴道深处不受控地一波一波抽搐，喷薄而出的液体浇湿床单大片。到第五次时，眼神已经开始失焦，语言功能几乎完全退化，只剩本能的呜咽与颤抖。看身体在说不要之后，还能诚实地抵达几次——这份记录，是本局的成果。",r:"口头求饶一律无效；唯有事前约定的安全词可即刻终止本局。",b:"抵达的次数即为本次记录，由双方共同记档；此数字将作为下次本局的起始目标。",m:"40 分钟"},
{t:2,n:"遥距外勤",l:"Foris",p:"跳蛋预先塞入体内，遥控留在家中操控者手上，二人出门。地点可为便利店挑选晚餐、饮品店排队、书店浏览——一切如常。而操控者出手的时机全是最坏的：对店员开口说微糖去冰不要果冻说到一半，档位陡然自零跃至中档，尾音颤了一颤，须咬住舌尖压住呼吸才能把整句话说完；在拥挤的收银台前排队，档位悄悄拔至最高档，服从方须站得笔直、面色如常，扶着购物篮的手指指节发白，两腿之间的湿意正无声地渗透内裤、蔓延至大腿内侧——甚至开始怀疑是否已经渗至外裤留下痕迹；结账刷卡时档位骤然全停，那种落差比持续的震动更令人失守，身体本能地追寻方才的震感却无处可寻。店员一无所知；周围的顾客一无所知；服从方与操控者之间那条无形的通讯线，只属于二人。此局最烫之处在于：全世界只有一人知道自己两腿之间正在发生什么，以及那只握着开关的手此刻在暗自发笑。",r:"结账、对话、需要开口的场合会被专门调档；话须说完整，声线须稳。",b:"撑住全程者，归家受一小时贴身伺候；当场露馅或急促逃窜者，归家跪着受一小时惩戒。",m:"60 分钟"},
{t:2,n:"深喉修行",l:"Profundum",p:"跪定于地，仰头对准。先做三次深呼吸，令咽反射尽量放松。自顶端一寸一寸纳入——过唇齿之关，抵至上颚的弧顶，绕过舌根，直至喉口那道弯。停一下。压下干呕的本能，闭眼，咽一次唾液——借着吞咽时喉肌向下收缩的动作，令最后一段柱身滑入喉咙深处。鼻尖触及对方的耻毛，尽根而没。坚持十秒：喉间那圈软肉不受控地痉挛绞紧，将口中之物勒得死死的；眼泪不受控地自睫毛间涌出，一颗一颗掉在对方的大腿上；口涎自嘴角淌出，顺着下颌滴至锁骨，甚至滴至前胸。十秒后缓缓退出，大口喘息、饮水、拭泪。此为修行，共三组，每一组之间休息一分钟。每组之后，喉咙对深度的接纳会略略提升——这也是训练之意。而喉咙深处那种被填满、被撑开、被暂时占据的感觉，本身也是一种极致的、原始的臣服体验。",r:"呛咳即停，不算失败；每组之间休息一分钟；水须常备手边。",b:"三组完成者，射精位置由修行者选择（喉内、口中、面部皆可）；未完成者，改为含定不动十分钟。",m:"25 分钟"},
{t:2,n:"皮拍二十",l:"Viginti",p:"皮拍先冰凉地贴上臀肉，令皮肤记住它的形状与冷面——那种从容不迫的贴合本身即是一种预告。而后扬起——第一记落于最翘处，一整片皮肤同时炸开热度，皮拍与臀肉相撞的啪声在房间中格外清脆，红印随即浮起。受罚者报：一。另一侧一记：二。力度自轻起，第五记时略略加重，第十记时达到中上强度，第十五记之后是收尾——每一记的强度、位置、间隔皆由执拍者控制。或连落三记不容喘息，令受罚者根本来不及报数；或悬停十数秒不动，让期待本身成为一种更深的刑罚。二十记毕，两团软肉滚烫得能焐手，色泽自粉转为深红，坐下会痛，走路会略略夹紧双腿——那份灼热感将伴随接下来的一切姿势，令后续的每一次姿势变换、每一次抚摸、每一次进入都被那份灼热放大数倍。",r:"每记须报数并保持声线稳定；哭泣不算违规，报数含糊或漏报才算。",b:"报错自一重计；累计三次自一重计，皮拍改为藤条，力度降半。",m:"20 分钟"},
{t:2,n:"发情期设定",l:"Aestus",p:"设定生效的一刻起，一方即为骤然进入发情期的 Omega——体温飙升，后颈的腺体开始胀麻发烫，信息素失控地自颈项外涌，全身皮肤敏感度倍增，双腿发软难以自持；而房间里唯一的 Alpha 就在眼前。须演至底：嗅到对方靠近时的战栗，被触碰颈项腺体时的哭腔，口中反复的、破碎的呓语——标记我、成结在里面、易感期救救我。Alpha 将掐住其后颈将人按至床上，掀开衣物，令其如发情动物般张开双腿；探入穴中时无需润滑，因为发情的身体早已濡湿到滴水；抽插节奏由缓转急，将人一路顶入易感期最深处；最后一口咬上后颈的腺体——牙齿刺穿皮肤的钝痛与穴道深处成结的胀满同时降临，标记完成，一切归于此人所有。此后整个发情期，唯此一位 Alpha 可近身。这份设定的极致沉浸感来自于它所调动的、几乎是动物性的本能——被信息素征服、被标记、被完全占有。",r:"全程不得出戏；设定专有词汇（腺体、标记、成结、易感期）须自然运用不得回避。",b:"出戏一次，整个场景自开局重演；成功完成者，此后现实中对方享有为期一周的绝对优先权。",m:"90 分钟"},
{t:2,n:"完整宠化",l:"Canis",p:"项圈扣上、牵绳挂好的一刻，语言自服从方身上退场。此后两小时，其身份为一只宠物——具体是猫是犬由事先约定。四肢着地随行于主人脚边：主人行则行，主人停则停；主人于沙发上落座，宠物须于其脚边趴伏；主人翻书阅读，宠物须安静地靠在膝上；主人饮水，宠物须仰头等待主人以掌心接水喂饲。渴了低头舔碗中的水，饿了就食碗中切好的果物——碗须置于地上，不许上桌。有所求则以叫声、蹭动、轻咬裤脚、以及各种非语言的姿势表达。呜咽是撒娇，短吠是不满，把头拱入掌心是讨摸，翻身仰肚是彻底的信任与献媚。而在角色的深度沉浸中——尤其是被摸头、被夸一声乖、被拍拍屁股说去玩吧的时刻——那份自我尊严的暂时放下所换来的，是一种深至骨髓的松弛与被爱意，原始得吓人。",r:"全程不得说人话，任何语言表达皆判出戏；出戏一次，牵绳收短一半。",b:"表现优异者，事毕被抱上床安睡，主人为其洗澡、擦干头发、拥入怀中入眠。",m:"120 分钟"},
{t:2,n:"感官封锁",l:"Privatio",p:"眼罩挡去光线——一片纯粹的黑；耳塞塞入耳道——外界声音降至几近于无，只剩自己的心跳与呼吸声异常清晰；四肢以柔软的皮带缚于床的四角，令身体呈完全展开的大字形——无法防御，无法预判，无法躲避。世界瞬间收缩至只剩皮肤与想象。而后是等待。被封锁者不知对方身在房间何处，不知下一次触碰何时降临、落于何处——可能十分钟之内毫无动静，久到几乎怀疑对方是不是已经离开；也可能突然一根手指划过足心，惊得整个人不受控地弹起。在纯粹的黑暗与寂静之中，每一次等待被拉长十倍，每一次触碰被放大十倍——一片羽毛扫过腹部即是滔天洪水，两根手指探入穴中即是灭顶之灾。皮肤开始变得几近超能力般敏感——甚至能通过空气的微小流动察觉到对方的靠近，那份预感反而更为折磨。一小时之后，皮肤将成为全身最明亮的器官。",r:"触碰的时机与位置完全随机，不作任何预告；被封锁者不得出声询问。",b:"结束后须如实交代：这一小时里，几次以为对方已离开；每答一次以为，主导方吻其一处。",m:"60 分钟"},
{t:2,n:"前后并进",l:"Duo",p:"前穴先纳入一根形状熟悉的器具，令其撑满穴道、抵在最熟悉的凹陷上——此时穴道深处已被填得实实的，穴口张至最开。而后服从方俯卧于床，臀部高抬。支配方倒足润滑液于后穴口——那种冰凉的液体一点点顺着股沟流淌至前穴口的触感本身即令人战栗——以一根手指贴着后穴口的褶皱缓缓画圈、按压、试探；那圈括约肌起初本能地抗拒，但在温柔的按摩之下慢慢放松，第一节指节缓缓探入。只用手指，不作他想——因为两条通道之间仅隔一层薄壁，探入者的指腹能隔着那层壁清晰摸到前方器具的形状、粗细、以及穴道每一次的收缩。前方被填满、后方被撑开的双重感受，将在体内叠加为一种从未体验过的、指数级的过载。而当探入者以另一只手同时刺激阴蒂时，三处刺激合成的快感几乎超出神经承受的极限，服从方会本能地想要蜷缩以求缓解却因姿势的限制而无法逃避。",r:"润滑须绝对充足；后穴手指自一根始，每加一根须停留至少三分钟令括约肌完全适应。",b:"隔壁摸到前方器具轮廓的一瞬，探入者须如实告知——此告知本身即为本局最烫的时刻之一。",m:"40 分钟"},
{t:2,n:"渐进扩张",l:"Dilatatio",p:"扩张器按尺寸列队摆放，自最细者始。润滑倒足于第一号，缓缓探入——几乎无感，只有润滑液的凉意与器具的温度落差。停留五分钟令穴道熟悉。换下一号——渐有撑开之意，穴口那圈软肉开始被拉展开细微的褶皱。再下一号，那圈肌肉开始需要主动放松方能容纳——服从方须深呼吸，令身体的抗拒感缓缓退去。每换一号皆是一场谈判：呼吸、接受、适应，身体自会给出答案。号数上升的过程中，穴道深处会渐渐产生一种奇异的、从未体验过的被撑满的餍足感——那份餍足与快感邻近但不相同，介于痛与爽之间，专属于此局。而每一次成功适应更大的号数，会带来一种奇特的成就感——身体本身在此过程中完成了一次小小的、私密的胜利。不硬来，不逞强——纳不下便停在上一号，那即是今日的国境线。今日抵达几号并不重要，重要的是每一次，身体都比上一次更信任这件事、更信任那双为之扩张的手。",r:"纳不下即停在上一号，不得强行；润滑不得节省；任何撕裂感立即终止。",b:"今日号数记档；下次自此起步。若欲跨号数进入正戏，扩张至少停留于目标号数十分钟。",m:"45 分钟"},
{t:2,n:"节奏让渡",l:"Regimen",p:"跪定，张口含住，随即交出全部主动权——对方的手指自侧鬓插入发间，五指扣住后脑，自此深浅、快慢、角度、节奏皆不由己。可能先浅浅厮磨，只以唇圈住冠状沟处轻轻吮吸；可能骤然按至根部，抵住喉口后停住不动，令喉间的痉挛与主导方的柱身互相较劲；可能一记接一记地快速抽插，令口腔不受控地作出吞咽的动作；可能一记极深之后停住十秒，令服从方在那份被塞满的窒息感中细细体会。双手须负于身后，任眼泪自睫毛间涌出、涎水自嘴角淌落，任下颌酸胀、任喉间痉挛。须做的只有一件事：放松、信任、令口腔完全易主。而这份深度的信任交付——包括交付出自己的呼吸节奏、呕吐反射、乃至喉咙深处最脆弱的部位——本身即是一份最深的亲密。被使用与被珍视，在此局中恰是同一件事——因为唯有极度的信任，方能允许口腔被这样彻底掌控。",r:"双手全程负于身后，不得抬起自卫；眼泪、涎水、干呕皆不必忍。",b:"全程不躲不退者，终局深处的释放须尽数含住并咽下；未咽者，涂抹于下颌与颈侧展示。",m:"20 分钟"},
{t:2,n:"语音自白",l:"Vox",p:"独自寻一处无人房间，以手机录制一段一分钟的语音，交予对方。内容须包括：以最不堪的词句描述自己此刻的身份归属（我是⋯⋯的、随时可被使用的⋯⋯，具体归属与用途须说明白），身体如何不争气（何处已经濡湿、何处已经硬起、平日有多想被对方如何对待），以及录制此刻脑中在想什么画面（须具体到姿势、动作、深度）。无人在场紧盯，羞耻感反而更重：对着话筒开口的第一句会卡壳，会脸热，会录到一半掐断重来。但最终交出的那一条里，须有喘息（因为录制时须一边说一边挑逗自己），须有具体的自白（无法以模糊形容词敷衍），须有亲口承认的每一个字。按下发送的那一秒，比说出口本身更烫十倍——因为那段话此后永远存在于对方的手机中，可随时被调阅；也因为那些用自己的声音承认下来的字句，即便未来后悔，也无法收回。",r:"须指明身份归属，须以不堪之词形容自身，须带真实喘息，须具体到画面。",b:"内容不合格者重录，无上限；累计三次以上，该段语音将于下次本局开场时当众播放。",m:"20 分钟"},
{t:2,n:"边缘一小时",l:"Hora",p:"计时器按下的一刻，一场漫长的凌迟开始。手指、唇舌、器具轮番登场——每种刺激都不许持续太久，每次都在快感即将累积为顶点的前一刻切换。攀至九十九，撤离；缓过来，再至九十九，再撤离；如此反复。前二十分钟尚能撑住体面，服从方咬着牙告诉自己我可以；四十分钟起开始咒骂、哭泣、语无伦次地讨价还价——求求你、让我到、我不行了——这些皆无效；最后十分钟已不成人形，全身细密地颤抖，穴道深处规律地不受控地痉挛，脸上分不清是汗是泪，喉间只剩破碎的呜咽。到这一步，即便完全不施加任何刺激，仅仅是手指轻轻搭在腹部，服从方都会因高度敏感而颤抖不止。而墙上的倒计时一秒一秒走——走完的那一刻，一小时的极致压抑将一次性归还，那份释放会来得比预期更迅猛、更彻底、更长久，甚至令身体在事后仍持续痉挛数分钟才慢慢平复。",r:"计时开始即不受理任何求饶；可哭可骂可挣扎，唯不许说不要了这三字。",b:"满一小时者，随后那一次将是本年最烈的一次；未满一小时者，禁令顺延至次日。",m:"60 分钟"},
{t:2,n:"弹指之刑",l:"Ictus",p:"受罚者仰卧，自行以两根手指撑开阴唇，令那颗充血的珠粒完全暴露于灯光下——那种自我暴露的动作本身即是本局的开幕。行刑者指尖抬起，第一记极轻地弹落于其上——如叩一颗露珠，力道刚好令那点微微一颤。受罚者报：一。第五记起加力，那一点已经又麻又胀，每弹一记全身随之一颤，穴道深处不受控地一夹；第十记时已经充血到粉红转深红，颗粒感格外分明，每弹一记都会溢出一小股清液顺着会阴淌下；第十五记之后是最重的五记——指尖蓄力、精准落下，快感与锐痛在同一点上炸开，双腿会疯狂想要合拢以求缓解——不许。撑开的两指须保持岔开的姿势，膝盖须始终分向两侧。二十记之后，那一点已经肿到与平日不成比例，几乎变成一颗小小的、鲜红的樱桃，一碰即颤，甚至不需要真正的触碰——空气拂过都能引起颤抖。",r:"每记报数；合腿一次，那一记作废重来；两指撑开的姿势不得改变。",b:"中途失守（提前抵达顶点）者重新计数；累计失守两次以上，改为缚定四肢续玩。",m:"20 分钟"},
{t:2,n:"镜前自陈",l:"Confessio",p:"跪坐于落地镜前，另一方于身后落座旁观。指令简单：自行以指撑开阴唇，将穴口暴露于镜前——亦暴露于身后那双眼睛之前。而后是难的部分——须一面注视镜中毫无遮拦的自己，一面开口描述所见：何种颜色（深粉、泛红、开合处透着水光），肿至何等程度（外唇比平时厚了一倍、阴蒂完全暴露、穴口撑开成小指粗的圆），濡湿到何种程度（从穴口沿会阴淌至臀缝、大腿内侧一整片都是、滴至地上），穴口正在如何开合（一收一放、痉挛地颤抖、不受控地一张一合）。用最直白的、几乎是医学式的词汇，说得像宣读检验报告，又羞耻得全然不是。届时会发现：最难的不是撑开自身，是亲口说出眼中所见的一切。而镜中的自己——那双撑开自己的手指、那微微前倾的姿态、那因描述而不断加深的红晕——会成为记忆中最难以磨灭的一副画面。",r:"描述须具体到颜色、湿度、动态，缺一项即重新描述该项。",b:"描述不合格者，以手机拍下穴口特写，对照照片重新描述，直至合格。",m:"25 分钟"},
{t:2,n:"忍水之局",l:"Retentio",p:"开局前，先饮尽一大杯水（约五百毫升）——半小时后水将抵达膀胱。而后照常行局——手指、唇舌、器具轮番施为，一切如常。随时间推移，另一种压力将自小腹深处一点点涨起，与快感搅在一处，愈发难以分辨——起初是隐约的胀意，可以忽略；继而是清晰的尿意，须刻意集中注意力才能压住；再往后是逼近临界的胀痛，两腿之间的两种感觉（性快感与排泄压力）互相干扰，令服从方在被顶入时会本能地绷紧全身以同时压制两种冲动。这份双重承受本身即是一种独特的刺激——因为无法专心于快感，快感也就变得更深、更纯粹。且性快感与排泄反射的神经通路互相干涉，某些位置的顶弄会同时触发两种反应，那种混合的、无法辨别的失控感是本局的核心体验。须如实奏报涨至几分（一至十），而去与不去、何时可去，须经批准。",r:"须如实以数字奏报膀胱压力；临界须提前申请；擅自离席一律加罚。",b:"提前如实申请者获准同行如厕；擅自行动者，本局暂停并额外增加一次相同条目于下次玩耍。",m:"60 分钟"},
{t:2,n:"缚椅之刑",l:"Sella",p:"一把结实的木椅——不需要豪华，需要的是可以承受负重且椅腿稳固。腕以柔软的皮带缚于扶手，两腕分别固定，无法互相接触；踝以皮带分缚于椅子两侧的椅腿，两腿被迫向外张开成一个宽阔的钝角——此姿势最狠的地方在于：双腿无法合拢，无法交叉，无法夹紧任何东西。腰间再加一道皮带穿过椅背固定，令上身无法前倾或后仰。人便彻底成为椅子的一部分。而后行刑者搬凳落座于正对面，慢条斯理地开始——可能只是伸手轻拂受缚者的乳尖，可能是探入指到穴中缓缓抽插，可能是以震动器对准阴蒂。受缚者能清楚看见每一个动作，能清楚感知每一种刺激，却连一厘米都躲不开、也迎不上——主动权被尽数缚走之后，剩下的全部是承受。这份完全的无法逃避会将每一次刺激的强度放大数倍，因为没有任何生理性的调整可以缓解——甚至连夹紧双腿这样最基本的自我安抚动作都被剥夺。",r:"正面施为；受缚者全程无法合腿、无法弯腰、无法伸手；解缚前须逐一检查血运。",b:"椅面留下的水痕由受缚者事后自行清理——先看清自己留下了多少痕迹，是本局的余韵。",m:"45 分钟"},
{t:2,n:"独力承欢",l:"Tu moves",p:"一方平躺于床上，双手枕于脑后，宣布罢工——从此至终局，此方不主动做任何动作，仅由躺姿承受。另一方跨坐其上，自行扶正对方使之立起，自行沉下——沉入的深度、速度、角度皆由自己掌控。此后便是骑乘者的独角戏：前后研磨或上下起落，或快或慢，哪个角度能顶至自己最深处的凹陷，全凭自己摸索。躺者一动不动，只是旁观：看骑乘者从最初的矜持缓动，到渐渐放开寻找自己的节奏，到追逐自身快感时腰肢摆动的失控，到满头汗珠、腿根颤抖、几近脱力仍咬牙继续。规则是：躺者缴械，方为终局；骑乘者先行抵达不算，须继续摆动直至躺者亦达至顶点。这份完全颠倒的权力关系令许多平日居下位者格外沉醉——因为唯有主动，方知被动之难；唯有摆动过一次自己的腰，方知平日那份轻松原来一点都不轻松。",r:"躺者不提供任何协助——不主动挺腰、不扶腰、不加速；累时可暂停，但停时不得脱离结合。",b:"骑乘者若先行抵达一次，须继续摆动至躺者亦释放；连续先行两次以上，转为侧躺姿势由躺者补位。",m:"40 分钟"},
{t:2,n:"车内之局",l:"In curru",p:"地下车库最角落的车位，引擎熄火，车窗留一线细缝——那缝隙是本局的赌注。后座空间狭窄得刚刚好——只能半躺蜷缩于座椅上，腿架至驾驶者肩上时还须小心提防不要撞到车顶，一个动作换一次角度就要重新调整。每个姿势都施展不开，每声轻吟都须压在喉间——因为一层车窗之外就是随时可能有人经过的通道，脚步声可能出现于任何时刻。远处传来脚步的瞬间全体静止，两人屏息相贴，心跳撞着心跳，柱身仍埋在体内，穴道却因紧张而反射性地绞紧——脚步声远去，再续。若有车辆驶入车库停在附近，须完全停下，甚至须捂住对方的嘴。狭窄、憋闷、提心吊胆——但正因为这份禁忌与危险，快感被放大到平日的数倍。而车窗玻璃上因两人的呼吸而蒙上的一层薄雾，会成为唯一的证据——如果有人凑近看，能看见的仅仅是那层雾，而雾之后一切都被隐藏。",r:"不得发出可被外部听见的声音；有人经过即完全静止；被目击即刻脱离撤离。",b:"被目击即刻结束本局撤离，归家立即续场；未被目击者，回家后可享受一次完整的正规做爱作为奖励。",m:"40 分钟"},
{t:2,n:"侍奉至满意",l:"Donec",p:"一方于沙发上落座，拍了拍两腿之间的地毯：跪这儿。没有时限，没有进度条，唯一的终止条件是一个字：停。侍奉者跪于地毯，以口伺候自根部至顶端——先以舌面自阴囊一路舔至冠状沟，再以嘴唇圈住顶端轻轻吮吸，然后含入口中缓缓深入。变换花样，察言观色——察觉对方呼吸转沉便保持当下的方式；发觉对方毫无反应便更换招式，或深喉、或吐出仅舔顶端、或双手辅助按摩囊袋。十分钟后下颌开始发酸，唾液自嘴角控制不住地淌落；二十分钟后舌根发麻，颈项因长时间的姿势而僵硬；而对方可能只是低头瞥一眼，眼神并无温度：继续。三十分钟后，跪着的膝盖开始因地毯的粗糙而生痛，但姿势不得改变。本局考验的不是技巧，是愿意为一句满意跪多久、跪得多虔诚——那份漫长的、看不到终点的服务感本身即是最深的臣服。",r:"中途停顿一次，本局时长加十分钟；下颌酸胀不得作为停止理由。",b:"下颌确实已经抬不起时，方可动用安全词；除此之外，继续。终局到来时，射精位置由被伺候方指定。",m:"不定"},
{t:2,n:"十道敕令",l:"Decem iussa",p:"支配方端坐不动，只出声，连下十道指令。开头温和：把头发束起来。跪下。手放在两腿之间。而后一道比一道过分：自己撩起裙摆至腰际。手指含入口中，舔湿，然后伸至自己下身。转过身，抬高，撑开示众。躺下，双腿分至最大限度。含入口中，不得吐出直至下一道指令。每一道指令仅有三秒的执行时间——迟疑即为抗命。声音落下的一瞬计时开始，三秒内动作须开始，动作结束前不许有第二念。十道下来，服从者会被自己的顺从吓到——原来只要声音来自那个人，多过分的事都做得出来。而每一道指令的完成本身，都在深化二人之间的权力关系——因为每一次的顺从都是一次微型的臣服仪式，累积十次之后，那份心理上的转变会持续到本局结束之后很久。",r:"每道指令限三秒内执行；迟疑记抗命一次；执行不到位需重做。",b:"抗命一道罚十下掌击，累计执行；十道全部无违规者，可向支配方提一个要求，无条件应允。",m:"30 分钟"},
{t:2,n:"含而不咽",l:"Retine",p:"终局一刻，主导方按着服从方的后脑将顶端顶至舌根附近释放——而后才是真正的游戏：不许咽，不许吐。须含着那一整口滚烫黏稠之物，跪坐端正，仰头，张口受检——舌面上那滩白浊混着涎水，随每一次呼吸轻轻晃动，几乎要溢出唇际。检视会持续很久——或许拍照留证，或许捏着下颌轻晃听那液体在口中晃动的声响，或许伸手将顶端塞回口中让服从方再度吮吸一次以令口腔重新沾满。腥气在口腔中愈发浓重，喉头本能地想要做吞咽的动作却须拼命压制——每一次咽口水的冲动被强行压下，就是本局的核心。舌头上那份重量、口腔中那份满、以及无法完成最后一个吞咽动作的挫败感，会将服从方置于一种奇特的、悬而未决的臣服状态。直到终于听见那一个字：咽。",r:"含定受检，不得吞咽或吐出；下颌须始终保持张开状态可供检视。",b:"中途溢出一滴，须自身尽数舔回；溢出超过三次，本局作废并加罚一次相同条目于下次。",m:"10 分钟"},
{t:3,n:"半身悬吊",l:"Suspensio",p:"胸缚打好之后——龟甲缚或箱型胸缚均可——主绳自胸前引出，穿过悬挂于房梁的承重环，缓缓收紧。上半身的重量逐寸自足底转移至胸前的绳架上——起初足尖仍稳稳踩地，绳索仅承担一小部分重量；继而足尖踮起，绳索承担一半重量；最终足尖仅点地保持平衡，几乎全部重量悬于绳上。人便悬于天地之间——足尖点地，胸口被绳吊起，双臂缚于身后。每一次呼吸绳子勒紧一分，每一个微小的晃动都被放大为钟摆式的摇摆；乳房被绳架四面挤压突显，乳尖因失重感而不自觉地挺立。失重与束缚同时发生的体验无可替代，是绳缚艺术的深水区。而此姿态令被缚者一切要害尽显于施术者之前——腰腹、腿间、颈项，无处不暴露。此时施术者的一根手指划过股间，那份触感因失重与束缚的双重放大会成为几乎无法承受的过载——被缚者会本能地想要蜷缩以求缓解却因悬吊而无处可退，只能承受。",r:"承重点须经专业检查、快剪须置于伸手可及处、全程须有人护场；任何麻木立即降下。",b:"未经系统学习者，本条目仅作幻想演绎——阅读描写、想象场景可，实际施行须待学习之后。",m:"90 分钟"},
{t:3,n:"单尾三十",l:"Flagellum",p:"单尾鞭与皮拍是完全不同的两个物种——皮拍是面的击打，力量分散；单尾鞭是点的击打，全部力量集中于鞭梢一点。破空之声先至，那种尖锐的啾声本身即令受者全身起粟；痛感后到——一道细长的、灼烧般的红线瞬间浮上皮肉，起初是烫，继而是清晰的、极细密的针刺感，几秒后化为深层的酸胀。三十记，只落于臀部与大腿后侧的厚肉之处，自热身力度始，一道压着一道排布——第一层是热身的粉痕，第二层是明显的红条，第三层是叠加后的深红——如在身上刻谱。至二十记之后，受鞭者会进入某种恍惚的状态：痛感开始转化为一种奇异的、几近于快感的东西，脑内内啡肽大量分泌，人反而觉得平静而清明。此时若被要求再报数，声音会变得又软又飘，那种恍惚的臣服感是本局最深的所在。刑毕是漫长的冰敷、上药、拥抱至颤抖停止——那段温柔的余韵比刑罚本身更为重要，是重新将人从恍惚中接回现实的必要仪式。",r:"绝对避开脊柱、肾区、关节；每十记须检视皮肤一次；发现异常反应立即终止。",b:"刑毕须冰敷上药，拥抱直至受鞭者停止颤抖为止；此后二十四小时不得再玩击打类条目。",m:"45 分钟"},
{t:3,n:"渐进全握",l:"Manus",p:"此为以小时计的工程，急不得。三根手指为起点——大量润滑液倒于手上，指尖并拢缓缓探入，如常一般的抽插节奏。停留十分钟令穴道完全适应此宽度；而后加至四根——那圈括约肌开始需要主动放松方能容纳，探入的深度也须放慢，缓慢地旋转、按压、扩展；再停留十五分钟。最后是最难的一关——拇指收入掌心，令四指并拢加拇指内收的手形成为最宽的一点，那一点集中于大拇指的指节。以毫米为单位向前推进，每前进一毫米停留十秒，令穴口的肌肉逐渐认可此扩张。整个过程之中，施术者的另一只手须持续以指腹按摩其他部位、以话语给予肯定与鼓励，令受术者的注意力分散、身心放松。当整只手最终完全进入的那一瞬——如果能到达——受术者会经历一种从未体验过的、彻底的填满感：手掌于体内握拳成一颗滚烫的心脏，每一次心跳都清晰地传递给对方。或许今日四指便是终点，那便到四指——进不去不是失败，身体愿意为此人打开到哪里，哪里便是今日的圆满。",r:"润滑液不得中断补充；指甲须剪至最短并磨圆；任何撕裂感、疼痛、出血立即终止。",b:"无法完成不作失败论——停下相拥、亲吻、以其他方式令其抵达顶点，同样是本局的完成。",m:"120 分钟"},
{t:3,n:"整日主奴",l:"Dies integer",p:"自今晚八时至明晚八时，一整日的权力交接。服从方的一切决定权上交：几时安睡、吃什么、穿什么、能否落座沙发、说话须不须跪、能否使用手机、如厕的时间与方式——皆须请示。这不是一场戏，而是把权力关系织入最平凡的日常。会在洗碗时忽然意识到自己是待命的；会在午睡前发讯申请闭眼；会在饥饿时低声请求进食；会在晨起时首先跪于床边等待第一道指令。二十四小时的浸泡会揭示许多平日隐藏的心理状态——对被管束的深层渴望，对信任的极致试探，对自我的重新认识。而这份浸泡的效果并非在事中最强烈——事中人往往还在角色里，感受被冲淡；真正的重量在事后浮现：那种失去与重获自主权的对比会持续数日在心中回响，令人重新审视自己与关系的本质。期满，权力归还——但这份体验将改写此后二人对关系的理解。事后须有一顿正餐与一场完整复盘：何处舒适，何处勉强，下次如何调整。",r:"开局前须书面写明边界清单：绝对禁止之事项须逐条列明，且此清单在本局中不可更改。",b:"期满须有正餐一顿与不少于一小时的完整复盘——舒适之处、勉强之处、边界的调整方向。",m:"24 小时"},
{t:3,n:"扼颈之护",l:"Collum",p:"临界前的数秒——那种熟悉的、即将决堤的电流已经自尾椎攀升至头顶的瞬间——手掌覆上颈侧，不压正中气道，仅均匀扣住颈动脉两侧，令脑部供血稍缓。视野边缘开始发暗发亮——那是脑部轻微缺氧的自然反应——快感在这份缺氧的错觉中被无限放大成一场海啸。呼吸变得艰难而稀薄，每一次心跳都清晰地传至颈侧那只手的掌心，那份跳动的存在感本身即是最原始的、生命被握于他人之手的隐喻。五秒，仅五秒，绝对不得延长。而后松手——血液轰然涌回头顶，感官短暂过载般清明，顶点随那阵眩晕一同砸落，整个人如从深水中浮起，恍惚中不知身在何处。此为整份清单中最须敬畏的条目：它的每一条规则都不是仪式，而是保命线。任何一次超时、任何一次压偏、任何一次面对头晕的不敏感，都可能造成不可逆的伤害。因此本条目只推荐于长期伴侣之间、且施术者须事先研习专业教程。",r:"绝对不压正中气道，绝对不逾五秒，须设立非语言停止手势；任何眩晕、视野异常、口齿含糊立即松手。",b:"施行前须双方共同观看专业教程视频不少于三段；不得凭感觉行事；每次施行前须口头复述规则一遍。",m:"配合使用"},
{t:3,n:"三日封印",l:"Tres dies",p:"自今夜零时起，七十二小时，高潮被没收。不许自渎，不许夹腿磨蹭，不许于睡梦中的任何暗示性动作——若梦遗则须于晨起时如实汇报。而生活须照常运转——沐浴时花洒不得对准下身冲洗过久，睡前手机不得翻至任何暗示性的画面。每日晚间须向持有封印方奏报：今日濡湿几次，哪个瞬间最难熬（看到街上的情侣接吻、闻到床单上残留的对方的气味、地铁上被人挤到），可曾起过偷跑的念头——若起过，须坦白起念的时刻与场景。三日之内，欲望如水位日日上涨——第一日尚能自控，双腿之间偶有隐约的胀意；第二日下腹开始隐隐作痒，任何轻微的触碰都会引起过度反应；第三日整个人如干柴一般，随时可以被点燃，甚至看到一件无关的物品也可能触发无法控制的联想。第三夜的解禁将来得比想象中更为激烈——那三日的积压将一次性爆发，那种彻底的释放会像整个身体被清空重启。",r:"每晚奏报须包含次数、时刻、念头三项，缺一项即视为不合格。",b:"第三夜解禁；若被察觉偷跑，封印自那日起重新计三日，累计。",m:"3 天"},
{t:3,n:"残缺之顶",l:"Ruina",p:"与寸止相反——寸止是在门槛前撤走，令顶点未能来临；此局更为恶劣——不在临界前收手，而是任其抵达，然后在浪头砸落的第一秒抽走所有刺激。指腹在最后一记加速之后骤然离开阴蒂，器具骤然关停撤离，唇舌骤然脱离——那个顶点将残缺地、半途而废地流过去：身体的痉挛如约到来（阴道深处的规律收缩、大腿的抽搐、腹肌的绷紧），但快感只被释放了极小一部分，绝大部分被截断在半途——如一发哑炮，如一场未完的乐章。这份残缺比未曾抵达更难受百倍，因为身体已经承诺了释放却未能兑现。生理上，那份未完成的能量无处可去，会以一种奇特的方式滞留于下腹深处——那种沉甸甸的、饱胀的空虚感，是本局的独特体验。受刑者会又气又空地瞪来，甚至试图自行补救——不许。双手被按住。连毁三次之后，第四次方予完整。届时的释放将比任何一次都更为激烈，因为身体积累了三次未完成的能量。",r:"抽走刺激之后，不得自行补救；双手须被按住至身体的痉挛完全平息。",b:"连续三次残缺之后，第四次给予完整而漫长的释放，直至身体完全脱力。",m:"40 分钟"},
{t:3,n:"电流低语",l:"Electricitas",p:"专用电玩具的贴片附于大腿外侧或臀部——绝不用于胸口、颈项、及任何靠近心脏之处。自最低档始。第一档几乎只是麻痒，如虫足于皮下爬行——这份麻痒本身是新奇的，但尚不构成明显的性刺激。第二档化为清晰的、一跳一跳的脉冲，肌肉不受控地轻颤——两腿之间开始产生共鸣，那份脉冲感通过神经传导至更深处，令穴道开始不受控地一收一放。第三档，每次脉冲都像一根看不见的手指在皮下拨弦，全身随之抽搐；至更高档，每次脉冲之后有一段短暂的余韵，令神经处于持续的过载状态。电流是所有刺激中最陌生的一种——它绕过皮肤，直接与神经对话，没有任何常规刺激的对应参考。习惯它需要时间，而一旦身体开始理解它，那种被电流反复亲吻的感觉会成为一种独特的、无法用常规语汇形容的快感。每档停留一分钟，逐档奏报感受，共同寻到那条痒与受不了之间的线。",r:"绝对不跨越心脏，绝对不用于胸口、颈项、头部；心脏疾患或植入医疗设备者一律禁用。",b:"自最低档起，每档满一分钟方可上调；发现异常反应（心悸、呼吸急促至危险程度）立即断电。",m:"30 分钟"},
{t:3,n:"贞操之钥",l:"Cingulum",p:"锁扣合拢的一声轻响之后，钥匙挂上另一人的钥匙链——那一刻，高潮有了物理意义上的管理者。锁上之物或为专用贞操锁（女性用有笼状与板状两种设计），或为其他限制性装置。此后，沐浴时它在——须以特殊的方式清洁；安睡时它在——夜间勃起或欲望上涌时无处宣泄，只能眼睁睁看着自己被物理阻断；欲望上涌时伸手摸到的只有一圈冰凉的壳，那份被物理阻断的挫败感将快感转化为持续的低烈度渴望。这份渴望日日累积——第一日尚能忽略，第三日开始难以专注于日常工作，第七日整个人处于一种精神性的欲望焦渴状态，会因为任何微小的触发（一句话、一个眼神、一件衣物的摩擦）而全身为之一震。想要——便须去求——放软声线，陈述理由，甚至跪下讨要。等候持钥者的心情。此局最妙之处不在锁上，而在每一次意识到它存在的瞬间，都会想起钥匙在谁手里。",r:"每日须检查皮肤与血运，发现红肿、渗液、疼痛须立即开锁就医；任何异常均须终止。",b:"锁期由持钥者定，但受锁者随时可要求解锁——不问理由。持钥者须在合理时间内应允。",m:"数天"},
{t:3,n:"薄衣赴宴",l:"Publicum",p:"外出晚餐，赴一场正式的场合——高级餐厅或时尚聚会。须着指定的那一件——质地软而薄的丝质料子，行走时布面随身体每一寸的起伏而流动，懂的人多看一眼便知里面空无一物。整顿饭须佯装若无其事：点菜时语气自然，与同伴交谈时谈笑风生，卷起意面时优雅从容——同时时刻意识到自己下方的空虚，意识到餐桌对面那道一遍遍剥开自己的目光。冷气拂过时布面会顶起两点——细心的服务生或许会瞥一眼但礼貌地移开视线，那份被看见又被礼貌回避的双重感受令乳尖变得更为敏感；伸手够外套的手会被同伴按住，只听一句：不冷。这份公开秘密的双重体验将平凡的一餐变为漫长的前戏——每一次布料摩擦皮肤，每一次同伴的意味深长的眼神，都在积累一场终将回家爆发的欲望。到餐末，服从方的下体已经因为整晚的心理刺激而彻底湿透，那件薄裙内侧留下的印记将成为归家路上最直接的证据。",r:"限于能被看出，不能真正暴露的界线；不得影响他人、不得引起服务生的不适。",b:"全程须有同伴陪同；受装者说撤即刻离场——受装者的舒适度优先于任何完成本局的执念。",m:"120 分钟"},
{t:3,n:"全然封闭",l:"Clausura",p:"眼罩挡去光线——一片纯粹的黑，甚至比闭眼更彻底，因为无光线自眼睑透入；耳塞塞入耳道，外界声音降至几近于无，只剩自己心跳与呼吸声异常清晰；四肢以皮带柔软地缚于床的四角，令身体呈完全展开的大字形；最后一层薄毯覆上，将身体包裹于自己的体温与黑暗之中。世界被彻底关在外面，人被彻底关进自己的身体里。一小时——无光，无声，无自由。只剩呼吸、心跳与毯子微微的重量。前十分钟是不安——一种被剥夺一切外部信息的深层恐惧，那种恐惧会激发一切原始本能，包括身体的防御姿态；继而是一种奇异的漂浮感——思绪消散，时间失去刻度，仿佛回到某个最初的、羊水中的、混沌的地方。此时任何轻微的触碰——一根手指划过腹部、一片布拂过大腿——都会被放大成惊天动地的事件。被封闭者手中系着一根应急绳，通向守护者——拉一下，一切立即打开。守护者将全程在场，看着此人沉下去，再等待其浮上来。",r:"应急绳一端系于被封闭者手中，一拉即开；守护者全程于同室内，不得离开；每十分钟须检查皮肤温度。",b:"开启之后不急于交谈——先拥抱不少于十分钟，令神志缓慢回归；此后再谈本局体验。",m:"60 分钟"},
{t:3,n:"周末人格",l:"Persona",p:"周五晚八时，角色降临：或为被购入的猫娘（须持有猫耳、尾饰、项圈、以及喵作为主要发音），或为年长的监护者与年幼的被监护者（须约定称呼、月零花钱、门禁时间等设定），或为某段禁忌关系中的两人（血缘、师生、雇主雇员皆可），或为完全虚构的人物（异世界公主与其骑士）。设定提前写好，边界提前画死——哪些行为允许、哪些绝对禁止、哪些属于灰色地带须双方现场协商。而后是整整两日的沉浸：以角色的称谓用早餐，以角色的规矩过白天，以角色的身份就寝——做饭是戏，散步是戏，斗嘴也是戏；甚至私密时刻也须以角色的语言、姿态、情感反应完成。整整四十八小时之内，人格结构会开始发生微妙的调整——不是替换，而是层叠：真实的自己在下层观察，角色的自己在上层生活，两者之间的对话本身即是一场深层的自我探索。周日夜里落幕之时，会有一种自另一段人生中醒来的恍惚——那四十八小时里，两人都是别人，又比任何时候都更是自己。",r:"设定内容、许可范围、禁止事项、以及最重要的——出戏暗号——须提前书面写明。",b:"出戏暗号一旦说出，立即恢复常态，不作追问；此后二十四小时不再重启此角色。",m:"48 小时"},
{t:3,n:"极限尺寸",l:"Maximum",p:"扩张器自最日常的号数起步（约同平日使用之器具的尺寸），一路向上，走到今日的边界为止。每一号停留十分钟——润滑液厚涂，深呼吸，令穴道深处那圈肌肉自抗拒转为接纳。快感与胀感的比例逐号变化：起初以快感为主，胀感为辅；至某个临界点后，胀感开始超过快感——但那份被撑至极限的胀感自有其独特的魅力，介于痛与爽之间，被称为甜蜜的过载。愈近极限，推进愈须慢到无聊——不是一号一号地跳，而是同一号中一毫米一毫米地深入，令穴道有充足的时间调整。某一号会卡住，任凭如何放松都进不去了——那里便是今日的国境线。将数字记下——这串数字是只属于局中人的地图坐标，外人永远无从知晓。而每一次抵达新的极限之后，穴道会保留一份深层的记忆——下次同样的号数进入时，身体的接纳会明显加快，仿佛每一次极限探索都在打开身体的新领地。",r:"推进以慢到无聊为准；任何撕裂、出血、剧烈疼痛立即终止，其后一周不得再动此处。",b:"记录今日抵达之数字；该数字仅存于局中人之间，不外传，不比较，仅作二人共同前行的坐标。",m:"90 分钟"},
{t:3,n:"温水灌注",l:"Lavatio",p:"专用器具（灌肠球或专业设备），接近体温的清水（约三十六至三十七度），少量（初次不超过二百毫升）。受注者侧卧屈膝，身体呈胎儿式蜷缩——那种被动、开放、且脆弱的姿势本身即是本局的基调。温水缓缓注入的过程中，小腹深处会升起一种陌生的、缓慢的胀满感——不痛，但存在感极强，如同身体内部被轻轻撑开了一个新的维度。那份充盈自肠道深处向外辐射，令下腹隆起微微的弧度，用手掌覆上小腹能明确感到一种活的、流动的存在。保持数分钟不释放，感受它，如实奏报感受——胀至几分、有无痉挛、有无排出的强烈欲望。这段时间内可施以其他刺激（爱抚、亲吻），令感官交叠——腹内的胀满与外部的爱抚会产生一种奇特的干涉，令平日熟悉的爱抚变成陌生的、更为深层的刺激。而后释放。此条目与其说是玩法，更像一场对身体陌生区域的探险：安静，缓慢，须以绝对信任为底色。",r:"水温须接近体温不得过热；量须严格控制在二百毫升以内；绝不添加任何物质；腹痛立即终止。",b:"事毕须休息不少于两小时；当日不再行任何后穴条目；补充电解质水。",m:"60 分钟"},
{t:3,n:"银针列阵",l:"Acus",p:"一次性无菌针（医用采血针最为常见），仅穿透表皮浅层。手法与针灸相似但取穴不同——沿肩胛线或臂线排出一列对称的银点，每根针间隔约一厘米，排列须工整。每一根刺入的瞬间是一记极细的、锐利如闪电的痛，随即化为微热，如小型的伤口在皮下呼吸。行家形容它介于针灸与纹身之间的体验：痛感本身不重（远轻于打耳洞），重的是仪式感——皮肤上那列整齐的银针，如某种臣服的勋章，如身体成为祭坛的宣告。行刑者的手须极稳，每一针的深度须一致，每一针之间的距离须精确。受术者可看着自己身上一根根竖起的银针，心跳每一次都令那些针微微颤动——那份自己的身体成为可见的仪式载体的感受，是本局的核心。刑毕将针一根根拔出——那一瞬皮下的血珠会微微渗出，如一列小小的红宝石。但其无菌要求是医疗级别的：手套、酒精、锐器盒、事后消毒，一步不可省。未经系统学习者，令其留在文字里。",r:"全套无菌操作，缺一不可；任何感染病史（HIV、乙肝、丙肝等）双方均须提前告知；针不得复用。",b:"须经真正的学习方可施行——阅读专业资料、观摩教学视频、寻找有经验的引导者。",m:"60 分钟"},
{t:3,n:"钝刃巡游",l:"Dorsum",p:"施术前，将刀举至受者眼前——一柄真实的刀，可以是水果刀、亦可以是仪式性的短刀——令受者亲手抚过刃口，亲眼确认它是钝的、或以特殊工艺磨得刃口无法割破皮肤。这一确认过程本身即是本局的前奏——因为此后所有的恐惧都建立在明知无害的认知之上，反而令那份原始的、动物性的畏惧更为鲜明。而后戴上眼罩。接下来冰凉的金属贴上皮肤——刀背沿脊柱缓缓下行，每一节脊椎都能清晰感到金属的凉意；刀侧平贴肩胛骨转弯，一段冰凉的抚触；偶以刀尖极轻地点一下腰窝——那一记不痛却令全身的鸡皮疙瘩瞬间竖起，一直蔓延至发梢。明知是钝的，但金属的凉意与刀这个概念本身，会令每寸被划过的皮肤绷紧、战栗、起满细粟。受者的呼吸会不自觉地变浅、变急，每一次金属触碰皮肤的瞬间，身体都会本能地颤抖，即便理智告诉它这不会造成伤害。本局玩的自始至终不是伤口，是脑中那根被恐惧拉满的弦。",r:"刃口须事先当面验明为钝或经特殊工艺处理；本局的对象是恐惧，不是皮肤；出现任何真实划痕立即终止。",b:"终局不得有一道破皮——有，即为执刀者之失，须自行认罚。",m:"30 分钟"},
{t:3,n:"火光掠影",l:"Ignis",p:"酒精棉球点燃于镊子夹持之下，蓝色的火苗于暗室中几近透明——这份视觉上的美丽是本局的魅力所在。它贴着皮肤快速掠过——绝对不是停留，仅仅是掠过，快到热度方抵皮表便已离开，留下一道转瞬即逝的暖流与心跳漏掉的半拍。火光映在受者瞪大的瞳孔里，那份原始的对火焰的敬畏令场景充满仪式感。看着一团活的火焰在自己身体上方跳跃的感受，与理智地知道它不会造成伤害的认知之间的张力，是本局的核心体验。此为极少数看着比感受更烈的玩法：视觉的惊心动魄远超实际的温度感受。棉球的燃烧时间须极短（不超过数秒），掠过的路径须预先规划，避开所有毛发覆盖之处、私密处、以及靠近粘膜的部位。但其容错率趋近于零——一次判断失误、一次风向变化、一次手抖，即可能造成真实的烧伤。多数时候，令它只活在文字里为佳。",r:"灭火湿毛巾必须置于伸手可及处；头发须完全束起；绝对避开毛发、粘膜、以及一切易燃部位。",b:"未经专业训练者，本条目仅作文字演绎——描写与幻想可以极致，实际施行须待学习之后。",m:"30 分钟"},
{t:3,n:"彻底失守",l:"Effusio",p:"床上先铺好厚厚的防水垫与吸水毛巾——因为本局的终点线，画在彻底失去控制的地方。不是一次顶点即止，而是穿过它继续。第一次抵达时，穴道深处的规律痉挛如约到来——但施术不停；第二次时，那份痉挛更为剧烈，全身开始颤抖——继续；第三次时，一小股温热的液体开始自穴口渗出——那是身体开始失守的第一信号；越过某个临界之后，身体会放弃管理一切阀门——潮水一波接一波自穴口涌出，与别的什么混作一处，床垫湿成一片沼泽；抽泣与尖叫混杂，语言功能退化为破碎的音节；而人已分不清也顾不上，只剩痉挛、失禁、被贯穿。至此，服从方进入一种彻底的、无法回头的失控状态——那种失控不是屈辱，而是解脱：所有平日的自控、体面、边界都被冲垮，剩下的只是最原始的、被彻底占有的身体。彻底的失控即彻底的交付。事毕，由主导方抱入浴室，自发梢洗到足尖——这份事后的照护是本局不可分割的一部分。",r:"防水垫须先行铺设厚实；每二十分钟须补充水分（须暂停饮水，不可强灌）；观察脱水症状。",b:"事毕由主导方全程负责清洗——自发梢至足尖，包括更换床单、擦干身体、拥入怀中入眠。",m:"90 分钟"},
{t:3,n:"双穴同御",l:"Ambo",p:"前方为人体（真实的柱身），后方为提前润滑扩张的器具（专用的后穴玩具）——或反其道而行，前方器具后方为人。两处同时被填满的一瞬间，会发出一种从未听过的声音——那不是两倍的满，是指数级的：因为两条通道之间仅隔一层薄壁，任何一方的每一次动作都会隔着那层壁推挤到另一侧，两种节奏在体内正中互相干涉、叠加、共振。前方一记深顶，后方的器具随之被向前推进；后方轻微的旋转，前方的柱身能清晰感到那份震动。人被夹在中间，进也是撞、退也是撞、静止也是被两侧同时挤压——很快只剩颤抖，语言功能全部退化，只有本能的呻吟。而这份被同时占据的、无处可逃的填满感会将全身的感官过载至一种超越平日体验的境地——大脑会短暂地进入一种近乎晕眩的空白状态，那种空白之中反而生出一种奇特的清明与解脱。规矩越严，玩得越尽兴：器具绝对分开、润滑绝对分开、中途须清洁——这些细节是本局能够安全进行的前提。",r:"前后所用器具与润滑液绝不互换；中途切换主动位时须停下清洁；任一侧不适立即终止。",b:"任何一侧发生不适即停——本条目不以完成论英雄，安全度过本局本身即是成功。",m:"60 分钟"},
{t:3,n:"眠中之约",l:"Somnus",p:"约定生效的数日之内，每晚入睡都带一丝甜的悬念：今夜会不会。约定的范围须事先详尽讨论——允许触碰哪些部位、允许进入到何种程度、允许持续多久、觉醒之后如何进行。或许在半夜的朦胧中察觉被角被轻轻掀起，一双手贴着睡衣下摆自足踝缓缓上行——梦与现实的界限模糊，身体先于意识作出反应；或许是在半梦半醒之间被缓缓进入的——那份熟悉的温热与充盈自穴道深处唤醒神志，梦的残片与真实的快感搅在一处，睁眼时已在浪的中央；或许是被口舌唤醒——温热的湿意自私密处传来，人在梦中先经历一场高潮，醒来时那份余韵尚未散去。这份介于梦与醒的中间地带自有其独特的心理色彩：意识的部分参与令身体的反应更为诚实（无法压抑，无法掩饰），而梦境的滤镜又令整个体验带上一层不真实的柔软。事前将范围议定，事中随时可停——余下的，便是这种介于梦与醒之间的、最暧昧的被打开方式。",r:"提前一日议定具体许可范围与禁止事项；醒来说停即刻停止，不问理由；须绝对信任方可行此局。",b:"醒来的第一时间须被抱入怀中，确认对方是谁、身处何处；随后可选择继续或休息。",m:"不定"},
{t:3,n:"暗语驯化",l:"Signum",p:"选定一个词——一个平平无奇、日常对话中能自然出现的词（如某种食物名、某个地名、某个日常动作）。而后开始训练：每次在私密时刻抵达顶点的那一刻，主导方在耳边说出它；一次，十次，数十次，令身体的下意识将这个词与那种极致快感焊死在一起，形成条件反射。这是一场以月为单位的长期工程，每一次快感峰值时的重复都是一次巴甫洛夫式的建构——直到某一天，那个词单独出现时，身体会不受控地作出与快感相同的反应：脸红、心跳加速、下腹一阵酥麻、乃至下体轻微的湿润。经过数月的训练，这个词便成为一枚藏于语言中的隐形开关：某日在超市排队，一人俯身在另一人耳边轻轻说出那个词——当场腿软、脸红、狠狠一记眼刀飞来，而四周的人一无所知，只以为是普通的耳语。这份专属于二人的秘密武器可用于无穷多的场景：正式聚会中、公开演讲的间隙、家庭聚会时。它是最亲密的暗语，也是最强大的调情工具——因为它令二人始终生活在一层旁人无法进入的私密语境之中。",r:"须长期重复训练；每次说出须精确配合快感峰值；不得于非私密场合过早测试。",b:"练成之后，任何场合一个词即可令对方腿软——但主导方须节制使用，此工具的力量在于稀缺。",m:"长期"},
{t:3,n:"旷野之行",l:"Rus",p:"驾车一路向人迹稀少之处而去，导航上的道路越来越细，路灯越来越稀，最终停在一片没有信号灯、只有虫鸣的野地——山野、湖畔、林中空地皆可。车门推开，夜风扑上皮肤——那份自由的、带着草木气息的野风本身即令人的呼吸放大——而后是全脱。天为被，地为床（预先铺好毯子），人赤条条地立于旷野正中，头顶是真实的星空（远离城市灯光时可见的、几乎不真实的密集星辰），四面八方是真实的黑暗。文明与体面被留在数十公里外，剩下的是最原始的两具身体与撒野的自由——可以放声呼喊，可以肆意呻吟，可以喊到惊起一片飞鸟。夜风拂过赤裸的皮肤，那份寒意与体温之间的对比令感官格外敏锐；星光下依稀可见对方身体的轮廓，那份朦胧的美感令熟悉的姿势重获陌生的浪漫；虫鸣与心跳声交叠，构成一种远古的、原始的背景音。这份体验一生难得——它令性爱回归到一种近乎宗教仪式的、天地为证的原始状态。归程之上，须保持无衣状态坐于副驾。",r:"车钥匙、衣物、饮水、手机（保持有信号）须置于伸手可及处；天气须提前查证；不得选择保护区或私人领地。",b:"归程全程保持无衣状态坐于副驾——那份于夜色中被驾车者的目光反复瞥见的暴露感，是本局的余韵。",m:"120 分钟"},
{t:3,n:"全程存档",l:"Imago",p:"三脚架立好，角度调好，红点亮起——自此刻起，房间里多了一只不眨的眼睛。知晓被摄，每个动作都会不自觉多一层意识——腰塌得更深因为镜头在拍侧面；声音放得更开因为镜头能收音；或恰恰相反，羞耻到把脸埋进枕头因为知道自己的表情正被记录。这份被凝视感是本局的核心机制——它令即便是最日常的姿势也变得如表演一般，令平日的自然流露变成一种自觉的展示。而当被摄者渐渐忘记镜头存在的那些瞬间——沉浸于快感深处、身体本能反应的时刻——反而是最珍贵的：因为那些片段将成为未来某个时刻两人共同回看时的意外之喜。而真正的重头戏在事后：两人裹着被子倚在床头，将方才那段自头至尾放一遍。看屏幕里的自己是何表情、何声音、何模样——那双失焦的眼睛，那被顶到唇边的破碎音节，那些自己从未意识到的、腰肢摆动的幅度——会看见一个自己从未见过的自己。这份外部视角的自我审视往往比行动本身更为动情。",r:"仅存于本地设备，绝不联网上传，绝不云同步；任何一方要求删除的一刻立即当面删除；不得留副本。",b:"当晚必须共同回看一遍——不许改天再看，不许下次一起看——回看本身是本局的完成。",m:"全程"},
{t:3,n:"十连挑战",l:"Decies",p:"自晨间睁眼始，本日只有一个议程：十次。手指算一次，器具算一次，唇舌算一次，正经行事亦算一次——方式不限，间隔自定，但每次须记录时间与方式——如一份严肃的实验日志。上午尚且游刃有余，第一次、第二次、第三次都来得容易而清晰；至午后第四第五次，身体开始进入某种敏感期，触碰的门槛显著降低；第六第七次时，已经一触即颤，顶点变得又快又浅又密；第八九次时，身体开始进入某种半麻木的状态，顶点几乎自动到来但快感的深度反而降低；最后几次几乎是折磨与恩赐的混合体——身体已经耗尽但仍被要求继续。这一天下来，除了完成十次的记录之外，服从方会经历一场对自身身体极限的深度探索：了解自己在不同状态下的反应模式，认识那种从欲望旺盛到耗竭再到重启的完整循环。抵不到十次也全然无妨——这份日志本身，即是本日的战利品，是对身体极限的一份珍贵调研。",r:"其间须进食、补水、适当休息；不适（头晕、心悸、剧烈疲惫）即停在当下次数不强求；本日不得饮酒。",b:"未满十次不作失败论；记录本身即为战利品；此记录将作为下次本局的参考基线。",m:"一整天"},
{t:3,n:"长约立契",l:"Pactum",p:"此条目没有床，只有一张桌、两盏茶、以及一份须认真书写的文件。称谓如何定（日常称呼、私密称呼、正式称呼），日常何事归谁管（做饭、清洁、财务、决策），何事绝对不碰（每人各自的绝对边界，写死），有效期多久（三月、半年、一年，可续），如何退出（是否需要预告期、如何完成过渡）——逐条谈，逐条写。谈的过程本身即是最深的亲密：一方会说出平日难以启齿的想要（我希望被规定几点睡觉、我希望每周日晚上做一次汇报），另一方会写下愿意承担的责任（我保证不在盛怒时惩罚、我保证每月至少一次仪式性的服务）。这场对谈往往会揭示许多平日不曾言说的深层需求与恐惧——是一次比任何身体接触都更为深入的相互认识。最后签字，各执一份。它没有法律效力，但比任何法律文件都诚实——这是两个人把如何相爱白纸黑字写下来。",r:"双方签署，各执一份；到期须重新协商，不自动续约；任一方随时可单方面终止，无须理由。",b:"契约期内每一条款皆认真执行——非戏，非游戏，是真实的关系约定；期满须有正式的结束仪式。",m:"长期"},
{t:4,n:"刻字",l:"Sculptura",p:"幻想之中，此为烙印的终极形态——名字被一笔一划刻在皮肤之上，鲜血涌出如书法家笔下的朱砂，字迹凝固为永不褪去的疤痕。文学中，这份意象承载着最深的占有欲——身体成为契约的载体，一具身体永久地记载着另一个人的存在。那份鲜血渗出时特有的深红色、伤口边缘皮肤的翻卷、字迹在皮肤上凝固时的温度变化——每一个细节在文字中都可以书写至令人喘不过气。而现实中它的位置在文字与笔尖——可以极细的马克笔在肩胛一笔一笔书写，写得很慢、很用力，令受写者闭眼数着笔划、猜测字句；亦可将被刻下印记的完整故事写成文字，写到面红耳赤仿佛亲历。皮肤会代谢，墨迹会洗净，但被写上名字这件事的重量——那种我属于此人的心理烙印——一分不减。真实的划伤永远不建议——瘢痕感染的风险与心理创伤同等严重。",r:"永久瘢痕、大出血、深部感染，风险皆为真实；即便浅表划伤亦可能引发严重后果。",b:"以笔代刃可行——写得用力些、慢一些、认真一些，其心理效果不亚于真实刻痕。",m:"仅限幻想"},
{t:4,n:"燎原之火",l:"Conflagratio",p:"文字之中，火可以烧得极美——整片背脊被幽蓝色的火焰轻轻舐过，暖流层层漫开，如被一条以温度织就的舌自尾椎舔至后颈；或以火焰勾勒身体的轮廓，如某种古老的献祭仪式；或以火光在暗室中照亮皮肤的每一寸细节，映出汗珠与颤抖。这类场景可以写得隔着纸都觉得皮肤发烫——那种被火焰完整包裹却毫发无伤的极致想象，是文字独有的特权。但现实之中，大面积的火焰接触没有轻轻二字——二度烧伤只需数秒，三度烧伤只需十数秒；火焰的接触面无法精确控制，风向的一次变化即可能致灾；且皮肤的烧伤瘢痕将永久留存，气道的烧伤更是可能致命。皮肤在真实火焰下的反应与文字中描绘的完全不同：不是暖流，而是瞬间的、不可逆的组织坏死，痛感在数秒之后才达到峰值，那时已无可挽回。故此格的火，只烧在字里行间——那里可以烧得极致，且不留一丝真实的疤痕。",r:"二度以上烧伤、气道损伤，数秒之内即可发生；无任何安全的实操版本。",b:"文字之中可以烧得极致——只要不出书斋，任何幻想的极致皆可书写。",m:"仅限幻想"},
{t:4,n:"长时窒息",l:"Suffocatio",p:"此格不作铺垫。这是整个 BDSM 领域中致死人数最多的一类玩法，没有之一——且逝者多为经验丰富者，因为缺氧导致的判断力丧失快于任何人的反应速度。当氧气不足开始影响脑部时，人自身对状态恶化的感知会同时被剥夺——这是它最阴险的机制：受害者往往不知道自己已经处于危险之中，甚至觉得越来越舒服。这份“感觉良好的死亡”是所有窒息类玩法的核心陷阱：脑部在缺氧的最后阶段会释放大量内啡肽，令主观体验充满欣快感，而客观上距离不可逆的脑损伤只有数十秒。任何形式的独自进行都是致死性的；两人进行时的意外亦频繁发生——绳索的滑动、姿势的错位、施术者对状态的误判，任何一项都足以造成不可逆的悲剧。文字之中若要书写濒死的失重与眼前发白的顶点，可以写，写得很沉、很美、很危险。但真实世界里，此格的答案永远只有一个字：不。",r:"独自进行的致死率接近百分之百；即使双人进行，风险亦远超一般玩法的可控范围。",b:"文字演绎不设上限——任何深度、任何黑暗的书写皆可；现实施行一律拒绝。",m:"仅限幻想"},
{t:4,n:"放血",l:"Sanguis",p:"暗红色在文学中是最艳的颜色——贴着颈侧的獠牙缓缓刺入，一滴血珠沿着颈项滑落至锁骨，被舌尖郑重其事地舔去；或以纤细的银针取出一小杯血液，二人共同啜饮如中世纪的血誓仪式；或血液与情液混杂，绘出身体上的红色纹路。此类意象可以写至极致——仪式感、占有欲、血脉相融的深层隐喻，尽可皆有，且在文学史上有悠久传承。血在文学中承载的重量远超其物理意义：它是生命的直接可见形式，是最深的自我馈赠，是宗教与情欲交叠处最古老的符号。但现实之中，大量取血即失血性休克，共享血液即血源性传染病（HIV、乙肝、丙肝、梅毒等）的直通车。即便是微量的皮肤破损，只要器械未经严格消毒，都可能引发严重感染。故血只流在故事之中——故事里它可以流得极美、极浪漫、极虔诚。",r:"低血容量休克、血源性传染病；即便微量刺破亦可能因器械污染引发严重感染。",b:"此格永远停在文字之中——任何深度的血色描写皆可书写，唯不入现实。",m:"仅限幻想"},
{t:4,n:"枪口",l:"Telum",p:"影视中的经典画面——冰冷的枪管抵着下颌一路下滑，恐惧将每寸皮肤的感知放大十倍，权力关系于此刻抵达绝对的顶点。作为纯粹的心理意象，它玩的是绝对权力差带来的战栗，是生命完全被握于另一人之手的极致象征。金属的冰凉、扳机的沉重、以及那份任何时刻都可能扣响的恐惧感——三者叠加构成了文学与影视中最强烈的权力符号之一。但现实中，哪怕确认过无弹的枪，每年都在造成死亡——走火不需要任何理由（机械故障、清膛不彻底、心不在焉的一次扣扳机）；即便是仿真道具枪，其带来的心理创伤（尤其是意外触发深层恐惧后的 PTSD）亦不可小觑；且不同国家和地区对枪械管制的差异令即便持有仿真枪都可能面临法律风险。此格连道具枪都不建议触碰：欲求被绝对掌控的恐惧感，钝刃、语言、束缚皆可给予，且它们不会真的响。",r:"意外走火不需要任何理由——即使双方确信武器已卸弹，仍存在人类无法预料的意外机制。",b:"道具枪亦不建议使用；类似的恐惧感与权力体验，以钝刃巡游、全然封闭等条目替代。",m:"仅限幻想"},
{t:4,n:"永久穿孔",l:"Perforatio",p:"乳尖上一枚小小的银环，私处一颗藏起来的钉，或耳尖、鼻中隔、乃至舌头的穿孔——穿孔的想象确实又疼又艳，那是写在身体上的永久宣言，衣物之下只有彼此知晓的秘密，触碰时的细微金属感令平日的抚爱多一层触感的维度。而某些私密部位的穿孔更会在日常生活中提供持续的低烈度刺激——衣物摩擦时的轻微牵动、行走时的微弱感受、乃至安坐时的存在感，都会成为一种全天候的、隐秘的性提示。这份欲求的实现路径其实很清晰：正规穿孔店，无菌环境，专业技师，术后护理与消炎。它可以是某个纪念日、某个人生节点认真赴约的一件事，甚至可以是伴侣共同前往、互相为对方选择位置的仪式。唯独不能是床笫之间一时兴起的游戏——DIY 穿孔的感染率、神经损伤率、排异反应率都远高于专业操作，且伤口愈合期间需要严格的护理，绝非当场的浪漫可以承担。",r:"感染、排异、永久性神经损伤——任何非专业操作皆有极高风险。",b:"确有此愿者，赴正规穿孔店专业操作——不于床上施行；专业穿孔本身亦可成为二人共同的仪式。",m:"仅限幻想"},
{t:4,n:"见血之笞",l:"Cruor",p:"鞭痕见血在某类叙事之中是忠诚的极致证明——皮开肉绽仍仰头说继续，血珠自伤口渗出汇成细流，那份彻底的献祭感与身体作为祭坛的意象具有强大的文学感染力。鞭子每一次落下时血珠的溅落方向、伤口边缘皮肤的翻卷、以及背部渐渐被鞭痕交织成一张网的过程——每一个细节在文字中可以推至令人窒息的极致。文字之中此种烈度可以书写。但现实中的身体不是叙事——打到出血意味着深层组织损伤、大面积血肿、真皮层的破损；再往上是横纹肌溶解（大量肌肉细胞坏死释放物质入血）、肾衰竭（横纹肌溶解的常见后果）、乃至危及生命的电解质紊乱。击打类条目的合理上限画在痕迹留存一周这条线：红肿、鞭痕、深色淤青皆可，破皮见血不可。疼痛可以是礼物，伤害不是。真正专业的鞭手能够精准控制不出血，那是数年练习的成果——非专业者的稍微用力即可能酿祸。",r:"深层组织损伤、大面积血肿、横纹肌溶解、急性肾衰竭——重击的实际风险远超直觉。",b:"痕迹可留存一周——足以让二人共同凝视皮肤上的印记；不该留存一辈子。",m:"仅限幻想"},
{t:4,n:"多人",l:"Multitudo",p:"许多双手同时落在身上、应接不暇的画面——此幻想的引力不难理解：一具身体成为众人的祭坛，从各方涌来的抚触与占有令人失去所有防御。文字中，这份场景可以推至极致的过载：多张嘴同时占据身体的多个部位，多双手同时探入不同的孔穴，声音从四面八方而来令人无法辨别方向，最终陷入一种被彻底淹没的、无法抵抗的狂喜。但多人场景对关系边界、事后情绪、以及主要伴侣之间的信任的冲击，远远超过其生理风险：嫉妒的萌芽、无意识的比较（对方的技巧、身体、投入程度）、以及事后回想时可能出现的悔意，往往在结束数日之后才开始生长发酵。它对所有参与者的完全知情同意、性健康筛查、以及事后修复能力要求都极高。即使技术上可行，此类玩法对关系的隐性代价往往远超预期。本套牌仅收录其幻想演绎版本——文字之中可尽情探索这份想象，而现实中的施行须极为审慎。",r:"关系冲击远超生理风险；事后修复成本极高；且性健康风险随参与者数量呈指数上升。",b:"文字演绎可行——任何深度、任何数量、任何组合皆可书写；现实施行须全员知情同意、完整体检、以及事后深度沟通。",m:"仅限幻想"},
{t:4,n:"完全控制",l:"Regimen totum",p:"排泄的完全支配是权力交换的最深水区之一——连身体最基本的、自主的阀门都上交，服从做到生理层面的每一处细节。文字中，这份彻底的、连膀胱开合权都不属于自己的失控感承载着极强的臣服象征意义。轻度版本是可行的：忍耐（憋尿至一定程度）、奏报（如实告知膀胱压力）、申请批准（何时可以如厕），那种紧张兮兮的半失控边缘感确有其独特魅力，专家级条目中已有此类玩法。但完全二字则意味着质变——长时间的强制憋尿、导管介入、或以物理装置阻断排泄。这是泌尿系统感染（尿路上行性感染可至肾脏）、肾功能损伤（尿液滞留导致肾积水）、乃至膀胱破裂的直路。膀胱作为身体的储液器官有其生理极限，超过极限的强制约束不仅可能造成即时损伤，更可能造成长期的功能失调。故此界线画于此：忍耐游戏可玩，阀门的最终控制权永远留在身体主人自己手中。",r:"泌尿系统感染、肾功能损伤、膀胱损伤——身体基础功能的强行控制风险极高。",b:"轻度忍耐条目可行（参见忍水之局）；完全控制不予施行。",m:"仅限幻想"},
{t:4,n:"秽物",l:"Scatologia",p:"此格存在于清单之中，因它确实存在于世界的某些角落——某些人有此癖好，某些亚文化中有此仪式。人类幻想的谱系是极其宽广的，本套牌不作道德审判。但从公共卫生的角度看，其风险清单极为沉重：肠道寄生虫（贾第虫、阿米巴等）、甲型肝炎、大肠杆菌严重感染（可致败血症）、乃至尚未彻底研究清楚的其他病原体传播。而与其他条目不同，此格的风险即便在最完备的卫生措施下也无法有效降低——因为其风险来源与其内容本身不可分割。其画面感与风险清单同等沉重。本套牌对此格不设幻想演绎版本，亦不作任何推荐——每一份玩法清单都有权保留至少一个空白格，作为对自身审美与底线的诚实标记。",r:"肠道寄生虫、甲型肝炎、严重肠道感染——即便是极小接触量亦可能引发严重后果。",b:"本条目不设任何演绎版本；建议以其他更能满足支配感需求的条目替代。",m:"仅限幻想"},
{t:4,n:"吞食",l:"Vorare",p:"被一个巨大而温柔的存在整个吞下——不是死亡，而是回到某个绝对安全的内部：温热、黑暗、被完整包裹，外面的世界彻底进不来。此幻想的心理内核是终极的被容纳——退回到子宫、退回到某个前语言的原初状态。那份被巨物咽下时喉咙的收缩、被内部的湿润完整覆盖的触感、以及在温热的、律动的空间中失去时间感知的漂浮——文字中可以书写至令人窒息的美。物理上它当然不可能发生，故它是百分之百属于想象力的领域——也因此可以写得毫无顾忌：巨龙的腹腔（那份被鳞片包裹的温暖）、深海生物的柔软内部（那份幽暗与波动）、异界巨物的温热之内（那份完全的臣服）。文字之中可探索一切细节——被吞下时的姿势、内部的温度、生存的时间、情感的层次。这类幻想在特定文学社群（vore 亚文化）中有丰富的既有作品可供参考，其美学与心理深度值得认真书写。",r:"物理上不可能发生——纯属想象力的领域。",b:"文字演绎不设任何上限——被谁吞下、以何种姿态、体验如何，由幻想者自由指定。",m:"仅限幻想"},
{t:4,n:"死亡",l:"Mors",p:"以死亡为终点的场景是幻想光谱的最远端——它迷人的从来不是死本身，而是为其而死中那种献祭式的、把存在本身完全交出去的极致浪漫。文学史上一半的殉情故事都在书写它——罗密欧朱丽叶、梁山伯祝英台、《雪国》中的那份彻底沉沦。它可以被书写：写在爱人怀中一点点变凉，写数着自己最后的心跳，写最后的呼吸如何缓缓吐尽，写脸颊上那一抹尚未干涸的微笑——写得极美、极安静、极完整。这份幻想深处触及的是生与死的边界处最私密的情感——愿意为对方交出一切，包括存在本身的这种终极承诺，在其他所有场景中都无法完整表达。但其全部生命力恰恰在于只能是文字——因为爱要好好活着，才能一直书写下去；因为每一次写下死的场景，都是一次对活着的隐秘赞美——那份意识到彼此仍在此处呼吸的珍惜感，正是通过书写死亡这份不可能而反向得以强化。",r:"不需要解释。",b:"文字之中可以写得极美——尤其在爱情文学、殉情叙事、悲剧美学的传统之中；且仅限文字。",m:"仅限幻想"},
{t:4,n:"触手",l:"Tentacula",p:"数不清的、温热湿滑的、会自己思考的触须自黑暗之中涌出——缠住脚踝向上攀爬，卷住手腕向两侧分开，同时抵达身体的所有地方：有的缠腰，有的裹胸，有的探至唇边分开牙齿，有的滑向腿间试探穴口。人类只有两只手，而它有一百只、一千只，且每一只都有自己的意志。此幻想最好的载体即是文字——因为想象力没有物理限制：可以赋予触须以温度（滚烫如新生、冰凉如深海）、以纹理（光滑如丝绸、覆有细小吸盘、带有细密鳞片）、以脉动（如活物一般随情绪起伏）、以坏心眼（专挑最敏感之处纠缠）。而触手作为非人存在的性伴侣，能够突破一切人类身体的物理限制——可以同时占据无数个位置，可以变换粗细满足任何深度，可以完全无视对方的意愿或愿望做出精确到毫米的回应。在触手文学（tentacle erotica）这一独特亚类型之中，此幻想有极为丰富的叙事传统可供探索，从日本古典春画到现代西方 tentacle romance 皆有大量优秀作品。",r:"现实中仅能以器具作近似模拟（多头玩具、触手造型的柱状物），但远远无法呈现文字之中的极致画面。",b:"文字演绎不设上限——深度、数量、过分程度、时长，由幻想者自由指定；本套牌可提供详细的书写协作。",m:"仅限幻想"},
{t:4,n:"兽形",l:"Bestia",p:"发箍上的耳朵一戴，尾饰一佩（内塞式或腰带式皆可），人便暂时卸下人形——成为一只会撒娇、会呜咽、会以脸颊蹭人掌心的小兽。兽形扮演的可玩性极高：猫的傲慢（时而亲近时而漠视，被摸时喉间发出满足的震动）、犬的黏人（尾巴不受控制地摇摆，追随主人的每一步）、兔的敏感易惊（一有响动便竖起耳朵瑟瑟发抖）、狐的狡黠勾人（那种半人半兽的、带着算计的媚态）。每一种都是不同的性格剧本，可以深度探索。而尾饰的存在——尤其是内塞式尾饰——会为整个体验添加一份物理层面的持续存在感：每一次落座、每一次走动、每一次姿势变换，那份尾饰的存在都会成为提醒。此档随时可行，道具唾手可得——网上有大量精美的耳朵尾巴售卖，甚至有全套的兽装（fursuit）文化。而此格真正的红线只有一条，写明：任何涉及真实动物的行为，绝对、永远、不行——扮演的对象是人对兽的模仿，绝非真实的兽。",r:"扮演可行；任何涉及真实动物的一切行为绝对禁止——这是法律、道德、以及基本人性的三重红线。",b:"耳与尾的扮演档随时可玩——猫娘、犬奴、兔娘、狐妖，任选其一；深度沉浸的角色扮演亦可结合周末人格条目进行。",m:"部分可玩"},
{t:4,n:"产卵",l:"Ova",p:"一颗颗温热圆润的卵被缓缓送入身体深处——每一颗都比上一颗略大一些，穴道被迫接纳、扩张、又在下一颗到来之前尚未完全恢复。小腹一点点被填出弧度，鼓鼓的、沉甸甸的，像藏着一整窝秘密。此幻想的核心是极致的被填满——超越单一柱身的填满，是无数小型物件填满整个腹腔的胀满感——再加一点背德的、非人的、生殖性的想象。文字中，那份被反复填充、身体如同容器般承接的画面可以书写至极致的过载——从第一颗卵的期待、到中间过程的胀满逐渐超出承受、到最后一颗卵进入时腹部的显著隆起，每一个阶段都有独特的心理与身体反应。市面上确有明胶材质的专用器具可作模拟（可食用明胶制的假卵，配合专门的产卵器可以体验类似过程），但材质的选择（食品级明胶、软硅胶）、尺寸的把控（从小至大的渐进）、以及卫生的维护都需要专业知识。文字版本则没有这些限制：产卵的全过程、卵在体内的重量、时间的流逝、乃至幻想中卵的孵化，皆可书写至极尽细节。",r:"器具模拟须严格把控材质（食品级）、尺寸（渐进）、卫生（专用）；不适立即终止。",b:"文字版本可写至极尽详细——过程、感受、时间、余韵，皆可深入书写。",m:"仅限幻想"},
{t:4,n:"魔物",l:"Daemon",p:"祂的体温比人低（冰凉如深渊之水），或高得如同发烧（炽热如岩浆之核）；祂的尺寸不讲道理（远超人类可承受的极限）；祂的瞳孔是竖的，随情绪伸缩；祂的尾巴会自行缠上腿弯，如活物一般探索身体的每一寸；祂说话的方式不通过喉咙，声音直接落在颅骨内侧，绕过耳朵直达神经。非人存在的扮演玩的是规则之外——人类的道德、体力、生理限制对祂一概无效；人类的语言、意愿、抵抗对祂而言可有可无。于是臣服于祂便有了一种献祭般的甜美——因为这份臣服不是屈辱，而是我把自己交给一个更高的存在的仪式。而魔物的非人特质会突破一切人类身体的物理限制：可以令身体承受不可能的深度与尺寸，可以令感官承受超越平日的过载，可以令时间在魔物的意愿下扭曲变形。此格与角色扮演接壤，可玩性极高——自召唤阵起笔（画法、咒语、代价），至被拖入契约为止（血契的深度、灵魂的抵押），全部可展开。",r:"纯设定演绎——无实体接触的物理风险，但角色的深度沉浸可能带来心理层面的复杂反应。",b:"与角色扮演条目连用（尤其周末人格），自设定至契约皆可深度展开；本套牌可提供协作书写。",m:"文字可玩"},
{t:4,n:"胀满",l:"Inflatio",p:"被灌至小腹微微隆起、内里满得一晃便能清晰感知——此程度的想象与玩法是安全的：多次射入的自然累积（女性向），或温水器具的轻度模拟（专用玩具可温和地注入少量温水制造胀满感）。这种轻度胀满感其实心理层面的满足远大于生理层面——那份被填满至身体略微改变形状的感受承载着深沉的占有与被占有的情感意义。文字中，那份腹如临产之期的画面——身体成为对方留下之物的完整容器，那份满盈到从体表都可见的证据——可以书写至令人喘息。但此格的极端版本——大量液体或气体的真实注入以致腹部显著隆起——是肠穿孔、腹腔破裂、以及电解质紊乱（大量水分强行进入体腔会打乱身体的水盐平衡）的直路。人体腹腔并非可任意扩张的容器，超过一定量的强行注入会造成即时的、不可逆的组织损伤。那条线绝对不越。轻度的满，可尽情玩；极端的胀，只留给文字。文字之中，可以写至腹如临产之期，可以写至身体已成盛器——那是幻想的自由。",r:"大量真实注入将致肠穿孔、腹腔破裂、以及严重电解质紊乱——即便一次也可能致命。",b:"轻度模拟可行（少量温水、多次射入的自然累积）；极端版本仅限文字之中。",m:"仅限幻想"},
{t:4,n:"阉割意象",l:"Castratio",p:"心理阉割玩的是语言暴力的最深处——将对方的性征、尊严、主导权在言语之中一寸寸碾碎：废物、不许硬、没资格、你这辈子都不会有、连使用你自己身体的权利都没了。纯语言层面的此档，配合贞操锁与高潮管理条目，是权力交换的经典组合——它触及自我认同的核心，其心理效果远超单纯的身体控制。当身体的性征被反复以语言否定，即便理智知道那只是言语，潜意识仍会在长期的重复中被塑造——这正是此类玩法的力量所在，也是其需要谨慎使用的原因。此局中受言者往往会在某个瞬间真正相信自己的无价值——那份短暂的、彻底的自我否定构成本局的高峰体验，也构成事后需要认真照护的心理状态。而任何真实的物理操作皆不可逆——手术性阉割是永久性的、灾难性的、且法律层面完全无法界定知情同意的行为，想都不必想。故此格的刀永远以话语铸成：够锋利，能割入骨髓，但一旦事毕能收得回来。",r:"任何真实操作皆不可逆——包括任何形式的绝育手术、化学阉割、或其他物理性干预。",b:"语言层面配合贞操条目可行——那份心理效果强大而深远；真实操作永远不存在。",m:"仅限幻想"},
{t:4,n:"伪逆之局",l:"Sine consensu",p:"完整的强迫剧本：挣扎是剧情的一部分，不要是既定的台词，被压制、被夺取、被违逆意愿地贯穿的全过程皆在事前协议之内。它是信任的极限运动——正因为每一秒都可以用安全手势叫停（且叫停会真的立即被执行），那种被真正夺走的失控感才能被安全地体验。它探索的是一种最深的信任：把自己完全交给对方，包括交给对方去侵犯自己的权力——而对方将带着更深的爱与克制承接这份交付。这份剧本的深处，触及的是关于自主权与臣服的最古老的心理原型——那份完全放下防御、允许自己被夺走的体验，是很多人一生难得的深度释放。剧情之中，越是激烈的挣扎，越是强烈的反抗，越是撕心裂肺的求饶，反而是心理层面越深的信任表达——因为唯有绝对信任对方会在正确的信号下立即停止，才能真正投入这般深度的表演。但其准备工作与施行时长等长：何种具体行为许可、何种词语是真的停止（区分于剧情中的不要）、哪些身体部位不得触碰、事后如何进行长时间照护——须以一整个下午的时间谈透。谈透了，此格可行，且会成为二人关系中极深的一次亲密。",r:"须极详尽的事前协商、真正的安全手势（区分于剧情台词）、以及长时间的事后照护（不少于三小时）。",b:"协商完备者可行——这将成为二人信任的最高级证明；未协商完备者、临时起意者，绝对禁止。",m:"需长谈"},
{t:4,n:"药眠",l:"Somnus gravis",p:"清醒版的眠中之约——事先约定、半梦半醒之间进入、随时可醒来叫停——已列于专家条目眠中之约之中，是可行的、探索性质的玩法。此格所指为其极端变体：药物介入导致的完全无意识状态。区别是本质性的：前者是约定好的暧昧游戏，参与者虽在梦中但仍保有基本意识与叫停能力；后者是彻底剥夺对方的说停能力，令其陷入完全无自主意识的状态。这一区别不是程度上的，而是性质上的——完全无意识意味着连身体的最基本自我保护机制（如疼痛反射、窒息反射）都可能被抑制，任何意外都无法通过对方的自主反应及时发现。任何以致人失去意识为目的的药物使用皆为犯罪（无论对方事前是否同意——法律不承认对失去意识状态的同意），且这些药物本身的过量使用可能直接致死，长期使用可造成永久性脑损伤。答案很短：清醒版随时可行，药物版永远不存在。",r:"任何致人失去意识的药物使用皆为犯罪；且药物本身的过量使用可致死或永久脑损伤。",b:"清醒版本参见专家条目眠中之约——是可安全探索的类似体验；药物版本永远不存在。",m:"仅限幻想"},
{t:4,n:"药物",l:"Venenum",p:"春药在小说里是万能开关——一片入口，整晚欲火焚身；一滴入酒，理智即刻退场。现实之中它是化学骗局：网上购得之物成分不明、剂量不明、来源不明；吞下的可能是安慰剂（大部分情况），可能是普通兴奋剂（副作用剧烈），可能是滥用类精神药物（有成瘾风险），也可能是危险药物（急诊室的门票）。且即便成分确认，个体差异令同一剂量对不同人的效果可能天差地别——所谓的春药效果无法预测，更无法控制。真正欲求被点燃的效果？其实有天然手段：漫长的前戏（不少于一小时的挑逗）、边缘控制（多次寸止累积能量）、数日的禁欲（让身体自己积攒欲望）——这些天然方法的效力胜过任何可疑药片，且醒来没有代价、不损伤肝肾、不产生依赖。而且，通过天然手段积攒的欲望更纯粹，更专注于对方而非药物本身，更能加深关系。本清单之中，酒精之外一概不用；酒精亦须节制（一杯到微醺为宜，超过则丧失判断力）。",r:"来源不明之物入口，后果不可预测——从无效到致死之间任何可能都存在。",b:"酒精之外一概不用；酒精的使用亦须节制在微醺以内——超过则本局无效，因不存在清醒的同意。",m:"仅限幻想"},
{t:4,n:"掳掠剧本",l:"Raptus",p:"自背后被捂住口鼻拖入黑暗——那一记突袭时肾上腺素的爆发，挣扎间被牢牢制住的无力感，被缚住手脚塞入车中的窒息感，醒来时身处陌生房间的绝望感——掳掠剧本是伪逆之局的场景化极致版本，恐惧与肾上腺素是它的主菜。于室内演绎，完全可行——门一关，自玄关的袭击开始，全屋皆是舞台：预先约定好路线、约定好各个关键节点、约定好安全手势。伴侣扮演的陌生人的手却是熟悉的，那份熟悉与陌生的交叠创造出独特的心理张力——理智知道这是伴侣，本能却在剧情的推动下真实地反应，这种双重体验只有此格能提供。而剧情越是逼真，那份被夺走的失控体验就越接近想象中的极致。但将其搬入公共空间是完全另一回事：路人看到会真的报警（且报警之后即便解释清楚，被记录在案的可能性也不能忽略），挣扎中会真的出意外（跌倒骨折、失控伤人），解释不清时的后果全是真的（治安拘留、影响履历、乃至刑事记录）。",r:"公共空间的掳掠扮演可致真实的报警、真实的事故、真实的法律后果——任何一项都足以毁掉一段关系。",b:"室内演绎可行——全屋可作舞台，情节可极致戏剧化；户外一律禁止。",m:"室内可玩"},
{t:4,n:"长期囚禁",l:"Carcer",p:"被关数日、与世隔绝、完全依附于一人——囚禁幻想的引力在于绝对的依赖：饮食、光线、自由、乃至基本的生理需求，全部经由一双手。文字中，那份完全被切断与外界连接、生存所需的一切都必须通过对方获得的场景，承载着极深的臣服与依附意象。数小时的版本可行：一个下午的囚室（如以密室、如以束缚固定于特定位置），束缚、定时送水、规定的放风时间——这种短时体验充满仪式感与心理张力，能提供囚禁幻想的核心体验（依附感、被剥夺自由、完全的信任交付）而无长期风险。但以天计的真实囚禁会碾过身体的多重底线：脱水（长时间限水）、深静脉血栓（长时间不活动）、压疮（长时间同一姿势）、肌肉萎缩（数日不动即可开始）；心理层面的损伤更为深远——真实的隔离与依附关系可能触发或加剧解离、依赖症、以及斯德哥尔摩综合症样的复杂情感反应。牢笼可以是游戏，但钥匙须每晚回到被囚者手中。",r:"心理创伤、脱水、血栓、肌肉萎缩、压疮；心理层面的隐性损伤可能在事后数月才开始显现。",b:"数小时可行（一个下午、一个晚上）；数日一律禁止；每次施行后须有充分的重新连接时间。",m:"仅限幻想"},
{t:4,n:"人体家具",l:"Supellex",p:"跪伏成一张矮几，背上置一盏茶——另一人于旁读书，偶尔端起啜一口，从头至尾不看一眼，仿佛那真的只是一件家具。或成为脚凳（供另一人搁脚）、成为屏风（跪立不动阻隔某个方向的视线）、成为烛台（举着一根蜡烛保持静止）。物化扮演的战栗感恰来自这份被无视——存在，却不被作为人对待；被使用，却不被交流；提供功能，却不被给予情感回应。这份存在感的极致降低反而令服从者进入一种奇异的、几近于禅定的状态——注意力高度集中于保持姿势不动，思维反而彻底放空。而当被使用者渐渐忘记自己是人、真正沉浸于家具的角色时，那份从人的自我意识中暂时解脱的体验会带来一种独特的、类似冥想的宁静——这正是此格的深层吸引力。二十分钟以内，这是极有张力的心理游戏；越过此线，固定姿势将开始压迫神经（尤其膝盖、肩颈）、淤积血流（下肢静脉压力增加）。故茶几可以当，但每二十分钟，这件家具须被抱起来揉一揉膝盖。",r:"逾一小时的固定姿势将致神经压迫与静脉血栓风险——尤其中老年群体、循环不佳者禁忌。",b:"二十分钟以内可行；每满二十分钟须起身活动至少五分钟；每次总时长不超过两小时。",m:"限时可玩"},
{t:4,n:"彻底物化",l:"Res",p:"此格的设定为：无名，无称谓，不被当人对待，彻底沦为一件物品被使用、被摆放、被存放。它与宠物扮演（仍有情感联结，仍被昵称）、人体家具（仍有短时的功能性存在）的区别在于程度——后两者剥去的是体面，此格剥去的是人格本身。长时间的彻底去人格化对依恋、自我认同、以及关系的深层结构冲击极大；事后修复成本远超一般条目，且往往在结束后数日至数周才开始显现——那种我是不是不再是我的存在性质疑一旦触发，需要长时间的心理支持才能重建。而这份重建过程本身充满风险——因为它触及的是自我认同的根基，而这份根基一旦动摇，很多其他领域的心理稳定性也会受到连带影响。这不是危言耸听，而是长期从事此类玩法的社群中反复报告的现象。此格的心理风险远超其生理风险，故本套牌不收录其完整实操版本——若欲体验物化感，建议以限时人体家具或完整宠化条目替代。",r:"心理风险远大于生理风险；创伤常延迟显现（数日至数周之后）；对既有关系的信任基础可能造成长期影响。",b:"如欲体验物化感，以限时人体家具或完整宠化条目替代——那些是同类需求的安全表达。",m:"仅限幻想"}
];

/* ---------- starfield ---------- */
const sky=document.getElementById("sky"),ctx=sky.getContext("2d");
let stars=[],lines=[];
function skyInit(){
  sky.width=innerWidth;sky.height=innerHeight;
  stars=[];lines=[];
  const n=Math.min(150,Math.floor(innerWidth*innerHeight/9000));
  for(let i=0;i<n;i++){
    stars.push({x:Math.random()*sky.width,y:Math.random()*sky.height,
      r:Math.random()*1.3+.3,ph:Math.random()*6.28,sp:.4+Math.random()*1.1,
      hue:Math.random()<.16?"180,90%,75%":(Math.random()<.1?"268,80%,80%":"0,0%,92%")});
  }
  for(let c=0;c<4;c++){
    const pts=[];let px=Math.random()*sky.width,py=Math.random()*sky.height*.7;
    const k=3+Math.floor(Math.random()*3);
    for(let i=0;i<k;i++){pts.push([px,py]);px+=(Math.random()-.4)*170;py+=(Math.random()-.45)*150;}
    lines.push(pts);
  }
}
skyInit();addEventListener("resize",skyInit);
(function loop(t){
  ctx.clearRect(0,0,sky.width,sky.height);
  ctx.lineWidth=.5;
  lines.forEach(pts=>{
    ctx.strokeStyle="rgba(127,255,212,.10)";
    ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    pts.forEach(([x,y])=>{ctx.fillStyle="rgba(127,255,212,.35)";ctx.beginPath();ctx.arc(x,y,1.2,0,6.28);ctx.fill();});
  });
  stars.forEach(s=>{
    const a=.25+.75*Math.abs(Math.sin(t*.001*s.sp+s.ph));
    ctx.fillStyle="hsla("+s.hue+","+a+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();
  });
  requestAnimationFrame(loop);
})(0);

/* ---------- audio ---------- */
let AC=null,muted=false;
document.getElementById("mute").onclick=e=>{
  muted=!muted;e.target.textContent=muted?"∅":"♪";
  e.target.style.color=muted?"var(--mist-3)":"var(--t1)";
};
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function sndChime(tier){
  if(muted)return;const a=ac();
  const base=tier===4?392:tier===3?523:tier===2?587:659;
  [[base,0],[base*1.5,.14],[base*2,.26]].forEach(([fr,dt])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type="sine";o.frequency.value=fr;
    g.gain.setValueAtTime(0,a.currentTime+dt);
    g.gain.linearRampToValueAtTime(.16,a.currentTime+dt+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dt+1.1);
    o.connect(g);g.connect(a.destination);
    o.start(a.currentTime+dt);o.stop(a.currentTime+dt+1.2);
  });
}

/* ---------- particles ---------- */
function burst(el,hex,n){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.className="star-p";s.textContent=Math.random()<.5?"✦":"✧";
    s.style.color=hex;s.style.textShadow="0 0 8px "+hex;
    s.style.left=cx+"px";s.style.top=cy+"px";
    const ang=Math.random()*6.28,dist=60+Math.random()*110;
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",Math.sin(ang)*dist-30+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

/* ---------- dice build ---------- */
const pyr=document.getElementById("pyr");
function paintPyr(tier){
  const t=T[tier];
  pyr.querySelectorAll(".pface").forEach(f=>{
    f.style.setProperty("--fc0",t.f0);
    f.style.setProperty("--fc1",t.f1);
    f.style.setProperty("--fc2",t.f2);
  });
  document.getElementById("pod1").style.setProperty("--pg",t.g);
}
paintPyr(1);

const d2=document.getElementById("d2");
function pips(n){
  const L={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],
  4:[[27,27],[73,27],[27,73],[73,73]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],
  6:[[27,23],[73,23],[27,50],[73,50],[27,77],[73,77]]};
  return '<svg viewBox="0 0 100 100">'+L[n].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="7.5" fill="currentColor"/>').join("")+'</svg>';
}
for(let i=1;i<=6;i++){
  const f=document.createElement("div");
  f.className="cface cf"+i;f.innerHTML=pips(i);
  d2.appendChild(f);
}
const SHOW6={1:[0,0],2:[0,-90],3:[0,180],4:[0,90],5:[-90,0],6:[90,0]};
let pyrRot=[0,0],d2Rot=[0,0];

function spinPyr(face){
  const targetY=-(face-1)*90;
  const ny=Math.ceil((pyrRot[1]+720)/360)*360+targetY+360*(1+Math.floor(Math.random()*2));
  const nx=pyrRot[0]+360*(2+Math.floor(Math.random()*2));
  pyr.style.transform="rotateX("+nx+"deg) rotateY("+ny+"deg)";
  pyrRot=[nx,ny];
}
function spinCube(face){
  const[tx,ty]=SHOW6[face];
  const nx=Math.ceil((d2Rot[0]+720)/360)*360+tx+360*(1+Math.floor(Math.random()*2));
  const ny=Math.ceil((d2Rot[1]+720)/360)*360+ty+360*(1+Math.floor(Math.random()*2));
  d2.style.transform="rotateX("+nx+"deg) rotateY("+ny+"deg)";
  d2Rot=[nx,ny];
}
pyr.style.transform="rotateX(0deg) rotateY(0deg)";
d2.style.transform="rotateX(0deg) rotateY(0deg)";

/* ---------- tiers ---------- */
const tiersEl=document.getElementById("tiers");
let picked=new Set([1,2]);
function paintTiers(){
  tiersEl.innerHTML="";
  [1,2,3,4].forEach(k=>{
    const b=document.createElement("button");
    b.className="tier";
    b.style.setProperty("--tc",T[k].c);
    b.style.setProperty("--tg",T[k].g);
    b.dataset.on=picked.has(k)?"1":"0";
    b.innerHTML='<span class="gem"></span><span class="rn">'+T[k].rn+'</span><span class="nm">'+T[k].nm+'</span>';
    b.onclick=()=>{
      if(picked.has(k)){ if(picked.size>1) picked.delete(k); }
      else picked.add(k);
      paintTiers();
    };
    tiersEl.appendChild(b);
  });
}
paintTiers();

function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

let cur=null,timerId=null,history=[],busy=false;
const HINTS_ROLL=["astragali cadunt — 骰子正在坠落","fata volvuntur — 命运正在翻滚","dii spectant — 众神在看"];
const HINTS_DONE={1:"leve initium — 温柔的开局",2:"calidius fit — 开始升温了",3:"in profundum — 坠入深处",4:"ad infernum — 欢迎来到地狱"};

function render(x){
  const t=T[x.t];
  const slot=document.getElementById("slot");
  const isHell=x.t===4;
  const ruleBlock=isHell
    ?'<div class="warnbox"><dt>Cur Infernum &middot; 为什么是地狱级</dt><dd>'+x.r+'</dd></div>'
    :'<div class="sec"><dt>Regula &middot; 规则</dt><dd>'+x.r+'</dd></div>';
  slot.innerHTML=
    '<div class="card'+(isHell?' hell':'')+'" style="--ac:'+t.c+';--ag:'+t.g+'">'+
      '<i class="c-corner tl"></i><i class="c-corner tr"></i><i class="c-corner bl"></i><i class="c-corner br"></i>'+
      '<div class="c-top">'+
        '<div class="c-num">No. '+String(D.indexOf(x)+1).padStart(3,"0")+'</div>'+
        '<div><span class="c-tier">'+t.nm+' &middot; '+t.rn+'</span></div>'+
        '<div class="c-name">'+x.n+'</div>'+
        '<div class="c-latin">'+x.l+'</div>'+
      '</div>'+
      '<div class="c-div"><span></span></div>'+
      '<div class="sec"><dt>Ludus &middot; 玩法</dt><dd>'+x.p+'</dd></div>'+
      ruleBlock+
      '<div class="sec"><dt>Merces &middot; 奖惩</dt><dd>'+x.b+'</dd></div>'+
      '<div class="c-foot">'+
        '<span class="dur">时长 <i>'+x.m+'</i></span>'+
        '<span class="tm" id="tm"></span>'+
        '<button class="tbtn" id="tbtn">开始计时</button>'+
      '</div>'+
    '</div>';

  const mins=(x.m.match(/(\d+)\s*分钟/)||[])[1];
  const tb=document.getElementById("tbtn");
  if(!mins){ tb.remove(); }
  else{
    let left=parseInt(mins)*60,run=false;
    const tm=document.getElementById("tm");
    tm.textContent=fmt(left);
    tb.onclick=()=>{
      if(run){ clearInterval(timerId);run=false;tb.textContent="继续"; return; }
      run=true;tb.textContent="暂停";
      clearInterval(timerId);
      timerId=setInterval(()=>{
        left--;tm.textContent=fmt(left);
        if(left<=0){clearInterval(timerId);tm.textContent="到点了";tb.textContent="开始计时";run=false;}
      },1000);
    };
  }
}

const hint=document.getElementById("hint");
function draw(){
  if(busy)return;
  busy=true;
  clearInterval(timerId);
  const btn=document.getElementById("draw");
  btn.disabled=true;
  pyr.classList.remove("lit");
  const slot=document.getElementById("slot");
  const oldCard=slot.querySelector(".card");
  if(oldCard){oldCard.style.transition="opacity .3s";oldCard.style.opacity="0";setTimeout(()=>slot.innerHTML="",300);}

  const pool=D.filter(x=>picked.has(x.t));
  let x=pool[Math.floor(Math.random()*pool.length)];
  if(cur&&pool.length>1&&x===cur) x=pool[(pool.indexOf(x)+1)%pool.length];

  const idxInTier=D.filter(y=>y.t===x.t).indexOf(x);
  const dieNum=1+(idxInTier%6);

  hint.textContent=HINTS_ROLL[Math.floor(Math.random()*HINTS_ROLL.length)];
  hint.style.color="var(--mist-2)";
  paintPyr(x.t);
  spinPyr(x.t);
  spinCube(dieNum);

  setTimeout(()=>{
    cur=x;
    pyr.classList.add("lit");
    sndChime(x.t);
    burst(pyr,T[x.t].hex,14);
    burst(d2,"#40E0D0",10);
    render(x);
    history.unshift(x);
    const log=document.getElementById("log");
    log.hidden=false;
    document.getElementById("loglist").innerHTML=history.slice(0,10).map(h=>
      '<li style="--lc:'+T[h.t].c+';--lg:'+T[h.t].g+'"><span class="dot"></span>'+h.n+
      '<span class="lt">'+T[h.t].nm+'</span></li>').join("");
    btn.disabled=false;btn.textContent="再掷一次";
    hint.textContent=HINTS_DONE[x.t];
    hint.style.color=T[x.t].hex;
    busy=false;
  },2100);
}
document.getElementById("draw").onclick=draw;
</script>
