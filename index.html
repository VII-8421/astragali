{t:3,n:{zh:"全程存档",en:"Full Archive"},l:"Imago",p:{zh:"三脚架立好，角度调好，红点亮起——自此刻起，房间里多了一只不眨的眼睛。知晓被摄，每个动作都会不自觉多一层意识——腰塌得更深因为镜头在拍侧面；声音放得更开因为镜头能收音；或恰恰相反，羞耻到把脸埋进枕头因为知道自己的表情正被记录。这份被凝视感是本局的核心机制——它令即便是最日常的姿势也变得如表演一般，令平日的自然流露变成一种自觉的展示。而当被摄者渐渐忘记镜头存在的那些瞬间——沉浸于快感深处、身体本能反应的时刻——反而是最珍贵的：因为那些片段将成为未来某个时刻两人共同回看时的意外之喜。而真正的重头戏在事后：两人裹着被子倚在床头，将方才那段自头至尾放一遍。看屏幕里的自己是何表情、何声音、何模样——那双失焦的眼睛，那被顶到唇边的破碎音节，那些自己从未意识到的、腰肢摆动的幅度——会看见一个自己从未见过的自己。这份外部视角的自我审视往往比行动本身更为动情。",en:"Set up the tripod, align the angle, red light on — from this instant an unblinking eye is added to the room. Knowing they are watched, every action is another layer conscious of itself — the waist arches more deeply because the camera is filming a side angle; voice is opened wider because the camera picks up sound; or the opposite, ashamed to bury the face in a pillow because they know the expression is being recorded. This being-watched sensation is the scene's core mechanism — it turns even the most ordinary posture into something like theatre, turns habitual naturalness into deliberate display. And those moments where the filmed is nearly ready to forget the camera exists — deep in pleasure, or purely in the body's reflex — are the most precious: because those clips will become the surprise re-watched at some later date. And the real main act is after: both wrapped in the sheet leaning against the headboard, replay the segment from head to tail. Watching one's own expression, one's own voice, one's own aspect on the screen — the unfocused eyes, the syllables broken to the lip, the amplitude of hip-motion never noticed before — one sees a self one has never seen. This outside-view self-examination is often more moving than the act itself."},r:{zh:"仅存于本地设备，绝不联网上传，绝不云同步；任何一方要求删除的一刻立即当面删除；不得留副本。",en:"Stored only on local device, never online, never cloud-synced; the moment any party asks for deletion, delete on the spot in front of them; no copy retained."},b:{zh:"当晚必须共同回看一遍——不许改天再看，不许下次一起看——回看本身是本局的完成。",en:"That very night both must re-watch — not \“another day,\” not \“next time together\” — the re-watch itself is the scene's completion."},m:{zh:"全程",en:"scene-length"}},
{t:3,n:{zh:"十连挑战",en:"Ten Consecutive"},l:"Decies",p:{zh:"自晨间睁眼始，本日只有一个议程：十次。手指算一次，器具算一次，唇舌算一次，正经行事亦算一次——方式不限，间隔自定，但每次须记录时间与方式——如一份严肃的实验日志。上午尚且游刃有余，第一次、第二次、第三次都来得容易而清晰；至午后第四第五次，身体开始进入某种敏感期，触碰的门槛显著降低；第六第七次时，已经一触即颤，顶点变得又快又浅又密；第八九次时，身体开始进入某种半麻木的状态，顶点几乎自动到来但快感的深度反而降低；最后几次几乎是折磨与恩赐的混合体——身体已经耗尽但仍被要求继续。这一天下来，除了完成十次的记录之外，服从方会经历一场对自身身体极限的深度探索：了解自己在不同状态下的反应模式，认识那种从欲望旺盛到耗竭再到重启的完整循环。抵不到十次也全然无妨——这份日志本身，即是本日的战利品，是对身体极限的一份珍贵调研。",en:"From the moment of morning eyes open, today has one agenda: ten times. A finger counts, an implement counts, mouth and tongue count, ordinary lovemaking counts — the manner not restricted, the interval self-set, but each time must have logged time and method — as a serious experiment's log. Mornings are still relatively easy, first, second, third all arrive quickly and clearly; by early afternoon the fourth and fifth, the body enters a kind of sensitized phase, the threshold of contact drops distinctly; the sixth and seventh, one touch and it quivers, the peak becomes quick and shallow and thick; the eighth and ninth, the body enters a half-numb state, the peak nearly arrives on its own but the pleasure's depth diminishes; the last few are a compound of torment and gift — the body already exhausted but still asked to continue. Through this day, besides completing the log of ten, the sub will go through a depth exploration of their own body's limit: come to know their own responses in different states, come to recognize that full cycle from robust desire to exhaustion to reboot. Not reaching ten is entirely fine — the log itself is today's spoils, a precious study of the body's limit."},r:{zh:"其间须进食、补水、适当休息；不适（头晕、心悸、剧烈疲惫）即停在当下次数不强求；本日不得饮酒。",en:"Meals, water, appropriate rest through the day; on discomfort (dizziness, palpitation, extreme fatigue), stop at that count without forcing; no alcohol today."},b:{zh:"未满十次不作失败论；记录本身即为战利品；此记录将作为下次本局的参考基线。",en:"Not-ten is not judged failure; the log itself is spoils; this log serves as baseline for the next round of this scene."},m:{zh:"一整天",en:"all day"}},
{t:3,n:{zh:"长约立契",en:"Long Compact"},l:"Pactum",p:{zh:"此条目没有床，只有一张桌、两盏茶、以及一份须认真书写的文件。称谓如何定（日常称呼、私密称呼、正式称呼），日常何事归谁管（做饭、清洁、财务、决策），何事绝对不碰（每人各自的绝对边界，写死），有效期多久（三月、半年、一年，可续），如何退出（是否需要预告期、如何完成过渡）——逐条谈，逐条写。谈的过程本身即是最深的亲密：一方会说出平日难以启齿的想要（我希望被规定几点睡觉、我希望每周日晚上做一次汇报），另一方会写下愿意承担的责任（我保证不在盛怒时惩罚、我保证每月至少一次仪式性的服务）。这场对谈往往会揭示许多平日不曾言说的深层需求与恐惧——是一次比任何身体接触都更为深入的相互认识。最后签字，各执一份。它没有法律效力，但比任何法律文件都诚实——这是两个人把如何相爱白纸黑字写下来。",en:"This entry has no bed, only a table, two cups of tea, and a document to be written down in earnest. How shall the address be set (daily address, private address, formal address), what daily thing is whose to manage (cooking, cleaning, finance, decision), what is absolutely not touched (each person's absolute boundary, written to death), what is the term (three months, half a year, a year, renewable), how is exit (whether a notice period is required, how the transition completes) — one by one to negotiate, one by one to write. The negotiation itself is the deepest intimacy: one side will say things ordinarily impossible to say (\“I hope to be told when to sleep,\” \“I hope for a report Sunday night\”), the other will write down responsibilities they are willing to bear (\“I promise no punishment in rage,\” \“I promise at least one ritual service a month\”). This negotiation often uncovers many usually-unspoken deep needs and fears — a mutual acquaintance deeper than any physical contact. Finally sign, one copy each. It has no legal force but is truer than any legal document — this is two people writing down, on paper, how to love each other."},r:{zh:"双方签署，各执一份；到期须重新协商，不自动续约；任一方随时可单方面终止，无须理由。",en:"Both sign, one copy each; on expiration re-negotiate, does not auto-renew; either party may unilaterally terminate at any time, no reason needed."},b:{zh:"契约期内每一条款皆认真执行——非戏，非游戏，是真实的关系约定；期满须有正式的结束仪式。",en:"Every clause during term is executed in earnest — not theatre, not game, but real relationship agreement; on expiration, a formal ending ritual."},m:{zh:"长期",en:"long-term"}},
{t:4,n:{zh:"刻字",en:"Carving"},l:"Sculptura",p:{zh:"幻想之中，此为烙印的终极形态——名字被一笔一划刻在皮肤之上，鲜血涌出如书法家笔下的朱砂，字迹凝固为永不褪去的疤痕。文学中，这份意象承载着最深的占有欲——身体成为契约的载体，一具身体永久地记载着另一个人的存在。那份鲜血渗出时特有的深红色、伤口边缘皮肤的翻卷、字迹在皮肤上凝固时的温度变化——每一个细节在文字中都可以书写至令人喘不过气。而现实中它的位置在文字与笔尖——可以极细的马克笔在肩胛一笔一笔书写，写得很慢、很用力，令受写者闭眼数着笔划、猜测字句；亦可将被刻下印记的完整故事写成文字，写到面红耳赤仿佛亲历。皮肤会代谢，墨迹会洗净，但被写上名字这件事的重量——那种我属于此人的心理烙印——一分不减。真实的划伤永远不建议——瘢痕感染的风险与心理创伤同等严重。",en:"In fantasy this is the ultimate form of branding — a name inscribed stroke by stroke into the skin, blood coming forth like a calligrapher's cinnabar, the letters set as scars that will never fade. Literarily, this image carries the deepest possessive longing — the body as vessel of a contract, a body permanently recording the existence of another. The peculiar deep red of blood as it seeps, the curl of the wound's edge, the temperature change as ink of the letters solidifies on skin — every detail in language may be written to the point of breathlessness. But its place in reality is at the tip of the pen — the finest marker on a shoulder blade written line by line, slowly, with pressure, letting the written eyes-closed count strokes and guess the word; or the whole story of \“being inscribed\” written out and read at face-flush length as if lived. Skin metabolizes, ink washes off, but the weight of \“being written on with a name\” — that psychic brand of \“I belong to this person\” — does not lessen a bit. Real cutting is never recommended — the risk of scarring and infection is as severe as the psychic trauma."},r:{zh:"永久瘢痕、大出血、深部感染，风险皆为真实；即便浅表划伤亦可能引发严重后果。",en:"Permanent scarring, major bleeding, deep infection — all real risks; even superficial cuts may bring severe consequences."},b:{zh:"以笔代刃可行——写得用力些、慢一些、认真一些，其心理效果不亚于真实刻痕。",en:"Pen instead of blade — write harder, slower, in earnest; the psychic effect is not less than real carving."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"燎原之火",en:"Wildfire"},l:"Conflagratio",p:{zh:"文字之中，火可以烧得极美——整片背脊被幽蓝色的火焰轻轻舐过，暖流层层漫开，如被一条以温度织就的舌自尾椎舔至后颈；或以火焰勾勒身体的轮廓，如某种古老的献祭仪式；或以火光在暗室中照亮皮肤的每一寸细节，映出汗珠与颤抖。这类场景可以写得隔着纸都觉得皮肤发烫——那种被火焰完整包裹却毫发无伤的极致想象，是文字独有的特权。但现实之中，大面积的火焰接触没有轻轻二字——二度烧伤只需数秒，三度烧伤只需十数秒；火焰的接触面无法精确控制，风向的一次变化即可能致灾；且皮肤的烧伤瘢痕将永久留存，气道的烧伤更是可能致命。皮肤在真实火焰下的反应与文字中描绘的完全不同：不是暖流，而是瞬间的、不可逆的组织坏死，痛感在数秒之后才达到峰值，那时已无可挽回。故此格的火，只烧在字里行间——那里可以烧得极致，且不留一丝真实的疤痕。",en:"In words, fire can burn very beautifully — a whole back licked lightly by pale blue flame, warm currents spreading layer by layer, as if licked from tailbone to nape by a tongue woven of temperature; or flame outlining the body as some ancient offering; or firelight in a dark room lighting every inch of skin, printing beads of sweat and shivers. Scenes of this kind may be written to make the skin feel hot through the paper — a wholly-flame-enveloped-yet-unscathed extremity of fantasy is the privilege of language alone. But in reality, contact with large surfaces of flame contains no \“lightly\” — second-degree burns take only seconds, third-degree take a dozen or so; the flame's contact face cannot be finely controlled; a shift in the wind may cause disaster; and burn scars will remain permanently, airway burns can be lethal. Skin's response to real flame is nothing like what the words describe: not warm currents, but instant, irreversible tissue death; the pain reaches its peak only after seconds, by which time it is too late. So this entry's fire burns only between the lines — the extremity is possible there, and no true scar is left."},r:{zh:"二度以上烧伤、气道损伤，数秒之内即可发生；无任何安全的实操版本。",en:"Second-degree burns or worse and airway damage occur within seconds; no safe practical version."},b:{zh:"文字之中可以烧得极致——只要不出书斋，任何幻想的极致皆可书写。",en:"Written flame may burn without limit — so long as one does not leave the study, any imagined extremity may be written."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"长时窒息",en:"Prolonged Asphyxiation"},l:"Suffocatio",p:{zh:"此格不作铺垫。这是整个 BDSM 领域中致死人数最多的一类玩法，没有之一——且逝者多为经验丰富者，因为缺氧导致的判断力丧失快于任何人的反应速度。当氧气不足开始影响脑部时，人自身对状态恶化的感知会同时被剥夺——这是它最阴险的机制：受害者往往不知道自己已经处于危险之中，甚至觉得越来越舒服。这份“感觉良好的死亡”是所有窒息类玩法的核心陷阱：脑部在缺氧的最后阶段会释放大量内啡肽，令主观体验充满欣快感，而客观上距离不可逆的脑损伤只有数十秒。任何形式的独自进行都是致死性的；两人进行时的意外亦频繁发生——绳索的滑动、姿势的错位、施术者对状态的误判，任何一项都足以造成不可逆的悲剧。文字之中若要书写濒死的失重与眼前发白的顶点，可以写，写得很沉、很美、很危险。但真实世界里，此格的答案永远只有一个字：不。",en:"This entry gets no run-up. This is the class of BDSM play with the highest death toll, without exception — and its dead are often the experienced, because loss of judgment from oxygen deprivation is faster than any human's reaction time. When lack of oxygen begins to affect the brain, the person's own sense of the worsening state is also stripped — this is its most insidious mechanism: the victim often does not know they are already in danger, and even feels \“more and more comfortable.\” This \“death that feels good\” is the core trap of all asphyxiation play: the brain in the last stages of hypoxia releases great amounts of endorphin, so the subjective experience is filled with euphoria, while objectively only tens of seconds remain to irreversible brain damage. Any solo practice is fatal; accidents in paired practice occur too — a slipping rope, a mis-positioning, a misjudgment of state — any one may cause irreversible tragedy. If, in words, one wishes to write near-death weightlessness and the whiteout peak, one may, and heavily, and beautifully, and dangerously. But in the real world this entry's answer is always the single word: no."},r:{zh:"独自进行的致死率接近百分之百；即使双人进行，风险亦远超一般玩法的可控范围。",en:"Solo practice approaches a hundred-percent fatality; even paired, risk exceeds ordinary controllability by far."},b:{zh:"文字演绎不设上限——任何深度、任何黑暗的书写皆可；现实施行一律拒绝。",en:"Written performance has no upper bound — any depth, any darkness, may be written; real practice is universally declined."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"放血",en:"Bloodletting"},l:"Sanguis",p:{zh:"暗红色在文学中是最艳的颜色——贴着颈侧的獠牙缓缓刺入，一滴血珠沿着颈项滑落至锁骨，被舌尖郑重其事地舔去；或以纤细的银针取出一小杯血液，二人共同啜饮如中世纪的血誓仪式；或血液与情液混杂，绘出身体上的红色纹路。此类意象可以写至极致——仪式感、占有欲、血脉相融的深层隐喻，尽可皆有，且在文学史上有悠久传承。血在文学中承载的重量远超其物理意义：它是生命的直接可见形式，是最深的自我馈赠，是宗教与情欲交叠处最古老的符号。但现实之中，大量取血即失血性休克，共享血液即血源性传染病（HIV、乙肝、丙肝、梅毒等）的直通车。即便是微量的皮肤破损，只要器械未经严格消毒，都可能引发严重感染。故血只流在故事之中——故事里它可以流得极美、极浪漫、极虔诚。",en:"Dark red is literature's most vivid color — fangs slid slowly against the side of the neck, a bead of blood sliding along to the collarbone, licked away in earnestness; or a small cup drawn with a fine silver pin, drunk together like a medieval blood oath; or blood mixed with the fluids of love, drawing red lines across the body. Images of this kind may be written to extremity — ritual, possession, the deep metaphor of blood-mingling, all present, and with a long tradition through literary history. In literature blood carries a weight far beyond its physical meaning: it is life's most direct visible form, the deepest self-gift, the oldest symbol at the joining of religion and love. But in reality, large withdrawal is hemorrhagic shock, and shared blood is a direct route for blood-borne infection (HIV, hepatitis B/C, syphilis, etc.). Even a small skin break, if the instruments have not been rigorously sterilized, may trigger serious infection. So blood flows only in the story — there it may flow beautifully, romantically, reverently."},r:{zh:"低血容量休克、血源性传染病；即便微量刺破亦可能因器械污染引发严重感染。",en:"Hemorrhagic shock, blood-borne infection; even minor punctures may trigger severe infection due to instrument contamination."},b:{zh:"此格永远停在文字之中——任何深度的血色描写皆可书写，唯不入现实。",en:"This entry stops forever in words — any depth of blood-color description may be written, but never enters reality."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"枪口",en:"Barrel"},l:"Telum",p:{zh:"影视中的经典画面——冰冷的枪管抵着下颌一路下滑，恐惧将每寸皮肤的感知放大十倍，权力关系于此刻抵达绝对的顶点。作为纯粹的心理意象，它玩的是绝对权力差带来的战栗，是生命完全被握于另一人之手的极致象征。金属的冰凉、扳机的沉重、以及那份任何时刻都可能扣响的恐惧感——三者叠加构成了文学与影视中最强烈的权力符号之一。但现实中，哪怕确认过无弹的枪，每年都在造成死亡——走火不需要任何理由（机械故障、清膛不彻底、心不在焉的一次扣扳机）；即便是仿真道具枪，其带来的心理创伤（尤其是意外触发深层恐惧后的 PTSD）亦不可小觑；且不同国家和地区对枪械管制的差异令即便持有仿真枪都可能面临法律风险。此格连道具枪都不建议触碰：欲求被绝对掌控的恐惧感，钝刃、语言、束缚皆可给予，且它们不会真的响。",en:"The classic filmic image — the cold barrel pressed to the underjaw, sliding down; the amplification by fear of every inch of skin's perception tenfold; the power relation arriving at absolute peak in this instant. As pure psychic image, it plays the shudder brought by absolute power differential, and is the ultimate symbol of \“life wholly held in the hand of another.\” The metal's chill, the trigger's heaviness, and the dread of \“may fire at any instant\” — three overlaid — constitute one of the strongest power-symbols in literature and film. But in reality, even a \“verified empty\” gun kills people every year — misfire needs no reason (mechanical malfunction, incomplete clearing, absent-minded finger on the trigger); even a replica gun's induced psychic trauma (especially triggered deep fear PTSD) is not to be dismissed; and the range of national and regional laws regarding firearms means even the possession of a replica may carry legal risk. This entry does not recommend touching even a replica: the wish for that dread of absolute domination can be met by blunt blade, language, and restraint, and those will not really fire."},r:{zh:"意外走火不需要任何理由——即使双方确信武器已卸弹，仍存在人类无法预料的意外机制。",en:"An accidental fire needs no reason — even both parties confident the weapon is unloaded, there are mechanics human foresight cannot predict."},b:{zh:"道具枪亦不建议使用；类似的恐惧感与权力体验，以钝刃巡游、全然封闭等条目替代。",en:"Replica guns also not recommended; a similar dread and power experience via blunted-blade, total enclosure, and related entries."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"永久穿孔",en:"Permanent Piercing"},l:"Perforatio",p:{zh:"乳尖上一枚小小的银环，私处一颗藏起来的钉，或耳尖、鼻中隔、乃至舌头的穿孔——穿孔的想象确实又疼又艳，那是写在身体上的永久宣言，衣物之下只有彼此知晓的秘密，触碰时的细微金属感令平日的抚爱多一层触感的维度。而某些私密部位的穿孔更会在日常生活中提供持续的低烈度刺激——衣物摩擦时的轻微牵动、行走时的微弱感受、乃至安坐时的存在感，都会成为一种全天候的、隐秘的性提示。这份欲求的实现路径其实很清晰：正规穿孔店，无菌环境，专业技师，术后护理与消炎。它可以是某个纪念日、某个人生节点认真赴约的一件事，甚至可以是伴侣共同前往、互相为对方选择位置的仪式。唯独不能是床笫之间一时兴起的游戏——DIY 穿孔的感染率、神经损伤率、排异反应率都远高于专业操作，且伤口愈合期间需要严格的护理，绝非当场的浪漫可以承担。",en:"A small silver ring on the nipple, a pin hidden in the sex, or the ear-lip, septum, or tongue pierced — the imagination of piercing is indeed both painful and gorgeous, a permanent declaration written into the body, secrets only the two know beneath clothing, a dimension of touch added to ordinary caress by the fine feel of metal. And certain private-location piercings will further provide sustained low-grade stimulus through daily life — light tugs from fabric friction, faint sensations from walking, even the presence's assertion during quiet sitting all become an all-day, secret sexual reminder. The path to fulfilling this desire is in fact very clear: legitimate piercing studio, sterile environment, professional piercer, aftercare and disinfection. It may be an appointment kept in earnest on some anniversary or life juncture, may even be a ritual attended by both partners choosing places for each other. What it may not be is an at-the-bedside impulse — DIY piercing's infection rate, nerve damage rate, and rejection rate are all far higher than a professional's, and the healing period requires rigorous care, not something \“on-the-spot romance\” can support."},r:{zh:"感染、排异、永久性神经损伤——任何非专业操作皆有极高风险。",en:"Infection, rejection, permanent nerve damage — any non-professional operation carries high risk."},b:{zh:"确有此愿者，赴正规穿孔店专业操作——不于床上施行；专业穿孔本身亦可成为二人共同的仪式。",en:"Those with the wish, go to a legitimate piercing studio — do not perform in bed; the professional piercing itself may become the couple's ritual."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"见血之笞",en:"Whip to Blood"},l:"Cruor",p:{zh:"鞭痕见血在某类叙事之中是忠诚的极致证明——皮开肉绽仍仰头说继续，血珠自伤口渗出汇成细流，那份彻底的献祭感与身体作为祭坛的意象具有强大的文学感染力。鞭子每一次落下时血珠的溅落方向、伤口边缘皮肤的翻卷、以及背部渐渐被鞭痕交织成一张网的过程——每一个细节在文字中可以推至令人窒息的极致。文字之中此种烈度可以书写。但现实中的身体不是叙事——打到出血意味着深层组织损伤、大面积血肿、真皮层的破损；再往上是横纹肌溶解（大量肌肉细胞坏死释放物质入血）、肾衰竭（横纹肌溶解的常见后果）、乃至危及生命的电解质紊乱。击打类条目的合理上限画在痕迹留存一周这条线：红肿、鞭痕、深色淤青皆可，破皮见血不可。疼痛可以是礼物，伤害不是。真正专业的鞭手能够精准控制不出血，那是数年练习的成果——非专业者的稍微用力即可能酿祸。",en:"Whip-marks to bleeding in a certain kind of narrative are the ultimate proof of loyalty — flesh open to the bone yet the head is lifted with a \“continue,\” bead of blood at the wound gathering into a rivulet, that total sense of offering and the image of the body as altar carry great literary force. The direction of blood splash at each fall of the whip, the curl of skin at the wound's edge, the process of the back's gradual becoming a net of whip-marks — every detail may be pressed in words to a suffocating extremity. Words may write this pitch. But the real body is not narrative — struck to bleeding means deep-tissue damage, extensive hematoma, breach of the dermis; further up is rhabdomyolysis (great numbers of muscle cells dying and their contents entering the blood), renal failure (its common sequel), even life-threatening electrolyte disturbance. The rational upper limit of impact-play sits at the line of \“marks lingering a week\” — redness, welts, deep bruising all permissible, broken skin bleeding not. Pain may be a gift, damage is not. A truly professional whip-hand can control precision so that no bleeding occurs — that is the fruit of years of practice; a non-professional's \“a bit harder\” may bring disaster."},r:{zh:"深层组织损伤、大面积血肿、横纹肌溶解、急性肾衰竭——重击的实际风险远超直觉。",en:"Deep tissue damage, extensive hematoma, rhabdomyolysis, acute renal failure — the real risks of heavy impact are far above intuition."},b:{zh:"痕迹可留存一周——足以让二人共同凝视皮肤上的印记；不该留存一辈子。",en:"Marks may linger a week — enough for both to look together upon the print in the skin; not for a lifetime."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"多人",en:"Multitude"},l:"Multitudo",p:{zh:"许多双手同时落在身上、应接不暇的画面——此幻想的引力不难理解：一具身体成为众人的祭坛，从各方涌来的抚触与占有令人失去所有防御。文字中，这份场景可以推至极致的过载：多张嘴同时占据身体的多个部位，多双手同时探入不同的孔穴，声音从四面八方而来令人无法辨别方向，最终陷入一种被彻底淹没的、无法抵抗的狂喜。但多人场景对关系边界、事后情绪、以及主要伴侣之间的信任的冲击，远远超过其生理风险：嫉妒的萌芽、无意识的比较（对方的技巧、身体、投入程度）、以及事后回想时可能出现的悔意，往往在结束数日之后才开始生长发酵。它对所有参与者的完全知情同意、性健康筛查、以及事后修复能力要求都极高。即使技术上可行，此类玩法对关系的隐性代价往往远超预期。本套牌仅收录其幻想演绎版本——文字之中可尽情探索这份想象，而现实中的施行须极为审慎。",en:"Many hands landing on the body at once, images of overwhelm — the attraction of this fantasy is easy to grasp: one body as altar for many, touch and possession pouring in from every side deposing all defense. In words, this scene may be pushed to the extremity of overload: several mouths simultaneously occupying several parts of the body, several pairs of hands simultaneously entering different apertures, sound from every quarter making direction indeterminate, plunged into a wholly-drowned, un-resistible ecstasy. But multi-person scenes' impact on relationship boundaries, on after-emotion, and on the principal partners' trust, far exceeds their physiological risks: the sprout of jealousy, unconscious comparison (technique, body, degree of investment), and possible after-regret in retrospect, often only begin to grow and ferment in the days after the event. It demands of every participant complete informed consent, screening, and after-repair capacity all at high level. Even where technically feasible, the hidden cost to the relationship often far exceeds expectation. This deck includes only the written performance version — words may explore this imagination to the full, while practice in reality must be extremely cautious."},r:{zh:"关系冲击远超生理风险；事后修复成本极高；且性健康风险随参与者数量呈指数上升。",en:"Relational impact far exceeds physiological risk; after-repair cost extremely high; and sexual-health risk rises exponentially with participant count."},b:{zh:"文字演绎可行——任何深度、任何数量、任何组合皆可书写；现实施行须全员知情同意、完整体检、以及事后深度沟通。",en:"Written performance is fine — any depth, any number, any combination may be written; practice requires all-parties' informed consent, full check-up, and deep post-hoc conversation."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"完全控制",en:"Total Control"},l:"Regimen totum",p:{zh:"排泄的完全支配是权力交换的最深水区之一——连身体最基本的、自主的阀门都上交，服从做到生理层面的每一处细节。文字中，这份彻底的、连膀胱开合权都不属于自己的失控感承载着极强的臣服象征意义。轻度版本是可行的：忍耐（憋尿至一定程度）、奏报（如实告知膀胱压力）、申请批准（何时可以如厕），那种紧张兮兮的半失控边缘感确有其独特魅力，专家级条目中已有此类玩法。但完全二字则意味着质变——长时间的强制憋尿、导管介入、或以物理装置阻断排泄。这是泌尿系统感染（尿路上行性感染可至肾脏）、肾功能损伤（尿液滞留导致肾积水）、乃至膀胱破裂的直路。膀胱作为身体的储液器官有其生理极限，超过极限的强制约束不仅可能造成即时损伤，更可能造成长期的功能失调。故此界线画于此：忍耐游戏可玩，阀门的最终控制权永远留在身体主人自己手中。",en:"Complete domination over excretion is one of power-transfer's deepest waters — even the body's most basic autonomous gates surrendered, obedience carried to a physiological detail. In words, that total, even-the-bladder's-opening-and-closing-not-your-own loss of control carries an extreme yielding-symbolism. A light version is workable: hold (bladder to some degree), report (state honestly the pressure), apply for permission (when may go) — that anxious half-loss-of-control edge does have its distinct charm, already provided in the Advanced tier. But the word \“complete\” here signifies a shift in nature — extended forced holding, catheter insertion, or physical device blocking excretion. That is the direct route to urinary infection (ascending infection may reach the kidney), renal damage (urine retention causing hydronephrosis), even bladder rupture. The bladder as reservoir has its physiological limit; forced restriction beyond that limit not only risks immediate injury but risks long-term functional dysfunction. So the line is here: the game of holding may be played, ultimate control of the gate stays always with the body's owner."},r:{zh:"泌尿系统感染、肾功能损伤、膀胱损伤——身体基础功能的强行控制风险极高。",en:"Urinary infection, renal damage, bladder injury — forced control of basic bodily function carries very high risk."},b:{zh:"轻度忍耐条目可行（参见忍水之局）；完全控制不予施行。",en:"Light hold-play is fine (see \“Holding Fluid\”); complete control not practiced."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"秽物",en:"Filth"},l:"Scatologia",p:{zh:"此格存在于清单之中，因它确实存在于世界的某些角落——某些人有此癖好，某些亚文化中有此仪式。人类幻想的谱系是极其宽广的，本套牌不作道德审判。但从公共卫生的角度看，其风险清单极为沉重：肠道寄生虫（贾第虫、阿米巴等）、甲型肝炎、大肠杆菌严重感染（可致败血症）、乃至尚未彻底研究清楚的其他病原体传播。而与其他条目不同，此格的风险即便在最完备的卫生措施下也无法有效降低——因为其风险来源与其内容本身不可分割。其画面感与风险清单同等沉重。本套牌对此格不设幻想演绎版本，亦不作任何推荐——每一份玩法清单都有权保留至少一个空白格，作为对自身审美与底线的诚实标记。",en:"This entry stands in the list because it stands in the world — some have this preference, some subcultures have this ritual. The genealogy of human fantasy is very wide; this deck offers no moral judgment. But from public-health, its risk list is extremely heavy: intestinal parasites (giardia, amoeba, etc.), hepatitis A, severe E. coli infection (may cause sepsis), and other pathogen transmissions not yet fully studied. And unlike other entries, this entry's risks cannot be effectively reduced by even the most complete hygiene measures — because the source of risk is inseparable from the content itself. The imagery is as heavy as the risk list. This deck sets no performance version for it, and offers no recommendation — every play list has the right to keep at least one blank cell, as an honest mark of its own aesthetic and boundary."},r:{zh:"肠道寄生虫、甲型肝炎、严重肠道感染——即便是极小接触量亦可能引发严重后果。",en:"Intestinal parasites, hepatitis A, severe intestinal infection — even minimal exposure may trigger severe consequence."},b:{zh:"本条目不设任何演绎版本；建议以其他更能满足支配感需求的条目替代。",en:"This entry sets no performance version at all; suggested substitution is other entries that better serve the wish for domination."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"吞食",en:"Vore"},l:"Vorare",p:{zh:"被一个巨大而温柔的存在整个吞下——不是死亡，而是回到某个绝对安全的内部：温热、黑暗、被完整包裹，外面的世界彻底进不来。此幻想的心理内核是终极的被容纳——退回到子宫、退回到某个前语言的原初状态。那份被巨物咽下时喉咙的收缩、被内部的湿润完整覆盖的触感、以及在温热的、律动的空间中失去时间感知的漂浮——文字中可以书写至令人窒息的美。物理上它当然不可能发生，故它是百分之百属于想象力的领域——也因此可以写得毫无顾忌：巨龙的腹腔（那份被鳞片包裹的温暖）、深海生物的柔软内部（那份幽暗与波动）、异界巨物的温热之内（那份完全的臣服）。文字之中可探索一切细节——被吞下时的姿势、内部的温度、生存的时间、情感的层次。这类幻想在特定文学社群（vore 亚文化）中有丰富的既有作品可供参考，其美学与心理深度值得认真书写。",en:"To be wholly swallowed by a vast, gentle being — not death, but return to some absolutely safe interior: warm, dark, completely enveloped, the outside world unable to reach in. This fantasy's psychic core is the ultimate being-contained — a retreat to the womb, to some pre-verbal originary state. The tightening of the throat at being swallowed by a vast thing, the touch of complete envelopment by the interior's wetness, and the floating loss of time-sense within the warm, rhythmic space — words may write to a breath-stopping beauty. Physically it is impossible, so it is a hundred percent territory of imagination — and therefore may be written without reserve: the belly of a dragon (that warmth wrapped in scales), the soft interior of some deep-sea being (that gloom and the pulse), the warmth of an otherworldly giant (that total yielding). In words every detail may be explored — the posture of being swallowed, the interior's temperature, the survival duration, the emotional layers. This class of fantasy has, in specific literary communities (the vore subculture), a rich body of existing work, and its aesthetics and psychic depth deserve serious writing."},r:{zh:"物理上不可能发生——纯属想象力的领域。",en:"Physically impossible — a domain purely of imagination."},b:{zh:"文字演绎不设任何上限——被谁吞下、以何种姿态、体验如何，由幻想者自由指定。",en:"Written performance has no upper limit — by whom swallowed, in what posture, what the experience — the imaginer's choice."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"死亡",en:"Death"},l:"Mors",p:{zh:"以死亡为终点的场景是幻想光谱的最远端——它迷人的从来不是死本身，而是为其而死中那种献祭式的、把存在本身完全交出去的极致浪漫。文学史上一半的殉情故事都在书写它——罗密欧朱丽叶、梁山伯祝英台、《雪国》中的那份彻底沉沦。它可以被书写：写在爱人怀中一点点变凉，写数着自己最后的心跳，写最后的呼吸如何缓缓吐尽，写脸颊上那一抹尚未干涸的微笑——写得极美、极安静、极完整。这份幻想深处触及的是生与死的边界处最私密的情感——愿意为对方交出一切，包括存在本身的这种终极承诺，在其他所有场景中都无法完整表达。但其全部生命力恰恰在于只能是文字——因为爱要好好活着，才能一直书写下去；因为每一次写下死的场景，都是一次对活着的隐秘赞美——那份意识到彼此仍在此处呼吸的珍惜感，正是通过书写死亡这份不可能而反向得以强化。",en:"Scenes taking death as terminus stand at the far end of the fantasy spectrum — its allure is never death itself but that offering-in-dying's ultimate romance of \“handing over existence itself.\” Half of literary history's love-suicide stories are writing it — Romeo and Juliet, Liang-Zhu, Snow Country's whole abandon. It may be written: written cooling in the beloved's arms, written counting one's own last heartbeats, written the last breath released slowly, written the not-yet-dried smile on the cheek — written beautifully, quietly, wholly. What this fantasy touches at bottom is the most private feeling at the border of living and dying — the willingness to give the beloved everything including existence itself, a final promise no other scene can fully express. But the whole of its life-force lies precisely in being only words — because love must live well, and love may write on and on, because each writing of death is a hidden praise of being alive — that sense of preciousness in realizing both are still breathing here is, precisely, strengthened in the reverse direction by writing this impossibility."},r:{zh:"不需要解释。",en:"No explanation required."},b:{zh:"文字之中可以写得极美——尤其在爱情文学、殉情叙事、悲剧美学的传统之中；且仅限文字。",en:"Written may be very beautiful — especially in the traditions of love-in-literature, love-suicide narrative, and tragedy aesthetics; and only in words."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"触手",en:"Tentacles"},l:"Tentacula",p:{zh:"数不清的、温热湿滑的、会自己思考的触须自黑暗之中涌出——缠住脚踝向上攀爬，卷住手腕向两侧分开，同时抵达身体的所有地方：有的缠腰，有的裹胸，有的探至唇边分开牙齿，有的滑向腿间试探穴口。人类只有两只手，而它有一百只、一千只，且每一只都有自己的意志。此幻想最好的载体即是文字——因为想象力没有物理限制：可以赋予触须以温度（滚烫如新生、冰凉如深海）、以纹理（光滑如丝绸、覆有细小吸盘、带有细密鳞片）、以脉动（如活物一般随情绪起伏）、以坏心眼（专挑最敏感之处纠缠）。而触手作为非人存在的性伴侣，能够突破一切人类身体的物理限制——可以同时占据无数个位置，可以变换粗细满足任何深度，可以完全无视对方的意愿或愿望做出精确到毫米的回应。在触手文学（tentacle erotica）这一独特亚类型之中，此幻想有极为丰富的叙事传统可供探索，从日本古典春画到现代西方 tentacle romance 皆有大量优秀作品。",en:"Countless, warm, wet, self-thinking tendrils surging from the dark — coiling around the ankles climbing up, clasping the wrists parting them, arriving at all places of the body at once: some coil the waist, some wrap the chest, some seek at the lip parting the teeth, some slip toward the sex probing the entrance. A human has only two hands; it has a hundred, a thousand, and each has its own will. The best vehicle for this fantasy is words — because imagination has no physical limits: tendrils may be given temperature (scalding as new-born, cold as deep sea), texture (silk-smooth, small-suckered, faint-scaled), pulse (rising and falling like the living), and cunning (winding at the most sensitive places on purpose). And tentacles as non-human sexual partners can transcend all limits of the human body — may occupy innumerable places at once, may vary thickness to any depth, may without regard for the other's will or wish give millimeter-precise responses. In tentacle erotica as a distinctive subgenre, this fantasy has a very rich narrative tradition to explore, from Japanese classical shunga to modern Western tentacle romance, with much fine work."},r:{zh:"现实中仅能以器具作近似模拟（多头玩具、触手造型的柱状物），但远远无法呈现文字之中的极致画面。",en:"Reality only offers implement approximations (multi-headed toys, tendril-shaped shafts), which very far fail to render the words' extremity."},b:{zh:"文字演绎不设上限——深度、数量、过分程度、时长，由幻想者自由指定；本套牌可提供详细的书写协作。",en:"Written performance has no upper limit — depth, number, degree of excess, duration — the imaginer's choice; the deck offers extensive writing collaboration."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"兽形",en:"Beast Form"},l:"Bestia",p:{zh:"发箍上的耳朵一戴，尾饰一佩（内塞式或腰带式皆可），人便暂时卸下人形——成为一只会撒娇、会呜咽、会以脸颊蹭人掌心的小兽。兽形扮演的可玩性极高：猫的傲慢（时而亲近时而漠视，被摸时喉间发出满足的震动）、犬的黏人（尾巴不受控制地摇摆，追随主人的每一步）、兔的敏感易惊（一有响动便竖起耳朵瑟瑟发抖）、狐的狡黠勾人（那种半人半兽的、带着算计的媚态）。每一种都是不同的性格剧本，可以深度探索。而尾饰的存在——尤其是内塞式尾饰——会为整个体验添加一份物理层面的持续存在感：每一次落座、每一次走动、每一次姿势变换，那份尾饰的存在都会成为提醒。此档随时可行，道具唾手可得——网上有大量精美的耳朵尾巴售卖，甚至有全套的兽装（fursuit）文化。而此格真正的红线只有一条，写明：任何涉及真实动物的行为，绝对、永远、不行——扮演的对象是人对兽的模仿，绝非真实的兽。",en:"Once the ears clip on and the tail piece hooks on (internal or belted), the human shape is temporarily set aside — becoming a small beast that will nuzzle, whimper, rub a cheek against a palm. The playability of beast-form is high: cat's hauteur (now close, now indifferent, throat-vibrating in contented content when touched), dog's clinginess (tail wagging out of control, following each of master's steps), rabbit's easily-startled sensitivity (ears up at any sound, all quiver), fox's sly seduction (that half-human, half-beast, calculating flirtation). Each is a different personality script and deeply explorable. And the tail piece's presence — especially the internal type — adds a physically sustained sense of presence: every sit, every walk, every change of posture, that tail piece's presence becomes reminder. This entry is always available, its props readily obtainable — many fine ears and tails are sold online, and there is even a whole fursuit culture. And this entry's one true red line is written clear: any behavior involving real animals is absolutely, always, never — the object of the role-play is a human's imitation of a beast, not a real beast."},r:{zh:"扮演可行；任何涉及真实动物的一切行为绝对禁止——这是法律、道德、以及基本人性的三重红线。",en:"Role-play is fine; any action involving real animals is absolutely forbidden — this is the triple red line of law, ethics, and basic humanity."},b:{zh:"耳与尾的扮演档随时可玩——猫娘、犬奴、兔娘、狐妖，任选其一；深度沉浸的角色扮演亦可结合周末人格条目进行。",en:"Ears-and-tail play is available any time — catgirl, dog-slave, rabbit-girl, fox spirit, choose one; deep-immersion role-play may be combined with the \“A Weekend as Another\” entry."},m:{zh:"部分可玩",en:"partly playable"}},
{t:4,n:{zh:"产卵",en:"Egg-Laying"},l:"Ova",p:{zh:"一颗颗温热圆润的卵被缓缓送入身体深处——每一颗都比上一颗略大一些，穴道被迫接纳、扩张、又在下一颗到来之前尚未完全恢复。小腹一点点被填出弧度，鼓鼓的、沉甸甸的，像藏着一整窝秘密。此幻想的核心是极致的被填满——超越单一柱身的填满，是无数小型物件填满整个腹腔的胀满感——再加一点背德的、非人的、生殖性的想象。文字中，那份被反复填充、身体如同容器般承接的画面可以书写至极致的过载——从第一颗卵的期待、到中间过程的胀满逐渐超出承受、到最后一颗卵进入时腹部的显著隆起，每一个阶段都有独特的心理与身体反应。市面上确有明胶材质的专用器具可作模拟（可食用明胶制的假卵，配合专门的产卵器可以体验类似过程），但材质的选择（食品级明胶、软硅胶）、尺寸的把控（从小至大的渐进）、以及卫生的维护都需要专业知识。文字版本则没有这些限制：产卵的全过程、卵在体内的重量、时间的流逝、乃至幻想中卵的孵化，皆可书写至极尽细节。",en:"Warm, round eggs one at a time slowly delivered to the deep of the body — each slightly larger than the last, the passage forced to accept, dilate, and not fully recover before the next arrives. The belly is gradually filled into an arc, swollen, weighted, as if hiding a whole clutch of secrets. This fantasy's core is a filling-taken-to-extreme — beyond the fullness of any single shaft, it is the swollen-fullness of countless small objects filling the whole belly cavity — plus a slightly-forbidden, non-human, reproductive imagination. In words, the image of being repeatedly filled, the body as vessel receiving one after another, may be written to extreme overload — from the anticipation of the first egg, to the middle where the fullness gradually exceeds bearing, to the notable arc of belly at the entrance of the last, each stage has its distinctive psychic and bodily response. There are gelatin-material purpose-made implements on the market to model this (edible-gelatin egg-facsimiles used with a dedicated laying implement), but material choice (food-grade gelatin, soft silicone), size management (small-to-large progression), and hygiene maintenance all demand specialized knowledge. The written version has no such limits: the whole process of laying, the weight of eggs within the body, the passage of time, even the imagined \“hatching\” — all may be written to exhaustive detail."},r:{zh:"器具模拟须严格把控材质（食品级）、尺寸（渐进）、卫生（专用）；不适立即终止。",en:"Implement models must strictly control material (food-grade), size (progressive), hygiene (dedicated); on discomfort, stop at once."},b:{zh:"文字版本可写至极尽详细——过程、感受、时间、余韵，皆可深入书写。",en:"Written version may be as detailed as desired — process, sensation, time, aftertaste, all may be written deeply."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"魔物",en:"Demon"},l:"Daemon",p:{zh:"祂的体温比人低（冰凉如深渊之水），或高得如同发烧（炽热如岩浆之核）；祂的尺寸不讲道理（远超人类可承受的极限）；祂的瞳孔是竖的，随情绪伸缩；祂的尾巴会自行缠上腿弯，如活物一般探索身体的每一寸；祂说话的方式不通过喉咙，声音直接落在颅骨内侧，绕过耳朵直达神经。非人存在的扮演玩的是规则之外——人类的道德、体力、生理限制对祂一概无效；人类的语言、意愿、抵抗对祂而言可有可无。于是臣服于祂便有了一种献祭般的甜美——因为这份臣服不是屈辱，而是我把自己交给一个更高的存在的仪式。而魔物的非人特质会突破一切人类身体的物理限制：可以令身体承受不可能的深度与尺寸，可以令感官承受超越平日的过载，可以令时间在魔物的意愿下扭曲变形。此格与角色扮演接壤，可玩性极高——自召唤阵起笔（画法、咒语、代价），至被拖入契约为止（血契的深度、灵魂的抵押），全部可展开。",en:"Its temperature is lower than a human's (cold as deep-abyss water), or higher-as-fevered (scalding as core of magma); its dimensions defy reason (far beyond what a human may bear); its pupils are vertical, dilating with mood; its tail winds itself around the crook of the knee, exploring every inch of the body as if alive; the way it speaks does not use a throat, the sound falls directly at the inside of the skull, bypassing the ear and reaching the nerve. Role-play of non-human beings plays outside-the-rules — human morality, endurance, and physiological limits do not apply to it; human language, will, and resistance are as-may-be to it. So yielding to it takes on an offering's sweetness — because this yielding is not humiliation but the ritual of \“I hand myself to a higher existence.\” And the demon's non-human traits will transcend every physical limit of the human body: may make the body bear impossible depths and dimensions, may make the senses bear an overload beyond ordinary, may make time distort under the demon's will. This entry borders on role-play, its playability high — from the summoning circle at the pen (the method, the incantation, the cost) to being dragged into the compact (the depth of the blood-oath, the pawning of the soul), the whole may be developed."},r:{zh:"纯设定演绎——无实体接触的物理风险，但角色的深度沉浸可能带来心理层面的复杂反应。",en:"Pure written performance — no physical contact risk, but deep immersion of role may bring complex psychic response."},b:{zh:"与角色扮演条目连用（尤其周末人格），自设定至契约皆可深度展开；本套牌可提供协作书写。",en:"Combine with role-play entries (especially \“A Weekend as Another\”), from setting to compact all may be developed deeply; the deck offers writing collaboration."},m:{zh:"文字可玩",en:"writably playable"}},
{t:4,n:{zh:"胀满",en:"Distension"},l:"Inflatio",p:{zh:"被灌至小腹微微隆起、内里满得一晃便能清晰感知——此程度的想象与玩法是安全的：多次射入的自然累积（女性向），或温水器具的轻度模拟（专用玩具可温和地注入少量温水制造胀满感）。这种轻度胀满感其实心理层面的满足远大于生理层面——那份被填满至身体略微改变形状的感受承载着深沉的占有与被占有的情感意义。文字中，那份腹如临产之期的画面——身体成为对方留下之物的完整容器，那份满盈到从体表都可见的证据——可以书写至令人喘息。但此格的极端版本——大量液体或气体的真实注入以致腹部显著隆起——是肠穿孔、腹腔破裂、以及电解质紊乱（大量水分强行进入体腔会打乱身体的水盐平衡）的直路。人体腹腔并非可任意扩张的容器，超过一定量的强行注入会造成即时的、不可逆的组织损伤。那条线绝对不越。轻度的满，可尽情玩；极端的胀，只留给文字。文字之中，可以写至腹如临产之期，可以写至身体已成盛器——那是幻想的自由。",en:"Filled until the belly slightly rises, the interior full enough to be sensed at a shake — this level of imagination and play is safe: natural accumulation of multiple releases (femme version), or light modeling by warm-water implement (dedicated toys can gently introduce a small amount of warm water to produce a distension sensation). This light distension's psychic satisfaction far exceeds the physical — the sensation of \“filled to a slight change in the body's shape\” carries the deep symbolism of possession and being possessed. In words the image of \“a belly like ripe with child\” — the body as complete vessel of what the other has left, that fullness at the surface visible as evidence — may be written to a breath-taking pitch. But the extremity of this entry — the true infusion of great volumes of liquid or gas to distinct belly distension — is the direct route to bowel perforation, abdominal rupture, and electrolyte disturbance (large volumes of water forced into the body cavity disturb the water-salt balance). The abdominal cavity is not a freely-expandable vessel; forced infusion beyond a certain amount causes immediate irreversible tissue damage. That line is absolute. The light full may be enjoyed to the full; the extreme distension is left to words. In words, one may write to a belly as ripe as full-term, may write to the body wholly become vessel — that is fantasy's freedom."},r:{zh:"大量真实注入将致肠穿孔、腹腔破裂、以及严重电解质紊乱——即便一次也可能致命。",en:"Real infusion of large volume will bring bowel perforation, abdominal rupture, severe electrolyte disturbance — even once may be lethal."},b:{zh:"轻度模拟可行（少量温水、多次射入的自然累积）；极端版本仅限文字之中。",en:"Light modeling is fine (small volume warm water, natural accumulation of releases); extreme version only in words."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"阉割意象",en:"Castration Image"},l:"Castratio",p:{zh:"心理阉割玩的是语言暴力的最深处——将对方的性征、尊严、主导权在言语之中一寸寸碾碎：废物、不许硬、没资格、你这辈子都不会有、连使用你自己身体的权利都没了。纯语言层面的此档，配合贞操锁与高潮管理条目，是权力交换的经典组合——它触及自我认同的核心，其心理效果远超单纯的身体控制。当身体的性征被反复以语言否定，即便理智知道那只是言语，潜意识仍会在长期的重复中被塑造——这正是此类玩法的力量所在，也是其需要谨慎使用的原因。此局中受言者往往会在某个瞬间真正相信自己的无价值——那份短暂的、彻底的自我否定构成本局的高峰体验，也构成事后需要认真照护的心理状态。而任何真实的物理操作皆不可逆——手术性阉割是永久性的、灾难性的、且法律层面完全无法界定知情同意的行为，想都不必想。故此格的刀永远以话语铸成：够锋利，能割入骨髓，但一旦事毕能收得回来。",en:"Psychic castration plays at the deep of language-violence — the other's sexual traits, dignity, and initiative, in language, are ground down inch by inch: worthless, may not be hard, do not qualify, will not have any of it in this lifetime, do not even have the right to use your own body. This tier played purely in language, combined with chastity and climax-control, is a classic power-transfer combination — it touches at the core of self-identity, and its psychic effect far exceeds physical control alone. When the body's sexual trait is repeatedly negated by language, even when the reason knows it is only language, the subconscious will be shaped in the long repetition — that is precisely the power of this play, and precisely why it needs careful use. In this scene the receiver of the words will, at some moment, truly believe their own worthlessness — that brief, total self-negation is the scene's summit and the psychic state after which requires serious after-care. And any real physical operation is irreversible — surgical castration is a permanent, catastrophic, and in law wholly-un-\“informed-consent\”-definable act, not to be considered. So this entry's blade is forever forged of words: sharp enough to cut into bone, but taken back when the deed ends."},r:{zh:"任何真实操作皆不可逆——包括任何形式的绝育手术、化学阉割、或其他物理性干预。",en:"Any real operation is irreversible — including any sterilization surgery, chemical castration, or other physical intervention."},b:{zh:"语言层面配合贞操条目可行——那份心理效果强大而深远；真实操作永远不存在。",en:"Combining language-tier with chastity is workable — psychic effect strong and long; real operation is never possible."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"伪逆之局",en:"Rape-Play"},l:"Sine consensu",p:{zh:"完整的强迫剧本：挣扎是剧情的一部分，不要是既定的台词，被压制、被夺取、被违逆意愿地贯穿的全过程皆在事前协议之内。它是信任的极限运动——正因为每一秒都可以用安全手势叫停（且叫停会真的立即被执行），那种被真正夺走的失控感才能被安全地体验。它探索的是一种最深的信任：把自己完全交给对方，包括交给对方去侵犯自己的权力——而对方将带着更深的爱与克制承接这份交付。这份剧本的深处，触及的是关于自主权与臣服的最古老的心理原型——那份完全放下防御、允许自己被夺走的体验，是很多人一生难得的深度释放。剧情之中，越是激烈的挣扎，越是强烈的反抗，越是撕心裂肺的求饶，反而是心理层面越深的信任表达——因为唯有绝对信任对方会在正确的信号下立即停止，才能真正投入这般深度的表演。但其准备工作与施行时长等长：何种具体行为许可、何种词语是真的停止（区分于剧情中的不要）、哪些身体部位不得触碰、事后如何进行长时间照护——须以一整个下午的时间谈透。谈透了，此格可行，且会成为二人关系中极深的一次亲密。",en:"Complete forced script: struggle is part of the plot, \“no\” is set dialogue, the whole process of being subdued, taken, run through against will is inside the pre-agreement. It is trust's extreme sport — precisely because every second may be halted by a safety hand-signal (and the halt truly and immediately executed), that sensation of \“being truly taken away\” of loss of control may be safely experienced. What it explores is a deepest form of trust: hand oneself wholly to the other, including handing the other the power to \“violate\” oneself — and the other will carry with deeper love and restraint. In the depth of this script it touches upon oldest psychic archetypes about autonomy and yielding — that experience of putting down all defense and permitting oneself to be taken away is a deep release many will not have in a lifetime. In the plot, the more fierce the struggle, the more intense the resistance, the more heart-rending the pleading, the psychically deeper the trust-expression — because only absolute trust that the other will stop at the right signal permits such deep-plunging performance. But its preparation and execution are of equal length: which specific behaviors permitted, which words are the true stop (as against the plot's \“don't\”), which body parts not to touch, how the after-care will proceed for a long time — must be talked through with a whole afternoon. Talked through, this entry is workable, and will become a deep intimacy in the relationship."},r:{zh:"须极详尽的事前协商、真正的安全手势（区分于剧情台词）、以及长时间的事后照护（不少于三小时）。",en:"Requires extremely detailed prior negotiation, a real safety hand-signal (distinguished from lines in the plot), and long after-care (not less than three hours)."},b:{zh:"协商完备者可行——这将成为二人信任的最高级证明；未协商完备者、临时起意者，绝对禁止。",en:"Fully negotiated, workable — this will become the highest-level proof of the two's trust; incompletely negotiated, on impulse — absolutely forbidden."},m:{zh:"需长谈",en:"long conversation required"}},
{t:4,n:{zh:"药眠",en:"Drugged Sleep"},l:"Somnus gravis",p:{zh:"清醒版的眠中之约——事先约定、半梦半醒之间进入、随时可醒来叫停——已列于专家条目眠中之约之中，是可行的、探索性质的玩法。此格所指为其极端变体：药物介入导致的完全无意识状态。区别是本质性的：前者是约定好的暧昧游戏，参与者虽在梦中但仍保有基本意识与叫停能力；后者是彻底剥夺对方的说停能力，令其陷入完全无自主意识的状态。这一区别不是程度上的，而是性质上的——完全无意识意味着连身体的最基本自我保护机制（如疼痛反射、窒息反射）都可能被抑制，任何意外都无法通过对方的自主反应及时发现。任何以致人失去意识为目的的药物使用皆为犯罪（无论对方事前是否同意——法律不承认对失去意识状态的同意），且这些药物本身的过量使用可能直接致死，长期使用可造成永久性脑损伤。答案很短：清醒版随时可行，药物版永远不存在。",en:"The waking version of \“Sleeping Assent\” — pre-agreed, half-in-dream half-in-wake, any-time-stop-able — has been listed in the Advanced tier as \“Sleeping Assent,\” a workable exploratory play. This entry refers to its extreme variant: full unconsciousness induced by drug. The difference is essential: the former is an agreed ambiguous game, the participant in dream but retaining basic consciousness and stop-capacity; the latter completely strips the other's capacity to say stop, casting them into a wholly non-autonomous state. This is not a difference of degree but of kind — total unconsciousness means even the body's most basic self-protective mechanisms (like the pain reflex, the choking reflex) may be suppressed, and any accident cannot be discovered timely through the other's autonomous response. Any drug use aimed at making a person lose consciousness is a criminal act (whether or not the other agreed in advance — the law does not recognize consent in the loss-of-consciousness state), and overdose of these drugs may directly kill, long-term use may cause permanent brain damage. The answer is short: the waking version is available any time, the drugged version does not exist ever."},r:{zh:"任何致人失去意识的药物使用皆为犯罪；且药物本身的过量使用可致死或永久脑损伤。",en:"Any drug use aimed at loss of consciousness is a criminal act; drug overdose itself may kill or cause permanent brain damage."},b:{zh:"清醒版本参见专家条目眠中之约——是可安全探索的类似体验；药物版本永远不存在。",en:"For the waking version see the Advanced entry \“Sleeping Assent\” — that is the safely explorable analogous experience; the drugged version does not exist."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"药物",en:"Substance"},l:"Venenum",p:{zh:"春药在小说里是万能开关——一片入口，整晚欲火焚身；一滴入酒，理智即刻退场。现实之中它是化学骗局：网上购得之物成分不明、剂量不明、来源不明；吞下的可能是安慰剂（大部分情况），可能是普通兴奋剂（副作用剧烈），可能是滥用类精神药物（有成瘾风险），也可能是危险药物（急诊室的门票）。且即便成分确认，个体差异令同一剂量对不同人的效果可能天差地别——所谓的春药效果无法预测，更无法控制。真正欲求被点燃的效果？其实有天然手段：漫长的前戏（不少于一小时的挑逗）、边缘控制（多次寸止累积能量）、数日的禁欲（让身体自己积攒欲望）——这些天然方法的效力胜过任何可疑药片，且醒来没有代价、不损伤肝肾、不产生依赖。而且，通过天然手段积攒的欲望更纯粹，更专注于对方而非药物本身，更能加深关系。本清单之中，酒精之外一概不用；酒精亦须节制（一杯到微醺为宜，超过则丧失判断力）。",en:"Aphrodisiacs in novels are magic switches — one tablet, whole-night fire; one drop into drink, reason instantly leaves. In reality they are chemical scam: what one buys online is of unknown composition, unknown dose, unknown provenance; what is swallowed may be a placebo (most of the time), may be an ordinary stimulant (with fierce side effects), may be an abused psychiatric drug (with dependence risk), may be a dangerous drug (a ticket to the emergency room). And even if composition is known, individual variance means the same dose can differ enormously between persons — the so-called \“aphrodisiac effect\” cannot be predicted, still less controlled. Real desire for \“being ignited\”? There is in fact natural means: long foreplay (not less than an hour of teasing), edging (multiple withholds accumulating charge), a few days' abstinence (letting the body build up desire itself) — these natural means' potency defeats any suspect tablet, waking with no cost, no liver-and-kidney damage, no dependence. And desire built by natural means is purer, more focused on the other and not on the substance itself, and better deepens the relation. In this list, other than alcohol, none used; alcohol used with restraint (a glass, to slightly tipsy, is appropriate; beyond, judgment is lost)."},r:{zh:"来源不明之物入口，后果不可预测——从无效到致死之间任何可能都存在。",en:"An unknown thing swallowed, consequence unpredictable — anywhere from ineffective to lethal is possible."},b:{zh:"酒精之外一概不用；酒精的使用亦须节制在微醺以内——超过则本局无效，因不存在清醒的同意。",en:"Other than alcohol, none used; alcohol itself used in moderation to \“tipsy\” — beyond, the scene is void, because no sober consent obtains."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"掳掠剧本",en:"Abduction"},l:"Raptus",p:{zh:"自背后被捂住口鼻拖入黑暗——那一记突袭时肾上腺素的爆发，挣扎间被牢牢制住的无力感，被缚住手脚塞入车中的窒息感，醒来时身处陌生房间的绝望感——掳掠剧本是伪逆之局的场景化极致版本，恐惧与肾上腺素是它的主菜。于室内演绎，完全可行——门一关，自玄关的袭击开始，全屋皆是舞台：预先约定好路线、约定好各个关键节点、约定好安全手势。伴侣扮演的陌生人的手却是熟悉的，那份熟悉与陌生的交叠创造出独特的心理张力——理智知道这是伴侣，本能却在剧情的推动下真实地反应，这种双重体验只有此格能提供。而剧情越是逼真，那份被夺走的失控体验就越接近想象中的极致。但将其搬入公共空间是完全另一回事：路人看到会真的报警（且报警之后即便解释清楚，被记录在案的可能性也不能忽略），挣扎中会真的出意外（跌倒骨折、失控伤人），解释不清时的后果全是真的（治安拘留、影响履历、乃至刑事记录）。",en:"From behind, mouth-and-nose covered, dragged into the dark — that adrenaline burst at the moment of ambush, the powerlessness of being pinned during struggle, the suffocation of being tied at the hands and feet and thrust into a car, the despair of waking in a strange room — the abduction script is a scenario-extremity version of the \“Rape-Play\” entry, and dread and adrenaline are its main course. Performed indoors, entirely workable — close the door, begin at the entryway with the ambush, and the whole house is a stage: routes pre-agreed, key nodes agreed, safety signal agreed. The stranger role played by the partner is a familiar hand, and that overlay of the familiar and the strange creates a peculiar psychic tension — the reason knows it is the partner, the instinct under the plot's push responds truthfully, and this dual experience only this entry can provide. And the more real the plot, the closer the being-taken-away experience approaches the imagined extreme. But to move it into public space is another matter entirely — a bystander will really call the police (and even after everything is explained, the chance of being logged is not negligible), a real accident in the struggle (falling to a broken bone, injuring another out of loss of control), an inability to explain, and the consequences are all real (custody, career impact, even a criminal record)."},r:{zh:"公共空间的掳掠扮演可致真实的报警、真实的事故、真实的法律后果——任何一项都足以毁掉一段关系。",en:"Abduction role-play in public space may cause real police call, real accident, real legal consequence — any of which suffices to ruin a relationship."},b:{zh:"室内演绎可行——全屋可作舞台，情节可极致戏剧化；户外一律禁止。",en:"Indoor performance is workable — the whole house as stage, the plot may reach a dramatic extreme; outdoor, one and all forbidden."},m:{zh:"室内可玩",en:"indoor-playable"}},
{t:4,n:{zh:"长期囚禁",en:"Long Captivity"},l:"Carcer",p:{zh:"被关数日、与世隔绝、完全依附于一人——囚禁幻想的引力在于绝对的依赖：饮食、光线、自由、乃至基本的生理需求，全部经由一双手。文字中，那份完全被切断与外界连接、生存所需的一切都必须通过对方获得的场景，承载着极深的臣服与依附意象。数小时的版本可行：一个下午的囚室（如以密室、如以束缚固定于特定位置），束缚、定时送水、规定的放风时间——这种短时体验充满仪式感与心理张力，能提供囚禁幻想的核心体验（依附感、被剥夺自由、完全的信任交付）而无长期风险。但以天计的真实囚禁会碾过身体的多重底线：脱水（长时间限水）、深静脉血栓（长时间不活动）、压疮（长时间同一姿势）、肌肉萎缩（数日不动即可开始）；心理层面的损伤更为深远——真实的隔离与依附关系可能触发或加剧解离、依赖症、以及斯德哥尔摩综合症样的复杂情感反应。牢笼可以是游戏，但钥匙须每晚回到被囚者手中。",en:"Locked away days, cut off from the world, wholly dependent on one — the imagination of captivity's pull lies in absolute dependence: food, light, freedom, and even basic bodily needs, all pass through a pair of hands. In words, the scene of being completely severed from all outward contact, everything for survival going through the other, carries deep symbolism of yielding and dependency. The hours-long version is workable: an afternoon's cell (by lockable room, by binding to fix in a specific place), binding, timed water delivery, prescribed \“exercise time\” — this short-form experience has ritual and psychic tension, and provides the captivity fantasy's core (dependence, being deprived of freedom, complete trust-delivery) without long-term risk. But real captivity measured in days will crush multiple bodily thresholds: dehydration (long water restriction), deep vein thrombosis (long immobility), pressure sores (long same-posture), muscle atrophy (days without motion can begin). Psychic damage is more far-reaching still — the isolation-and-dependency relation may trigger or worsen dissociation, dependence-illness, and Stockholm-syndrome-like complex emotional responses. The cage can be the game, but the key must return each evening to the hand of the captive."},r:{zh:"心理创伤、脱水、血栓、肌肉萎缩、压疮；心理层面的隐性损伤可能在事后数月才开始显现。",en:"Psychic trauma, dehydration, thrombosis, muscle atrophy, pressure sores; hidden psychic injury may only surface months after the event."},b:{zh:"数小时可行（一个下午、一个晚上）；数日一律禁止；每次施行后须有充分的重新连接时间。",en:"Hours-long workable (an afternoon, an evening); days-long forbidden; each round requires ample reconnection time after."},m:{zh:"仅限幻想",en:"fantasy only"}},
{t:4,n:{zh:"人体家具",en:"Human Furniture"},l:"Supellex",p:{zh:"跪伏成一张矮几，背上置一盏茶——另一人于旁读书，偶尔端起啜一口，从头至尾不看一眼，仿佛那真的只是一件家具。或成为脚凳（供另一人搁脚）、成为屏风（跪立不动阻隔某个方向的视线）、成为烛台（举着一根蜡烛保持静止）。物化扮演的战栗感恰来自这份被无视——存在，却不被作为人对待；被使用，却不被交流；提供功能，却不被给予情感回应。这份存在感的极致降低反而令服从者进入一种奇异的、几近于禅定的状态——注意力高度集中于保持姿势不动，思维反而彻底放空。而当被使用者渐渐忘记自己是人、真正沉浸于家具的角色时，那份从人的自我意识中暂时解脱的体验会带来一种独特的、类似冥想的宁静——这正是此格的深层吸引力。二十分钟以内，这是极有张力的心理游戏；越过此线，固定姿势将开始压迫神经（尤其膝盖、肩颈）、淤积血流（下肢静脉压力增加）。故茶几可以当，但每二十分钟，这件家具须被抱起来揉一揉膝盖。",en:"Kneel-flat as a low table, a cup of tea set on the back — another person reads on nearby, occasionally lifting the cup for a sip, and does not glance the whole time, as if it truly is a piece of furniture. Or become a footstool (for another's feet), or a screen (kneeling upright to block a direction of sight), or a candelabra (holding a candle and staying still). The shudder of objectification-role-play comes precisely from this being-ignored — one exists but is not treated as human; is used but not conversed with; provides function and receives no emotional response. This extremity-of-lowered-presence conversely brings the servant into a strange, near-meditative state — the attention high-focused on maintaining posture, the thought conversely emptied. And when the used one gradually forgets that they are human, truly immersed in the role of furniture, the experience of a momentary release from the human self-consciousness brings a distinctive, meditation-like quietness — this is precisely the deep charm of this entry. Within twenty minutes, this is a tense psychic game; past that, the fixed posture will begin to compress nerves (especially the knees, shoulders, neck), pool the blood (venous pressure in the lower limbs rises). So the tea-table may be played, but every twenty minutes this \“furniture\” must be picked up and have the knees rubbed."},r:{zh:"逾一小时的固定姿势将致神经压迫与静脉血栓风险——尤其中老年群体、循环不佳者禁忌。",en:"Fixed posture beyond one hour will produce nerve compression and venous thrombosis risk — especially forbidden for middle-aged and older, and those of poor circulation."},b:{zh:"二十分钟以内可行；每满二十分钟须起身活动至少五分钟；每次总时长不超过两小时。",en:"Under twenty minutes workable; every twenty minutes must rise for at least five minutes of activity; total each time not exceeding two hours."},m:{zh:"限时可玩",en:"time-limited playable"}},
{t:4,n:{zh:"彻底物化",en:"Total Objectification"},l:"Res",p:{zh:"此格的设定为：无名，无称谓，不被当人对待，彻底沦为一件物品被使用、被摆放、被存放。它与宠物扮演（仍有情感联结，仍被昵称）、人体家具（仍有短时的功能性存在）的区别在于程度——后两者剥去的是体面，此格剥去的是人格本身。长时间的彻底去人格化对依恋、自我认同、以及关系的深层结构冲击极大；事后修复成本远超一般条目，且往往在结束后数日至数周才开始显现——那种我是不是不再是我的存在性质疑一旦触发，需要长时间的心理支持才能重建。而这份重建过程本身充满风险——因为它触及的是自我认同的根基，而这份根基一旦动摇，很多其他领域的心理稳定性也会受到连带影响。这不是危言耸听，而是长期从事此类玩法的社群中反复报告的现象。此格的心理风险远超其生理风险，故本套牌不收录其完整实操版本——若欲体验物化感，建议以限时人体家具或完整宠化条目替代。",en:"This entry's setting is: no name, no address, not treated as human, wholly reduced to an object to be used, arranged, stored. What separates it from pet-play (still emotional connection, still with a pet name) and human-furniture (still with a short functional presence) is the degree — the latter two strip away decorum, this strips personality itself. Long-term total de-personalization impacts attachment, self-identity, and the deep structure of the relation heavily; the cost of after-repair far exceeds ordinary entries', and often only begins to surface in the days to weeks after the scene closes — the existential-quality doubt \“am I still me\” once triggered requires long psychological support to rebuild. And this rebuilding process itself is fraught with risk — because it touches the base of self-identity, and once that base is shaken, the psychic stability of many other domains too may be affected in cascade. This is not alarmism; it is a phenomenon repeatedly reported in the long-term-practitioner community. Its psychic risk far exceeds its physical risk, and this deck does not include its full practical version — for those seeking the sensation of objectification, better to substitute with the time-limited human-furniture or complete-petification entries."},r:{zh:"心理风险远大于生理风险；创伤常延迟显现（数日至数周之后）；对既有关系的信任基础可能造成长期影响。",en:"Psychic risk far exceeds physiological risk; trauma often delayed (days to weeks after); may cause long-term impact on the existing relation's trust foundation."},b:{zh:"如欲体验物化感，以限时人体家具或完整宠化条目替代——那些是同类需求的安全表达。",en:"For those seeking objectification sensation, substitute with \“Human Furniture\” (time-limited) or \“Complete Petification\” — these are the safe expression of like desire."},m:{zh:"仅限幻想",en:"fantasy only"}}
];

/* ---------- starfield ---------- */
const sky=document.getElementById("sky"),ctx=sky.getContext("2d");
let stars=[],lines=[];
function skyInit(){
  sky.width=innerWidth;sky.height=innerHeight;
  stars=[];lines=[];
  const n=Math.min(150,Math.floor(innerWidth*innerHeight/9000));
  for(let i=0;i<n;i++){
    stars.push({x:Math.random()*sky.width,y:Math.random()*sky.height,
      r:Math.random()*1.3+.3,ph:Math.random()*6.28,sp:.4+Math.random()*1.1,
      hue:Math.random()<.16?"180,90%,75%":(Math.random()<.1?"268,80%,80%":"0,0%,92%")});
  }
  for(let c=0;c<4;c++){
    const pts=[];let px=Math.random()*sky.width,py=Math.random()*sky.height*.7;
    const k=3+Math.floor(Math.random()*3);
    for(let i=0;i<k;i++){pts.push([px,py]);px+=(Math.random()-.4)*170;py+=(Math.random()-.45)*150;}
    lines.push(pts);
  }
}
skyInit();addEventListener("resize",skyInit);
(function loop(t){
  ctx.clearRect(0,0,sky.width,sky.height);
  ctx.lineWidth=.5;
  lines.forEach(pts=>{
    ctx.strokeStyle="rgba(127,255,212,.10)";
    ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    pts.forEach(([x,y])=>{ctx.fillStyle="rgba(127,255,212,.35)";ctx.beginPath();ctx.arc(x,y,1.2,0,6.28);ctx.fill();});
  });
  stars.forEach(s=>{
    const a=.25+.75*Math.abs(Math.sin(t*.001*s.sp+s.ph));
    ctx.fillStyle="hsla("+s.hue+","+a+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();
  });
  requestAnimationFrame(loop);
})(0);

/* ---------- audio ---------- */
let AC=null,muted=false;
document.getElementById("mute").onclick=e=>{
  muted=!muted;e.target.textContent=muted?"∅":"♪";
  e.target.style.color=muted?"var(--mist-3)":"var(--t1)";
};
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function sndChime(tier){
  if(muted)return;const a=ac();
  const base=tier===4?392:tier===3?523:tier===2?587:659;
  [[base,0],[base*1.5,.14],[base*2,.26]].forEach(([fr,dt])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type="sine";o.frequency.value=fr;
    g.gain.setValueAtTime(0,a.currentTime+dt);
    g.gain.linearRampToValueAtTime(.16,a.currentTime+dt+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dt+1.1);
    o.connect(g);g.connect(a.destination);
    o.start(a.currentTime+dt);o.stop(a.currentTime+dt+1.2);
  });
}

/* ---------- particles ---------- */
function burst(el,hex,n){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.className="star-p";s.textContent=Math.random()<.5?"✦":"✧";
    s.style.color=hex;s.style.textShadow="0 0 8px "+hex;
    s.style.left=cx+"px";s.style.top=cy+"px";
    const ang=Math.random()*6.28,dist=60+Math.random()*110;
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",Math.sin(ang)*dist-30+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

/* ---------- dice build ---------- */
const pyr=document.getElementById("pyr");
function paintPyr(tier){
  const t=T[tier];
  pyr.querySelectorAll(".pface").forEach(f=>{
    f.style.setProperty("--fc0",t.f0);
    f.style.setProperty("--fc1",t.f1);
    f.style.setProperty("--fc2",t.f2);
  });
  document.getElementById("pod1").style.setProperty("--pg",t.g);
}
paintPyr(1);

const d2=document.getElementById("d2");
function pips(n){
  const L={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],
  4:[[27,27],[73,27],[27,73],[73,73]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],
  6:[[27,23],[73,23],[27,50],[73,50],[27,77],[73,77]]};
  return '<svg viewBox="0 0 100 100">'+L[n].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="7.5" fill="currentColor"/>').join("")+'</svg>';
}
for(let i=1;i<=6;i++){
  const f=document.createElement("div");
  f.className="cface cf"+i;f.innerHTML=pips(i);
  d2.appendChild(f);
}
const SHOW6={1:[0,0],2:[0,-90],3:[0,180],4:[0,90],5:[-90,0],6:[90,0]};
let pyrRot=[0,0],d2Rot=[0,0];

function spinPyr(face){
  const targetY=-(face-1)*90;
  const ny=Math.ceil((pyrRot[1]+720)/360)*360+targetY+360*(1+Math.floor(Math.random()*2));
  const nx=pyrRot[0]+360*(2+Math.floor(Math.random()*2));
  pyr.style.transform="rotateX("+nx+"deg) rotateY("+ny+"deg)";
  pyrRot=[nx,ny];
}
function spinCube(face){
  const[tx,ty]=SHOW6[face];
  const nx=Math.ceil((d2Rot[0]+720)/360)*360+tx+360*(1+Math.floor(Math.random()*2));
  const ny=Math.ceil((d2Rot[1]+720)/360)*360+ty+360*(1+Math.floor(Math.random()*2));
  d2.style.transform="rotateX("+nx+"deg) rotateY("+ny+"deg)";
  d2Rot=[nx,ny];
}
pyr.style.transform="rotateX(0deg) rotateY(0deg)";
d2.style.transform="rotateX(0deg) rotateY(0deg)";

/* ---------- tiers ---------- */
const tiersEl=document.getElementById("tiers");
let picked=new Set([1,2]);
function paintTiers(){
  tiersEl.innerHTML="";
  [1,2,3,4].forEach(k=>{
    const b=document.createElement("button");
    b.className="tier";
    b.style.setProperty("--tc",T[k].c);
    b.style.setProperty("--tg",T[k].g);
    b.dataset.on=picked.has(k)?"1":"0";
    b.innerHTML='<span class="gem"></span><span class="rn">'+T[k].rn+'</span><span class="nm">'+T[k].nm[LANG]+'</span>';
    b.onclick=()=>{
      if(picked.has(k)){ if(picked.size>1) picked.delete(k); }
      else picked.add(k);
      paintTiers();
    };
    tiersEl.appendChild(b);
  });
}
paintTiers();

function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

let cur=null,timerId=null,history=[],busy=false;

function render(x){
  const t=T[x.t];
  const slot=document.getElementById("slot");
  const isHell=x.t===4;
  const ruleBlock=isHell
    ?'<div class="warnbox"><dt>'+I18N["sec-hell"][LANG]+'</dt><dd>'+x.r[LANG]+'</dd></div>'
    :'<div class="sec"><dt>'+I18N["sec-regula"][LANG]+'</dt><dd>'+x.r[LANG]+'</dd></div>';
  slot.innerHTML=
    '<div class="card'+(isHell?' hell':'')+'" style="--ac:'+t.c+';--ag:'+t.g+'">'+
      '<i class="c-corner tl"></i><i class="c-corner tr"></i><i class="c-corner bl"></i><i class="c-corner br"></i>'+
      '<div class="c-top">'+
        '<div class="c-num">'+I18N["no"][LANG]+String(D.indexOf(x)+1).padStart(3,"0")+'</div>'+
        '<div><span class="c-tier">'+t.nm[LANG]+' &middot; '+t.rn+'</span></div>'+
        '<div class="c-name">'+x.n[LANG]+'</div>'+
        '<div class="c-latin">'+x.l+'</div>'+
      '</div>'+
      '<div class="c-div"><span></span></div>'+
      '<div class="sec"><dt>'+I18N["sec-ludus"][LANG]+'</dt><dd>'+x.p[LANG]+'</dd></div>'+
      ruleBlock+
      '<div class="sec"><dt>'+I18N["sec-merces"][LANG]+'</dt><dd>'+x.b[LANG]+'</dd></div>'+
      '<div class="c-foot">'+
        '<span class="dur">'+I18N["dur-label"][LANG]+' <i>'+x.m[LANG]+'</i></span>'+
        '<span class="tm" id="tm"></span>'+
        '<button class="tbtn" id="tbtn">'+I18N["tm-start"][LANG]+'</button>'+
      '</div>'+
    '</div>';

  const mins=(x.m.zh.match(/(\d+)\s*分钟/)||[])[1];
  const tb=document.getElementById("tbtn");
  if(!mins){ tb.remove(); }
  else{
    let left=parseInt(mins)*60,run=false;
    const tm=document.getElementById("tm");
    tm.textContent=fmt(left);
    tb.onclick=()=>{
      if(run){ clearInterval(timerId);run=false;tb.textContent=I18N["tm-resume"][LANG]; return; }
      run=true;tb.textContent=I18N["tm-pause"][LANG];
      clearInterval(timerId);
      timerId=setInterval(()=>{
        left--;tm.textContent=fmt(left);
        if(left<=0){clearInterval(timerId);tm.textContent=I18N["tm-done"][LANG];tb.textContent=I18N["tm-start"][LANG];run=false;}
      },1000);
    };
  }
}

const hint=document.getElementById("hint");
function draw(){
  if(busy)return;
  busy=true;
  clearInterval(timerId);
  const btn=document.getElementById("draw");
  btn.disabled=true;
  pyr.classList.remove("lit");
  const slot=document.getElementById("slot");
  const oldCard=slot.querySelector(".card");
  if(oldCard){oldCard.style.transition="opacity .3s";oldCard.style.opacity="0";setTimeout(()=>slot.innerHTML="",300);}

  const pool=D.filter(x=>picked.has(x.t));
  let x=pool[Math.floor(Math.random()*pool.length)];
  if(cur&&pool.length>1&&x===cur) x=pool[(pool.indexOf(x)+1)%pool.length];

  const idxInTier=D.filter(y=>y.t===x.t).indexOf(x);
  const dieNum=1+(idxInTier%6);

  hint.textContent=HINTS_ROLL[LANG][Math.floor(Math.random()*HINTS_ROLL[LANG].length)];
  hint.style.color="var(--mist-2)";
  paintPyr(x.t);
  spinPyr(x.t);
  spinCube(dieNum);

  setTimeout(()=>{
    cur=x;
    pyr.classList.add("lit");
    sndChime(x.t);
    burst(pyr,T[x.t].hex,14);
    burst(d2,"#40E0D0",10);
    render(x);
    history.unshift(x);
    const log=document.getElementById("log");
    log.hidden=false;
    document.getElementById("loglist").innerHTML=history.slice(0,10).map(h=>
      '<li style="--lc:'+T[h.t].c+';--lg:'+T[h.t].g+'"><span class="dot"></span>'+h.n[LANG]+
      '<span class="lt">'+T[h.t].nm[LANG]+'</span></li>').join("");
    btn.disabled=false;btn.textContent=I18N["btn-again"][LANG];
    hint.textContent=HINTS_DONE[LANG][x.t];
    hint.style.color=T[x.t].hex;
    busy=false;
  },2100);
}
document.getElementById("draw").onclick=draw;

/* ---------- language switch ---------- */
function applyLang(){
  document.documentElement.setAttribute("lang",LANG);
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(I18N[k]) el.innerHTML=I18N[k][LANG];
  });
  const sw=document.getElementById("langsw");
  sw.dataset.lang=LANG;
  sw.querySelectorAll(".lbl").forEach(el=>{
    el.classList.toggle("on",el.dataset.langBtn===LANG);
  });
  paintTiers();
  // if a card is currently shown, re-render it in the new language
  if(cur){
    render(cur);
    // also re-render the log with new-language names
    document.getElementById("loglist").innerHTML=history.slice(0,10).map(h=>
      '<li style="--lc:'+T[h.t].c+';--lg:'+T[h.t].g+'"><span class="dot"></span>'+h.n[LANG]+
      '<span class="lt">'+T[h.t].nm[LANG]+'</span></li>').join("");
    // update the ending hint & button text if scene already drawn
    const btn=document.getElementById("draw");
    if(btn.textContent && !busy) btn.textContent=I18N["btn-again"][LANG];
    document.getElementById("hint").textContent=HINTS_DONE[LANG][cur.t];
  } else {
    // no card drawn yet — reset hint to default
    const hint=document.getElementById("hint");
    hint.innerHTML=LANG==="zh"
      ? "tolle et lege &mdash; 掷出，然后照做"
      : "tolle et lege &mdash; cast, then obey";
  }
}
document.getElementById("langsw").onclick=()=>{
  LANG = (LANG==="zh") ? "en" : "zh";
  applyLang();
};
applyLang();
</script>
