{t:2,n:{zh:"发情期设定",en:"Heat Setting"},l:"Aestus",p:{zh:"设定生效的一刻起，一方即为骤然进入发情期的 Omega——体温飙升，后颈的腺体开始胀麻发烫，信息素失控地自颈项外涌，全身皮肤敏感度倍增，双腿发软难以自持；而房间里唯一的 Alpha 就在眼前。须演至底：嗅到对方靠近时的战栗，被触碰颈项腺体时的哭腔，口中反复的、破碎的呓语——标记我、成结在里面、易感期救救我。Alpha 将掐住其后颈将人按至床上，掀开衣物，令其如发情动物般张开双腿；探入穴中时无需润滑，因为发情的身体早已濡湿到滴水；抽插节奏由缓转急，将人一路顶入易感期最深处；最后一口咬上后颈的腺体——牙齿刺穿皮肤的钝痛与穴道深处成结的胀满同时降临，标记完成，一切归于此人所有。此后整个发情期，唯此一位 Alpha 可近身。这份设定的极致沉浸感来自于它所调动的、几乎是动物性的本能——被信息素征服、被标记、被完全占有。",en:"From the instant the setting engages, one party is an Omega abruptly entered into heat — body temperature spiking, the gland at the nape flushed hot and swollen, pheromone spilling uncontrollably from the neck, all-over skin sensitivity redoubled, thighs weakening past the point of standing; and in the room the sole Alpha stands directly ahead. Play it to the ground: shudder on scenting the Alpha's approach, sob when the neck gland is touched, and repeat, in broken murmurs, \“mark me,\” \“knot inside,\” \“rut save me.\” The Alpha takes the nape in one hand and presses the person to the bed, opens their clothing, has the legs open like an animal in heat; entering the passage requires no lubricant because the heated body is already dripping wet; the tempo turns from slow to hard, driving the person to the deepest point of the vulnerable phase; finally, a bite at the nape gland — the blunt pain of teeth breaking skin arrives together with the full swell of a knot in the deep of the passage; the mark is set; everything belongs, now, to that person. For the remainder of the heat, no other Alpha may come near. The scene's extreme immersion pulls from those near-animal instincts it invokes — being conquered by pheromone, being marked, being wholly possessed."},r:{zh:"全程不得出戏；设定专有词汇（腺体、标记、成结、易感期）须自然运用不得回避。",en:"No breaking character throughout; the setting's proper vocabulary (gland, mark, knot, vulnerable phase) is required, unmasked."},b:{zh:"出戏一次，整个场景自开局重演；成功完成者，此后现实中对方享有为期一周的绝对优先权。",en:"On breaking character, the scene restarts from the opening; on successful completion, that person holds absolute priority for the next week's real-life negotiations."},m:{zh:"90 分钟",en:"90 min"}},
{t:2,n:{zh:"完整宠化",en:"Complete Petification"},l:"Canis",p:{zh:"项圈扣上、牵绳挂好的一刻，语言自服从方身上退场。此后两小时，其身份为一只宠物——具体是猫是犬由事先约定。四肢着地随行于主人脚边：主人行则行，主人停则停；主人于沙发上落座，宠物须于其脚边趴伏；主人翻书阅读，宠物须安静地靠在膝上；主人饮水，宠物须仰头等待主人以掌心接水喂饲。渴了低头舔碗中的水，饿了就食碗中切好的果物——碗须置于地上，不许上桌。有所求则以叫声、蹭动、轻咬裤脚、以及各种非语言的姿势表达。呜咽是撒娇，短吠是不满，把头拱入掌心是讨摸，翻身仰肚是彻底的信任与献媚。而在角色的深度沉浸中——尤其是被摸头、被夸一声乖、被拍拍屁股说去玩吧的时刻——那份自我尊严的暂时放下所换来的，是一种深至骨髓的松弛与被爱意，原始得吓人。",en:"The moment the collar closes and the leash clips on, language exits the sub. For the next two hours, their identity is a pet — cat or dog specified in advance. On four limbs by the master's foot: master walks, pet walks; master stops, pet stops. Master sits on the sofa: pet lies at the feet. Master reads: pet leans quiet against the knee. Master drinks water: pet lifts head and waits for master to serve water in the palm. Thirsty, lower the head and drink from the bowl; hungry, take cut fruit from the bowl — bowls on the ground, no table permitted. To request, use cries, rubs, gentle tug at the trouser leg, and various non-verbal postures. A whimper is a nuzzle; a short bark is displeasure; head burrowed into the palm is a plea to be petted; belly rolled up is total trust and offering. In the depth of the role — being stroked and told 'good,' having the rump patted with a 'go and play' — that momentary lay-down of self-dignity yields a bone-deep relaxation and belovedness so primitive it is a little frightening."},r:{zh:"全程不得说人话，任何语言表达皆判出戏；出戏一次，牵绳收短一半。",en:"No human speech throughout; any verbal expression is out-of-character; each break shortens the leash by half."},b:{zh:"表现优异者，事毕被抱上床安睡，主人为其洗澡、擦干头发、拥入怀中入眠。",en:"Exemplary performance: after the scene, is carried up to bed for sleep; master runs bath, dries hair, holds in arms into sleep."},m:{zh:"120 分钟",en:"120 min"}},
{t:2,n:{zh:"感官封锁",en:"Sensory Deprivation"},l:"Privatio",p:{zh:"眼罩挡去光线——一片纯粹的黑；耳塞塞入耳道——外界声音降至几近于无，只剩自己的心跳与呼吸声异常清晰；四肢以柔软的皮带缚于床的四角，令身体呈完全展开的大字形——无法防御，无法预判，无法躲避。世界瞬间收缩至只剩皮肤与想象。而后是等待。被封锁者不知对方身在房间何处，不知下一次触碰何时降临、落于何处——可能十分钟之内毫无动静，久到几乎怀疑对方是不是已经离开；也可能突然一根手指划过足心，惊得整个人不受控地弹起。在纯粹的黑暗与寂静之中，每一次等待被拉长十倍，每一次触碰被放大十倍——一片羽毛扫过腹部即是滔天洪水，两根手指探入穴中即是灭顶之灾。皮肤开始变得几近超能力般敏感——甚至能通过空气的微小流动察觉到对方的靠近，那份预感反而更为折磨。一小时之后，皮肤将成为全身最明亮的器官。",en:"Blindfold takes the light — a pure black, more thorough than closing the eyes because no light comes through the lids; earplugs go in, external sound falls to next-to-nothing, only heartbeat and breath abnormally clear; the four limbs soft-bound with leather to the bed's four corners, the body forced open into a full X — no defense, no anticipation, no dodge. The world contracts in an instant to skin and imagination. Then, waiting. The deprived does not know where the other is in the room, does not know when the next contact arrives or where it lands — possibly ten minutes with no motion whatsoever, long enough to half-believe the other has left; possibly a sudden finger across the sole of the foot, jerking the whole body up. In pure darkness and quiet, each waiting is drawn out tenfold, each contact amplified tenfold — a feather brushing the belly is a deluge; two fingers entering the passage is a cataclysm. The skin turns near-superhumanly sensitive — even, presently, sensing the other's approach through subtle currents in the air, and that presentiment is more agonizing still. After an hour, the skin will be the brightest organ of the whole body."},r:{zh:"触碰的时机与位置完全随机，不作任何预告；被封锁者不得出声询问。",en:"Timing and location of contact are wholly random with no announcement; the deprived may not ask."},b:{zh:"结束后须如实交代：这一小时里，几次以为对方已离开；每答一次以为，主导方吻其一处。",en:"After: honest reckoning — in that hour, how many times did you believe the other had left; each admission earns a kiss to one place."},m:{zh:"60 分钟",en:"60 min"}},
{t:2,n:{zh:"前后并进",en:"Both Passages"},l:"Duo",p:{zh:"前穴先纳入一根形状熟悉的器具，令其撑满穴道、抵在最熟悉的凹陷上——此时穴道深处已被填得实实的，穴口张至最开。而后服从方俯卧于床，臀部高抬。支配方倒足润滑液于后穴口——那种冰凉的液体一点点顺着股沟流淌至前穴口的触感本身即令人战栗——以一根手指贴着后穴口的褶皱缓缓画圈、按压、试探；那圈括约肌起初本能地抗拒，但在温柔的按摩之下慢慢放松，第一节指节缓缓探入。只用手指，不作他想——因为两条通道之间仅隔一层薄壁，探入者的指腹能隔着那层壁清晰摸到前方器具的形状、粗细、以及穴道每一次的收缩。前方被填满、后方被撑开的双重感受，将在体内叠加为一种从未体验过的、指数级的过载。而当探入者以另一只手同时刺激阴蒂时，三处刺激合成的快感几乎超出神经承受的极限，服从方会本能地想要蜷缩以求缓解却因姿势的限制而无法逃避。",en:"A familiar-shaped implement inserted into the front passage in advance, filling and pressing against the familiar hollow — the deep of the passage full, the entrance at maximum widening. Then face-down on the bed, hips lifted. The Dom pours ample lubricant on the entrance to the back — that cool liquid running from the entrance of the back down the perineum to the entrance of the front is itself shudder-inducing — and with one finger against the rear pucker circles, presses, tests slowly; that ring of muscle instinctively resists, but under gentle massage relaxes gradually and the first knuckle slips in. Only fingers, no more — because with the thin membrane between the two passages, the entrant's finger pads can feel with perfect clarity, through that wall, the shape of the front implement, its thickness, and the passage's every squeeze. The front full and the back opened, compound in the body into an unprecedented, exponential overload. And if the entrant works the clit with the other hand at the same time, the sum of three stimuli nearly exceeds neural tolerance; the sub will instinctively wish to curl for relief and be unable, by the posture, to escape."},r:{zh:"润滑须绝对充足；后穴手指自一根始，每加一根须停留至少三分钟令括约肌完全适应。",en:"Lubrication must be ample; back begins with one finger; each added finger requires at least three minutes of rest for the sphincter to adapt."},b:{zh:"隔壁摸到前方器具轮廓的一瞬，探入者须如实告知——此告知本身即为本局最烫的时刻之一。",en:"At the instant the front implement's outline is felt through the wall, the entrant must announce it — that announcement is itself the scene's most scalding moment."},m:{zh:"40 分钟",en:"40 min"}},
{t:2,n:{zh:"渐进扩张",en:"Gradual Dilation"},l:"Dilatatio",p:{zh:"扩张器按尺寸列队摆放，自最细者始。润滑倒足于第一号，缓缓探入——几乎无感，只有润滑液的凉意与器具的温度落差。停留五分钟令穴道熟悉。换下一号——渐有撑开之意，穴口那圈软肉开始被拉展开细微的褶皱。再下一号，那圈肌肉开始需要主动放松方能容纳——服从方须深呼吸，令身体的抗拒感缓缓退去。每换一号皆是一场谈判：呼吸、接受、适应，身体自会给出答案。号数上升的过程中，穴道深处会渐渐产生一种奇异的、从未体验过的被撑满的餍足感——那份餍足与快感邻近但不相同，介于痛与爽之间，专属于此局。而每一次成功适应更大的号数，会带来一种奇特的成就感——身体本身在此过程中完成了一次小小的、私密的胜利。不硬来，不逞强——纳不下便停在上一号，那即是今日的国境线。今日抵达几号并不重要，重要的是每一次，身体都比上一次更信任这件事、更信任那双为之扩张的手。",en:"Dilators queue in order, from the finest. Lubricant on the first, slide it in slowly — nearly no sensation, only the lubricant's coolness against the implement's temperature. Hold five minutes for the passage to acquaint itself. Change to the next — the widening begins to speak, the ring of soft flesh at the entrance begins to pull open fine creases. Next up — that ring must be actively relaxed to admit; the sub must breathe deep, letting the body's refusal recede. Each change is a negotiation: breathe, accept, adapt, and the body will answer. Along the ascent of number, at the deep of the passage a strange, unprecedented sated fullness will slowly arise — its neighbor is pleasure, but it is not pleasure; it sits between pain and joy, and belongs exclusively to this scene. Each successful accommodation of a larger number brings a peculiar sense of achievement — the body itself has, in this process, completed a small, private victory. Do not force it, do not overreach — if it will not enter, stop at the previous number, and that is today's national border. What number reaches today is not the point; the point is that each time, the body has trusted this act and that pair of hands a little more."},r:{zh:"纳不下即停在上一号，不得强行；润滑不得节省；任何撕裂感立即终止。",en:"On refusal, hold at the previous number; do not force; lubricant may not be skimped; any tearing sensation ends the scene."},b:{zh:"今日号数记档；下次自此起步。若欲跨号数进入正戏，扩张至少停留于目标号数十分钟。",en:"Log today's number; next time begins here. To cross into a scene proper, hold at target number ten minutes."},m:{zh:"45 分钟",en:"45 min"}},
{t:2,n:{zh:"节奏让渡",en:"Yielding the Rhythm"},l:"Regimen",p:{zh:"跪定，张口含住，随即交出全部主动权——对方的手指自侧鬓插入发间，五指扣住后脑，自此深浅、快慢、角度、节奏皆不由己。可能先浅浅厮磨，只以唇圈住冠状沟处轻轻吮吸；可能骤然按至根部，抵住喉口后停住不动，令喉间的痉挛与主导方的柱身互相较劲；可能一记接一记地快速抽插，令口腔不受控地作出吞咽的动作；可能一记极深之后停住十秒，令服从方在那份被塞满的窒息感中细细体会。双手须负于身后，任眼泪自睫毛间涌出、涎水自嘴角淌落，任下颌酸胀、任喉间痉挛。须做的只有一件事：放松、信任、令口腔完全易主。而这份深度的信任交付——包括交付出自己的呼吸节奏、呕吐反射、乃至喉咙深处最脆弱的部位——本身即是一份最深的亲密。被使用与被珍视，在此局中恰是同一件事——因为唯有极度的信任，方能允许口腔被这样彻底掌控。",en:"Kneel, open the mouth to receive, and with that hand into the hair — five fingers to the back of the skull — surrender all initiative. Depth, speed, angle, tempo — none any longer belong to the sub. Possibly shallow grinding, only the lips ringing the corona in light suction; possibly a sudden press to the root, held against the throat's mouth in stillness while throat spasms and the receiver's shaft weigh against each other; possibly hit after hit of fast strokes forcing swallow motions in the mouth; possibly one very deep hit held ten seconds so the sub can taste the fullness-and-suffocation slowly. Hands must stay behind the back; let tears go from between lashes, let saliva go from the mouth's corner, let the jaw ache, let the throat spasm. Only one task: relax, trust, hand the mouth over. And this deep trust-delivery — including delivery of one's own breath tempo, one's own gag reflex, one's own most vulnerable throat-place — is itself one of the deepest possible intimacies. Being used and being cherished are, in this scene, the same thing — because only extreme trust permits the mouth to be so wholly commanded."},r:{zh:"双手全程负于身后，不得抬起自卫；眼泪、涎水、干呕皆不必忍。",en:"Hands stay behind throughout, no self-defense; tears, saliva, gag reflex all need no restraint."},b:{zh:"全程不躲不退者，终局深处的释放须尽数含住并咽下；未咽者，涂抹于下颌与颈侧展示。",en:"On complete non-flinching to the end: the deep release at the finish must be all held and swallowed; unswallowed, painted on the jaw and neck for display."},m:{zh:"20 分钟",en:"20 min"}},
{t:2,n:{zh:"语音自白",en:"Recorded Confession"},l:"Vox",p:{zh:"独自寻一处无人房间，以手机录制一段一分钟的语音，交予对方。内容须包括：以最不堪的词句描述自己此刻的身份归属（我是⋯⋯的、随时可被使用的⋯⋯，具体归属与用途须说明白），身体如何不争气（何处已经濡湿、何处已经硬起、平日有多想被对方如何对待），以及录制此刻脑中在想什么画面（须具体到姿势、动作、深度）。无人在场紧盯，羞耻感反而更重：对着话筒开口的第一句会卡壳，会脸热，会录到一半掐断重来。但最终交出的那一条里，须有喘息（因为录制时须一边说一边挑逗自己），须有具体的自白（无法以模糊形容词敷衍），须有亲口承认的每一个字。按下发送的那一秒，比说出口本身更烫十倍——因为那段话此后永远存在于对方的手机中，可随时被调阅；也因为那些用自己的声音承认下来的字句，即便未来后悔，也无法收回。",en:"Alone in a private room, record on a phone a one-minute audio and send to the other party. Content must include: describe in the most unspeakable words one's own present ownership (\“I am the ______ of, at any time available for use ______ of,\” ownership and use specified clearly), how the body's failing (where wet, where hard, how much one habitually wishes to be done to), and the images in mind at the moment of recording (specific to posture, action, depth). Alone, no one watching, and shame is heavier for it: the first sentence into the microphone will catch, the face flush, the recording cut and restarted mid-way. But in the delivered clip: real breath (because during recording one must simultaneously self-tease), specific confession (no vague adjectives to slur), and words admitted, in one's own voice, each of them. The second of pressing \“send\” is ten times hotter than saying it aloud — because the audio now permanently exists on the other party's phone and can be recalled at any time; and because words admitted in one's own voice cannot, even in future regret, be taken back."},r:{zh:"须指明身份归属，须以不堪之词形容自身，须带真实喘息，须具体到画面。",en:"State ownership; use unspeakable words; carry real breath; be specific to image."},b:{zh:"内容不合格者重录，无上限；累计三次以上，该段语音将于下次本局开场时当众播放。",en:"Inadequate: rerecord, no upper limit. Three inadequate or more: the audio will play at the opening of the next scene."},m:{zh:"20 分钟",en:"20 min"}},
{t:2,n:{zh:"边缘一小时",en:"An Hour on the Brink"},l:"Hora",p:{zh:"计时器按下的一刻，一场漫长的凌迟开始。手指、唇舌、器具轮番登场——每种刺激都不许持续太久，每次都在快感即将累积为顶点的前一刻切换。攀至九十九，撤离；缓过来，再至九十九，再撤离；如此反复。前二十分钟尚能撑住体面，服从方咬着牙告诉自己我可以；四十分钟起开始咒骂、哭泣、语无伦次地讨价还价——求求你、让我到、我不行了——这些皆无效；最后十分钟已不成人形，全身细密地颤抖，穴道深处规律地不受控地痉挛，脸上分不清是汗是泪，喉间只剩破碎的呜咽。到这一步，即便完全不施加任何刺激，仅仅是手指轻轻搭在腹部，服从方都会因高度敏感而颤抖不止。而墙上的倒计时一秒一秒走——走完的那一刻，一小时的极致压抑将一次性归还，那份释放会来得比预期更迅猛、更彻底、更长久，甚至令身体在事后仍持续痉挛数分钟才慢慢平复。",en:"The moment the timer starts, a long execution begins. Fingers, mouth, toys in relay — no single stimulus permitted to last long, each switched off at the last moment before pleasure culminates. Climb to ninety-nine, off; recover, back to ninety-nine, off; and again. The first twenty minutes composure may just be held, the sub gritted-teeth telling themselves it is doable; from forty minutes on, curses, tears, incoherent bargaining — please, let me finish, I can't — all null; the last ten minutes are already unmade, the whole body finely trembling, the deep of the passage twitching in irregular spasms, face a smear of sweat and tears, throat only broken whimpers. By this stage, even with no stimulus applied, a finger simply resting on the belly is enough to bring on tremor. And the countdown on the wall walks a second at a time — the moment it ends, an hour's compressed suppression will be returned all at once, and the release will arrive fiercer, more thorough, longer than expectation, the body still spasming for minutes afterward before slowly quieting."},r:{zh:"计时开始即不受理任何求饶；可哭可骂可挣扎，唯不许说不要了这三字。",en:"From the timer's start, no plea is entertained; may weep, may curse, may struggle, only not say \“don't want to.\”"},b:{zh:"满一小时者，随后那一次将是本年最烈的一次；未满一小时者，禁令顺延至次日。",en:"Held one hour: what follows will be this year's fiercest. Not held: the ban extends to the next day."},m:{zh:"60 分钟",en:"60 min"}},
{t:2,n:{zh:"弹指之刑",en:"Flicked Bud"},l:"Ictus",p:{zh:"受罚者仰卧，自行以两根手指撑开阴唇，令那颗充血的珠粒完全暴露于灯光下——那种自我暴露的动作本身即是本局的开幕。行刑者指尖抬起，第一记极轻地弹落于其上——如叩一颗露珠，力道刚好令那点微微一颤。受罚者报：一。第五记起加力，那一点已经又麻又胀，每弹一记全身随之一颤，穴道深处不受控地一夹；第十记时已经充血到粉红转深红，颗粒感格外分明，每弹一记都会溢出一小股清液顺着会阴淌下；第十五记之后是最重的五记——指尖蓄力、精准落下，快感与锐痛在同一点上炸开，双腿会疯狂想要合拢以求缓解——不许。撑开的两指须保持岔开的姿势，膝盖须始终分向两侧。二十记之后，那一点已经肿到与平日不成比例，几乎变成一颗小小的、鲜红的樱桃，一碰即颤，甚至不需要真正的触碰——空气拂过都能引起颤抖。",en:"The punished lies on their back and, with two fingers, holds the labia open, so that fully-engorged pearl is entirely exposed to the light — the act of self-exposure itself is this scene's opening. The executioner lifts the fingertip and lets the first flick fall — very light, as if tapping a dewdrop, the force just enough for the point to quiver once. The punished reports: one. From the fifth flick, weight rises; that point is already numb-and-swollen, each flick a whole-body shudder, the passage's deep clenching involuntarily; by the tenth it has flushed from pink to deep red, its grain unmistakable, and each flick sends a small clear ooze down the perineum; from the fifteenth on come the heaviest five — fingertip gathered, precisely landing, pleasure and sharp pain detonating at the same point, the thighs desperately wishing to close for relief — denied. The two open fingers must maintain their spread posture, the knees must stay split. After twenty, that point has swelled disproportionately to its ordinary self, nearly a small bright cherry, quivering at a touch — even without real contact — just the wafting of air enough to make it shiver."},r:{zh:"每记报数；合腿一次，那一记作废重来；两指撑开的姿势不得改变。",en:"Each flick numbered; each thigh-closure voids that flick; the two-finger spread may not change."},b:{zh:"中途失守（提前抵达顶点）者重新计数；累计失守两次以上，改为缚定四肢续玩。",en:"Preemptive climax during play resets the count; two or more resets during a scene, tie the four limbs and continue."},m:{zh:"20 分钟",en:"20 min"}},
{t:2,n:{zh:"镜前自陈",en:"Mirror Testimony"},l:"Confessio",p:{zh:"跪坐于落地镜前，另一方于身后落座旁观。指令简单：自行以指撑开阴唇，将穴口暴露于镜前——亦暴露于身后那双眼睛之前。而后是难的部分——须一面注视镜中毫无遮拦的自己，一面开口描述所见：何种颜色（深粉、泛红、开合处透着水光），肿至何等程度（外唇比平时厚了一倍、阴蒂完全暴露、穴口撑开成小指粗的圆），濡湿到何种程度（从穴口沿会阴淌至臀缝、大腿内侧一整片都是、滴至地上），穴口正在如何开合（一收一放、痉挛地颤抖、不受控地一张一合）。用最直白的、几乎是医学式的词汇，说得像宣读检验报告，又羞耻得全然不是。届时会发现：最难的不是撑开自身，是亲口说出眼中所见的一切。而镜中的自己——那双撑开自己的手指、那微微前倾的姿态、那因描述而不断加深的红晕——会成为记忆中最难以磨灭的一副画面。",en:"Kneel-sit before a floor mirror; the other party sits behind and watches. Instruction is simple: hold the labia open with the fingers, so the entrance shows in the mirror — and shows to the eyes behind. Then the hard part — the sub must simultaneously look upon their own unhindered image in the mirror and describe aloud what they see: what color (\“deep pink,\” \“flushed,\” \“water-slick at the parting\”), how swollen (\“outer lips twice their usual thickness,\” \“clit wholly exposed,\” \“entrance dilated to the width of a little finger\”), how wet (\“running from entrance down the perineum to the crease of the buttocks,\” \“a whole patch on the inner thigh,\” \“dripping to the floor\”), and how the entrance is opening and closing (\“opening and closing,\” \“spasming and shivering,\” \“an involuntary rhythm of open and shut\”). Use the plainest, near-clinical words, sounding like reading out a lab report, and quite entirely not so. By then it will be plain: the hardest part is not opening oneself, but speaking aloud all that the eyes see. And the mirror's self — those spread fingers, that tilted-forward posture, the flush that deepens with description — will become one of memory's least effaceable images."},r:{zh:"描述须具体到颜色、湿度、动态，缺一项即重新描述该项。",en:"Description must be specific: color, wetness, dynamics; missing any item requires that item redescribed."},b:{zh:"描述不合格者，以手机拍下穴口特写，对照照片重新描述，直至合格。",en:"Inadequate: the sub photographs a close-up of the entrance on their phone, and, with the photo, redescribes until adequate."},m:{zh:"25 分钟",en:"25 min"}},
{t:2,n:{zh:"忍水之局",en:"Holding Fluid"},l:"Retentio",p:{zh:"开局前，先饮尽一大杯水（约五百毫升）——半小时后水将抵达膀胱。而后照常行局——手指、唇舌、器具轮番施为，一切如常。随时间推移，另一种压力将自小腹深处一点点涨起，与快感搅在一处，愈发难以分辨——起初是隐约的胀意，可以忽略；继而是清晰的尿意，须刻意集中注意力才能压住；再往后是逼近临界的胀痛，两腿之间的两种感觉（性快感与排泄压力）互相干扰，令服从方在被顶入时会本能地绷紧全身以同时压制两种冲动。这份双重承受本身即是一种独特的刺激——因为无法专心于快感，快感也就变得更深、更纯粹。且性快感与排泄反射的神经通路互相干涉，某些位置的顶弄会同时触发两种反应，那种混合的、无法辨别的失控感是本局的核心体验。须如实奏报涨至几分（一至十），而去与不去、何时可去，须经批准。",en:"Before the scene, drink a large cup of water (about 500 ml) — in half an hour it will reach the bladder. Then proceed as usual — fingers, mouth, toys, all as ordinary. As time goes on, another pressure will rise slowly from the deep of the belly and mix with pleasure, growing harder and harder to sort out — first a vague swell that may be ignored; then a distinct urgency that requires effort to suppress; then a swelling pain near the threshold. Between the thighs, the two sensations (pleasure and the pressure of holding it) interfere with each other; the sub, on being entered, will reflexively tighten the whole body just to hold both impulses down. This double burden is itself a peculiar stimulus — because the mind cannot rest on pleasure, pleasure grows deeper and purer for it. And the neural pathways of pleasure and reflex-of-release interfere with one another; certain angles of thrust trigger both at once, and that composite, hard-to-parse loss of control is the scene's core experience. The sub must honestly report by number the level (one to ten), and whether and when they may go must be permitted."},r:{zh:"须如实以数字奏报膀胱压力；临界须提前申请；擅自离席一律加罚。",en:"Report bladder pressure honestly by number; approach requires prior application; unauthorized departure incurs additional penalty."},b:{zh:"提前如实申请者获准同行如厕；擅自行动者，本局暂停并额外增加一次相同条目于下次玩耍。",en:"Timely-and-honest application: escorted to the toilet. Unauthorized departure: the scene pauses and an equivalent scene is added next time."},m:{zh:"60 分钟",en:"60 min"}},
{t:2,n:{zh:"缚椅之刑",en:"Chair Fix"},l:"Sella",p:{zh:"一把结实的木椅——不需要豪华，需要的是可以承受负重且椅腿稳固。腕以柔软的皮带缚于扶手，两腕分别固定，无法互相接触；踝以皮带分缚于椅子两侧的椅腿，两腿被迫向外张开成一个宽阔的钝角——此姿势最狠的地方在于：双腿无法合拢，无法交叉，无法夹紧任何东西。腰间再加一道皮带穿过椅背固定，令上身无法前倾或后仰。人便彻底成为椅子的一部分。而后行刑者搬凳落座于正对面，慢条斯理地开始——可能只是伸手轻拂受缚者的乳尖，可能是探入指到穴中缓缓抽插，可能是以震动器对准阴蒂。受缚者能清楚看见每一个动作，能清楚感知每一种刺激，却连一厘米都躲不开、也迎不上——主动权被尽数缚走之后，剩下的全部是承受。这份完全的无法逃避会将每一次刺激的强度放大数倍，因为没有任何生理性的调整可以缓解——甚至连夹紧双腿这样最基本的自我安抚动作都被剥夺。",en:"A sturdy wooden chair — no need for luxury; sturdiness and stable legs required. Wrists bound to the armrests with soft leather, the two wrists separately fixed and unable to contact each other; ankles bound with leather to the two sides of the chair, so the legs are forced apart into a wide obtuse angle — the deadliest point of this posture is: the legs cannot close, cannot cross, cannot clamp anything at all. A further leather at the waist through the back of the chair, fixing the torso — cannot lean forward, cannot lean back. The person is wholly a piece of the chair now. Then the executor pulls a stool over and sits opposite, and proceeds at leisure — perhaps merely brushing a fingertip across the bound one's nipples, perhaps entering a finger into the passage in slow strokes, perhaps aiming a vibrator at the clit. The bound one can see with total clarity each action, can register with total clarity each stimulus — and cannot, by so much as a centimeter, dodge or meet — after initiative is bound away, all that remains is receipt. And this complete inability to dodge amplifies every stimulus severalfold, because no physical adjustment can offer relief — even the closing of the thighs, the most basic act of self-soothing, has been taken."},r:{zh:"正面施为；受缚者全程无法合腿、无法弯腰、无法伸手；解缚前须逐一检查血运。",en:"Face-front proceeding; the bound cannot close the legs, cannot bend, cannot use hands; before release, check circulation one by one."},b:{zh:"椅面留下的水痕由受缚者事后自行清理——先看清自己留下了多少痕迹，是本局的余韵。",en:"Wet marks left on the chair's seat are cleaned by the bound after the scene — first seeing exactly how much one has left is the scene's finish."},m:{zh:"45 分钟",en:"45 min"}},
{t:2,n:{zh:"独力承欢",en:"Own Effort"},l:"Tu moves",p:{zh:"一方平躺于床上，双手枕于脑后，宣布罢工——从此至终局，此方不主动做任何动作，仅由躺姿承受。另一方跨坐其上，自行扶正对方使之立起，自行沉下——沉入的深度、速度、角度皆由自己掌控。此后便是骑乘者的独角戏：前后研磨或上下起落，或快或慢，哪个角度能顶至自己最深处的凹陷，全凭自己摸索。躺者一动不动，只是旁观：看骑乘者从最初的矜持缓动，到渐渐放开寻找自己的节奏，到追逐自身快感时腰肢摆动的失控，到满头汗珠、腿根颤抖、几近脱力仍咬牙继续。规则是：躺者缴械，方为终局；骑乘者先行抵达不算，须继续摆动直至躺者亦达至顶点。这份完全颠倒的权力关系令许多平日居下位者格外沉醉——因为唯有主动，方知被动之难；唯有摆动过一次自己的腰，方知平日那份轻松原来一点都不轻松。",en:"One party lies on the bed, hands pillowing the head, and declares strike — from now to the end, this party will not move on their own, only receive from below. The other party straddles and above, sets the receiver upright with their own hand, and lowers themselves — depth, speed, angle, all under their own control. Then it is the rider's monologue: front-and-back grinding, or up-and-down, or fast or slow, feeling for which angle reaches their own deepest hollow. The one lying down does not move, only watches: watches the rider from initial reserved motion, to the gradual finding of their own rhythm, to the disintegration of hip motion under the chase of their own pleasure, to the head beaded with sweat, thighs trembling, near-exhaustion, and still gritted-teeth continuation. The rule: the lying one surrenders — only then, the scene's end; the rider's own arrival does not count, they must go on swaying until the lying one, too, arrives. This wholly reversed power arrangement will hypnotize many who habitually occupy the lower position — because only through initiative does one grasp how not-easy it is to be receptacle; only when one has moved one's own hips, does one grasp that the usual ease of it is not so easy at all."},r:{zh:"躺者不提供任何协助——不主动挺腰、不扶腰、不加速；累时可暂停，但停时不得脱离结合。",en:"The lying party offers no assistance — no active thrust, no waist-holding, no acceleration; may pause when tired, may not disengage."},b:{zh:"骑乘者若先行抵达一次，须继续摆动至躺者亦释放；连续先行两次以上，转为侧躺姿势由躺者补位。",en:"If the rider arrives first once, they must continue rocking until the lying party also releases; two or more first-arrivals, switch to side-lying and the lying party takes the place."},m:{zh:"40 分钟",en:"40 min"}},
{t:2,n:{zh:"车内之局",en:"Car Interior"},l:"In curru",p:{zh:"地下车库最角落的车位，引擎熄火，车窗留一线细缝——那缝隙是本局的赌注。后座空间狭窄得刚刚好——只能半躺蜷缩于座椅上，腿架至驾驶者肩上时还须小心提防不要撞到车顶，一个动作换一次角度就要重新调整。每个姿势都施展不开，每声轻吟都须压在喉间——因为一层车窗之外就是随时可能有人经过的通道，脚步声可能出现于任何时刻。远处传来脚步的瞬间全体静止，两人屏息相贴，心跳撞着心跳，柱身仍埋在体内，穴道却因紧张而反射性地绞紧——脚步声远去，再续。若有车辆驶入车库停在附近，须完全停下，甚至须捂住对方的嘴。狭窄、憋闷、提心吊胆——但正因为这份禁忌与危险，快感被放大到平日的数倍。而车窗玻璃上因两人的呼吸而蒙上的一层薄雾，会成为唯一的证据——如果有人凑近看，能看见的仅仅是那层雾，而雾之后一切都被隐藏。",en:"The most cornered spot in the underground carpark, engine off, window left the thinnest crack — that crack is the scene's wager. The rear seat is precisely so narrow — half-lying curled into the seat, thighs on the driver's shoulders yet still with care not to hit the roof; each change of angle is a re-adjustment. Every posture is cramped, every soft moan must press against the throat — because outside a layer of window is the corridor along which people may pass at any moment; footsteps may appear at any point. At the instant of far-off footfall, both go still, breath held pressed together, heart against heart, shaft still embedded in the deep, the passage clenched by tension of its own — the footsteps pass, and continue. Should a car pull in and park nearby, one must halt entirely, even, if need be, cover the other's mouth. Cramped, stifling, jangle-of-nerves — and precisely because of this taboo and danger, pleasure is amplified severalfold to normal. And the fog on the inside of the car window from both people's breath will become the sole witness — if a stranger came close and looked, all they would see is that fog, and behind the fog everything is hidden."},r:{zh:"不得发出可被外部听见的声音；有人经过即完全静止；被目击即刻脱离撤离。",en:"No sound audible from outside; on someone's passage, halt entirely; on being seen, disengage and leave."},b:{zh:"被目击即刻结束本局撤离，归家立即续场；未被目击者，回家后可享受一次完整的正规做爱作为奖励。",en:"On being seen: end and leave immediately, resume at home. Not seen: on return home, one complete round of proper love-making as reward."},m:{zh:"40 分钟",en:"40 min"}},
{t:2,n:{zh:"侍奉至满意",en:"Serve Till Satisfied"},l:"Donec",p:{zh:"一方于沙发上落座，拍了拍两腿之间的地毯：跪这儿。没有时限，没有进度条，唯一的终止条件是一个字：停。侍奉者跪于地毯，以口伺候自根部至顶端——先以舌面自阴囊一路舔至冠状沟，再以嘴唇圈住顶端轻轻吮吸，然后含入口中缓缓深入。变换花样，察言观色——察觉对方呼吸转沉便保持当下的方式；发觉对方毫无反应便更换招式，或深喉、或吐出仅舔顶端、或双手辅助按摩囊袋。十分钟后下颌开始发酸，唾液自嘴角控制不住地淌落；二十分钟后舌根发麻，颈项因长时间的姿势而僵硬；而对方可能只是低头瞥一眼，眼神并无温度：继续。三十分钟后，跪着的膝盖开始因地毯的粗糙而生痛，但姿势不得改变。本局考验的不是技巧，是愿意为一句满意跪多久、跪得多虔诚——那份漫长的、看不到终点的服务感本身即是最深的臣服。",en:"One party sits down on the sofa, pats the rug between their legs: kneel here. There is no time limit, no progress bar, only one termination condition, one word: stop. The servant kneels on the rug and, with the mouth, serves from base to tip — first the tongue's face from the sac up to the corona, then the lips ringing the head in light suction, then taking into the mouth in slow depth. Vary the pattern, read the face — when the other's breath turns heavier, keep the current pattern; when the other shows no reaction, change moves, or deep-throat, or withdraw to lick only the head, or the hands assisting massage of the sac. After ten minutes the jaw begins to ache, saliva running uncontrolled from the mouth's corner; after twenty minutes the tongue's base numbs and the neck stiffens from the extended posture; and the other may only glance down, eyes without warmth: continue. After thirty minutes, the kneeling knees begin to ache on the rug's coarseness, but the posture may not change. This scene does not test technique; it tests how long, and how devoutly, one is willing to kneel for a single word of \“satisfied\” — that long, ending-invisible sense of service is itself the deepest yielding."},r:{zh:"中途停顿一次，本局时长加十分钟；下颌酸胀不得作为停止理由。",en:"One pause mid-way: scene time extended by ten minutes; jaw ache is not a valid reason to stop."},b:{zh:"下颌确实已经抬不起时，方可动用安全词；除此之外，继续。终局到来时，射精位置由被伺候方指定。",en:"When the jaw truly cannot rise, only then may the safeword be used; short of that, continue. At the finish, place of release is chosen by the served."},m:{zh:"不定",en:"open-ended"}},
{t:2,n:{zh:"十道敕令",en:"Ten Decrees"},l:"Decem iussa",p:{zh:"支配方端坐不动，只出声，连下十道指令。开头温和：把头发束起来。跪下。手放在两腿之间。而后一道比一道过分：自己撩起裙摆至腰际。手指含入口中，舔湿，然后伸至自己下身。转过身，抬高，撑开示众。躺下，双腿分至最大限度。含入口中，不得吐出直至下一道指令。每一道指令仅有三秒的执行时间——迟疑即为抗命。声音落下的一瞬计时开始，三秒内动作须开始，动作结束前不许有第二念。十道下来，服从者会被自己的顺从吓到——原来只要声音来自那个人，多过分的事都做得出来。而每一道指令的完成本身，都在深化二人之间的权力关系——因为每一次的顺从都是一次微型的臣服仪式，累积十次之后，那份心理上的转变会持续到本局结束之后很久。",en:"The Dom sits still and speaks only, issuing ten decrees. Begin gently: tie up the hair. Kneel. Put the hands between the thighs. Then each decree is more excessive than the last: lift the skirt to the waist. Put the fingers in the mouth, wet them, then bring them to one's own lower body. Turn round, lift high, hold open for viewing. Lie down, legs open to the widest. Take into the mouth, and may not spit out until the next decree. Each decree gets three seconds' execution time — hesitation is defiance. From the instant the sound falls, the clock begins; within three seconds the action must begin, and no second thought is permitted before completion. Ten decrees on, the servant will find themselves frightened by their own compliance — that as long as the voice comes from that person, however excessive a thing, they can be made to do. And each decree's completion further deepens the power relation between the two — because each yielding is a little ritual of vassalage, and after ten cumulative, the psychological shift will persist long after the scene closes."},r:{zh:"每道指令限三秒内执行；迟疑记抗命一次；执行不到位需重做。",en:"Each decree within three seconds' start; hesitation counts as defiance once; inadequate execution requires redo."},b:{zh:"抗命一道罚十下掌击，累计执行；十道全部无违规者，可向支配方提一个要求，无条件应允。",en:"A defied decree: ten strikes each, cumulative and enforced. Ten completed without violation: one request may be made to the Dom, unconditionally granted."},m:{zh:"30 分钟",en:"30 min"}},
{t:2,n:{zh:"含而不咽",en:"Held, Not Swallowed"},l:"Retine",p:{zh:"终局一刻，主导方按着服从方的后脑将顶端顶至舌根附近释放——而后才是真正的游戏：不许咽，不许吐。须含着那一整口滚烫黏稠之物，跪坐端正，仰头，张口受检——舌面上那滩白浊混着涎水，随每一次呼吸轻轻晃动，几乎要溢出唇际。检视会持续很久——或许拍照留证，或许捏着下颌轻晃听那液体在口中晃动的声响，或许伸手将顶端塞回口中让服从方再度吮吸一次以令口腔重新沾满。腥气在口腔中愈发浓重，喉头本能地想要做吞咽的动作却须拼命压制——每一次咽口水的冲动被强行压下，就是本局的核心。舌头上那份重量、口腔中那份满、以及无法完成最后一个吞咽动作的挫败感，会将服从方置于一种奇特的、悬而未决的臣服状态。直到终于听见那一个字：咽。",en:"At the end, the giver of orders holds the back of the receiver's head and drives the tip to near the tongue's root and releases — and only now the true game begins: no swallow, no spit-out. That whole mouthful of hot, thick matter must be held; the receiver sits kneeling upright, tilts back the head, opens the mouth for inspection — on the tongue-face that pool of white mixed with saliva shifts gently with every breath, near-brimming over. Inspection lasts a long while — perhaps a photo, perhaps a squeeze at the jaw to hear the liquid slosh audibly, perhaps a hand returning the tip to the mouth so the servant sucks it once more so as to re-glaze the oral cavity. The odor thickens further in the mouth; the throat instinctively wishes to swallow but must be repressed — each impulse to swallow forced back is the scene's core. The weight on the tongue, the full of the mouth, and the frustrated final swallowing motion, place the servant in an odd, unresolved posture of yielding. Until at last that single word is heard: swallow."},r:{zh:"含定受检，不得吞咽或吐出；下颌须始终保持张开状态可供检视。",en:"Hold in mouth for inspection; may not swallow or spit; jaw must remain open for inspection throughout."},b:{zh:"中途溢出一滴，须自身尽数舔回；溢出超过三次，本局作废并加罚一次相同条目于下次。",en:"On even one drop spilled, the sub must lick back every drop; if spilled three times or more, the scene is void and an equivalent scene added."},m:{zh:"10 分钟",en:"10 min"}},
{t:3,n:{zh:"半身悬吊",en:"Half-Body Suspension"},l:"Suspensio",p:{zh:"胸缚打好之后——龟甲缚或箱型胸缚均可——主绳自胸前引出，穿过悬挂于房梁的承重环，缓缓收紧。上半身的重量逐寸自足底转移至胸前的绳架上——起初足尖仍稳稳踩地，绳索仅承担一小部分重量；继而足尖踮起，绳索承担一半重量；最终足尖仅点地保持平衡，几乎全部重量悬于绳上。人便悬于天地之间——足尖点地，胸口被绳吊起，双臂缚于身后。每一次呼吸绳子勒紧一分，每一个微小的晃动都被放大为钟摆式的摇摆；乳房被绳架四面挤压突显，乳尖因失重感而不自觉地挺立。失重与束缚同时发生的体验无可替代，是绳缚艺术的深水区。而此姿态令被缚者一切要害尽显于施术者之前——腰腹、腿间、颈项，无处不暴露。此时施术者的一根手指划过股间，那份触感因失重与束缚的双重放大会成为几乎无法承受的过载——被缚者会本能地想要蜷缩以求缓解却因悬吊而无处可退，只能承受。",en:"After the chest tie is set — kikkou or box tie either serves — the main line is drawn out from the chest, threaded through the load-bearing ring hung from the beam, and slowly cinched. The upper body's weight transfers inch by inch from the sole of the foot onto the chest cage — first the toes still stand firm on the ground with the rope taking a small share of the weight; then the toes rise and the rope takes half; finally the toes only touch the ground for balance and near all the weight hangs on the rope. The person hangs between heaven and earth — toes to floor, chest hoisted, arms bound behind. Every breath tightens the rope one degree; every tiny sway magnifies into a pendulum swing; the breasts, squeezed on four sides by the cage, jut; the nipples, in weightlessness, involuntarily stand up. Weightlessness and bondage occurring at once is an experience with no substitute — this is rope-play's deep water. And this posture leaves every vulnerability of the bound one wholly displayed before the practitioner — belly, between-legs, neck, nothing left uncovered. At that point a single finger of the practitioner drawn between the buttocks, that touch under the amplification of both weightlessness and bondage becomes a nearly unbearable overload — the bound will instinctively wish to curl for relief and, hanging as they are, have nowhere to retreat, only to receive."},r:{zh:"承重点须经专业检查、快剪须置于伸手可及处、全程须有人护场；任何麻木立即降下。",en:"Anchor points must be professionally inspected; safety shears within reach; a spotter present throughout; any numbness — descend at once."},b:{zh:"未经系统学习者，本条目仅作幻想演绎——阅读描写、想象场景可，实际施行须待学习之后。",en:"Without systematic training, this entry is fantasy only — read the description and imagine the scene; actual practice awaits schooling."},m:{zh:"90 分钟",en:"90 min"}},
{t:3,n:{zh:"单尾三十",en:"Thirty With The Single-Tail"},l:"Flagellum",p:{zh:"单尾鞭与皮拍是完全不同的两个物种——皮拍是面的击打，力量分散；单尾鞭是点的击打，全部力量集中于鞭梢一点。破空之声先至，那种尖锐的啾声本身即令受者全身起粟；痛感后到——一道细长的、灼烧般的红线瞬间浮上皮肉，起初是烫，继而是清晰的、极细密的针刺感，几秒后化为深层的酸胀。三十记，只落于臀部与大腿后侧的厚肉之处，自热身力度始，一道压着一道排布——第一层是热身的粉痕，第二层是明显的红条，第三层是叠加后的深红——如在身上刻谱。至二十记之后，受鞭者会进入某种恍惚的状态：痛感开始转化为一种奇异的、几近于快感的东西，脑内内啡肽大量分泌，人反而觉得平静而清明。此时若被要求再报数，声音会变得又软又飘，那种恍惚的臣服感是本局最深的所在。刑毕是漫长的冰敷、上药、拥抱至颤抖停止——那段温柔的余韵比刑罚本身更为重要，是重新将人从恍惚中接回现实的必要仪式。",en:"The single-tail whip and the paddle are entirely different species — the paddle is a face strike, force distributed; the single-tail is a point strike, all force concentrated at the very tip. Air-parting sound comes first, the sharp \“zip\” itself raising every hair on the receiver's body; pain comes after — a thin, fine, scorching red line rises at once on the flesh, hot at first, then a distinct extremely fine pin-prick sensation, then, seconds later, deep-tissue ache. Thirty in all, only on the thick flesh of the buttocks and back of the thighs, from warm-up weight upward, one line pressed against the next in arrangement — the first layer warm-up pink prints, the second layer distinct red bars, the third layer superimposed deep red — as if inscribing a musical score on the body. By the twentieth or so, the receiver enters a certain trance state: pain begins to convert into something strange, something near-pleasure, endorphin flooding the brain, the person on the contrary feeling calm and clear. At which point if asked to renumber, the voice will come out both soft and drifting, and that trance-vassalage is the scene's deepest register. Punishment concluded, a long ice pack, salve, and holding until shivering ceases — that gentle finish is more important than the punishment itself, and is the necessary ritual to bring the person back from trance to reality."},r:{zh:"绝对避开脊柱、肾区、关节；每十记须检视皮肤一次；发现异常反应立即终止。",en:"Absolute avoidance of spine, kidney region, joints; skin check every ten strikes; any abnormal reaction ends the scene at once."},b:{zh:"刑毕须冰敷上药，拥抱直至受鞭者停止颤抖为止；此后二十四小时不得再玩击打类条目。",en:"After: ice, salve, hold until the receiver stops shivering; no further impact-play for twenty-four hours."},m:{zh:"45 分钟",en:"45 min"}},
{t:3,n:{zh:"渐进全握",en:"Whole-Hand Progression"},l:"Manus",p:{zh:"此为以小时计的工程，急不得。三根手指为起点——大量润滑液倒于手上，指尖并拢缓缓探入，如常一般的抽插节奏。停留十分钟令穴道完全适应此宽度；而后加至四根——那圈括约肌开始需要主动放松方能容纳，探入的深度也须放慢，缓慢地旋转、按压、扩展；再停留十五分钟。最后是最难的一关——拇指收入掌心，令四指并拢加拇指内收的手形成为最宽的一点，那一点集中于大拇指的指节。以毫米为单位向前推进，每前进一毫米停留十秒，令穴口的肌肉逐渐认可此扩张。整个过程之中，施术者的另一只手须持续以指腹按摩其他部位、以话语给予肯定与鼓励，令受术者的注意力分散、身心放松。当整只手最终完全进入的那一瞬——如果能到达——受术者会经历一种从未体验过的、彻底的填满感：手掌于体内握拳成一颗滚烫的心脏，每一次心跳都清晰地传递给对方。或许今日四指便是终点，那便到四指——进不去不是失败，身体愿意为此人打开到哪里，哪里便是今日的圆满。",en:"This is engineering measured in hours; no haste. Three fingers as start — abundant lubricant on the hand, fingertips together and slowly in, the usual in-and-out tempo. Hold ten minutes for the passage to fully adapt to the width; up to four fingers — the ring of muscle now must be actively relaxed to admit, the entry depth also must slow, gently rotating, pressing, expanding; hold another fifteen minutes. Finally the hardest gate — the thumb tucked into the palm, the four-fingers-plus-tucked-thumb hand-shape's widest point at the thumb's knuckle. Advance millimeter by millimeter, each millimeter's advance held for ten seconds so the muscle at the entrance may gradually acknowledge this widening. Through the whole process, the practitioner's other hand must keep working the finger pads on other body parts, giving affirmation and encouragement in words, so the practiced one's attention is dispersed and body and mind relaxed. At the moment the whole hand at last enters completely — if it reaches — the practiced will experience an unprecedented, total filling: the palm inside the body, closed into a fist, a hot heart, each beat conveying clearly to the other. Perhaps today four fingers is the terminus, so four fingers it is — not entering is not failure; wherever the body wills for this person to open, is the day's completeness."},r:{zh:"润滑液不得中断补充；指甲须剪至最短并磨圆；任何撕裂感、疼痛、出血立即终止。",en:"Lubricant must be replenished continually; fingernails trimmed shortest and rounded; any tearing, pain, or bleeding ends the scene at once."},b:{zh:"无法完成不作失败论——停下相拥、亲吻、以其他方式令其抵达顶点，同样是本局的完成。",en:"Failure to complete is not counted as failure — stopping and holding each other, kissing, bringing the peak by other means, likewise the scene's completion."},m:{zh:"120 分钟",en:"120 min"}},
{t:3,n:{zh:"整日主奴",en:"A Whole Day of Rule"},l:"Dies integer",p:{zh:"自今晚八时至明晚八时，一整日的权力交接。服从方的一切决定权上交：几时安睡、吃什么、穿什么、能否落座沙发、说话须不须跪、能否使用手机、如厕的时间与方式——皆须请示。这不是一场戏，而是把权力关系织入最平凡的日常。会在洗碗时忽然意识到自己是待命的；会在午睡前发讯申请闭眼；会在饥饿时低声请求进食；会在晨起时首先跪于床边等待第一道指令。二十四小时的浸泡会揭示许多平日隐藏的心理状态——对被管束的深层渴望，对信任的极致试探，对自我的重新认识。而这份浸泡的效果并非在事中最强烈——事中人往往还在角色里，感受被冲淡；真正的重量在事后浮现：那种失去与重获自主权的对比会持续数日在心中回响，令人重新审视自己与关系的本质。期满，权力归还——但这份体验将改写此后二人对关系的理解。事后须有一顿正餐与一场完整复盘：何处舒适，何处勉强，下次如何调整。",en:"From tonight's eight to tomorrow's eight, a whole day of power-transfer. The sub surrenders every decision-right: when to sleep, what to eat, what to wear, whether they may sit on the sofa, whether they must kneel to speak, whether they may use the phone, the times and manner of the toilet — all must be requested. This is not a scene, but the weaving of a power-relation into the most ordinary daily life. The sub will, mid-dishwashing, suddenly realize they are on standby; will send a message pre-nap to ask for permission to close the eyes; will lower voice at hunger to request feeding; will kneel first at the bedside of a morning waiting for the day's first order. Twenty-four hours of immersion will reveal much psychology otherwise hidden — the deep want for being managed, an extreme test of trust, a re-recognition of self. And the immersion's effect is not strongest during the event — during, the person is still inside the role, the sensation muted — the real weight surfaces after: that contrast between losing and regaining autonomy will echo for days in the mind, moving one to re-examine the essence of oneself and the relation. Expired: authority is returned — but this experience will rewrite from now on both parties' understanding of the relation. After, one proper meal and one complete de-brief: where comfortable, where difficult, adjustments for next time."},r:{zh:"开局前须书面写明边界清单：绝对禁止之事项须逐条列明，且此清单在本局中不可更改。",en:"Before opening, the boundary-list must be written down: absolutely forbidden items each listed clearly, and this list is immutable during the scene."},b:{zh:"期满须有正餐一顿与不少于一小时的完整复盘——舒适之处、勉强之处、边界的调整方向。",en:"Expiration requires one full meal and a de-brief of not less than one hour — comfortable places, difficult places, the direction of boundary adjustment."},m:{zh:"24 小时",en:"24 hr"}},
{t:3,n:{zh:"扼颈之护",en:"Protected Choke"},l:"Collum",p:{zh:"临界前的数秒——那种熟悉的、即将决堤的电流已经自尾椎攀升至头顶的瞬间——手掌覆上颈侧，不压正中气道，仅均匀扣住颈动脉两侧，令脑部供血稍缓。视野边缘开始发暗发亮——那是脑部轻微缺氧的自然反应——快感在这份缺氧的错觉中被无限放大成一场海啸。呼吸变得艰难而稀薄，每一次心跳都清晰地传至颈侧那只手的掌心，那份跳动的存在感本身即是最原始的、生命被握于他人之手的隐喻。五秒，仅五秒，绝对不得延长。而后松手——血液轰然涌回头顶，感官短暂过载般清明，顶点随那阵眩晕一同砸落，整个人如从深水中浮起，恍惚中不知身在何处。此为整份清单中最须敬畏的条目：它的每一条规则都不是仪式，而是保命线。任何一次超时、任何一次压偏、任何一次面对头晕的不敏感，都可能造成不可逆的伤害。因此本条目只推荐于长期伴侣之间、且施术者须事先研习专业教程。",en:"In the seconds before threshold — that familiar rising current from the tailbone to the top of the head — the palm lands on the side of the neck, not pressing the trachea, only evenly cupping the two sides of the carotid, gently slowing perfusion. The edges of vision begin to darken and lighten — the mild oxygen deprivation's natural response — and pleasure, magnified in this illusion of hypoxia, becomes a boundless sea. Breath grows difficult and thin; each heartbeat transmits clearly to the palm on the side of the neck, and that beating presence is itself the most primitive symbol of life held in another's hand. Five seconds, five only, absolutely not extended. Then release — blood rushes back to the head with a roar, senses briefly overloaded into clarity, the peak crashes with that dizziness, the whole person as if surfacing from deep water, unsure, briefly, where they are. This is the most awe-required entry on the whole list: every one of its rules is not a ritual but a lifeline. Any once-over, any misalignment, any dulled response to a dizzy signal, can inflict irreversible harm. So this entry recommends itself only for long-term partners, and the practitioner must have studied a professional protocol in advance."},r:{zh:"绝对不压正中气道，绝对不逾五秒，须设立非语言停止手势；任何眩晕、视野异常、口齿含糊立即松手。",en:"Absolutely never press midline, absolutely never exceed five seconds, a non-verbal stop signal must be established; any dizziness, visual anomaly, or slurred speech — release at once."},b:{zh:"施行前须双方共同观看专业教程视频不少于三段；不得凭感觉行事；每次施行前须口头复述规则一遍。",en:"Prior to any practice, both parties must together watch professional teaching videos at least three; do not act on feeling; before each practice, recite the rules aloud."},m:{zh:"配合使用",en:"paired use"}},
{t:3,n:{zh:"三日封印",en:"Three-Day Seal"},l:"Tres dies",p:{zh:"自今夜零时起，七十二小时，高潮被没收。不许自渎，不许夹腿磨蹭，不许于睡梦中的任何暗示性动作——若梦遗则须于晨起时如实汇报。而生活须照常运转——沐浴时花洒不得对准下身冲洗过久，睡前手机不得翻至任何暗示性的画面。每日晚间须向持有封印方奏报：今日濡湿几次，哪个瞬间最难熬（看到街上的情侣接吻、闻到床单上残留的对方的气味、地铁上被人挤到），可曾起过偷跑的念头——若起过，须坦白起念的时刻与场景。三日之内，欲望如水位日日上涨——第一日尚能自控，双腿之间偶有隐约的胀意；第二日下腹开始隐隐作痒，任何轻微的触碰都会引起过度反应；第三日整个人如干柴一般，随时可以被点燃，甚至看到一件无关的物品也可能触发无法控制的联想。第三夜的解禁将来得比想象中更为激烈——那三日的积压将一次性爆发，那种彻底的释放会像整个身体被清空重启。",en:"From tonight midnight, seventy-two hours, climax is confiscated. No self-touch, no thigh-grinding, no suggestive motion in sleep — a wet dream must be honestly reported on waking. Life must go on as usual — showering, the head not to be aimed at the sex for extended cleansing; before sleep, the phone not to be scrolled to any suggestive image. Each evening, report to the seal-holder: how many times wet today, which moment was hardest (seeing a couple kiss on the street, smelling the other on the sheet, being pressed against on the subway), whether the thought of running came up — if it did, come clean about when it arose and where. Across three days the tide climbs by the day — first day, self-control still holds, only vague swelling between the thighs; second day, the belly begins to itch faintly, and any small touch draws exaggerated response; third day, the whole person is like dry tinder, ignitable at any moment, even an unrelated object seen can trigger uncontrollable association. The third night's unlocking will arrive fiercer than imagined — those three days' pile-up will detonate all at once, and that complete release will feel like the whole body being emptied and rebooted."},r:{zh:"每晚奏报须包含次数、时刻、念头三项，缺一项即视为不合格。",en:"Nightly report must contain three items — count, time, thought — any missing item fails the report."},b:{zh:"第三夜解禁；若被察觉偷跑，封印自那日起重新计三日，累计。",en:"Third night, unsealed; if caught cheating, the seal restarts three days from that day, cumulatively."},m:{zh:"3 天",en:"3 days"}},
{t:3,n:{zh:"残缺之顶",en:"Ruined Peak"},l:"Ruina",p:{zh:"与寸止相反——寸止是在门槛前撤走，令顶点未能来临；此局更为恶劣——不在临界前收手，而是任其抵达，然后在浪头砸落的第一秒抽走所有刺激。指腹在最后一记加速之后骤然离开阴蒂，器具骤然关停撤离，唇舌骤然脱离——那个顶点将残缺地、半途而废地流过去：身体的痉挛如约到来（阴道深处的规律收缩、大腿的抽搐、腹肌的绷紧），但快感只被释放了极小一部分，绝大部分被截断在半途——如一发哑炮，如一场未完的乐章。这份残缺比未曾抵达更难受百倍，因为身体已经承诺了释放却未能兑现。生理上，那份未完成的能量无处可去，会以一种奇特的方式滞留于下腹深处——那种沉甸甸的、饱胀的空虚感，是本局的独特体验。受刑者会又气又空地瞪来，甚至试图自行补救——不许。双手被按住。连毁三次之后，第四次方予完整。届时的释放将比任何一次都更为激烈，因为身体积累了三次未完成的能量。",en:"The opposite of edging. Edging withdraws before the threshold, and the peak does not arrive; this entry is worse still — do not withdraw before the threshold, let it arrive, and in the first second of the wave crashing, extract every stimulus. The finger's pad withdraws abruptly from the clit after the last accelerated stroke, the toy shuts and departs, mouth and tongue peel away — that peak drifts by ruined and half-completed: the body's spasms arrive as promised (regular contraction in the deep of the passage, tremor of the thighs, tightening of the belly muscles), but only a very small share of the pleasure is discharged, the vast majority intercepted mid-way — like a misfired shell, like an unfinished movement of music. This ruined state is a hundred times harder than never having arrived at all, because the body already committed to release and did not receive its due. Physically, that undischarged energy cannot go anywhere and lingers strangely in the deep of the belly — that heavy-sunk sated emptiness is the scene's distinctive feature. The receiver will glare, spent and vacant; they may even try self-remedy — denied. The hands are pinned. After three ruins in a row, the fourth grants completion. And that release will be fiercer than any before, because the body has stored the energy of three unfinished ones."},r:{zh:"抽走刺激之后，不得自行补救；双手须被按住至身体的痉挛完全平息。",en:"After the withdrawal, no self-remedy is permitted; the hands must be pinned until the body's spasms fully subside."},b:{zh:"连续三次残缺之后，第四次给予完整而漫长的释放，直至身体完全脱力。",en:"After three consecutive ruined peaks, the fourth grants a complete and prolonged release, to bodily exhaustion."},m:{zh:"40 分钟",en:"40 min"}},
{t:3,n:{zh:"电流低语",en:"Electric Whispers"},l:"Electricitas",p:{zh:"专用电玩具的贴片附于大腿外侧或臀部——绝不用于胸口、颈项、及任何靠近心脏之处。自最低档始。第一档几乎只是麻痒，如虫足于皮下爬行——这份麻痒本身是新奇的，但尚不构成明显的性刺激。第二档化为清晰的、一跳一跳的脉冲，肌肉不受控地轻颤——两腿之间开始产生共鸣，那份脉冲感通过神经传导至更深处，令穴道开始不受控地一收一放。第三档，每次脉冲都像一根看不见的手指在皮下拨弦，全身随之抽搐；至更高档，每次脉冲之后有一段短暂的余韵，令神经处于持续的过载状态。电流是所有刺激中最陌生的一种——它绕过皮肤，直接与神经对话，没有任何常规刺激的对应参考。习惯它需要时间，而一旦身体开始理解它，那种被电流反复亲吻的感觉会成为一种独特的、无法用常规语汇形容的快感。每档停留一分钟，逐档奏报感受，共同寻到那条痒与受不了之间的线。",en:"Purpose-made electro pads on the outside of the thigh or the buttocks — absolutely never on the chest, neck, or anywhere near the heart. From the lowest setting. Setting one is nearly only itch, like insect feet crawling under the skin — the itch itself novel, but not yet an obvious sexual stimulus. Setting two shifts to a clear, one-beat-at-a-time pulse, muscle involuntarily twitching — between the thighs a resonance begins, the pulse transmitting through nerves to deeper places, the passage beginning to clench and unclench uncontrollably. Setting three — each pulse an invisible finger plucking a string beneath the skin — the whole body shuddering with it; up further, a short afterglow after each pulse leaves the nerves in sustained overload. Electricity is the strangest of stimuli — it bypasses skin and speaks directly to the nerves, with none of the usual points of reference. To get used to it takes time, and once the body begins to comprehend it, the sensation of being kissed again and again by current becomes a peculiar, unformulable pleasure. Each setting held one minute; report the sensation setting by setting; together seek the line between \“itch\” and \“can't take it.\”"},r:{zh:"绝对不跨越心脏，绝对不用于胸口、颈项、头部；心脏疾患或植入医疗设备者一律禁用。",en:"Absolutely never crosses the heart, never on chest, neck, or head; anyone with cardiac disease or implanted medical devices is excluded."},b:{zh:"自最低档起，每档满一分钟方可上调；发现异常反应（心悸、呼吸急促至危险程度）立即断电。",en:"From the lowest, one minute each level before adjustment upward; on any abnormal reaction (palpitation, breathing distress at danger degree), cut power at once."},m:{zh:"30 分钟",en:"30 min"}},
{t:3,n:{zh:"贞操之钥",en:"The Key"},l:"Cingulum",p:{zh:"锁扣合拢的一声轻响之后，钥匙挂上另一人的钥匙链——那一刻，高潮有了物理意义上的管理者。锁上之物或为专用贞操锁（女性用有笼状与板状两种设计），或为其他限制性装置。此后，沐浴时它在——须以特殊的方式清洁；安睡时它在——夜间勃起或欲望上涌时无处宣泄，只能眼睁睁看着自己被物理阻断；欲望上涌时伸手摸到的只有一圈冰凉的壳，那份被物理阻断的挫败感将快感转化为持续的低烈度渴望。这份渴望日日累积——第一日尚能忽略，第三日开始难以专注于日常工作，第七日整个人处于一种精神性的欲望焦渴状态，会因为任何微小的触发（一句话、一个眼神、一件衣物的摩擦）而全身为之一震。想要——便须去求——放软声线，陈述理由，甚至跪下讨要。等候持钥者的心情。此局最妙之处不在锁上，而在每一次意识到它存在的瞬间，都会想起钥匙在谁手里。",en:"After the click of the lock closing softly, the key is threaded onto the other's keyring — from that moment on, climax has a manager, in the physical sense of the word. The device may be a purpose-made chastity lock (with cage or plate designs for the anatomy in question) or another restriction. From then on, at shower time it is there — cleaning requires a particular procedure; at sleep time it is there — night arousal or want has nowhere to spill, only to be observed being physically shut down; at desire's rising, what the hand meets is only a ring of cold shell, and that physical block will convert pleasure into a persistent low-grade desire-thirst. That thirst accumulates day by day — first day may be ignored, third day begins to interfere with focus at daily work, seventh day the whole person is in a state of spiritual desire-drought, whole-body shivering at any small trigger (a word, a look, the friction of a garment). To want — is to have to ask — voice softened, reason offered, even kneeling to plead. Await the keyholder's mood. What is best in this scene is not the lock, but that in every moment of remembering it exists, one is reminded whose hand holds the key."},r:{zh:"每日须检查皮肤与血运，发现红肿、渗液、疼痛须立即开锁就医；任何异常均须终止。",en:"Skin and circulation checked daily; on redness, discharge, pain, unlock at once and seek medical care; any anomaly ends the scene."},b:{zh:"锁期由持钥者定，但受锁者随时可要求解锁——不问理由。持钥者须在合理时间内应允。",en:"Lock period set by the holder, but the locked may at any time request unlocking — no reason needed. The holder must, in reasonable time, grant."},m:{zh:"数天",en:"days"}},
{t:3,n:{zh:"薄衣赴宴",en:"Thin Dress to the Party"},l:"Publicum",p:{zh:"外出晚餐，赴一场正式的场合——高级餐厅或时尚聚会。须着指定的那一件——质地软而薄的丝质料子，行走时布面随身体每一寸的起伏而流动，懂的人多看一眼便知里面空无一物。整顿饭须佯装若无其事：点菜时语气自然，与同伴交谈时谈笑风生，卷起意面时优雅从容——同时时刻意识到自己下方的空虚，意识到餐桌对面那道一遍遍剥开自己的目光。冷气拂过时布面会顶起两点——细心的服务生或许会瞥一眼但礼貌地移开视线，那份被看见又被礼貌回避的双重感受令乳尖变得更为敏感；伸手够外套的手会被同伴按住，只听一句：不冷。这份公开秘密的双重体验将平凡的一餐变为漫长的前戏——每一次布料摩擦皮肤，每一次同伴的意味深长的眼神，都在积累一场终将回家爆发的欲望。到餐末，服从方的下体已经因为整晚的心理刺激而彻底湿透，那件薄裙内侧留下的印记将成为归家路上最直接的证据。",en:"Out to dinner, at a formal occasion — an upscale restaurant or fashion gathering. Wear the specified piece — a soft, thin silk, the fabric flowing with every rise and fall of the body as one walks, one glance from a knowing eye enough to establish that beneath it there is nothing at all. The whole meal must be carried off as if nothing: order in natural voice, converse with a companion with ease, twist pasta with elegance — while at every moment conscious of the emptiness below, conscious of the gaze across the table peeling one open again and again. At a draft's passing the fabric will lift into two small points — the observant server may glance once and politely look away, and that dual sensation of being seen and being politely evaded makes the nipples more sensitive still; the hand reaching for a jacket is pressed down by the companion, only: not cold. This dual public-secret experience turns a plain meal into extended foreplay — each brush of fabric against skin, each meaningful look from the companion, accumulates a desire that will eventually burst on the way home. By the meal's end, the sub's lower body will, from the whole evening's psychic stimulus, have gone thoroughly soaked, and the print left on the inside of that thin skirt will be the most direct evidence on the ride home."},r:{zh:"限于能被看出，不能真正暴露的界线；不得影响他人、不得引起服务生的不适。",en:"Bound by the line of \“legibly, not truly exposed\”; not to inconvenience others or trouble the servers."},b:{zh:"全程须有同伴陪同；受装者说撤即刻离场——受装者的舒适度优先于任何完成本局的执念。",en:"A companion is required throughout; the wearer says withdraw, leave at once — the wearer's comfort takes priority over any \“complete the scene\” impulse."},m:{zh:"120 分钟",en:"120 min"}},
{t:3,n:{zh:"全然封闭",en:"Total Enclosure"},l:"Clausura",p:{zh:"眼罩挡去光线——一片纯粹的黑，甚至比闭眼更彻底，因为无光线自眼睑透入；耳塞塞入耳道，外界声音降至几近于无，只剩自己心跳与呼吸声异常清晰；四肢以皮带柔软地缚于床的四角，令身体呈完全展开的大字形；最后一层薄毯覆上，将身体包裹于自己的体温与黑暗之中。世界被彻底关在外面，人被彻底关进自己的身体里。一小时——无光，无声，无自由。只剩呼吸、心跳与毯子微微的重量。前十分钟是不安——一种被剥夺一切外部信息的深层恐惧，那种恐惧会激发一切原始本能，包括身体的防御姿态；继而是一种奇异的漂浮感——思绪消散，时间失去刻度，仿佛回到某个最初的、羊水中的、混沌的地方。此时任何轻微的触碰——一根手指划过腹部、一片布拂过大腿——都会被放大成惊天动地的事件。被封闭者手中系着一根应急绳，通向守护者——拉一下，一切立即打开。守护者将全程在场，看着此人沉下去，再等待其浮上来。",en:"Blindfold takes the light — a pure black, more thorough than closing the eyes because no light comes through the lids; earplugs sink external sound to nearly none; four limbs soft-tied by leather to the four corners of the bed, the body opened to a full X; last, a thin blanket covers, wrapping the body inside its own warmth and the darkness. The world is shut out; the person is shut into their own body. An hour — no light, no sound, no freedom. Only breath, heartbeat, and the blanket's slight weight. The first ten minutes are unease — a deep fear at being deprived of every external input, a fear that will call forth every primal instinct, including the body's defensive stance; then arrives a strange sensation of drifting — thought disperses, time loses graduation, as if returned to some first, amniotic, chaotic place. At that point any small touch — a finger drawing across the belly, a piece of cloth brushing the thigh — will amplify into a world-shaking event. In the hand of the enclosed a call-cord runs to the guardian — one pull, everything opens at once. The guardian remains present through the whole scene, watching this person sink down, and waiting for them to surface."},r:{zh:"应急绳一端系于被封闭者手中，一拉即开；守护者全程于同室内，不得离开；每十分钟须检查皮肤温度。",en:"The call-cord is tied one end in the enclosed's hand, opens at one pull; guardian stays in the room throughout, may not leave; every ten minutes check skin temperature."},b:{zh:"开启之后不急于交谈——先拥抱不少于十分钟，令神志缓慢回归；此后再谈本局体验。",en:"After opening, do not rush to converse — hold not less than ten minutes first, let the mind slowly return; then discuss the experience."},m:{zh:"60 分钟",en:"60 min"}},
{t:3,n:{zh:"周末人格",en:"A Weekend as Another"},l:"Persona",p:{zh:"周五晚八时，角色降临：或为被购入的猫娘（须持有猫耳、尾饰、项圈、以及喵作为主要发音），或为年长的监护者与年幼的被监护者（须约定称呼、月零花钱、门禁时间等设定），或为某段禁忌关系中的两人（血缘、师生、雇主雇员皆可），或为完全虚构的人物（异世界公主与其骑士）。设定提前写好，边界提前画死——哪些行为允许、哪些绝对禁止、哪些属于灰色地带须双方现场协商。而后是整整两日的沉浸：以角色的称谓用早餐，以角色的规矩过白天，以角色的身份就寝——做饭是戏，散步是戏，斗嘴也是戏；甚至私密时刻也须以角色的语言、姿态、情感反应完成。整整四十八小时之内，人格结构会开始发生微妙的调整——不是替换，而是层叠：真实的自己在下层观察，角色的自己在上层生活，两者之间的对话本身即是一场深层的自我探索。周日夜里落幕之时，会有一种自另一段人生中醒来的恍惚——那四十八小时里，两人都是别人，又比任何时候都更是自己。",en:"Friday, eight in the evening, the role descends: perhaps a purchased catgirl (must hold cat-ears, tail, collar, and \“meow\” as principal vocalization), perhaps an older guardian and a younger ward (must agree address, monthly pocket money, curfew, and so on), perhaps two people in some forbidden relation (blood, teacher-student, employer-employee all serve), perhaps wholly fictional characters (an isekai princess and her knight). The setting is written in advance, boundaries drawn to death — what actions permitted, what absolutely not, what a grey zone requires on-site consultation. Then follow two whole days of immersion: breakfast in the role's honorific, the daytime by the role's rule, sleep in the role's identity — cooking is theatre, walking is theatre, bickering is theatre; even the private times must be executed in the role's language, posture, emotional register. Across the whole forty-eight hours, the structure of the personality will begin a fine adjustment — not replacement, but layering: the real self observes below, the role's self lives above, and the dialogue between them is itself a deep self-inquiry. Sunday's fall of the curtain will carry a bewilderment of waking from another life — in those forty-eight hours both were someone else, and more themselves than at any other time."},r:{zh:"设定内容、许可范围、禁止事项、以及最重要的——出戏暗号——须提前书面写明。",en:"The setting's content, the range of permission, the forbidden items, and most importantly the out-of-scene phrase, must be written down in advance."},b:{zh:"出戏暗号一旦说出，立即恢复常态，不作追问；此后二十四小时不再重启此角色。",en:"Once the out-of-scene phrase is spoken, return to ordinary state at once, no further inquiry; do not restart this role for twenty-four hours."},m:{zh:"48 小时",en:"48 hr"}},
{t:3,n:{zh:"极限尺寸",en:"Extreme Size"},l:"Maximum",p:{zh:"扩张器自最日常的号数起步（约同平日使用之器具的尺寸），一路向上，走到今日的边界为止。每一号停留十分钟——润滑液厚涂，深呼吸，令穴道深处那圈肌肉自抗拒转为接纳。快感与胀感的比例逐号变化：起初以快感为主，胀感为辅；至某个临界点后，胀感开始超过快感——但那份被撑至极限的胀感自有其独特的魅力，介于痛与爽之间，被称为甜蜜的过载。愈近极限，推进愈须慢到无聊——不是一号一号地跳，而是同一号中一毫米一毫米地深入，令穴道有充足的时间调整。某一号会卡住，任凭如何放松都进不去了——那里便是今日的国境线。将数字记下——这串数字是只属于局中人的地图坐标，外人永远无从知晓。而每一次抵达新的极限之后，穴道会保留一份深层的记忆——下次同样的号数进入时，身体的接纳会明显加快，仿佛每一次极限探索都在打开身体的新领地。",en:"The dilator starts at the most habitual number (about the size of the ordinary implement in use), climbs, and stops at today's border. Each number held ten minutes — lubricant thickly laid, deep breath, the ring of muscle in the deep of the passage shifting from refusal to acceptance. The ratio of pleasure to swelling shifts number by number: begins with pleasure predominant, swelling supporting; at some critical point swelling begins to surpass pleasure — but that widened-to-the-limit swelling has its own peculiar charm, between pain and pleasure, called \“sweet overload.\” The closer to the limit, the more the advance must slow to \“boring\” — not jumping from number to number, but within the same number advancing a millimeter at a time, so the passage may take time to adjust. One number will not admit — however relaxed, it will not — that is today's national border. Write down the number — this string of digits is a coordinate on the map belonging only to those in the scene, outsiders can never know. And each arrival at a new limit stores a deep record for the passage — next time the same number goes in, the body's acceptance will speed markedly, as if each limit-exploration opens some new territory of the body."},r:{zh:"推进以慢到无聊为准；任何撕裂、出血、剧烈疼痛立即终止，其后一周不得再动此处。",en:"Advance goes by \“boring is the standard\”; any tearing, bleeding, sharp pain ends the scene at once; that place is not touched again for a week."},b:{zh:"记录今日抵达之数字；该数字仅存于局中人之间，不外传，不比较，仅作二人共同前行的坐标。",en:"Log today's number; the number exists only among the scene's participants, not shared out, not compared, only as the two's shared forward coordinate."},m:{zh:"90 分钟",en:"90 min"}},
{t:3,n:{zh:"温水灌注",en:"Warm Water Infusion"},l:"Lavatio",p:{zh:"专用器具（灌肠球或专业设备），接近体温的清水（约三十六至三十七度），少量（初次不超过二百毫升）。受注者侧卧屈膝，身体呈胎儿式蜷缩——那种被动、开放、且脆弱的姿势本身即是本局的基调。温水缓缓注入的过程中，小腹深处会升起一种陌生的、缓慢的胀满感——不痛，但存在感极强，如同身体内部被轻轻撑开了一个新的维度。那份充盈自肠道深处向外辐射，令下腹隆起微微的弧度，用手掌覆上小腹能明确感到一种活的、流动的存在。保持数分钟不释放，感受它，如实奏报感受——胀至几分、有无痉挛、有无排出的强烈欲望。这段时间内可施以其他刺激（爱抚、亲吻），令感官交叠——腹内的胀满与外部的爱抚会产生一种奇特的干涉，令平日熟悉的爱抚变成陌生的、更为深层的刺激。而后释放。此条目与其说是玩法，更像一场对身体陌生区域的探险：安静，缓慢，须以绝对信任为底色。",en:"A purpose-made implement (a clean bulb or a professional device), water at near-body temperature (about thirty-six to thirty-seven degrees), a small quantity (first time not exceeding two hundred milliliters). The receiver lies on the side, knees drawn up, the body foetal-curled — a passive, open, vulnerable pose that is itself the scene's tone. During the slow infusion of warm water, a strange, slow full will rise from the deep of the belly — not painful, but of extreme presence, as if the interior of the body has been widened along a new dimension. The full radiates outward from the depth of the bowel, so the belly rises a small arc; a palm laid across the abdomen can distinctly feel something alive and flowing. Hold a few minutes without release, feel it, honestly report the sensation — swelling to what number, any spasm, any strong urge to release. In that time, other stimuli may be applied (caress, kissing), for sensory overlap — internal fullness and external caress will interfere strangely, so the familiar caress becomes strange, deeper stimulus. And then, release. This entry is not so much a scene as an expedition into unfamiliar country of the body: quiet, slow, on absolute trust."},r:{zh:"水温须接近体温不得过热；量须严格控制在二百毫升以内；绝不添加任何物质；腹痛立即终止。",en:"Water temperature at near-body, not overheated; volume strictly within two hundred milliliters; nothing added, ever; abdominal pain ends the scene at once."},b:{zh:"事毕须休息不少于两小时；当日不再行任何后穴条目；补充电解质水。",en:"After, rest not less than two hours; no other back-passage entries the same day; replenish electrolytes."},m:{zh:"60 分钟",en:"60 min"}},
{t:3,n:{zh:"银针列阵",en:"Row of Silver Pins"},l:"Acus",p:{zh:"一次性无菌针（医用采血针最为常见），仅穿透表皮浅层。手法与针灸相似但取穴不同——沿肩胛线或臂线排出一列对称的银点，每根针间隔约一厘米，排列须工整。每一根刺入的瞬间是一记极细的、锐利如闪电的痛，随即化为微热，如小型的伤口在皮下呼吸。行家形容它介于针灸与纹身之间的体验：痛感本身不重（远轻于打耳洞），重的是仪式感——皮肤上那列整齐的银针，如某种臣服的勋章，如身体成为祭坛的宣告。行刑者的手须极稳，每一针的深度须一致，每一针之间的距离须精确。受术者可看着自己身上一根根竖起的银针，心跳每一次都令那些针微微颤动——那份自己的身体成为可见的仪式载体的感受，是本局的核心。刑毕将针一根根拔出——那一瞬皮下的血珠会微微渗出，如一列小小的红宝石。但其无菌要求是医疗级别的：手套、酒精、锐器盒、事后消毒，一步不可省。未经系统学习者，令其留在文字里。",en:"Single-use sterile needles (a medical lancet is most common), through the epidermis only. The method resembles acupuncture but the chosen points differ — along the shoulder line or the arm line, a symmetric row of silver dots is set out, each needle spaced about a centimeter, arrangement squared. Each puncture's instant is an extremely fine, lightning-bright sting, then converts to slight warmth, as if a small wound breathes beneath the skin. Practitioners describe an experience between acupuncture and tattooing — the pain not heavy (much lighter than an ear piercing), the ritual heavy: the neat row of silver pins on the skin, like a badge of yielding, like the body announced as altar. The practitioner's hand must be extremely steady; each needle's depth uniform; each needle's spacing exact. The practiced may look upon the row of pins on their own body, each heartbeat setting them slightly a-tremble — that sensation of one's own body becoming a visible ritual is the scene's core. After: pull the needles out one by one — at each moment a tiny bead of blood beads at the skin, like a row of small rubies. But its sterility requirement is at the medical grade: gloves, alcohol, sharps container, post-sterilization, not a step to skip. Not systematically trained, keep it to the page."},r:{zh:"全套无菌操作，缺一不可；任何感染病史（HIV、乙肝、丙肝等）双方均须提前告知；针不得复用。",en:"Full sterile procedure, none skippable; blood-borne infection history (HIV, hepatitis B/C, etc.) disclosed in advance by both parties; no needle re-use."},b:{zh:"须经真正的学习方可施行——阅读专业资料、观摩教学视频、寻找有经验的引导者。",en:"Actual practice requires real study — read professional literature, watch instructional videos, find an experienced guide."},m:{zh:"60 分钟",en:"60 min"}},
{t:3,n:{zh:"钝刃巡游",en:"Blunted Blade"},l:"Dorsum",p:{zh:"施术前，将刀举至受者眼前——一柄真实的刀，可以是水果刀、亦可以是仪式性的短刀——令受者亲手抚过刃口，亲眼确认它是钝的、或以特殊工艺磨得刃口无法割破皮肤。这一确认过程本身即是本局的前奏——因为此后所有的恐惧都建立在明知无害的认知之上，反而令那份原始的、动物性的畏惧更为鲜明。而后戴上眼罩。接下来冰凉的金属贴上皮肤——刀背沿脊柱缓缓下行，每一节脊椎都能清晰感到金属的凉意；刀侧平贴肩胛骨转弯，一段冰凉的抚触；偶以刀尖极轻地点一下腰窝——那一记不痛却令全身的鸡皮疙瘩瞬间竖起，一直蔓延至发梢。明知是钝的，但金属的凉意与刀这个概念本身，会令每寸被划过的皮肤绷紧、战栗、起满细粟。受者的呼吸会不自觉地变浅、变急，每一次金属触碰皮肤的瞬间，身体都会本能地颤抖，即便理智告诉它这不会造成伤害。本局玩的自始至终不是伤口，是脑中那根被恐惧拉满的弦。",en:"Before the scene, lift the knife to the sub's eyes — a real knife, a fruit knife or a ritual short blade — have the receiver put their own hand across the edge, verify with their own eye that it is blunt, or the edge polished by a particular process so it cannot break skin. This verification is itself the scene's overture — because every fear that follows is built on the knowing-it-is-harmless, and this makes the primal, animal dread all the more vivid. Then the blindfold goes on. Then cold metal to skin — the blade's back travels slowly down the spine, each vertebra registering the metal's cold with total clarity; the flat of the blade level with the shoulder blade in an arc, a stretch of cold caress; occasionally the tip pressed very lightly at the small of the back — that touch does not hurt but the goosebumps of the whole body rise at once, spreading to the ends of the hair. Knowing it is blunt, the metal's chill and the notion of \“knife\” itself will draw taut every inch of skin, tremble it, raise fine grain. The receiver's breath will unbidden turn shallow and fast, and at every touch of metal to skin the body will reflexively shiver, though the mind knows this will do no harm. This scene from beginning to end is not about a wound; it is about a string in the head drawn taut on fear."},r:{zh:"刃口须事先当面验明为钝或经特殊工艺处理；本局的对象是恐惧，不是皮肤；出现任何真实划痕立即终止。",en:"The blade must be verified blunt or specially-processed at the outset, face-to-face; the object of this scene is the fear, not the skin; on any true scratch, end the scene at once."},b:{zh:"终局不得有一道破皮——有，即为执刀者之失，须自行认罚。",en:"At the scene's close there must not be one break of skin — if there is, the wielder is at fault, and must acknowledge and take penalty."},m:{zh:"30 分钟",en:"30 min"}},
{t:3,n:{zh:"火光掠影",en:"Flame's Pass"},l:"Ignis",p:{zh:"酒精棉球点燃于镊子夹持之下，蓝色的火苗于暗室中几近透明——这份视觉上的美丽是本局的魅力所在。它贴着皮肤快速掠过——绝对不是停留，仅仅是掠过，快到热度方抵皮表便已离开，留下一道转瞬即逝的暖流与心跳漏掉的半拍。火光映在受者瞪大的瞳孔里，那份原始的对火焰的敬畏令场景充满仪式感。看着一团活的火焰在自己身体上方跳跃的感受，与理智地知道它不会造成伤害的认知之间的张力，是本局的核心体验。此为极少数看着比感受更烈的玩法：视觉的惊心动魄远超实际的温度感受。棉球的燃烧时间须极短（不超过数秒），掠过的路径须预先规划，避开所有毛发覆盖之处、私密处、以及靠近粘膜的部位。但其容错率趋近于零——一次判断失误、一次风向变化、一次手抖，即可能造成真实的烧伤。多数时候，令它只活在文字里为佳。",en:"An alcohol-soaked cotton ball lit within tweezers, the blue flame nearly transparent in a dark room — this visual beauty is the scene's appeal. It passes over skin very fast — absolutely not stop, only pass, fast enough that the heat has barely reached the skin's surface before it has already left, leaving a fleeting warm current and a heartbeat's missed beat. Firelight reflected in the receiver's dilated pupils, that primal reverence for fire gives the scene its ritual air. The tension between watching a living flame leap above one's own body and knowing rationally that it will not inflict harm is the scene's core experience. This is one of the few plays where \“looks worse than feels\” — the visual is dwarfed by the actual temperature reception. The cotton ball's burn must be very short (not exceeding a few seconds), the path of the pass planned in advance, hair-covered areas, private parts, and areas near mucosa all avoided. But the tolerance approaches zero — one misjudgment, one shift in air, one hand shake, may cause real burn. Most of the time, better it live only in words."},r:{zh:"灭火湿毛巾必须置于伸手可及处；头发须完全束起；绝对避开毛发、粘膜、以及一切易燃部位。",en:"A wet towel for extinguishing must be within reach; hair fully tied back; absolutely avoid hair, mucosa, and all flammable areas."},b:{zh:"未经专业训练者，本条目仅作文字演绎——描写与幻想可以极致，实际施行须待学习之后。",en:"Untrained: entry is fantasy only — the writing and imagining may be extreme, actual practice awaits training."},m:{zh:"30 分钟",en:"30 min"}},
{t:3,n:{zh:"彻底失守",en:"Total Undoing"},l:"Effusio",p:{zh:"床上先铺好厚厚的防水垫与吸水毛巾——因为本局的终点线，画在彻底失去控制的地方。不是一次顶点即止，而是穿过它继续。第一次抵达时，穴道深处的规律痉挛如约到来——但施术不停；第二次时，那份痉挛更为剧烈，全身开始颤抖——继续；第三次时，一小股温热的液体开始自穴口渗出——那是身体开始失守的第一信号；越过某个临界之后，身体会放弃管理一切阀门——潮水一波接一波自穴口涌出，与别的什么混作一处，床垫湿成一片沼泽；抽泣与尖叫混杂，语言功能退化为破碎的音节；而人已分不清也顾不上，只剩痉挛、失禁、被贯穿。至此，服从方进入一种彻底的、无法回头的失控状态——那种失控不是屈辱，而是解脱：所有平日的自控、体面、边界都被冲垮，剩下的只是最原始的、被彻底占有的身体。彻底的失控即彻底的交付。事毕，由主导方抱入浴室，自发梢洗到足尖——这份事后的照护是本局不可分割的一部分。",en:"Set the bed thick with waterproof mat and towels — because this scene's finish line is drawn where all control breaks down. Not one peak and done, but through it, and on. First arrival: the deep's regular spasms as promised — but the work does not stop; second: those spasms more violent, the whole body shivers — continue; third: a small stream of hot fluid begins to escape from the entrance — the first sign that the body has begun to unlatch; over some threshold, the body relinquishes management of every gate — the tide waves out through the entrance one after another, and mingles with other things, the mattress soaked into a marsh; whimper and cry mingle; language deteriorates to broken syllables; and the person can no longer tell and no longer cares, only spasm and incontinence and being run through remain. By then, the sub has entered a total, unreturnable state of loss of control — that loss of control not humiliation but release: all daily self-restraint, decorum, and boundary are washed out, and what remains is only the most primitive body, the wholly-possessed body. Total undoing is total delivery. After, be gathered up by the Dom and carried to the bath, washed from crown to toe — this after-care is inseparable from the scene."},r:{zh:"防水垫须先行铺设厚实；每二十分钟须补充水分（须暂停饮水，不可强灌）；观察脱水症状。",en:"Waterproof mat first thickly laid; hydration replenishment every twenty minutes (must pause to drink, no forced fluid); observe for dehydration."},b:{zh:"事毕由主导方全程负责清洗——自发梢至足尖，包括更换床单、擦干身体、拥入怀中入眠。",en:"After, the Dom is fully responsible for cleaning — from crown to toe, including changing sheets, drying, holding into sleep."},m:{zh:"90 分钟",en:"90 min"}},
{t:3,n:{zh:"双穴同御",en:"Two Passages Together"},l:"Ambo",p:{zh:"前方为人体（真实的柱身），后方为提前润滑扩张的器具（专用的后穴玩具）——或反其道而行，前方器具后方为人。两处同时被填满的一瞬间，会发出一种从未听过的声音——那不是两倍的满，是指数级的：因为两条通道之间仅隔一层薄壁，任何一方的每一次动作都会隔着那层壁推挤到另一侧，两种节奏在体内正中互相干涉、叠加、共振。前方一记深顶，后方的器具随之被向前推进；后方轻微的旋转，前方的柱身能清晰感到那份震动。人被夹在中间，进也是撞、退也是撞、静止也是被两侧同时挤压——很快只剩颤抖，语言功能全部退化，只有本能的呻吟。而这份被同时占据的、无处可逃的填满感会将全身的感官过载至一种超越平日体验的境地——大脑会短暂地进入一种近乎晕眩的空白状态，那种空白之中反而生出一种奇特的清明与解脱。规矩越严，玩得越尽兴：器具绝对分开、润滑绝对分开、中途须清洁——这些细节是本局能够安全进行的前提。",en:"The front is a person (a real shaft); the back is a pre-lubricated, pre-dilated implement (a purpose-made back-passage toy) — or the reverse, front implement, back person. At the moment two places are filled at once, a sound not previously heard emerges — that is not double fullness, but exponential: because between the two channels lies only a thin wall, one side's every motion pushes through that wall to the other; two tempos, at the very center of the body, interfere, layer, resonate. A deep thrust up front, and the back's implement is pushed forward with it; a small twist behind, and the front's shaft can distinctly register the tremor. The person, wedged between, in-strokes as impact, out-strokes as impact, stillness as being pressed on both sides at once — very quickly reduced to tremor, language function wholly deteriorated, only the instinct's cry. And this simultaneous, no-exit fullness will overload the whole body's senses beyond ordinary experience, so the brain enters a briefly near-dizzy blankness, and out of that blankness a strange clarity and freedom is oddly born. The tighter the rule, the greater the enjoyment: implements strictly separate, lubricants strictly separate, mid-way cleaning — these details are the prerequisites for the scene's safe execution."},r:{zh:"前后所用器具与润滑液绝不互换；中途切换主动位时须停下清洁；任一侧不适立即终止。",en:"Front and back implements and lubricants absolutely not swapped; on mid-way active-position swap, pause to clean; any-side discomfort ends the scene."},b:{zh:"任何一侧发生不适即停——本条目不以完成论英雄，安全度过本局本身即是成功。",en:"Any-side discomfort — stop. This entry is not judged by \“completion\”; safe passage through the scene is itself success."},m:{zh:"60 分钟",en:"60 min"}},
{t:3,n:{zh:"眠中之约",en:"Sleeping Assent"},l:"Somnus",p:{zh:"约定生效的数日之内，每晚入睡都带一丝甜的悬念：今夜会不会。约定的范围须事先详尽讨论——允许触碰哪些部位、允许进入到何种程度、允许持续多久、觉醒之后如何进行。或许在半夜的朦胧中察觉被角被轻轻掀起，一双手贴着睡衣下摆自足踝缓缓上行——梦与现实的界限模糊，身体先于意识作出反应；或许是在半梦半醒之间被缓缓进入的——那份熟悉的温热与充盈自穴道深处唤醒神志，梦的残片与真实的快感搅在一处，睁眼时已在浪的中央；或许是被口舌唤醒——温热的湿意自私密处传来，人在梦中先经历一场高潮，醒来时那份余韵尚未散去。这份介于梦与醒的中间地带自有其独特的心理色彩：意识的部分参与令身体的反应更为诚实（无法压抑，无法掩饰），而梦境的滤镜又令整个体验带上一层不真实的柔软。事前将范围议定，事中随时可停——余下的，便是这种介于梦与醒之间的、最暧昧的被打开方式。",en:"Over the days the assent is in effect, each night's sleep carries a sweet suspense: tonight, will it. The scope of the assent must be discussed exhaustively in advance — which parts may be touched, how far entry may go, how long it may last, how, upon waking, the scene should proceed. Perhaps in the small hours' haze the sub notices the corner of the sheet gently lifted, a hand from the sleep-hem creeping slowly up from the ankle — dream and reality blurred, body reacting ahead of mind; perhaps entered slowly mid dream-and-waking — that familiar warmth and fullness rousing the mind from the deep of the passage, the dream's residue and real pleasure churning together, waking finds one in the middle of the wave; perhaps awakened by mouth and tongue — the warm wet arriving from the private place, the person experiences an orgasm in the dream first, waking finds the afterglow not yet passed. This zone between dream and waking has its own peculiar psychic hue: the partial participation of consciousness makes the body's reaction more honest (unable to suppress, unable to disguise), and dream's filter lays over the whole experience a layer of unreality's softness. Fix the scope in advance, may stop at any time within — the rest is this most ambiguous of ways of being opened."},r:{zh:"提前一日议定具体许可范围与禁止事项；醒来说停即刻停止，不问理由；须绝对信任方可行此局。",en:"The specific range of permission and the specific forbidden matters must be settled one day in advance; on waking, stop at \“stop,\” no reason needed; the practice requires absolute trust."},b:{zh:"醒来的第一时间须被抱入怀中，确认对方是谁、身处何处；随后可选择继续或休息。",en:"The first moment of waking, be gathered into arms; confirm who the other is, where the sub is; continue or rest is then choice."},m:{zh:"不定",en:"variable"}},
{t:3,n:{zh:"暗语驯化",en:"Password Conditioning"},l:"Signum",p:{zh:"选定一个词——一个平平无奇、日常对话中能自然出现的词（如某种食物名、某个地名、某个日常动作）。而后开始训练：每次在私密时刻抵达顶点的那一刻，主导方在耳边说出它；一次，十次，数十次，令身体的下意识将这个词与那种极致快感焊死在一起，形成条件反射。这是一场以月为单位的长期工程，每一次快感峰值时的重复都是一次巴甫洛夫式的建构——直到某一天，那个词单独出现时，身体会不受控地作出与快感相同的反应：脸红、心跳加速、下腹一阵酥麻、乃至下体轻微的湿润。经过数月的训练，这个词便成为一枚藏于语言中的隐形开关：某日在超市排队，一人俯身在另一人耳边轻轻说出那个词——当场腿软、脸红、狠狠一记眼刀飞来，而四周的人一无所知，只以为是普通的耳语。这份专属于二人的秘密武器可用于无穷多的场景：正式聚会中、公开演讲的间隙、家庭聚会时。它是最亲密的暗语，也是最强大的调情工具——因为它令二人始终生活在一层旁人无法进入的私密语境之中。",en:"Select a word — an ordinary, plain, everyday word that can arise naturally in normal conversation (a food name, a place name, a daily action). Then begin training: at each private-time peak, the Dom speaks it into the sub's ear at the moment; once, ten times, dozens, welding the body's subconscious to that word to that ultimate pleasure into a reflex. This is engineering measured in months, each repetition at peak's height a Pavlovian construction — until one day, the word alone, appearing in another context, will draw the same-shape response from the body: blush, quickened heart, a tingle across the lower belly, and even faint moisture below. After months of training, the word becomes a hidden switch buried in the language: one day in a supermarket queue, one leans over to the other's ear and softly says the word — that person softens at the knees, blushes, throws a sharp look, and the surrounding people don't know a thing, only think it a private endearment. This weapon particular to the two of them can be used in innumerable scenes: in a formal gathering, in the pauses of a public address, at a family reunion. It is the most intimate secret code and the strongest tool of flirtation — because it keeps both parties living within a private linguistic frame no outsider may enter."},r:{zh:"须长期重复训练；每次说出须精确配合快感峰值；不得于非私密场合过早测试。",en:"Requires long repetition; the utterance must precisely coincide with the peak; do not test prematurely in a non-private setting."},b:{zh:"练成之后，任何场合一个词即可令对方腿软——但主导方须节制使用，此工具的力量在于稀缺。",en:"Once trained: in any setting, one word will soften the other at the knees — but the Dom must moderate use, this tool's power lies in scarcity."},m:{zh:"长期",en:"long-term"}},
{t:3,n:{zh:"旷野之行",en:"Journey to Wilderness"},l:"Rus",p:{zh:"驾车一路向人迹稀少之处而去，导航上的道路越来越细，路灯越来越稀，最终停在一片没有信号灯、只有虫鸣的野地——山野、湖畔、林中空地皆可。车门推开，夜风扑上皮肤——那份自由的、带着草木气息的野风本身即令人的呼吸放大——而后是全脱。天为被，地为床（预先铺好毯子），人赤条条地立于旷野正中，头顶是真实的星空（远离城市灯光时可见的、几乎不真实的密集星辰），四面八方是真实的黑暗。文明与体面被留在数十公里外，剩下的是最原始的两具身体与撒野的自由——可以放声呼喊，可以肆意呻吟，可以喊到惊起一片飞鸟。夜风拂过赤裸的皮肤，那份寒意与体温之间的对比令感官格外敏锐；星光下依稀可见对方身体的轮廓，那份朦胧的美感令熟悉的姿势重获陌生的浪漫；虫鸣与心跳声交叠，构成一种远古的、原始的背景音。这份体验一生难得——它令性爱回归到一种近乎宗教仪式的、天地为证的原始状态。归程之上，须保持无衣状态坐于副驾。",en:"Drive to a sparsely-peopled place, road on the map narrowing, streetlights thinning, arriving at last on a lightless patch of land — a hillside, a lakeshore, a clearing in a wood. The car door opens, the night wind is on the skin — that free, plant-laced wild wind by itself amplifies the breath — and then all clothing off. Sky as bedding, earth as bed (a blanket down first), the person stripped-naked upright in the center of the wild, above stars real (in that density that appears when far from city light), on every side true dark. Civilization and decorum have been left tens of kilometers back, and what remains are two most-original bodies and a wild's freedom — voice may be given, moan lavished, screamed loud enough to startle a flight of birds. The night wind across the bare skin — that chill against body-warmth registers to sharpen every sense; the outlines of the other visible only faintly in starlight, that blur returns romance freshly-strange to a familiar posture; insect-cry and heart-beat overlap into a background as ancient and primal as any. This experience will not be had a second time in a life — it returns lovemaking to something near a religious rite, a heaven-and-earth-witnessed primordial state. On the way home, keep the unclothed state in the passenger seat."},r:{zh:"车钥匙、衣物、饮水、手机（保持有信号）须置于伸手可及处；天气须提前查证；不得选择保护区或私人领地。",en:"Keys, clothes, drink, phone (kept in signal) all within reach; check the weather in advance; do not choose protected land or private ground."},b:{zh:"归程全程保持无衣状态坐于副驾——那份于夜色中被驾车者的目光反复瞥见的暴露感，是本局的余韵。",en:"The return trip is spent entirely without clothing in the passenger seat — that repeated glance from the driver in the dark is the scene's after-taste."},m:{zh:"120 分钟",en:"120 min"}},
