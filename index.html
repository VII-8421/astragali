<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astragali · Nox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500;600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#050B16;
  --bg1:#0B1626;
  --mist:#DFF3EE;
  --mist-2:#9DBDB8;
  --mist-3:#5E7F80;
  --gold:#D9BE8B;
  --gold-d:#9A7F52;
  --t1:#7FFFD4;
  --t1g:rgba(127,255,212,.55);
  --t2:#40E0D0;
  --t2g:rgba(64,224,208,.55);
  --t3:#B08CFF;
  --t3g:rgba(176,140,255,.55);
  --t4:#FF4D6D;
  --t4g:rgba(255,77,109,.55);
  --serif:"Cormorant Garamond",Georgia,serif;
  --han:"Noto Serif SC",serif;
  --caps:"Cinzel",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg0)}
body{
  background:
    radial-gradient(ellipse 130% 55% at 50% -8%,rgba(64,224,208,.10),transparent 55%),
    radial-gradient(ellipse 90% 60% at 85% 100%,rgba(176,140,255,.06),transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 70%);
  color:var(--mist);
  font-family:var(--han);font-weight:400;
  min-height:100vh;
  padding:42px 20px 90px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}

.masthead{text-align:center;margin-bottom:6px}
.masthead h1{
  font-family:var(--serif);font-weight:500;font-style:italic;
  font-size:clamp(36px,8vw,46px);
  letter-spacing:.01em;line-height:1.05;
  color:var(--gold);
  text-shadow:0 0 26px rgba(217,190,139,.35);
}
.masthead .latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:14px;color:var(--mist-2);margin-top:8px;letter-spacing:.05em;
}
.orn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:18px 0 30px;color:var(--gold-d);
}
.orn::before,.orn::after{
  content:"";height:1px;flex:1;max-width:150px;
  background:linear-gradient(90deg,transparent,var(--gold-d));
}
.orn::after{background:linear-gradient(90deg,var(--gold-d),transparent)}
.orn svg{width:15px;height:15px;flex:none;filter:drop-shadow(0 0 6px rgba(217,190,139,.6))}

.tiers{display:flex;justify-content:center;gap:12px;margin-bottom:40px;flex-wrap:wrap}
.tier{
  background:rgba(255,255,255,.02);
  border:1px solid rgba(157,189,184,.22);
  border-radius:12px;
  cursor:pointer;padding:12px 0 10px;
  width:calc(25% - 9px);min-width:78px;
  text-align:center;font-family:var(--han);color:var(--mist-3);
  transition:all .3s;position:relative;overflow:hidden;
}
.tier .gem{
  width:16px;height:16px;margin:0 auto 8px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,var(--tc),transparent 130%);
  border:1px solid var(--tc);
  opacity:.4;transition:all .3s;
}
.tier .rn{font-family:var(--caps);font-size:13px;letter-spacing:.12em;display:block}
.tier .nm{font-size:11px;letter-spacing:.3em;display:block;margin-top:4px;padding-left:.3em}
.tier[data-on="1"]{
  color:var(--mist);
  border-color:var(--tc);
  box-shadow:0 0 22px -6px var(--tg),inset 0 0 18px -10px var(--tg);
}
.tier[data-on="1"] .gem{
  opacity:1;
  box-shadow:0 0 12px var(--tg);
  animation:gemPulse 2.6s ease-in-out infinite;
}
@keyframes gemPulse{
  0%,100%{box-shadow:0 0 8px var(--tg)}
  50%{box-shadow:0 0 18px var(--tg),0 0 30px var(--tg)}
}

/* ---------- dice arena ---------- */
.arena{
  display:flex;justify-content:center;align-items:flex-end;gap:56px;
  padding:34px 0 10px;min-height:250px;
  perspective:1100px;position:relative;
}
.diecol{display:flex;flex-direction:column;align-items:center}
.dielabel{
  text-align:center;font-family:var(--serif);font-style:italic;
  font-size:12.5px;color:var(--mist-2);margin-top:26px;letter-spacing:.06em;
}
.podium{
  width:110px;height:10px;border-radius:50%;
  background:radial-gradient(ellipse at center,var(--pg) 0%,transparent 70%);
  margin-top:-2px;filter:blur(4px);
  transition:background .5s;
}

/* --- pyramid d4 --- */
.pyr-stage{width:150px;height:170px;display:flex;align-items:flex-end;justify-content:center}
.pyr{
  width:130px;height:150px;position:relative;
  transform-style:preserve-3d;
  transition:transform 2s cubic-bezier(.16,.7,.22,1);
  animation:hoverY 4.5s ease-in-out infinite;
}
@keyframes hoverY{0%,100%{margin-bottom:0}50%{margin-bottom:12px}}
.pface{
  position:absolute;left:50%;bottom:6px;
  width:116px;height:138px;margin-left:-58px;
  transform-origin:50% 100%;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:
    linear-gradient(160deg,rgba(255,255,255,.28) 0%,transparent 34%),
    linear-gradient(200deg,var(--fc2) 0%,var(--fc1) 60%,var(--fc0) 100%);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:20px;
  backface-visibility:hidden;
}
.pface .rn{
  font-family:var(--caps);font-size:26px;letter-spacing:.04em;
  color:rgba(6,14,20,.82);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.pface::after{
  content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 60%);
  opacity:0;transition:opacity .4s;
}
.pyr.lit .pface::after{opacity:.5;animation:sheen 2.4s linear infinite}
@keyframes sheen{
  0%{transform:translateX(-60%)}
  100%{transform:translateX(60%)}
}
.pf1{transform:rotateY(0deg)   translateZ(33px) rotateX(24deg)}
.pf2{transform:rotateY(90deg)  translateZ(33px) rotateX(24deg)}
.pf3{transform:rotateY(180deg) translateZ(33px) rotateX(24deg)}
.pf4{transform:rotateY(270deg) translateZ(33px) rotateX(24deg)}
.pbase{
  position:absolute;left:50%;bottom:6px;
  width:96px;height:96px;margin-left:-48px;
  transform-origin:50% 100%;
  transform:rotateX(-90deg) translateZ(-6px) translateY(48px);
  background:rgba(5,10,18,.9);
  border:1px solid rgba(255,255,255,.08);
}

/* --- cube d6 --- */
.die{
  width:100px;height:100px;
  transform-style:preserve-3d;
  transition:transform 2s cubic-bezier(.16,.7,.22,1);
  position:relative;
  animation:hoverY2 4.5s ease-in-out infinite;
}
@keyframes hoverY2{0%,100%{margin-bottom:6px}50%{margin-bottom:18px}}
.cface{
  position:absolute;inset:0;border-radius:12px;
  background:
    linear-gradient(150deg,rgba(255,255,255,.20) 0%,transparent 40%),
    linear-gradient(180deg,#12273C 0%,#0A1626 100%);
  border:1px solid rgba(127,255,212,.35);
  box-shadow:
    inset 0 0 24px -8px rgba(64,224,208,.35),
    inset 0 0 0 1px rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;
}
.cface svg{width:64%;height:64%;color:var(--t2);filter:drop-shadow(0 0 5px var(--t2g))}
.cf1{transform:rotateY(0deg) translateZ(50px)}
.cf2{transform:rotateY(90deg) translateZ(50px)}
.cf3{transform:rotateY(180deg) translateZ(50px)}
.cf4{transform:rotateY(-90deg) translateZ(50px)}
.cf5{transform:rotateX(90deg) translateZ(50px)}
.cf6{transform:rotateX(-90deg) translateZ(50px)}

.actions{margin-top:26px;display:flex;justify-content:center}
.abtn{
  position:relative;cursor:pointer;
  background:linear-gradient(160deg,rgba(64,224,208,.16),rgba(64,224,208,.05));
  border:1px solid rgba(64,224,208,.55);
  border-radius:999px;
  font-family:var(--han);font-size:14.5px;letter-spacing:.4em;
  color:var(--t1);padding:15px 44px 15px calc(44px + .4em);
  transition:all .3s;overflow:hidden;
  text-shadow:0 0 12px var(--t1g);
  box-shadow:0 0 30px -10px var(--t2g),inset 0 0 22px -12px var(--t2g);
}
.abtn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
  transform:translateX(-110%);
}
.abtn:hover::before{transform:translateX(110%);transition:transform .8s}
.abtn:hover{box-shadow:0 0 44px -8px var(--t2g),inset 0 0 26px -10px var(--t2g)}
.abtn:active{transform:scale(.97)}
.abtn:disabled{opacity:.4;cursor:wait}

.hint{
  margin-top:16px;text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:13.5px;color:var(--mist-2);letter-spacing:.03em;
  min-height:22px;transition:color .4s;
}

.mute{
  position:fixed;top:16px;right:16px;z-index:5;
  background:rgba(255,255,255,.04);border:1px solid rgba(157,189,184,.25);
  border-radius:50%;width:38px;height:38px;cursor:pointer;
  color:var(--mist-2);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
.mute:hover{color:var(--t1);border-color:var(--t1)}

.langsw{
  position:fixed;top:16px;right:66px;z-index:5;
  display:flex;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid rgba(157,189,184,.25);
  border-radius:19px;height:38px;padding:0 4px;cursor:pointer;
  font-family:"EB Garamond",serif;font-size:13px;user-select:none;
  transition:.25s;
}
.langsw:hover{border-color:var(--t1)}
.langsw .lbl{
  padding:0 10px;color:var(--mist-2);letter-spacing:.08em;
  transition:color .3s;position:relative;z-index:1;
}
.langsw .lbl.on{color:#0b1220}
.langsw .knob{
  position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:32px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(127,255,212,.85),rgba(64,224,208,.85));
  transition:transform .3s cubic-bezier(.4,.2,.2,1);
  box-shadow:0 0 12px rgba(127,255,212,.35);
}
.langsw[data-lang="en"] .knob{transform:translateX(100%)}

/* ---------- result ---------- */
.card{
  margin-top:34px;position:relative;
  background:linear-gradient(170deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--ac);
  border-radius:16px;
  padding:30px 26px 22px;
  box-shadow:0 0 46px -12px var(--ag),inset 0 0 34px -20px var(--ag);
  animation:rise .6s cubic-bezier(.2,.75,.3,1);
}
@keyframes rise{
  from{opacity:0;transform:translateY(22px) scale(.97)}
  to{opacity:1;transform:none}
}
.card.hell{animation:rise .6s cubic-bezier(.2,.75,.3,1),hellPulse 3s ease-in-out infinite .6s}
@keyframes hellPulse{
  0%,100%{box-shadow:0 0 46px -12px var(--ag),inset 0 0 34px -20px var(--ag)}
  50%{box-shadow:0 0 70px -8px var(--ag),inset 0 0 44px -16px var(--ag)}
}
.c-corner{position:absolute;width:22px;height:22px;border:1px solid var(--ac);opacity:.8}
.c-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:16px 0 0 0}
.c-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 16px 0 0}
.c-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 16px}
.c-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 16px 0}

.c-top{text-align:center;margin-bottom:14px}
.c-num{
  font-family:var(--caps);font-size:12px;letter-spacing:.34em;
  color:var(--ac);padding-left:.34em;
  text-shadow:0 0 14px var(--ag);
}
.c-tier{
  display:inline-block;margin-top:10px;
  font-family:var(--han);font-size:10.5px;letter-spacing:.4em;
  color:var(--ac);padding:4px 14px 3px calc(14px + .4em);
  border:1px solid var(--ac);border-radius:999px;
  box-shadow:0 0 14px -4px var(--ag);
}
.c-name{
  font-family:var(--han);font-weight:600;
  font-size:clamp(23px,6vw,28px);letter-spacing:.12em;
  color:var(--mist);margin-top:14px;padding-left:.12em;
  text-shadow:0 0 24px var(--ag);
}
.c-latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:15px;color:var(--mist-2);margin-top:4px;
}
.c-div{
  display:flex;align-items:center;gap:10px;margin:16px 0 18px;
}
.c-div::before,.c-div::after{
  content:"";height:1px;flex:1;
  background:linear-gradient(90deg,transparent,var(--ac));opacity:.5;
}
.c-div::after{background:linear-gradient(90deg,var(--ac),transparent)}
.c-div span{
  width:6px;height:6px;transform:rotate(45deg);
  background:var(--ac);flex:none;
  box-shadow:0 0 10px var(--ag);
}
.sec{margin-bottom:15px}
.sec dt{
  font-family:var(--caps);font-size:9.5px;letter-spacing:.28em;
  color:var(--ac);margin-bottom:7px;
}
.sec dd{
  font-size:13.5px;line-height:2;color:#C6D9D5;
  text-align:justify;
}
.warnbox{
  margin-bottom:15px;padding:13px 15px;border-radius:10px;
  border:1px solid rgba(255,77,109,.4);
  background:rgba(255,77,109,.07);
}
.warnbox dt{
  font-family:var(--caps);font-size:9.5px;letter-spacing:.28em;
  color:var(--t4);margin-bottom:7px;
}
.warnbox dd{font-size:12.5px;line-height:1.9;color:#F2B9C4;text-align:justify}
.c-foot{
  margin-top:8px;padding-top:14px;
  border-top:1px solid rgba(157,189,184,.18);
  display:flex;align-items:baseline;gap:14px;
  font-size:12px;color:var(--mist-2);
}
.c-foot .dur i{font-style:normal;letter-spacing:.06em}
.c-foot .tm{
  font-family:var(--caps);font-size:17px;letter-spacing:.08em;color:var(--ac);
  text-shadow:0 0 12px var(--ag);
}
.c-foot .tbtn{
  margin-left:auto;background:none;border:none;cursor:pointer;
  font-family:var(--han);font-size:12px;color:var(--mist-2);
  letter-spacing:.1em;padding:2px 0;
  border-bottom:1px solid var(--mist-3);transition:.2s;
}
.c-foot .tbtn:hover{color:var(--ac);border-color:var(--ac)}

.log{margin-top:52px}
.log h3{
  font-family:var(--caps);font-weight:400;font-size:10px;
  letter-spacing:.38em;color:var(--mist-3);
  text-align:center;margin-bottom:16px;padding-left:.38em;
}
.log ol{list-style:none}
.log li{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;font-size:13px;color:#B9CFCB;
  border:1px solid rgba(157,189,184,.14);
  border-radius:10px;margin-bottom:7px;
  background:rgba(255,255,255,.02);
}
.log li .dot{
  width:8px;height:8px;transform:rotate(45deg);flex:none;
  background:var(--lc);box-shadow:0 0 10px var(--lg);
}
.log li .lt{margin-left:auto;font-size:11px;letter-spacing:.22em;color:var(--lc)}

.safe{
  margin-top:56px;text-align:center;
  font-size:12.5px;line-height:2.1;color:var(--mist-2);
}
.safe .sw{
  font-family:var(--han);font-weight:500;color:var(--t1);
  letter-spacing:.16em;padding:0 2px 1px;
  border-bottom:1px solid var(--t1);
  text-shadow:0 0 14px var(--t1g);
}
.safe .lt{
  display:block;font-family:var(--serif);font-style:italic;
  font-size:12px;margin-top:6px;color:var(--mist-3);
}

.star-p{
  position:fixed;z-index:9;pointer-events:none;
  font-size:13px;line-height:1;
  animation:fly .9s cubic-bezier(.15,.6,.4,1) forwards;
}
@keyframes fly{
  from{opacity:1;transform:translate(0,0) scale(1)}
  to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(160deg)}
}
@media(max-width:430px){
  .arena{gap:30px}
  .pyr-stage{width:126px;height:150px}
  .pyr{width:110px;height:132px}
  .pface{width:100px;height:120px;margin-left:-50px;transform-origin:50% 100%}
  .pf1{transform:rotateY(0deg) translateZ(28px) rotateX(24deg)}
  .pf2{transform:rotateY(90deg) translateZ(28px) rotateX(24deg)}
  .pf3{transform:rotateY(180deg) translateZ(28px) rotateX(24deg)}
  .pf4{transform:rotateY(270deg) translateZ(28px) rotateX(24deg)}
  .die{width:86px;height:86px}
  .cf1{transform:rotateY(0deg) translateZ(43px)}
  .cf2{transform:rotateY(90deg) translateZ(43px)}
  .cf3{transform:rotateY(180deg) translateZ(43px)}
  .cf4{transform:rotateY(-90deg) translateZ(43px)}
  .cf5{transform:rotateX(90deg) translateZ(43px)}
  .cf6{transform:rotateX(-90deg) translateZ(43px)}
}
</style>

<canvas id="sky"></canvas>
<button class="mute" id="mute" title="音效">♪</button>
<div class="langsw" id="langsw" data-lang="zh" title="Language / 语言">
  <div class="knob"></div>
  <span class="lbl on" data-lang-btn="zh">中</span>
  <span class="lbl" data-lang-btn="en">EN</span>
</div>

<div class="wrap">
  <div class="masthead">
    <h1>Astragali</h1>
    <div class="latin"><span data-i18n="subtitle">nox &middot; sortem iacta &middot; 掷出今夜的签</span></div>
  </div>
  <div class="orn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"/>
    </svg>
  </div>

  <div class="tiers" id="tiers"></div>

  <div class="arena">
    <div class="diecol">
      <div class="pyr-stage">
        <div class="pyr" id="pyr">
          <div class="pface pf1" data-f="1"><span class="rn">I</span></div>
          <div class="pface pf2" data-f="2"><span class="rn">II</span></div>
          <div class="pface pf3" data-f="3"><span class="rn">III</span></div>
          <div class="pface pf4" data-f="4"><span class="rn">IV</span></div>
          <div class="pbase"></div>
        </div>
      </div>
      <div class="podium" id="pod1" style="--pg:rgba(127,255,212,.35)"></div>
      <div class="dielabel" data-i18n="d1">Fatum &middot; 等级</div>
    </div>
    <div class="diecol">
      <div class="die" id="d2"></div>
      <div class="podium" style="--pg:rgba(64,224,208,.3)"></div>
      <div class="dielabel" data-i18n="d2">Numerus &middot; 编号</div>
    </div>
  </div>

  <div class="actions"><button class="abtn" id="draw" data-i18n="btn-draw">掷出骰子</button></div>
  <div class="hint" id="hint">tolle et lege &mdash; 掷出，然后照做</div>

  <div id="slot"></div>

  <div class="log" id="log" hidden>
    <h3><span data-i18n="log-title">Acta Noctis &middot; 今夜战绩</span></h3>
    <ol id="loglist"></ol>
  </div>

  <div class="safe">
    <span data-i18n="safe">安全词 <span class="sw">菠萝披萨</span> 永远有效——任何一方说出，一切立刻停下。</span>
    <span class="lt">semper valet, sine quaestione</span>
  </div>
</div>

const D=[
{t:1,n:{zh:"蒙眼辨物",en:"Blindfold Divination"},l:"Quid est hoc",p:{zh:"服从方跪坐床沿，一条深色绸带蒙住双眼系至后脑——视觉被剥夺的一瞬，皮肤开始替眼睛工作，每一寸毛孔都竖起等待。支配方任选五种物件：一枚含在口中先加温至体温的冰块、一根羽毛的尾端、一条对折的皮带、指腹沾着的润滑液、以及唇齿本身——依次触上锁骨凹陷、乳晕外围、腰窝、大腿内侧最薄的那片皮肤。每处仅停三秒。冰块化到一半自锁骨滑落至胸前，那道水痕会一直凉到解答之后；皮带的钝重坠感与羽毛的轻痒之间隔着整整一个宇宙；而当唇齿贴上时，服从方甚至分不清那究竟是舌头还是别的什么。视觉退场后，辨识度被放大到令人措手不及。",en:"The sub kneels at the edge of the bed. A dark silk band goes over their eyes and ties behind the head — the instant sight leaves, the skin steps up to answer in its place, every pore lifting to receive. The Dom selects five items: an ice cube pre-warmed in the mouth to body temperature, the tip of a feather, a folded leather belt, lubricant on fingertips, and lips-and-teeth themselves. Each touches, in turn, the hollow above the collarbone, the outer ring of an areola, the small of the back, the thinnest stretch of inner thigh. Each contact lasts precisely three seconds. The ice, half-melted, slides from collarbone to sternum leaving a cold trail that persists long after the answer is given; the leather's dull weight and the feather's near-invisible tickle live in entirely different universes; and when lips arrive, the sub cannot always tell whether it is a tongue or something else. With vision gone, recognition sharpens to something almost overwhelming."},r:{zh:"每次触碰仅三秒；服从方须于触感消退前说出物件名称。",en:"Each contact is exactly three seconds; the sub must name the object before the sensation fades."},b:{zh:"答对一样，支配方以唇亲吻该处并停留三秒；答错一样，臀部对称处受掌击一记。",en:"Correct: the Dom kisses that spot and holds for three seconds. Incorrect: one open-handed strike to the mirror position of the buttocks."},m:{zh:"15 分钟",en:"15 min"}},
{t:1,n:{zh:"领带缚腕",en:"Necktie Wrist Bondage"},l:"Vinculum",p:{zh:"支配方缓缓解下领带——那种带着体温的柔滑丝质自颈间抽出的窸窣声本身即是前奏——将服从方双腕交叠举至头顶，缠绕三圈，打一个一挣即开的活结。此后支配方在其锁骨间描一道湿吻、指尖沿肋骨往下点数、口含乳尖轻轻厮磨、或将手探入两腿之间——每一个瞬间，服从方本能想去推拒、去抓握、去遮掩，都必须以意志将双手钉回原位。绸带柔软而无杀伤力，真正的束缚是自愿。前臂的肌肉会因长时间举高而慢慢发酸，那种细密的酸胀与全身其他部位涌起的燥热搅在一起，令人愈发无处可逃——直至那份酸涨也开始成为某种奇异的快感来源。",en:"The Dom slowly unknots a silk tie — the whisper of that warm fabric drawn from around the neck is itself the overture — and binds the sub's wrists crossed above the head with three loops closed by a slip knot that will release with one pull. What follows is the entire philosophy of this scene: they know they can escape, and choose not to. The Dom traces a wet kiss across the collarbones, counts down the ribs with a fingertip, closes lips around a nipple to worry it gently, or slips a hand between the thighs — and at every one of these moments, the sub's instinct to push away, to grasp, to cover, must be met with the deliberate act of pinning the hands back to their place. The silk is soft and toothless: the real bond is consent. Long-held-up forearms will begin to ache in that fine, insistent way, and that ache will blend with the heat rising everywhere else until nowhere feels like refuge — until the ache itself becomes another vector of pleasure."},r:{zh:"双手须全程保持于头顶原位；滑落一次即重新捆缚，前戏时长顺延。",en:"Hands must remain overhead throughout; each slip requires re-binding and adds foreplay time."},b:{zh:"坚持至终局者，此后进入之姿势由服从方指定；累计挣脱三次者，当夜释放取消。",en:"Reach the end without slipping: the sub chooses the position for what comes next. Three or more escapes: no release that night."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"低温滴蜡",en:"Low-Temperature Wax"},l:"Cera",p:{zh:"熄灯，独留烛火。支配方持一支专用低温蜡烛悬于服从方肌肤上方约三十厘米——高度决定烫意的浓度，此距离恰好落在温热与灼烧之间那道甜蜜的界线上。烛芯上积满一颗晶莹的蜡珠，坠落——落于锁骨凹陷的瞬间先炸开一记短促的刺，随即化为一小片浓郁的暖，在心跳中凝固成一枚封印。随后沿身体中线次第落下：乳晕外围绕一圈，两颗乳尖恰好被这圈热度圈在中央；小腹排一列，每落一颗肌肉便本能地一收；髋骨两侧各一道，然后是大腿内侧最白的那一段，那里的皮肤最薄，蜡尚未凝已经化开成暖流缓缓下淌，痒得受蜡者不自觉地夹紧双腿。烛火跳动，室内漆黑，只有那一列一列缓缓凝固的红梅，在暗中标记这具身体的每一处坐标。",en:"Lights out. Only the candle. The Dom holds a low-temp play candle about thirty centimeters above the sub's skin — that distance sits precisely on the sweet line between warm and searing. A single molten bead pools on the wick, drops, and lands in the collarbone's hollow: a sharp bright shock, then a rich spreading heat, then a small sealed medallion cooled by the heartbeat. Beads fall in sequence down the body's midline: a ring around each areola so both nipples find themselves at the center of that heat; a column down the belly, each drop making the abdominal muscles reflexively clench; one bead each at the crests of the hip bones; then along the palest stretch of inner thigh, one bead after another all the way down to the crook of the knee — there the skin is thinnest, and the wax barely finishes cooling before it liquefies into a small warm current that runs downward, tickling until the sub's legs press together despite themselves. Candle-flame shivering, the room dark, only those slowly-cooling red plum blossoms marking, in the dark, every coordinate of this body."},r:{zh:"服从方不得躲避；躲避一次，滴落高度下调五厘米。",en:"The sub must not flinch. Each flinch drops the pour height by five centimeters."},b:{zh:"全程未动者，蜡片剥离后由施蜡者以舌尖将每一处红痕重新舔过一遍，直至印痕再次泛红。",en:"Held still throughout: after the wax peels away, the licker's tongue re-marks each print until it flushes red again."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"报数十下",en:"Ten Counted Strikes"},l:"Decem",p:{zh:"服从方俯卧于支配方腿上，裙摆或下装褪至膝弯，两瓣软肉完全暴露于掌心之下。第一记不立即落——支配方先以掌心贴着臀肉缓慢揉压，画圈，捏住一小块然后松开，令肌肤先记住手的形状与温度，也令等待本身成为一种刑罚。就在服从方以为将落未落之际，一记清脆的掌击忽然降临，热度自击点向四周辐射，红印随即浮起。服从方须清晰报数：一。并附一句敬语。此后九下，节奏由施掌者掌控——可连击三下不容喘息，可悬停十数秒令臀肉在等待中先自战栗，可轻可重可正击可斜切。每一记落下之前的悬空，都比落下本身更折磨。第十下落定后，两瓣软肉滚烫得能焐手，皮肤下细小的血管都涨得清晰可见——此时任何抚摸都会带来放大数倍的酥麻。",en:"The sub lies across the Dom's lap, skirt or trousers pulled down to the crook of the knees, both cheeks fully offered to the palm. The first strike does not come at once — the Dom first presses down with the flat of the hand, circles the flesh, pinches and releases a small mouthful of it — teaching the skin the shape and warmth of the hand, and letting the wait itself become the first sentence of the punishment. In the moment the sub decides no strike is imminent, one arrives: sharp and clean, its heat radiating outward, the red print blooming a moment behind it. The sub reports clearly: one. And appends the honorific. The remaining nine follow at a rhythm entirely of the striker's choosing — three in quick succession giving no room to speak, a fifteen-second hover before the next in which the flesh trembles of its own accord in advance, light or hard, square or angled. The suspended second before each landing is worse than the landing itself. By the tenth, both mounds glow hot enough to warm a hand against, and the small blood vessels beneath the skin lie visibly engorged — after which any touch will register at several times its ordinary intensity."},r:{zh:"每记落下后须报数并致谢，二者缺一即视为漏记；报数含糊或迟疑亦然。",en:"Each strike must be counted aloud with honorific; missing either is a missed count, as is any slur."},b:{zh:"漏记者自一重新计数；累计三次自一重计，则第十一下起改用皮拍。",en:"Missed counts restart from one; after three restarts, the strikes continue with a paddle from eleven."},m:{zh:"10 分钟",en:"10 min"}},
{t:1,n:{zh:"寸止三次",en:"Edging Three Times"},l:"Ad limen",p:{zh:"支配方以手指或器具将服从方一路引向顶点——起初缓慢，指腹沿会阴描着弧线打圈，探入寻找那个熟悉的凹陷；节奏逐渐加密，服从方的呼吸开始变浅、变急、变碎；腰肢不自觉地拱起，双腿在床单上蹬蹭寻找支点，喉间的呻吟越来越无法压制，穴道深处那种熟悉的即将决堤的感觉一路自尾椎蹿至头顶。就在临界线的最后一步——支配方的手骤然抽走，退开身，坐至床沿旁观。服从方悬在半空，穴口一张一合地咬着空气，眼泪汪汪地翻身要求继续，得到的只是一句：等它退下去。等电流自尾椎缓缓褪回原位，等呼吸重新平稳——支配方再度上前，从头开始爬这座山。三次。第三次抵达门槛之前的每一秒，服从方将同时怨恨与渴望那双手。",en:"The Dom leads the sub with fingers or an implement toward the peak — slow at first, pads tracing arcs across the perineum, dipping in to find the familiar hollow; the tempo tightens; the sub's breath shortens, sharpens, breaks; hips arch off the sheet, feet scrabble for purchase, the moans in the throat outstrip any effort to contain them; that unmistakable rise from tailbone to crown of the head. And in the last step before the crest — the Dom's hand withdraws entirely, retreats, sits down on the edge of the bed to watch. The sub hangs suspended in mid-air, the entrance opening and closing on empty space, tearfully turning to demand more, receiving only: wait for it to subside. Wait for the current to slink back down the tailbone, wait for breath to return, wait for the body to believe it is over — and the Dom rises again to begin the same climb from the base of the mountain. Three times. Every second of the approach to the third threshold, the sub will simultaneously hate and long for that hand."},r:{zh:"临界须由服从方举手示意；夹腿、蹭床单、私下磨蹭皆判违规。",en:"The sub must raise a hand at each threshold; pressing thighs, grinding on the sheet, private stimulation, all constitute violation."},b:{zh:"忍至终局者，准予一次彻底而漫长的释放；中途违规者，违规几次禁令即顺延几日。",en:"Held to the end: one complete and slow release. Violation: the ban extends one day per infraction."},m:{zh:"30 分钟",en:"30 min"}},
{t:1,n:{zh:"隔布把玩",en:"Fingering Through Fabric"},l:"Per pannum",p:{zh:"内裤是本局唯一的规则，也是唯一的战场。支配方以指腹隔着薄薄的棉布按压——先沿会阴按下去一路碾至耻骨，再沿中线上下反复地磨。布料初时是干爽的，指尖能清楚感到底下软肉起伏的形状；片刻后，中央位置洇出一枚小小的深色斑点；再片刻，那一点晕开成一整片，湿润的黏腻感开始透过布料反上指腹；至半局，整块布已湿到透明，紧贴在肉上，连底下充血肿起的两片外唇、以及那颗从遮蔽中探出头的、颤颤的珠子的轮廓，都在灯下清晰可辨。服从方会本能地扭动腰肢寻求更深的按压，会讨价还价地恳求脱掉那一层布——不许。今夜的终点是让身体隔着一层棉布，把自己浇透。指尖会数次故意错开阴蒂那一点，只在旁边打转，直到听见喉间那声破碎的哀求。",en:"Underwear is the only rule of this scene, and its only battlefield. The Dom presses fingertips against thin cotton — pressing down along the perineum and rolling up to the pubic bone, then dragging up and down along the midline. The fabric starts dry; the fingertips can feel with total clarity the shape of the yielding flesh beneath. Presently a small dark stain blooms at the center; presently that stain spreads to a whole soaked patch; presently the sticky wet begins to feed back through cotton and onto the fingertips; by the halfway point, the fabric has gone transparent and clings to the flesh, revealing the swollen outer lips and the trembling little pearl that has emerged from its hood so clearly that the light picks them out one by one. The sub will twist their hips reflexively begging for deeper pressure, and bargain aloud for the fabric's removal — denied. Tonight's finish line is: through a layer of cotton, wet oneself all the way through. The fingertips will, at times, deliberately swerve past the clit itself, circling only near it — until they hear the shattered plea at the back of the throat."},r:{zh:"未获准许，服从方双手不得触碰自身任何部位。",en:"Without permission, the sub's hands may not touch any part of themselves."},b:{zh:"湿至能拧出水时，施术者以齿咬住布料边缘将其缓缓褪下，褪至膝弯为止。",en:"When the fabric is wet enough to wring: the Dom draws it down with teeth, to the crook of the knees."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"丝袜足戏",en:"Silken Foot Games"},l:"Pedes",p:{zh:"双方隔开一段距离对坐——距离即是本局的道具。服从方仅以两条穿着丝袜的腿伸至对方腿间，一切动作只以双足完成。脚背绷起的弧度绘出一道优雅的曲线，尼龙在灯下透出微微的哑光，脚趾隔着一层薄薄的透明料勾缠住对方——自根部一路缓缓向上磨，脚心以温柔的力道包住顶端，脚趾在冠状沟处收放。被伺候的一方只许坐直，双手可扶椅侧但不得触碰施足者，只能眼睁睁看着自己被一双脚随心所欲地拿捏。丝袜的滑与体温的热两重叠加，脚趾偶尔无意间捏紧一下的力道恰好卡在临界；而施足者从头至尾神色淡然，仿佛只是在做一件不那么重要的琐事，甚至可以一边施足一边翻手中的书。这种被漫不经心地伺候的羞耻感，即是本局的主菜。",en:"The two parties sit facing each other, separated by a short distance — that distance is this scene's implement. The sub reaches out only with two stockinged legs into the Dom's lap; the entire scene will proceed only through those feet. The arch of the foot draws a graceful line; the sheer nylon takes on a matte glow in the lamplight; toes hook and coil around the target through their thin transparent layer — sliding slowly up from base to tip, the sole of the foot cupping the head with tender pressure, the toes releasing and closing over the crown. The one being served may only sit upright with hands available on the chair but forbidden to touch the servant — permitted only to watch themselves being handled at leisure by a pair of feet. The slippage of nylon and the heat of the body compound; a squeeze of the toes at the wrong moment lands precisely on the threshold; and the one dispensing this service maintains a placid expression throughout, as if performing nothing more consequential than a routine errand — capable, even, of reading a book with one hand while the other is not needed. This casually dispensed service, and its attendant shame, is the main course."},r:{zh:"施足方不得使用双手与口，全程仅以双足完成；被伺候方不得触碰施足方。",en:"The foot-artist uses neither hands nor mouth throughout; the recipient may not touch the foot-artist."},b:{zh:"若成功令对方释放，溅落之物由施足方以脚趾抹开涂布于对方腹肌，展示片刻方可拭去。",en:"If the recipient releases: the foot-artist smears the fluid with a toe across the recipient's abs, holds it there a moment, then permits it to be wiped."},m:{zh:"25 分钟",en:"25 min"}},
{t:1,n:{zh:"问诊",en:"Examination"},l:"Medicus",p:{zh:"诊室灯亮，一片冷白。医者着白衣，翻阅纸质病历，头也不抬地示意：更衣，躺于检查床上。病人依令褪去外衣，只余薄薄的一层布料。检查自最正经处始——听心音，压腹诊——医者的听诊器冰凉，贴上皮肤时一惊；手掌隔着薄衫按压小腹，力度专业而不带感情。而后问题开始漂移：此处可有压痛？此处呢？这里为何略有湿意？请解开一颗纽扣，方便触诊。医者的手指戴着薄薄一层医用手套，微凉，指腹沾了少许透明的检查用润滑液，探入时只说一句：请放松，配合检查。病人须对每一问如实作答——包括平日的自渎频率，包括高潮时脑中所想的画面，包括此刻是否已经因为这场检查而濡湿。医者的语气始终平静而专业，那份“公事公办”的冷淡与探入之处的实际内容形成的反差，是本局最烫的所在。谎言一旦被戳穿，检查项目立即追加。",en:"Clinic lights on, cold white. The physician is in the white coat, reviewing the paper chart, not looking up: undress, and lie down on the examination table. The patient complies, leaving only a thin layer. The examination begins in the properest place — auscultation of the heart, palpation of the abdomen — the stethoscope is cold, its arrival a small shock; a professional and unfeeling palm presses through fabric on the abdomen. Then the questions begin to drift: any tenderness here? and here? and why is there some moisture in this region? Please undo one button, to facilitate the examination. The physician's fingers are in a thin glove, cool, the pads carrying a small quantity of transparent examination lubricant, and as they enter the physician says only: relax, please, and cooperate with the examination. The patient must answer each question truthfully — including habitual frequency of self-pleasure, including what images arise in the mind during climax, including whether at this moment they are already wet on account of this very examination. The physician's tone remains flat and professional throughout, and the gap between that clinical detachment and the actual content of what is being examined is this scene's hottest register. Each detected lie appends one additional test."},r:{zh:"病人须对医者所有提问如实回答，不得隐瞒或含糊。",en:"The patient must answer every question truthfully; no concealment, no vagueness."},b:{zh:"每被戳穿一次谎言，检查项目追加一项，无上限。",en:"Each detected lie appends one further examination item, without upper limit."},m:{zh:"30 分钟",en:"30 min"}},
{t:1,n:{zh:"负重巡游",en:"Weighted Errand"},l:"Ambulatio",p:{zh:"跳蛋预先塞入穴中，遥控交予支配方。服从方须在居所内走完一整圈：客厅、厨房、阳台，再回到起点。开局时档位为零，服从方几乎能忘记体内那颗异物的存在——但支配方专挑最刁钻的时机推档。伸手取高处杯子的一瞬，震动骤然拔至中档，一股酥麻自会阴一路窜至头顶，扶着橱柜的手指骤然收紧；跨过门槛的抬腿一刹，档位再上一级，双腿之间那颗小东西撞在最敏感的凹陷上，膝盖一软险些跪下；以为已经安全站在阳台上凭栏望远时，档位骤然拔至最高，全身猛地绷成一根弦，指节掐入栏杆才没让呻吟出口。而穴道深处那颗跳蛋每一次震动都令内壁充血，走完半圈时大腿内侧已开始有黏湿的感觉——那是身体不受控地作出的诚实反应。规则是：不许停步，不许扶物借力，不许并腿求缓。",en:"A remote-controlled ovum is inserted in advance; the remote is with the Dom. The sub must walk a full circuit of the residence: living room, kitchen, balcony, and back to the start. At the opening the setting is zero, and the sub can almost forget the object exists — but the Dom selects the worst possible moments for adjustments. As the sub reaches to fetch a cup from a high shelf, the setting jumps to medium: a wave of sharp tingling from perineum to crown, fingers whitening on the cabinet edge. Stepping over a threshold, the setting climbs another notch: that small object grinds against the most sensitive fold inside, one knee softens dangerously. Just as the sub arrives, apparently safe, at the balcony rail, the setting flies to maximum: the whole body draws taut as a string, the moan almost escaping is caught only because the knuckles have gripped the rail hard enough to hurt. And the small object's every vibration draws blood to the inner walls; by half-circuit the inner thighs are already tacky-wet — the body's honest reply, produced unbidden. Rule: no stops, no leaning on furniture, no closing the knees."},r:{zh:"全程不得停步、不得扶物、不得并腿；任何降档请求不予受理。",en:"No stopping, no support, no closing the legs; requests to reduce power are denied."},b:{zh:"中途跪倒于何处，即于何处继续玩至释放；成功走完一圈者，可指定接下来的体位。",en:"Fall to the knees anywhere: play continues there, to release. Complete the full circuit: choose the position for what comes next."},m:{zh:"15 分钟",en:"15 min"}},
{t:1,n:{zh:"镜前直视",en:"Mirror Facing"},l:"Speculum",p:{zh:"支配方自身后环抱服从方，下颌搁于其肩，二人共同面向一面立镜。左手覆上其颈侧，右手自腰际缓缓下滑——服从方将同时以两种方式经历这一切：皮肤上的真实触感，与镜中那具正在被拆解的身体。指尖沿锁骨下行至乳尖，镜中的乳尖立即挺立起一小颗坚硬的红；手掌整个覆上小腹，镜中的小腹随着呼吸急促地起伏；两根手指探入腿间，镜中的双腿本能地想要合拢又被膝盖顶开，穴口那一小片湿意在灯下亮亮地反光。整个过程中，服从方须睁眼直视镜中的自己：看被触碰的位置，看面颊如何一点一点被红晕爬满，看唇齿如何一寸一寸地张开，看眼神如何自最初的清明转向迷离再转向哀求。想要闭眼时，耳边只有一句话：睁开，看着她。看她被玩弄到何种地步。看她其实很享受。镜中人即是自己，无可辩驳。",en:"The Dom stands behind the sub, embracing, chin at the shoulder, both facing a full-length mirror. The left hand settles over the throat; the right slides slowly down from the waist — and the sub will experience this in two channels at once: the real touch on the skin, and the body in the mirror being taken apart. The fingertip traces down the collarbone to a nipple, and the mirror nipple stiffens into a small hard bead; the palm covers the belly, and the mirror belly rises and falls in quick shallow breaths; two fingers slip between the thighs, and the mirror thighs instinctively try to close and are held apart by the knee, the little slick between glowing brightly under the lamplight. Throughout, the sub must keep their eyes open and directed at their own face in the mirror: watch what is being touched, watch the blush climb up the face point by point, watch the mouth open increment by increment, watch the eyes shift from clear to blurred to pleading. When they try to close their eyes, at their ear only: open them. Watch her. Watch how far she is being used. Watch that she is, in fact, enjoying this. The mirror one is oneself — no argument possible."},r:{zh:"服从方须全程睁眼直视镜中自身面容；闭眼一次，所有动作暂停十秒。",en:"The sub must keep their eyes open on their own face throughout; each closure pauses all motion for ten seconds."},b:{zh:"服从方须以最直白的语言描述镜中所见——身体的每一处反应，须说出口。",en:"The sub must describe, in the plainest available words, exactly what they see in the mirror."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"承露十步",en:"Ten-Step Retention"},l:"Decem passus",p:{zh:"释放之后不许立即清理。支配方按住服从方的腰不许其起身，令温热于体内最深处沉降片刻——那种滚烫的浓稠在穴道深处缓缓蔓延、被穴肉一层一层温柔地含裹住，是许多人一生中最舒适的几分钟之一。片刻后，允许起身。而后是考验：夹紧，站立，自床沿走至门边，共十步。每一步都能感到体内之物在缓缓晃动、被地心引力向下拽、试图自穴口挤出——必须以下腹的力气咬住，令穴口那圈软肉紧紧闭合。至第五步，一小滴温热的液体已经悄悄溢至穴口边缘；至第七步，大腿内侧开始微微战栗；至第九步，那一小股液体终于顺着大腿内侧缓缓滑下，画出一道亮亮的水痕，慢慢延伸至膝弯。支配方就在身后，数着剩余的步数，也数着大腿上那道水痕蜿蜒到哪一节。",en:"After release, no immediate clean-up. The Dom pins the sub's hips against rising, letting the warmth settle to the deepest point — the hot, thick liquid layering slowly through the deep, wrapped tenderly by the folded flesh, is one of the most comfortable minutes of many people's lives. Presently, permission to rise. Then the test: squeeze, stand, walk from the edge of the bed to the door, ten paces. Each step brings the sense of the inner burden sloshing, being pulled down by gravity, trying to slip out — and must be held closed by force from below, that ring of soft flesh at the entrance clenching. By step five, a small warm drop already balances at the entrance's rim; by step seven, the inner thighs begin faint trembling; by step nine, that small warm rivulet finally spills over and slides slowly down the inner thigh, drawing a brightly-lit water trace all the way to the crook of the knee. The Dom stands behind, counting off the remaining paces — and counting to which crease the water trace on the thigh has meandered."},r:{zh:"夹紧行走完十步，途中一滴不得外漏。",en:"Squeeze and walk the full ten paces; not one drop may leak in transit."},b:{zh:"漏出者，跪地以舌将地面上以及自身腿上的痕迹尽数舔净。",en:"On leaking: kneel and lick clean every trace on the floor and thighs."},m:{zh:"5 分钟",en:"5 min"}},
{t:1,n:{zh:"言语课业",en:"Vocabulary Lesson"},l:"Verba",p:{zh:"支配方埋于服从方体内至最深处，动作忽然放至最缓——那种缓不是抽出，而是将顶端在穴道最深的凹陷处以极慢的力度一点一点研磨。而后开始上课：此刻是什么感觉？说出来。舒服不合格，好棒不合格，再来更不合格。须说清是何处、被何物顶到、以何种角度研磨、深浅几何、快慢如何。服从方要一面承受身下缓慢而深入的碾压——那种缓慢比激烈还难熬，因为每一寸感官都被无限拉长——一面在被顶得语音破碎的间隙组织出完整而下流的句子。说得含糊，动作立即静止；静止会一直持续到答案清晰为止。而穴道深处那份被撑得满满的、痒到发疯的空虚会在静止中愈发难耐，逼着说话者不得不吐出更下流、更细节的形容——甚至开始主动扭腰迎合，只为求得动作的继续。这是快感的课堂，也是语言的课堂。",en:"The Dom is buried at the sub's deepest point, and abruptly slows to a crawl — not a withdrawal, but the head grinding at the deep hollow with impossibly slow force. And then the lesson begins: what does that feel like? Say it. \“Nice\” fails. \“Good\” fails. \“More\” definitely fails. The sub must specify where, from what, at what angle ground, how deep, at what speed. The sub must both endure the slow deep milling — which is more grueling than violence, because every strand of sensation has been infinitely drawn out — and, in the fragments of breath between broken syllables, assemble complete and filthy sentences. Vague answers freeze the motion at once; the freeze holds until clarity arrives. And the fullness-and-emptiness at the deep of the passage, itching to madness, grows only more unbearable in that stillness, driving the speaker to spit out ever more graphic and specific descriptions — even to begin, of their own accord, twisting the hips to meet the head, if only to earn the resumption of motion. A lesson in pleasure, and a lesson in language."},r:{zh:"每次作答须为完整一句，须具体到部位、动作、深度、感受，缺一即为不合格。",en:"Each answer must be a complete sentence, specific to part, action, depth, and sensation; any missing element fails the answer."},b:{zh:"作答不合格时动作静止，直至说出合格答案方续；三次不合格，改为无声抽插三十下不得回应。",en:"On failure, motion halts until a passing answer is delivered; three failures within one scene switches to thirty silent strokes without permitted response."},m:{zh:"全程",en:"scene-length"}},
{t:1,n:{zh:"唯口可用",en:"Only Mouth"},l:"Ore tantum",p:{zh:"服从方双手缚于身后——常用的姿势是手腕交叠、以柔软的布带扎成一朵结。此后整段前戏之中，能动用的身体部位仅剩一张嘴。想触碰对方的胸膛，只能凑上前以唇瓣贴合；想爱抚对方的颈侧，只能以舌尖描摹脉搏跳动之处；想撩拨对方的锁骨凹陷，只能以脸颊侧面反复厮磨；想到达对方腿间，只能俯下身以鼻尖轻顶那处已经硬起的形状。失去双手的辅助，每一个动作都变得笨拙、专注、甚至孤注一掷——歪着头调整角度以便舌尖能舔到那个位置，够不到时鼻息里发出小小的不满的哼声，为了平衡而重心前倾时颈项拉出一条脆弱的曲线。而下颌的每一次开合、舌尖的每一次探入、唇瓣的每一次吮吸，都因为无法用手辅助而变得更为专注。所有关于想要的信息，都被迫全部压缩进唇舌那一小片皮肤上。",en:"The sub's wrists are bound behind their back — the usual arrangement is wrists crossed, tied in a soft ribbon-knot. For the remainder of the foreplay, the only part of the body available to the sub is a mouth. To touch the chest, they must lean in and set lips to it; to caress the neck, they must draw the tongue's tip along where the pulse beats; to work the hollow above the collarbone, they must rub the side of the face against it repeatedly; to reach the sex, they must lower themselves and nudge with the tip of the nose against what has already gone hard. Without the hands' assistance, every action becomes clumsy, focused, near-desperate — the head tilting to adjust angles so the tongue may reach precisely there, a small dissatisfied nasal note when out of reach, the throat curving into a fragile line as the center of gravity leans forward for balance. And the closing and opening of the jaw, the intrusion of the tongue, the pull of the lips at every attempt to suck — every one, because the hands cannot assist, must be more focused than before. All the information about wanting is compressed into that small patch of tissue at lip and tongue."},r:{zh:"服从方双手若挣脱一次，前戏时长翻倍；两次者，双手改缚于背后并加短绳。",en:"If the sub's hands slip loose once, foreplay time doubles; twice, the hands are re-bound with an added shorter rope."},b:{zh:"表现合格者，此后进入之体位、深度、节奏均由服从方指定。",en:"On satisfactory performance: the position for entering, the depth, and the tempo are all the sub's to specify."},m:{zh:"25 分钟",en:"25 min"}},
{t:1,n:{zh:"十枚印记",en:"Ten Marks"},l:"Signa",p:{zh:"支配方将于服从方身上盖下十枚印记。自颈侧起——唇瓣贴上颈侧那一小块温热的皮肤，先以舌尖沾湿，再以齿列极轻地圈住，然后吮吸——力道逐渐加深，血色从皮下缓缓浮起，凝成一枚深红色的花瓣。锁骨凹陷处一枚，触及骨骼时受印者会本能地一颤，喉间泄出一声低低的呻吟；胸口正中一枚，落在两颗乳尖连线的中央，那里的皮肤最薄最敏感；腰侧一枚，那里的皮肤最痒，吮吸时受印者会不自觉地扭腰躲避又被按住；腹股沟一枚，与两腿之间的湿热只隔咫尺，齿列的震动会一路传导至穴道深处；大腿内侧最白的地方一枚；乃至更私密的、平日只有情人可见之处。其中至少三枚须落在明日穿衣仍可露出的位置——如颈侧、锁骨、或腕内。此后一周，低头即见：有主之身。",en:"The Dom will place ten marks on the sub's body. Starting at the neck — lips arrive on that small patch of warm skin, first wetted by the tongue's tip, then very lightly ringed by teeth, then drawn in with suction — the pressure gradually deepens, the color rising from beneath, coalescing into a single dark red petal. The hollow above the collarbone: one mark, the recipient shivering as bone is grazed and a low groan escapes the throat; the center of the chest: one, on the midline between two nipples where the skin is thinnest and most sensitive; one at the side of the waist, where the skin is most ticklish and the recipient twists to escape and is held; one at the inguinal fold, one thumb's breadth from the wet heat between the thighs, where the vibration of the closing teeth carries all the way inward; one on the pallid inner thigh; and further, in more private places visible only to a lover. At least three of the marks must land where next day's clothes cannot hide them — the side of the neck, the collarbone, the inside of the wrist. For a week: eyes down, marked as owned."},r:{zh:"每留一枚须清晰报数并说明所在位置；漏报或误报皆重来。",en:"Each mark must be reported by number and located verbally; missed or misreported marks are redone."},b:{zh:"报错者全程重来一遍——但已留下的印记不予消除，最终身上或有超过十枚。",en:"On misreport, the entire round is redone — but existing marks are not erased, so the body may end the scene wearing more than ten."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"双点集中",en:"Two Points Only"},l:"Papillae",p:{zh:"本局全身地图上只有两个坐标——左右各一颗小小的乳尖。指腹先隔着薄薄的一层衣料寻到它们，画圈、轻刮、按压——布料的摩擦与温热的手指的按压交替作用，两颗乳尖会在衣料底下慢慢地、执拗地挺立起来，硬到隔着布都能看见形状。而后是直接的施为：撩起衣料，让它们完全暴露于灯光下。拇指与食指捏住一颗缓缓碾磨，令那点粉嫩缓慢地变深、变红、变肿；舌尖包裹着另一颗打转，唾液的湿润与嘴唇的温度交替折磨；牙齿极轻地叩，一记细微的锐痛立即化作两腿之间的一阵电流；冰块贴上令乳尖骤然收缩成一颗坚硬的小豆，紧接着以温热的口再度含化。下腹会越来越空、腿间会越来越湿，双腿本能地想要并拢磨蹭以求缓解——不许。让所有电流只从这两个高地出发，看它们能否独力送人抵达终点。届时那两颗乳尖会红肿至平日的两倍大小，一碰即颤。",en:"Only two coordinates exist on the whole body's map — one small nipple on each side. The fingertips first find them through a thin layer of fabric, drawing circles, flicking, pressing — the friction of cloth and the pressure of the warm finger alternating, and beneath the cloth the two nipples slowly and stubbornly rise, hard enough to shape the fabric visibly. Then, direct: lift the fabric, expose them entirely to the lamplight. Thumb and forefinger pinch one and slowly grind, forcing that pink to darken to red to swell; the tongue-tip envelops the other and revolves, tortured alternately by saliva's wet and lips' warmth; teeth tap very lightly, the small sharpness translating instantly to a current between the thighs; ice comes down and clenches the nipple into a small hard bead, then is chased back into warmth by the mouth. The lower belly grows emptier, the thighs wetter; the sub's legs instinctively want to press together and grind — denied. Let every circuit start only from these two heights, and see whether they can, on their own, deliver the whole body to the finish line. By then, the two nipples will be twice their ordinary size and tremble at a touch."},r:{zh:"服从方双手不得触碰下身；双腿不得并拢；蹭动床单亦判违规。",en:"The sub's hands may not go to the sex; the thighs may not close; grinding on the sheet is a violation."},b:{zh:"仅凭双点抵达顶点者，事后一个要求无条件应允——除去打破安全底线之事。",en:"On arriving by these two points alone: one unconditional request granted, short of any safety line."},m:{zh:"40 分钟",en:"40 min"}},
{t:1,n:{zh:"含冰侍奉",en:"Service With Ice"},l:"Glacies",p:{zh:"侍奉者先含入一整块冰——冰凉在口腔内迅速蔓延，舌面、上颚、齿列全部降至骨感的低温。而后张口将对方纳入——滚烫撞入冰窖的一瞬，被含者会不自觉地倒吸一口气，柱身骤然一跳。冰块在口腔中并不静止：它贴着柱身缓缓滚动，一路自根部滑至顶端，凉意与舌面的余温交替碾过每一寸皮肤；冰在含侍的过程中缓慢融化，冰水自嘴角淌落，滴至被含者的小腹、大腿根部，那种从滚烫到冰凉的落差在皮肤上被放大成一阵战栗，令小腹肌肉不受控地一阵抽搐。片刻后，口腔自冰凉回暖至温热，被含者刚要习惯这份新的温度——侍奉者吐出，换下一块冰，含回。共三块。换冰时不许将对方吐出：新的冰块须直接在口中与对方共处，那种滚烫与冰凉在极小空间内共存的瞬间，最是要命。",en:"The one who serves takes an ice cube into the mouth in advance — cold sweeps through the oral cavity, tongue-surface and palate and teeth all dropping to a bony low temperature. The mouth then opens to receive — a hot thing thrust into a cold cellar; the one being received cannot help but suck in air, and the shaft leaps at once. The ice does not sit still: it rolls along the shaft's underside from base to head, cold and the tongue's residual warmth grinding by turns across every inch of skin; as service continues the ice slowly melts, cold water spills from the corners of the mouth, drips onto the belly and inner thigh — the difference from scorching to cold gets amplified into a shudder across the skin, the belly muscles clenching unbidden. Presently the mouth returns from cold to warm, and the received-one begins to habituate — and the service-giver withdraws, takes another ice cube, and puts them back. Three cubes in all. Exchanges take place without releasing the receiver: the new cube must, directly in the mouth, coexist with the receiver. That moment when scald and chill share a very small space is the most deadly."},r:{zh:"换冰时口不得离开被含者；冰须于口中完成交替。",en:"Exchanges must not release the receiver from the mouth; ice must switch temperature there."},b:{zh:"三块用尽仍未令对方缴械，第四块塞入侍奉者的另一处穴口继续。",en:"If three cubes end without the receiver having yielded, the fourth goes into the servant's other orifice."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"晨间唤醒",en:"Morning Wake"},l:"Aurora",p:{zh:"晨光自窗帘缝隙漏入，一方尚在沉睡，呼吸绵长而深稳。另一方悄悄掀开被角自足端潜入，在温热而昏暗的被窝里摸索到晨起的形状——那是清晨特有的、并非源于欲望而源于生理的一段温热，硬度介于半苏与全醒之间。以唇轻触，仅仅是触碰；而后以舌尖沿冠状沟绕一周，动作要极轻、极慢；最后将顶端含入口中，含着不动，只让温热的口腔温度包裹住它。须缓——过急会令沉睡者过快苏醒，反而错过此局的真意。目标是让人在梦与醒的交界漂浮片刻：梦里先有了湿热缠绵的触感，意识一点点自深处上浮，梦与现实的界限模糊，肉体先于神志醒来。而后是那一刻——沉睡者睁眼，掀开被角，看见含着自己抬起眼睛的那双眼睛。此刻通常已经硬到近乎作痛，而含侍者的口中亦已被自己的津液与对方的前列腺液浸润。",en:"Dawn light spills through a gap in the curtain; one party still sleeps, breath long and settled. The other quietly lifts the corner of the bedding and enters from the foot of the bed, in the warm dark of the sheets seeks the morning shape — the peculiar morning heat that arises not from desire but from physiology, hardness suspended between half-woken and fully awake. A light touch of the lips, only a touch; then the tongue-tip along the corona in a slow ring, extremely light, extremely slow; finally the head enters the mouth, held without motion, only the warm oral temperature wrapping around it. Slow — too fast wakes the sleeper too quickly and misses the whole point. The goal is to make a person drift for a while at the boundary of dream and waking: the dream already carries a wet warm entwining touch, consciousness rising bit by bit from the depths, the border between dream and reality blurred, flesh waking ahead of mind. And then the moment: the sleeper opens their eyes, lifts the corner of the bedding, sees the eyes looking up while their own is being held. By this instant, they will be hard nearly to the point of aching, and the servant's mouth already glazed by their own saliva and the receiver's forerunning fluid."},r:{zh:"全程不得使用双手，不得出声，不得于对方完全清醒前停止。",en:"No hands throughout; no sound; may not stop before the receiver is fully awake."},b:{zh:"若对方醒来第一句为笑骂或抗议，本日主导权归唤醒者。",en:"If the receiver's first sentence on waking is a laughing curse or protest, the day's authority belongs to the wakener."},m:{zh:"随机",en:"variable"}},
{t:1,n:{zh:"禁声五分",en:"Five Minutes Silent"},l:"Silentium",p:{zh:"规则宣布之后，房间会安静得可怕——因为接下来五分钟，无论对方做什么，服从方不得发出任何声音。而支配方深知每一处令人无法压制之处，会专挑那些地方下手。手指绕着乳尖打圈，服从方咬住嘴唇，鼻息骤然变粗；唇舌探至耳后那一小块隐秘的皮肤，服从方喉间那声呻吟顶至齿关又被硬生生咽回；两根手指同时探入穴中弯起，找到那个凹陷用力按压，服从方全身猛地一颤，喉咙里泄出一小半个音节又被立即收住。整个房间只剩水声、床单摩擦声、以及那濒临破功的鼻息。被压回喉咙里的声音不会消失——它们会转化为别的东西，积在身体的深处，令穴道的痉挛、皮肤的战栗、腰肢的扭动都倍加激烈。憋住的呻吟是最好的春药——服从方会发现自己愈是压抑声音，身体就愈是不受控地对每一次触碰做出更剧烈的反应。",en:"After the rule is announced, the room becomes frighteningly quiet — because for the next five minutes, no matter what the Dom does, the sub may not make any sound. And the Dom knows exactly which places make silence impossible, and will choose precisely those places. A finger circles a nipple, and the sub bites their lip; the breath from the nose thickens abruptly. Lips and tongue reach that small hidden patch of skin behind the ear, and the moan cresting at the throat is forced back at the teeth. Two fingers enter and hook, find that hollow and press down hard — the sub's whole body jerks, and a half-syllable leaks and is instantly re-captured. The whole room contains only wet sounds, the scrape of sheets, and that breath at the very edge of failure. Sounds that get shoved back down the throat do not disappear — they turn into something else, and accumulate deep in the body, so that the inner clench, the shivers on the skin, the twist in the hips are all a step more violent for it. Stifled moans are the strongest aphrodisiac — the sub will find that the harder they compress the sound, the more uncontrolled the body's reaction to every touch becomes."},r:{zh:"喘息允许，呻吟违规，单音节亦算；哭泣抽气亦不得成声。",en:"Breath permitted; moaning is a violation; single syllables count; even sobbing may not go audible."},b:{zh:"出声一次，本局时长加一分钟；累计超过十分钟者，当夜释放取消。",en:"Each violation adds a minute to the scene's length; more than ten minutes cumulative cancels release for the night."},m:{zh:"5 分钟起",en:"5 min+"}},
{t:1,n:{zh:"独角剧场",en:"Solo Theatre"},l:"Spectaculum",p:{zh:"支配方于一米之外落座，翘腿旁观。全程不得触碰服从方，服从方亦不得触碰对方。服从方面向观者躺定，双腿分开至膝盖几乎贴床——以自己最熟稔的方式开始：手指如何游走，往何处按压，何种节奏。一米的距离，比贴身更为赤裸：因为每一个动作都是演给唯一一位观众的独角戏，无处遮掩，无处狡辩。一根手指沿会阴描一道弧线，观者能清楚看见指腹如何压过每一寸皱褶；两根手指探入穴中，观者能清楚看见指节没入的深度、拉出时穴口如何被牵拽变形、指缝间如何拉出一根根晶亮的银丝；拇指同时按上那颗充血的珠子打圈，观者能清楚看见服从方腰肢如何在自己的手底下不受控地拱起、双腿如何本能地绷紧、脚趾如何蜷缩。观者始终不动，只是看着，眼神在服从方的手指与面部之间来回，令自我表演变得更难以承受。这种被凝视的独慰，与独自的自慰是完全不同的事——每一个动作都带着表演的自觉，也就带着更深的耻辱与更烈的兴奋。",en:"The Dom sits down one meter away, legs crossed, to watch. No touching either way for the whole scene. The sub lies facing the audience, thighs opened until the knees very nearly touch the bed — and begins in their most habituated fashion: how the fingers wander, where they press, at what tempo. The meter of distance is more naked than skin: because every action is a one-woman show for a single audience member, no cover, no plea. A finger drawing an arc along the perineum: the audience can see clearly how the fingertip presses across every fold. Two fingers entering: the audience can see clearly the depth of the joint's disappearance, the pull that deforms the entrance on withdrawal, the fine bright threads drawn between the fingers. Thumb circling the swollen pearl in tandem: the audience sees clearly how the hips arch off the Dom's own doing, how the thighs snap tight, how the toes curl. The audience does not move — only watches, eyes traveling between the sub's fingers and the sub's face, making self-performance harder still. This kind of pleasure-under-gaze is entirely distinct from private pleasure — each action wears the awareness of performance, and therefore a deeper shame and a hotter arousal."},r:{zh:"服从方须面向观者，双腿分开，动作须全程清晰可见。",en:"The sub must face the audience; the thighs open; every action must be visible throughout."},b:{zh:"先开口恳求观者入场者为败方，败方于当夜之后续场合中居下位。",en:"Whoever first begs the audience to enter loses; the loser occupies the lower position in subsequent scenes for the night."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"项圈之日",en:"A Day of the Collar"},l:"Collare",p:{zh:"清晨醒来，服从方亲手为自己扣上项圈——那圈皮革贴住颈项的一瞬，一整日的身份定调即已完成。低头饮水时，皮革轻压喉结的位置；侧身转头时，皮革蹭过颈侧的皮肤；伸手够高处物件时，皮革随颈项肌肉的绷紧而收紧一分。这一整日，做家务、阅读、伏案工作、与他人交谈——一切如常，唯独颈间那一圈始终存在，像一只温柔的手虚虚地环着。每一次它蹭过皮肤，都会想起它的含义：今日是戴着标记生活的一日。而项圈的存在会将服从方的意识状态整日维持在一种低烈度的性期待之中——每一次不经意的触碰、每一次镜中一瞥自己戴着项圈的样子、每一次外出时穿高领遮掩它的努力，都在积累欲望。想要摘下——沐浴时、外出前、访客来时——须先向支配方申请。申请时的措辞、语气、姿势，皆为评估的一部分。",en:"On waking, the sub fastens their own collar — the moment the leather closes on the throat, the day's identity is set. Bending the head to drink water: the leather presses lightly on the Adam's apple. Turning the head to the side: the leather grazes the skin of the throat. Reaching for something high: the leather tightens by one degree as the neck's muscles engage. Throughout the day — housework, reading, desk work, conversation with others — everything as usual, except that ring at the throat never leaves, like a soft hand looped there without pressure. Every time it brushes skin, its meaning comes to mind: today is a day lived with a mark. And the collar's presence will hold the sub's mental state throughout the day in a low-grade sexual anticipation — every inadvertent touch, every glimpse of oneself in a mirror wearing it, every effort with a high collar to hide it in public, is a small deposit of desire. To remove it — bathing, going out, receiving a visitor — an application must be made in advance. The wording, the tone, and the posture of the application are all part of the assessment."},r:{zh:"摘取（沐浴、外出、访客等）须提前申请，获准方可暂摘，事毕须立即戴回。",en:"Removal (bathing, outings, visitors) requires prior application and approval; must be reworn immediately upon completion."},b:{zh:"擅自摘取一次，夜间掌击加二十下；累计三次，改为二十四小时不得摘除。",en:"Unauthorized removal: an additional twenty strokes in the evening; three such violations: the collar may not be removed for twenty-four hours."},m:{zh:"一整天",en:"all day"}},
{t:1,n:{zh:"舌尖清扫",en:"Tongue Cleanup"},l:"Lingua purgat",p:{zh:"事毕，任何人不得取用纸巾。支配方倚靠床头，只说一字：来。服从方跪行至身前，须以舌处理一切痕迹——对方身上的，自小腹一路舔至根部，将混合的白浊与自身的花蜜以舌面一点点收入口中；对方大腿内侧的，那里往往有一道自根部溢至股间的水痕，须循着痕迹的方向逐寸清扫；自己身上的，俯身够到大腿内侧那几道半干的湿痕，鼻尖能闻到属于自己的、混合了汗与情欲的独特气味；床单上的，如有溅出者，亦须以舌拭净。支配方指定何处即何处，不许发问，不许皱眉。这是一场仪式：将本局的一切证据，以最虔诚的方式收进体内。舔的动作要慢，要认真，要显得心悦诚服——甚至可能被要求在清扫过程中报告口中的味道、说出对方液体的口感、以及自身液体与对方液体混合后的差别。",en:"After the deed, no one may take a tissue. The Dom leans against the headboard and says only one word: come. The sub crawls forward and must handle every trace with the tongue: on the Dom's body, from belly to base, gathering the mixture of white and their own honey into the mouth one small sweep at a time; on the Dom's inner thigh — where there is often a trace of fluid running from the base to the fold of the hip, follow it along its direction inch by inch; on the sub's own body, bend down to reach those half-dried traces on the inner thigh; the tip of the nose can catch the odor peculiar to one's own body, a mixture of sweat and want; on the sheet, if there are any splatters, take them up too. Wherever the Dom points, is where. No asking why, no faces made. This is a ritual: all evidence of this scene, taken into the body in the most reverent possible fashion. The licking must be slow, must be conscientious, must appear glad — and there is even the possibility of a request, mid-cleaning, to describe the taste in the mouth, to name the mouthfeel of the other's fluid, and to compare the taste of self with the taste of the other after they mix."},r:{zh:"清扫顺序由支配方指定，不得询问理由，不得表现出嫌恶。",en:"The order of cleaning is set by the Dom; the sub may not ask why and may not display any distaste."},b:{zh:"遗漏一处，须自头再清扫一遍全身与床铺。",en:"On missing a spot, restart from the top of the body and sheet."},m:{zh:"15 分钟",en:"15 min"}},
{t:1,n:{zh:"整点奏报",en:"Hourly Report"},l:"Nuntius",p:{zh:"服从方外出——上课、逛街、会友——一切社交如常。唯独每至整点，须寻一处无人角落，向支配方奏报下身状态。报告须具体：此刻濡湿至何等程度（可用几成或隔着内裤是否已经沁出作答），内裤贴合的触感（是紧贴、微微下坠、还是几乎能感到布料被吸附住），方才走神的那三十秒里脑中所想的画面（可具体到姿势、位置、对象）。文字须完整成句，可配图——譬如于洗手间内快速掀开裙摆自拍一张，让支配方看清此刻的实况。于是一整日，无论身在何处、正做何等正经事——课堂上、会议中、与家人共进午餐——每小时都有那一分钟，意识会被强行拽回两腿之间，被拽回那个远端接收报告的人身边。这份被无形之线牵系的感觉，比任何看得见的束缚都更持久。而每一次奏报时的躲藏、每一次掀起裙摆自拍时的紧张、每一次遣词造句的挣扎，本身即是一场微型的秘密仪式。",en:"The sub goes out — class, shopping, meeting friends — social life as usual. Only on every clock-hour, they must find an unobserved corner and report on the state below. The report must be specific: how wet at this moment (a number, or a note on whether it has already begun to soak through the underwear), the sensation of the underwear's cling (tight, slightly sagging, or all but suctioned), and, in the last thirty seconds of daydreaming, what image was in mind (may specify the posture, the position, the object). The message must be a complete sentence; a photograph may be attached — say, a quick self-photo of the lifted skirt in a bathroom, so the Dom sees clearly the state at that moment. Thus for a whole day, whatever the sub is doing — in the classroom, in a meeting, at lunch with family — every hour, for one minute, consciousness is forcibly dragged back between the thighs, dragged back to the person receiving the report at the other end. This sense of being tethered by an invisible line is more enduring than any visible bond. And each report's concealment, each snapping of the skirt for a photograph, each struggle over word choice, is itself a small private ritual."},r:{zh:"奏报须包含湿度、触感、所想三项，缺一即不合格；不合格者当场重报。",en:"Each report must contain three items — wetness, sensation, thought; any missing item fails the report, and the report is redone on the spot."},b:{zh:"漏报一次，归家后跪姿补足一小时，补报期间不得动身。",en:"On missed report: on returning home, kneel for a compensatory hour, no movement permitted during compensation."},m:{zh:"一整天",en:"all day"}},
{t:1,n:{zh:"着装指定",en:"Chosen Dress"},l:"Vestis",p:{zh:"开局之前，由支配方自衣柜挑选服从方今夜的着装。可能是那条黑色吊带真丝睡裙——细肩带滑落至臂弯的姿势，胸口的蕾丝勾出乳沟的深度；可能是丝袜配一件白色衬衫，下摆刚好遮至腿根，一屈身便若隐若现；可能是一件宽大的男士衬衫，除此之外身无一物；亦可能只是一条内裤，其余全部不许。服从方着装完毕，须上前于支配方跟前转身一周展示，规则随即生效：全程不脱。裙摆会被推至腰际，肩带会被扯落至臂弯咬在齿间，衬衫扣子会被从上至下崩开数枚，丝袜会被撕开一个恰好露出穴口的洞——但衣物须一直留在身上，被揉皱、被浸湿、被弄得不成样子，甚至沾染上暧昧的痕迹，直至局终方可褪下。而着装本身的选择即是一份宣言——是被欣赏的对象，是被玩弄的容器，是被展示的作品。",en:"Before the scene, the Dom selects the sub's dress for the evening from the wardrobe. Perhaps the black silk slip — thin straps drooping to the crook of the arm, the depth of the neckline drawn out by the lace at the bust; perhaps stockings and a white shirt, the hem coming just to the crotch, and rising to a suggestion at any bend; perhaps an oversized man's shirt and nothing else; perhaps a pair of underwear and nothing else besides. The sub, dressed, must present themselves before the Dom and turn a full circle; the rule then becomes active: no full removal for the whole scene. The skirt will be pushed to the waist, the straps will be dragged down and caught in the teeth at the crook of the arm, the shirt's buttons will be snapped from top to bottom, the stockings will be torn open at just the position of the entrance — but the garment must remain on the body, rumpled, damp, misused, even stained with unspoken traces, until the scene concludes and only then may it come off. And the choice of dress itself is a small declaration — of the object of admiration, of the vessel to be used, of the piece to be shown."},r:{zh:"全程不得完全脱除；须着装完成整局，即便姿势变换亦然。",en:"No full removal; the dress must complete the whole scene through any change of position."},b:{zh:"衣物被弄污者，归着装者自行清洗；被弄破者，由指定者赔付新的。",en:"Soiled clothing: laundered by the dresser. Torn clothing: replaced by the chooser."},m:{zh:"全程",en:"scene-length"}},
{t:1,n:{zh:"按颈伏低",en:"Hand at the Nape"},l:"Manus in cervice",p:{zh:"后入之位。服从方俯卧于床，双膝跪起，胸口贴住床单，臀部高高抬起——那种主动献上的姿势本身即是一份宣言。支配方一手掐住腰际，指腹按入腰窝那两处凹陷；另一只手整个覆上后颈，五指微微收拢，向下按——面颊贴上床单，一侧脸颊被压出一道浅浅的红印，视野里只剩床单的皱褶与放大的织物纹理。腰被迫塌成最深的弧度，臀部完全交付。此姿势之中，服从方无法看见身后，无法转身，无法撑起身体，无法调整任何角度——所能做的唯有承受身后传来的每一记撞击，以及感受后颈那只手的分量。那只手不重，但它始终在。它在说：别动。你是我的。而每一次撞击的深度都能穿透至平日难以触及的凹陷，令服从方在被按住的姿势中感受到一种奇异的、被彻底占有的安全感。",en:"From behind. The sub lies face-down, kneels up on the knees, chest to the sheet, hips lifted high — that posture of voluntary offering is itself a declaration. One of the Dom's hands closes on the waist, the finger pads pressing into the two hollows at the small of the back; the other covers the nape whole, five fingers slightly gathered, pressing down — one cheek meets the sheet and takes a shallow red print, the field of vision reduced to the sheet's creases and the enlarged grain of the fabric. The waist is forced into its deepest arc; the hips are wholly delivered. In this posture the sub cannot see behind, cannot turn, cannot lift the body, cannot adjust any angle — all they may do is receive every strike from behind and feel the weight of that hand on the nape. That hand is not heavy, but it is always there. It is saying: don't move. You are mine. And every strike's depth reaches the hollow that day-to-day contact cannot, and in the pinned-down posture the sub experiences a curious sense of being wholly possessed, and wholly safe."},r:{zh:"服从方双手不得撑起身体；腰须始终塌陷保持深弧；撑起一次即受责。",en:"The sub's hands may not push the body up; the waist must maintain its deep arch throughout; a lift earns punishment."},b:{zh:"撑起一次，双手改缚于背后并加短绳；累计三次，改为面朝下双手完全束缚续玩。",en:"On one lift, the hands are re-bound behind the back with an added shorter rope; three lifts, the play continues face-down with hands wholly bound."},m:{zh:"20 分钟",en:"20 min"}},
{t:1,n:{zh:"点名之吻",en:"Called Kiss"},l:"Osculum",p:{zh:"支配方端坐不动，只出声。锁骨。——服从方须立即凑上前吻在其锁骨凹陷处。腕内。喉结。左胯凸起处。腰窝。膝内。共十处，由易至难：起初的位置伸手可及，后半段的位置需要跪下、俯身、甚至仰头才够得到。每一吻的速度、准头与虔诚程度都在支配方的评分之中。凑近的动作要迅速但不慌乱，唇触位置要精准，唇齿贴合的时间要恰到好处——过短显得敷衍，过长显得贪恋。这是一张以唇绘制的地图，绘制完毕之后，被吻者的身体上会留下一条完整的、被走过的路线——那些位置或许无痕，但会残留唇的温度与湿意，久久不散。而随着位置越来越私密——腹股沟、大腿内侧、乃至更深处——每一次凑近前的犹豫、每一次唇触时的战栗、每一次退开时的红脸，都成为本局最动人的细节。",en:"The Dom sits still and speaks only. Collarbone. — The sub must at once come forward and kiss the hollow above the collarbone. Inside of the wrist. Adam's apple. The rise of the left hip. Small of the back. Inside of the knee. Ten in all, from easy to hard: the earliest reachable without moving, the later ones requiring a kneel, a lean, even a lifted chin. Each kiss's speed, aim, and reverence enters the Dom's grading. The move to close must be swift but unhurried, the point of contact must be exact, the moment of contact must be neither perfunctory (too short) nor gluttonous (too long). This is a map drawn with the lips, and once drawn the mapped body carries a full, walked route — where the marks may not show, but the temperature and wetness of the mouth remain a long time. And as the locations move into more private country — the inguinal, the inner thigh, and beyond — every pause before nearing, every quiver at the moment of contact, every red-cheeked withdrawal, becomes among the loveliest details of this scene."},r:{zh:"共十处；吻错位置、方向偏离、迟疑超过两秒者，皆判违规。",en:"Ten locations; wrong location, wrong side, hesitation of more than two seconds, all count as violations."},b:{zh:"每违规一次，掌击一记；累计三次，本局作废，另择时另计。",en:"Each violation: one strike. Three cumulative violations: this scene is void, and re-scheduled."},m:{zh:"15 分钟",en:"15 min"}},
{t:2,n:{zh:"龟甲缚",en:"Kikkou Harness"},l:"Kikkou",p:{zh:"绳自后颈垂落，绕过肩头，于胸上一道、胸下一道，中央结出一串工整的菱形，令乳房被绳架自四面框住而不覆盖——那种被绳勒住却仍暴露的形态是龟甲缚的精髓所在。而后双臂自身后被一圈圈固定，前臂交叠于后腰，手腕以绳缠住。麻绳勒入皮肤的力道是均匀的、包裹性的——并非捆缚，更像一副生长于身上的甲胄。每一个绳结压着一个穴位，呼吸时整副绳架跟着起伏，胸口的绳被撑紧一分，勒痕慢慢在皮肤上洇出粉色的菱形花纹；乳房因两道绳的挤压而略微凸起，乳尖在绳与绳之间的空隙中挺立得格外分明，几乎是主动献上的姿态。绑毕不急于施为：先令被缚者在绳中静待五分钟，令其独自感受绳的重量、绳的温度、以及那份既被固定又被展示的双重感觉。心跳会撞在绳结上，一声一声，格外清晰——而穴道深处的湿意会随着每一次呼吸的起伏而缓缓渗出，无处可去，只能顺着大腿内侧慢慢下淌。",en:"Rope descends from the nape, passes over the shoulders, one line above the breasts and one below, at the center working into a neat chain of rhombuses — the breasts framed on four sides by the rope-cage without being covered, that both-bound-and-displayed geometry being the essence of kikkou. Then the arms are fixed a loop at a time behind the back, forearms crossed at the low back and wrists wrapped in. The hemp presses into the skin evenly — a wrapping pressure, not a cinching — more a suit of armor grown out of the body than a bond. Each knot rests on a pressure point; the whole cage rises and falls with each breath; the chest rope tightens by a degree, and pink rhombus prints slowly bloom on the skin; the breasts, compressed on both sides by rope, jut a little forward, the nipples projecting cleanly through the gap between ropes as if freely offered. When the tying is done, do not proceed at once: let the bound sit five minutes in the rope, alone, feeling the rope's weight, the rope's temperature, the double sensation of being fixed and displayed. The heart beats onto the knot, a beat at a time, unmistakably — and moisture at the deep of the passage will, with every rise and fall of breath, quietly seep out with nowhere to go but down the inner thigh."},r:{zh:"绑缚前须检查指尖温度与麻木感；此后每十分钟须复查一次血运。",en:"Before binding, check fingertip temperature and numbness; recheck circulation every ten minutes."},b:{zh:"绑毕先静置五分钟不作任何触碰，令被缚者独自感受；此后所有姿势自被缚者最敏感处开始。",en:"Once tied, five minutes of complete stillness; all subsequent positions begin from the bound's most sensitive place."},m:{zh:"60 分钟",en:"60 min"}},
{t:2,n:{zh:"周身蜡刑",en:"Full-Body Wax"},l:"Cera tota",p:{zh:"本局是一幅画的工程。受蜡者平躺于铺好防水布的床上，全身除隐私处外皆暴露于烛光下。施蜡者自锁骨落第一滴——烫意先在小小的范围内炸开，随即被身体的温度化开成一片暖印。而后沿身体版图逐次铺展：胸口对称两撇如书法起笔；肋骨起伏之处排一串圆点，每落一颗肌肉便本能地一收；小腹铺一小片，蜡在小腹的曲线上略微流淌片刻方凝；髋骨两侧各一道，那里骨骼突出，蜡凝得格外快；大腿内侧最白最薄的皮肤上，一路书写至膝弯——那里蜡尚未凝就已经化开成暖流缓缓下淌，痒得受蜡者不自觉地蹭动。烛与烛之间的间隙用来饮水、擦汗、检视皮肤，以及在等待中令下一滴的期待本身成为一种刑罚。四十五分钟后，受蜡者将成为一件覆满蜡封的完整作品——再被施蜡者一片一片剥开，剥落的蜡片如秋叶，露出蜡壳之下的粉色印痕，一处一处地重新暴露于灯光下，比原本更为敏感。此时任何抚摸都会带来放大数倍的战栗。",en:"This scene is the labor of a painting. The waxee lies on a bed set with waterproof cloth, the whole body barring the most private places offered to candlelight. The waxer drops the first at the collarbone — the heat flares in a small radius and is at once absorbed by the body's warmth to a broad warm print. Then the map spreads section by section: two sweeps to left and right at the sternum like the opening strokes of calligraphy; a string of dots up and down along the ribs, each landing making a muscle reflexively clench; a small patch across the belly, where the wax flows a moment along the belly's curve before setting; one line each along the crests of the hips, where the bone sits close and the wax sets fast; and along the palest thinnest inner thigh in a written line all the way down to the crook of the knee — where the wax barely finishes cooling before liquefying into a warm current running down, itching until the waxee reflexively shifts. The intervals between candles are for water, wiping sweat, checking skin, and the wait itself becoming a further punishment. Forty-five minutes on, the waxee will have become a wax-sealed complete work — and then the waxer peels them apart panel by panel, the panels dropping like autumn leaves, revealing beneath the wax shells the pink prints one at a time, each newly and freshly exposed to the light and made more sensitive than it began. At this point any touch will return several-fold in shudder."},r:{zh:"每落一处，受蜡者须报出感受是烫是痒；每十分钟须补水一次；发现异常灼痛立即终止。",en:"At each drop, the waxee reports hot or ticklish; every ten minutes, hydration; any anomalous burn ends the scene."},b:{zh:"全部剥离之后，印痕最深的一处由施蜡者以齿咬上，含定三十秒方松开。",en:"After full removal, the deepest print is closed on by the waxer's teeth and held thirty seconds before release."},m:{zh:"45 分钟",en:"45 min"}},
{t:2,n:{zh:"冰火淬炼",en:"Fire and Ice"},l:"Ignis et glacies",p:{zh:"案前置两盏：一盏盛冰块，一盏盛温水（约五十度，接近人体极限的耐受温度）。侍奉者先含一口温水，令口腔温热至几近发烫——舌面、上颚、齿列都被水温浸透。而后张口将对方纳入——热上加热，柱身如坠温泉，龟头周围被四十几度的口腔紧紧包裹住，被含者会立即倒吸一口气，柱身骤然一跳。侍奉者不急，含着不动，任由温热蔓延；片刻后，退出，含入一块冰。冰在口中迅速降温，舌面自炽热跌至冰点，再度将对方纳入——冰窖般的凉意瞬间咬住每一根神经，柱身在冰凉的口腔中反射性地想要退缩却被牢牢含住，甚至能感到柱身表面因温度骤降而微微颤抖。热、冷、热、冷，一张嘴即是一台温度的刑具。换温时不许将对方吐出：新的冰块或水须直接在口中与对方共处，那种极端温差在极小空间内碰撞的一瞬间，最能令人失守。到局末，被含者会连“到底是冷还是热”都难以分辨。",en:"Two vessels on the table: one of ice, one of water at about fifty degrees, near the human limit of tolerance. The servant takes a mouthful of the water — the oral cavity heats to near-scald, tongue and palate and teeth all suffused. Then the mouth opens to receive — heat upon heat, the shaft as if plunged into a hot spring, the head wrapped by an oral cavity at the low forties, the received-one gasping and the shaft leaping. The servant is unhurried, holds, lets the warmth spread; presently, withdraws, takes in a piece of ice. Ice drops the mouth's temperature at once, tongue-surface plummeting from scald to freezing point, and the received-one goes back in — the ice-cellar cold clenches every nerve, the shaft reflexively wants to retract in the cold mouth but is held firm; one can feel, even, the shaft's surface trembling faintly at the abrupt drop. Hot, cold, hot, cold — one mouth is one thermal-torture station. Exchanges do not release the received-one: the new ice or water must, directly in the mouth, coexist with the received-one, and that moment of extreme temperature contrast colliding in a very small space is the most fatal. By the scene's end, the received-one will scarcely be able to tell whether it is heat or cold."},r:{zh:"换温不得中断含侍；冰块须直接在口中完成温度切换；水温不得超过五十度。",en:"Exchange without breaking service; temperature switch happens in the mouth; water may not exceed fifty degrees."},b:{zh:"若令对方失控，释放于何处由侍奉者指定——面部、口中、胸前皆可。",en:"On the received-one losing control, place of release is specified by the servant — face, mouth, chest."},m:{zh:"25 分钟",en:"25 min"}},
{t:2,n:{zh:"整夜禁果",en:"An All-Night Denial"},l:"Denegatio",p:{zh:"本局规则唯一：不许抵达。而支配方将以一整晚的时间违背这条规则的字面含义——手指、唇舌、玩具、体位轮番上阵，每一次都将服从方推至门槛边缘，看其腰肢拱起、足趾蜷缩、呼吸破碎、指节掐入床单，然后在最后一秒撤走一切刺激。服从方须自行举手叫停，亲手掐断自己的顶点——这份自我否决的痛楚往往比外部剥夺更难忍受。一次，两次，三次。至第五次左右，服从方开始耍赖：偷偷夹紧双腿相互磨蹭，暗暗蹭动床单以求缓解，甚至以哭腔讨价还价——这些皆无效。规则不可违背。而每一次被剥夺，都会令下一次的门槛来得更快、更猛烈——这是恶性循环，也是本局的乐趣所在。至局末，服从方已经处于近乎歇斯底里的欲望状态，穴道深处不受控地一阵阵痉挛，只要一根手指探入就能立即引爆——但不许。这份漫长的克制会在解禁那一刻化为一场山崩。",en:"The rule is single: no arrival. And the Dom will use a whole night to violate the literal meaning of this rule — fingers, mouth, toys, positions in relays, each attempt driving the sub to the threshold's edge, watching hips arch, toes curl, breath break, knuckles push into the sheet, and then, in the last second, withdrawing every stimulus. The sub must raise a hand to signal the threshold, cutting off their own crest with their own hand — this self-negation is often more excruciating than external deprivation. Once, twice, thrice. By around the fifth, the sub begins to cheat: pressing thighs together to grind on each other, secretly working against the sheet for relief, or bargaining with a broken voice — all of these fail. The rule cannot be broken. And every deprivation makes the next threshold arrive faster and harder — this is a vicious circle, and the pleasure of this scene. By its close, the sub is in a near-hysterical state of want, the deep of the passage clenching in involuntary spasms, and any single finger entering would trigger detonation — but no. This long-form abstinence will, at the moment of release, become a landslide."},r:{zh:"临界须由服从方举手示意；夹腿、蹭动、私下磨蹭皆判违规；哭腔讨饶不予受理。",en:"The sub must raise a hand at the threshold; thighs pressed, grinding, private handling, all count as violations; sob-pleas will not be entertained."},b:{zh:"忍至终局者，准予一次彻底而漫长的释放，直至耗尽；违规几次，禁令即顺延几日。",en:"Held to the end: one complete and prolonged release, to depletion. Each violation extends the ban another day."},m:{zh:"90 分钟",en:"90 min"}},
{t:2,n:{zh:"强制连击",en:"Forced Continuation"},l:"Coactio",p:{zh:"高频震动器对准阴蒂，以医用胶带十字固定——它逃不掉，人也逃不掉。开至中档，支配方退至床边旁观。第一次顶点如约而至：呼吸紊乱、腰肢猛地弹起、穴道深处开始规律地痉挛——释放。但震动不停。刚刚经历过一次完整释放的、敏感至极的那一点被继续碾磨，快感开始由甜蜜转为过载：伸手试图去抓那颗跳蛋，被按住；本能地想要并腿夹住以缓解，膝盖被强行分开；哭喊着说不行了太多了求你停下，得到的回答只有一句——再来一次。第二次释放伴随着尖叫；第三次伴随着眼泪；第四次开始，身体进入一种既崩溃又空茫的失控状态，穴道深处不受控地一波一波抽搐，喷薄而出的液体浇湿床单大片。到第五次时，眼神已经开始失焦，语言功能几乎完全退化，只剩本能的呜咽与颤抖。看身体在说不要之后，还能诚实地抵达几次——这份记录，是本局的成果。",en:"A high-frequency vibrator to the clit, fixed with medical tape in a cross — it cannot escape, and neither can the person. Set to medium; the Dom retreats to the bed's edge to watch. The first crest arrives as promised: breath disordered, hips jerking up, deep spasms in regular waves — release. But vibration does not stop. The point, already through a complete release and now hyper-sensitive, continues to be ground on; pleasure begins to shift from sweet to overload: the sub tries to reach and take the toy off, is pinned; the instinctive urge to close the thighs is denied at the knees; sobs of \“I can't, too much, please stop\” get one answer only — again. The second release arrives with screams; the third with tears; from the fourth on, the body enters a state at once broken and vacant, the deep of the passage twitching in involuntary waves, gushed fluid dampening a broad patch of sheet. By the fifth, the eyes are unfocused; language function is very nearly gone; only instinct's whimper and shudder remain. To see how many more times the body arrives, honestly, after it says no — that count is this scene's yield."},r:{zh:"口头求饶一律无效；唯有事前约定的安全词可即刻终止本局。",en:"Verbal begging has no effect; only the agreed safeword ends the scene at once."},b:{zh:"抵达的次数即为本次记录，由双方共同记档；此数字将作为下次本局的起始目标。",en:"Times reached constitute the record, jointly logged; that number serves as next time's opening target."},m:{zh:"40 分钟",en:"40 min"}},
{t:2,n:{zh:"遥距外勤",en:"Remote at a Distance"},l:"Foris",p:{zh:"跳蛋预先塞入体内，遥控留在家中操控者手上，二人出门。地点可为便利店挑选晚餐、饮品店排队、书店浏览——一切如常。而操控者出手的时机全是最坏的：对店员开口说微糖去冰不要果冻说到一半，档位陡然自零跃至中档，尾音颤了一颤，须咬住舌尖压住呼吸才能把整句话说完；在拥挤的收银台前排队，档位悄悄拔至最高档，服从方须站得笔直、面色如常，扶着购物篮的手指指节发白，两腿之间的湿意正无声地渗透内裤、蔓延至大腿内侧——甚至开始怀疑是否已经渗至外裤留下痕迹；结账刷卡时档位骤然全停，那种落差比持续的震动更令人失守，身体本能地追寻方才的震感却无处可寻。店员一无所知；周围的顾客一无所知；服从方与操控者之间那条无形的通讯线，只属于二人。此局最烫之处在于：全世界只有一人知道自己两腿之间正在发生什么，以及那只握着开关的手此刻在暗自发笑。",en:"An ovum inserted in advance; the controller stays with the one at home, and the two go out. Location may be picking dinner at a convenience store, in line at a drink shop, browsing a bookstore — all as usual. The controller's choice of moment is the worst possible: mid-sentence to the clerk saying \“less sugar, no ice, no jellies,\” the setting flies from zero to medium, the tail of the sentence trembles, the tongue must be bitten just to finish; in line at the crowded register, the setting slips to maximum, the sub must stand up straight, face composed, knuckles white on the shopping basket, the wet between the thighs silently soaking through the underwear and spreading to the inner thigh — even doubting, presently, whether it has reached the outer clothes and left a trace. As the card is tapped at checkout, the setting drops abruptly to zero, and the sensory withdrawal is worse than sustained buzz, the body reflexively searching for the vanished buzz and finding none. The clerk knows nothing; the surrounding customers know nothing; the invisible line between sub and controller belongs only to the two of them. The hottest register of this scene: only one person in the whole world knows what is happening between the sub's thighs, and, at the other end, the hand on the switch is quietly laughing."},r:{zh:"结账、对话、需要开口的场合会被专门调档；话须说完整，声线须稳。",en:"Checkout, dialogue, and any speaking situations receive dedicated adjustments; sentences must complete; tone must stay steady."},b:{zh:"撑住全程者，归家受一小时贴身伺候；当场露馅或急促逃窜者，归家跪着受一小时惩戒。",en:"Held the whole way: an hour of close service at home. Caught out or in flight: an hour of kneeling in punishment at home."},m:{zh:"60 分钟",en:"60 min"}},
{t:2,n:{zh:"深喉修行",en:"Deep-Throat Practice"},l:"Profundum",p:{zh:"跪定于地，仰头对准。先做三次深呼吸，令咽反射尽量放松。自顶端一寸一寸纳入——过唇齿之关，抵至上颚的弧顶，绕过舌根，直至喉口那道弯。停一下。压下干呕的本能，闭眼，咽一次唾液——借着吞咽时喉肌向下收缩的动作，令最后一段柱身滑入喉咙深处。鼻尖触及对方的耻毛，尽根而没。坚持十秒：喉间那圈软肉不受控地痉挛绞紧，将口中之物勒得死死的；眼泪不受控地自睫毛间涌出，一颗一颗掉在对方的大腿上；口涎自嘴角淌出，顺着下颌滴至锁骨，甚至滴至前胸。十秒后缓缓退出，大口喘息、饮水、拭泪。此为修行，共三组，每一组之间休息一分钟。每组之后，喉咙对深度的接纳会略略提升——这也是训练之意。而喉咙深处那种被填满、被撑开、被暂时占据的感觉，本身也是一种极致的、原始的臣服体验。",en:"Kneel to the ground, tip the head up, aim. Three deep breaths first, to let the gag reflex slacken as far as it may. Take in from the tip inch by inch — past the gate of the lips and teeth, up to the arch of the palate, around the tongue's base, to the fold at the throat's entrance. Stop. Suppress the impulse to gag, close the eyes, swallow saliva once — with the throat's downward pull at the moment of swallowing, the last remaining segment slips into the deep of the throat. The tip of the nose touches the coarse hair of the receiver, full-root and gone. Hold ten seconds: the ring of soft flesh at the throat clenches uncontrollably, holding the object in the mouth tightly; tears flood between the lashes, one after another falling on the receiver's thigh; saliva runs from the corner of the mouth down the jaw to the collarbone and to the chest. After the ten seconds, withdraw slowly — great breath, water, wipe tears. This is practice; three sets, one minute of rest between them. After each set, the throat's acceptance of depth increases slightly — that is the training's intent. And at the deep of the throat, that sense of being filled, of being widened, of being temporarily occupied, is itself an extreme, primal experience of yielding."},r:{zh:"呛咳即停，不算失败；每组之间休息一分钟；水须常备手边。",en:"On choking, stop; not a failure; one-minute rest between sets; water at hand."},b:{zh:"三组完成者，射精位置由修行者选择（喉内、口中、面部皆可）；未完成者，改为含定不动十分钟。",en:"Three complete: place of release chosen by the trainee — throat, mouth, or face. Incomplete: hold in place for ten minutes."},m:{zh:"25 分钟",en:"25 min"}},
{t:2,n:{zh:"皮拍二十",en:"Twenty With The Paddle"},l:"Viginti",p:{zh:"皮拍先冰凉地贴上臀肉，令皮肤记住它的形状与冷面——那种从容不迫的贴合本身即是一种预告。而后扬起——第一记落于最翘处，一整片皮肤同时炸开热度，皮拍与臀肉相撞的啪声在房间中格外清脆，红印随即浮起。受罚者报：一。另一侧一记：二。力度自轻起，第五记时略略加重，第十记时达到中上强度，第十五记之后是收尾——每一记的强度、位置、间隔皆由执拍者控制。或连落三记不容喘息，令受罚者根本来不及报数；或悬停十数秒不动，让期待本身成为一种更深的刑罚。二十记毕，两团软肉滚烫得能焐手，色泽自粉转为深红，坐下会痛，走路会略略夹紧双腿——那份灼热感将伴随接下来的一切姿势，令后续的每一次姿势变换、每一次抚摸、每一次进入都被那份灼热放大数倍。",en:"The paddle first, cold, is set against the flesh — its shape and cold face memorized by the skin; that unhurried fit is itself a sort of foreword. Then it rises — the first strike lands at the highest point, the whole patch of skin exploding with heat at once, the crack of paddle-and-flesh clean in the room, the red print blooming a heartbeat behind. The receiver reports: one. The other side: two. Weight begins light; at the fifth, moderate; at the tenth, mid-upper; from the fifteenth on, wrap-up — every strike's weight, position, and interval under the wielder's control. Perhaps three landing in fast succession giving no room to breathe, so the receiver has no time to report; perhaps a hover of a dozen or so seconds, so anticipation itself becomes a further punishment. By the twentieth, the two mounds are hot enough to warm a hand against, the color darkened from pink to deep red; to sit will hurt; to walk will require slight tightening of the thighs — and that scald will accompany any subsequent posture, and amplify, several-fold, the sensation of every change of position, every touch, every entrance."},r:{zh:"每记须报数并保持声线稳定；哭泣不算违规，报数含糊或漏报才算。",en:"Each strike must be numbered aloud, voice steady; weeping is not a violation, only slurred or missed counts are."},b:{zh:"报错自一重计；累计三次自一重计，皮拍改为藤条，力度降半。",en:"On error, restart from one; three restarts, switch to the cane at half force."},m:{zh:"20 分钟",en:"20 min"}},
